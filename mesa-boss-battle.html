/* Layout: one-screen game for a 16:9 classroom panel. Lobby = challenge picker + team setup.
   Battle = arena (teams left, boss right) over a question deck. Single deliberate "blocky toy world" look, same in light and dark. */
:root{
  color-scheme:light;
  --ink:#1b2236;
  --paper:#fffdf5;
  --paper-2:#eef3f8;
  --muted:#5a6580;
  --sky-1:#39b6e6;
  --sky-2:#bfeaf8;
  --grass:#5cbf4b;
  --grass-2:#3d8d33;
  --gold:#ffcd2e;
  --good:#2fae4e;
  --bad:#e5433a;
  --heal:#33d17a;
  --a:#e5433a; --b:#2c84de; --c:#f0ad12; --d:#2fae4e;
  --display:"MJ Five More Minutes","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"MJ Prettily Printed","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  --step-q:clamp(24px,5.2vh,72px);
  --step-ans:clamp(20px,4vh,56px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-2);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 70%)}
#app{height:100%;position:relative}
.screen{height:100%;box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);text-wrap:balance}

/* ---------- shared bits ---------- */
.btn{font-family:var(--display);font-size:clamp(20px,3.3vh,42px);color:#fff;background:var(--bc,var(--good));
  border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:.35em 1.1em .45em;cursor:pointer;
  transition:transform .08s,box-shadow .08s,filter .15s;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#9aa3b5;cursor:not-allowed;filter:none}
.btn.small{font-size:clamp(14px,2vh,24px);padding:.25em .8em .35em;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.chip{font-family:var(--display);display:inline-flex;align-items:center;gap:.4em;background:var(--paper);border:3px solid var(--ink);
  border-radius:999px;padding:.1em .8em .2em;box-shadow:0 3px 0 var(--ink)}
.iconbtn{width:clamp(38px,5.4vh,64px);height:clamp(38px,5.4vh,64px);display:grid;place-items:center;background:var(--paper);
  border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:58%;height:58%}

/* ---------- lobby ---------- */
#lobby{overflow-y:auto;padding-block:2.2vh 3vh;display:flex;flex-direction:column;gap:2vh}
.logo-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(40px,8.5vh,110px);line-height:.95;color:#fff;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 9px 0 rgba(27,34,54,.35)}
.logo small{display:block;font-size:.34em;-webkit-text-stroke:0;color:var(--ink);text-shadow:none;letter-spacing:.04em;margin-top:.35em;font-family:var(--body);font-weight:700}
.lobby-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:2.4vh 28px;align-items:start}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:2vh 22px 2.4vh;display:flex;flex-direction:column;gap:1.6vh;min-width:0}
.step{font-size:clamp(22px,3.6vh,44px);display:flex;align-items:center;gap:.4em}
.step b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;background:var(--gold);border:3px solid var(--ink);border-radius:8px;font-weight:400;font-size:.8em}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{position:relative;text-align:left;border:4px solid var(--ink);border-radius:16px;padding:0;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,var(--s1),var(--s2));box-shadow:0 6px 0 var(--ink);transition:transform .12s, box-shadow .12s;display:flex;flex-direction:column;min-width:0}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.card[aria-pressed="true"]{outline:6px solid var(--gold);outline-offset:3px;transform:translateY(-3px)}
.card .art{height:clamp(90px,17vh,210px);display:flex;align-items:flex-end;justify-content:center;position:relative}
.card .art::after{content:"";position:absolute;left:0;right:0;bottom:0;height:18%;background:var(--g1);border-top:4px solid var(--ink)}
.card .art svg{height:92%;position:relative;z-index:1;margin-bottom:4%}
.card .info{background:var(--paper);border-top:4px solid var(--ink);padding:.9vh 14px 1.2vh;display:flex;flex-direction:column;gap:.2vh}
.card .info h3{font-size:clamp(18px,2.9vh,36px);line-height:1.05}
.card .info span{font-size:clamp(16px,2.3vh,28px);color:var(--muted);font-weight:700}
.card .check{position:absolute;top:10px;right:10px;background:var(--gold);border:3px solid var(--ink);border-radius:10px;font-family:var(--display);padding:.05em .5em .15em;font-size:clamp(14px,2vh,24px);display:none}
.card[aria-pressed="true"] .check{display:block}

.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-family:var(--display);font-size:clamp(17px,2.7vh,34px);min-width:2.6em;background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;
  box-shadow:0 4px 0 var(--ink);padding:.15em .6em .25em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold)}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.opt label,.opt .lbl{font-size:clamp(17px,2.8vh,34px);font-weight:700}
.team-rows{display:flex;flex-direction:column;gap:1vh}
.team-row{display:flex;align-items:center;gap:12px}
.team-row svg{height:clamp(44px,6.4vh,80px);flex:none}
.team-row input{flex:1;min-width:0;font-family:var(--display);font-size:clamp(18px,2.7vh,34px);padding:.2em .5em .3em;border:3px solid var(--ink);border-radius:12px;background:var(--paper-2);color:var(--ink)}
.start-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.start-row .btn{font-size:clamp(24px,4vh,52px);flex:1}
.hint{font-size:clamp(16px,2.4vh,30px);font-weight:700;color:var(--muted)}
.ground-strip{height:5vh;min-height:30px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));flex:none;
  background:linear-gradient(var(--grass) 0 0) top/100% 60% no-repeat, var(--grass-2);
  border-top:4px solid var(--ink);
  background-image:linear-gradient(90deg,rgba(0,0,0,.12) 3px,transparent 3px),linear-gradient(var(--grass),var(--grass) 55%,var(--grass-2) 55%);
  background-size:54px 100%,100% 100%}

/* ---------- battle ---------- */
#battle{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.2vh;padding-block:1.2vh 1.6vh}
.topbar{display:flex;align-items:center;gap:12px;min-width:0}
.topbar .title{font-family:var(--display);font-size:clamp(18px,3.2vh,42px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.topbar .chip{font-size:clamp(15px,2.7vh,34px);white-space:nowrap}

.arena{position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);
  background:linear-gradient(180deg,var(--a-sky1),var(--a-sky2));min-height:180px}
.arena .decor{position:absolute;inset:0;pointer-events:none}
.arena .ground{position:absolute;left:0;right:0;bottom:0;height:22%;border-top:4px solid var(--ink);
  background-image:linear-gradient(90deg,rgba(0,0,0,.12) 3px,transparent 3px),linear-gradient(var(--a-g1),var(--a-g1) 40%,var(--a-g2) 40%);
  background-size:64px 100%,100% 100%}
.teams{position:absolute;left:2.5%;bottom:5%;width:52%;display:flex;align-items:flex-end;justify-content:space-around;gap:1%}
.team{display:flex;flex-direction:column;align-items:center;gap:.6vh;flex:1;min-width:0;transition:transform .25s}
.team .av{height:clamp(56px,15vh,210px);transition:transform .25s, filter .25s;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.team .av svg{height:100%;display:block}
.team.active .av{transform:translateY(-1.6vh) scale(1.12);animation:hop 1.1s ease-in-out infinite}
.team .plate{background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:.2vh 10px .5vh;text-align:center;max-width:100%;box-sizing:border-box}
.team .plate .nm{font-family:var(--display);font-size:clamp(14px,2.5vh,34px);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;color:var(--tc)}
.team .plate .sc{font-family:var(--display);font-size:clamp(16px,3vh,40px);font-variant-numeric:tabular-nums;line-height:1}
.team .streak{font-family:var(--display);font-size:clamp(11px,1.7vh,22px);background:var(--gold);border:2px solid var(--ink);border-radius:8px;padding:0 .4em .1em;visibility:hidden}
.team .streak.on{visibility:visible}
.team.active .plate{outline:4px solid var(--gold);outline-offset:2px}
@keyframes hop{0%,100%{translate:0 0}50%{translate:0 -1vh}}

.bosswrap{position:absolute;right:5%;bottom:7%;height:66%;aspect-ratio:1/1;max-width:42%}
.boss{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite}
.boss .inner{width:100%;height:100%}
.boss svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.boss.rage svg{filter:drop-shadow(0 0 14px #ff2d2d) drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.boss.rage{animation-duration:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
.spin{transform-origin:120px 130px;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{transform:translateY(-4px)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

.hp{position:absolute;right:3%;top:4%;width:min(40%,620px);z-index:2;display:flex;flex-direction:column;gap:.5vh}
.hp .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hp .bname{font-family:var(--display);font-size:clamp(16px,3vh,40px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hp .num{font-family:var(--display);font-size:clamp(13px,2.2vh,28px);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp .bar{height:clamp(16px,3vh,38px);background:#2b2f3f;border:4px solid var(--ink);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 4px 0 var(--ink)}
.hp .ghost{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.6;transition:width 1s .35s ease}
.hp .fill{position:absolute;inset:0 auto 0 0;background:var(--hpc,#3bd16f);transition:width .45s ease, background .3s;
  background-image:linear-gradient(180deg,rgba(255,255,255,.35) 0 35%,transparent 35%)}
.hp .rage-tag{align-self:flex-end;font-family:var(--display);background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 .5em .1em;font-size:clamp(12px,2vh,26px);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:3%;background:rgba(15,20,35,.35);z-index:5}
.overlay .card2{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:2.2vh 28px 2.6vh;max-width:min(980px,92%);
  display:flex;flex-direction:column;gap:1.4vh;align-items:center;text-align:center;box-sizing:border-box}
.overlay h2{font-size:clamp(28px,5.8vh,78px);line-height:1}
.overlay p{margin:0;font-size:clamp(19px,3.6vh,48px);font-weight:700;line-height:1.25;max-width:42ch;-webkit-text-stroke:.02em currentColor}
.overlay .why-label{font-family:var(--display);font-size:clamp(14px,2.4vh,30px);color:var(--muted);letter-spacing:.05em}
.overlay .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.overlay.slim{place-items:start start;background:transparent;padding:2% 2%}
.overlay.slim .card2{padding-block:1.6vh 2vh;gap:1vh;max-width:min(1150px,60%)}
.result-good{color:var(--good)} .result-bad{color:var(--bad)}

.deck{display:flex;flex-direction:column;gap:1.2vh;min-width:0}
.qrow{display:flex;align-items:stretch;gap:14px;min-width:0}
.turn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;background:var(--tc,#888);color:#fff;border:4px solid var(--ink);border-radius:16px;
  box-shadow:0 5px 0 var(--ink);padding:.6vh 16px;min-width:clamp(110px,15vw,260px);max-width:28%}
.turn .who{font-family:var(--display);font-size:clamp(17px,3.2vh,42px);line-height:1;text-align:center;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;overflow-wrap:anywhere}
.turn .lbl{font-family:var(--display);font-size:clamp(13px,2.2vh,28px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 .5em .1em}
.qbox{flex:1;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:1.2vh 22px;display:flex;align-items:center;gap:16px}
.qtext{flex:1;min-width:0;font-size:var(--step-q);line-height:1.18;font-weight:700;-webkit-text-stroke:.025em currentColor;text-wrap:balance}
.timer{flex:none;width:clamp(48px,8vh,100px);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;
  background:conic-gradient(var(--tcol,var(--good)) calc(var(--p,1)*360deg),#d9dee8 0);position:relative}
.timer span{position:absolute;inset:16%;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:clamp(16px,3vh,38px);font-variant-numeric:tabular-nums}
.timer.low{animation:pulse .5s ease-in-out infinite}

.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vh 18px}
.ans{--ac:var(--a);display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper);border:4px solid var(--ink);border-radius:16px;
  box-shadow:0 6px 0 var(--ink),inset 0 -6px 0 color-mix(in srgb,var(--ac) 22%,transparent);min-height:clamp(58px,11vh,150px);padding:.6vh 18px .6vh 10px;cursor:pointer;
  transition:transform .08s,box-shadow .08s,opacity .2s,background .2s;min-width:0}
.ans:nth-child(2){--ac:var(--b)} .ans:nth-child(3){--ac:var(--c)} .ans:nth-child(4){--ac:var(--d)}
.ans .key{flex:none;width:clamp(42px,7.4vh,96px);aspect-ratio:1;display:grid;place-items:center;background:var(--ac);color:#fff;border:4px solid var(--ink);border-radius:12px;
  font-family:var(--display);font-size:clamp(22px,4.4vh,56px);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.ans .txt{font-size:var(--step-ans);line-height:1.15;font-weight:700;-webkit-text-stroke:.022em currentColor;min-width:0;overflow-wrap:anywhere}
.ans:hover:not([disabled]){background:color-mix(in srgb,var(--ac) 12%,var(--paper))}
.ans:active:not([disabled]){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.ans[disabled]{cursor:default}
.ans.dim{opacity:.38}
.ans.right{background:#d9f7df;outline:6px solid var(--good);outline-offset:-2px}
.ans.right .key{background:var(--good)}
.ans.wrong{background:#fde0de}
.ans.wrong .key{background:var(--bad)}
.ans.wrong .txt{text-decoration:line-through;text-decoration-thickness:3px}

/* ---------- fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.bolt{position:absolute;width:40px;height:40px;border:4px solid var(--ink);border-radius:6px;box-shadow:0 0 18px 6px rgba(255,255,255,.75)}
.orb{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--oc,#9b59ff) 45%,#2a0b4d);border:4px solid var(--ink);box-shadow:0 0 24px 8px var(--oc,#9b59ff)}
.pop{position:absolute;font-family:var(--display);font-size:clamp(28px,6vh,84px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap;transform:translate(-50%,-50%)}
.pop.heal{color:var(--heal)}
.pop.crit{color:var(--gold);font-size:clamp(34px,7.5vh,110px)}
.pop.small{font-size:clamp(18px,3.4vh,48px)}
.shard{position:absolute;border:3px solid var(--ink);border-radius:3px}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(36px,9vh,140px);color:#fff;
  -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);white-space:nowrap;text-align:center}

/* ---------- results ---------- */
#results{overflow-y:auto;padding-block:2vh 3vh;display:flex;flex-direction:column;gap:2vh}
.res-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6vh}
.res-head h1{font-size:clamp(40px,9vh,120px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);line-height:1}
.res-head p{margin:0;font-size:clamp(18px,3.5vh,44px);font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:.2em .8em .3em;box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:.02em currentColor}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,32px);min-height:0}
.pod{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:clamp(100px,17vw,260px)}
.pod .av{height:clamp(70px,16vh,200px)}
.pod .av svg{height:100%}
.pod .block{width:100%;box-sizing:border-box;padding-bottom:1vh;background:var(--tc);border:4px solid var(--ink);border-radius:12px 12px 0 0;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:1vh;gap:.4vh;color:#fff}
.pod .place{font-family:var(--display);font-size:clamp(26px,5.5vh,72px);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;line-height:1}
.pod .pname{font-family:var(--display);font-size:clamp(15px,2.5vh,32px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:.05em .5em .15em;max-width:92%;box-sizing:border-box;text-align:center;overflow-wrap:anywhere}
.pod .pstat{font-size:clamp(15px,2.5vh,30px);font-weight:700;background:rgba(27,34,54,.55);border-radius:8px;padding:0 .5em .1em;text-align:center}
.mvp{font-family:var(--display);background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:0 .5em .1em;font-size:clamp(16px,2.8vh,36px);box-shadow:0 3px 0 var(--ink)}
.res-btns{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.review{max-width:1100px;width:100%;margin-inline:auto;box-sizing:border-box}
.review ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1vh}
.review li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;border-bottom:2px dashed #c9d0dc;padding-bottom:1vh}
.review li:last-child{border-bottom:0}
.review .tag{font-family:var(--display);font-size:clamp(12px,1.8vh,22px);border:2px solid var(--ink);border-radius:8px;padding:0 .5em .1em;color:#fff;grid-row:span 2;align-self:center;text-align:center;min-width:5.5em}
.review .tag.correct{background:var(--good)} .review .tag.stolen{background:var(--b)} .review .tag.missed{background:var(--bad)}
.review .rq{font-size:clamp(17px,2.8vh,36px);font-weight:700;-webkit-text-stroke:.02em currentColor}
.review .ra{font-size:clamp(16px,2.5vh,32px);color:var(--muted);font-weight:700}
.review .ra strong{color:var(--good)}

/* ---------- arenas ---------- */
[data-arena="lander"]{--a-sky1:#0b1430;--a-sky2:#2b3f7a;--a-g1:#c9ccd6;--a-g2:#9a9fae;--tint:#ffb43a}
[data-arena="wearable"]{--a-sky1:#ff8a3d;--a-sky2:#ffd978;--a-g1:#4cb356;--a-g2:#2f8139;--tint:#ff5b2e}
[data-arena="storybook"]{--a-sky1:#27407e;--a-sky2:#f394b6;--a-g1:#dba066;--a-g2:#a86b34;--tint:#c2334d}
[data-arena="cleanup"]{--a-sky1:#3fb0e0;--a-sky2:#cdf1ff;--a-g1:#2a89c8;--a-g2:#1b5f92;--tint:#6c7a8c}
.card[data-arena]{--s1:var(--a-sky1);--s2:var(--a-sky2);--g1:var(--a-g1)}

@media (max-width:820px){
  body{overflow:auto}
  .lobby-grid{grid-template-columns:minmax(0,1fr)}
  #battle{height:auto;min-height:100%}
  .arena{height:46vh}
  .answers{grid-template-columns:minmax(0,1fr)}
  .qrow{flex-direction:column}
  .turn{max-width:none;flex-direction:row}
  .hp{width:60%}
  .bosswrap{width:42%}
}
@media (max-width:520px){ .cards{grid-template-columns:minmax(0,1fr)} }

  .boss,.team.active .av,.spin,.flick,.blink,.timer.low,.hp .rage-tag{animation:none!important}
}

<script>
(function(){
"use strict";
const INK="#1b2236";
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const wait=ms=>new Promise(r=>setTimeout(r,RM?Math.min(ms,150):ms));

/* ================= BOSS ART ================= */
const R=(x,y,w,h,f,extra="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" stroke="${INK}" stroke-width="4" ${extra}/>`;
const r=(x,y,w,h,f,extra="")=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
const eyes=(lx,rx,y,w,h,iris,pup)=>`<g class="blink" style="transform-origin:120px ${y+h/2}px">${R(lx,y,w,h,iris)}${R(rx,y,w,h,iris)}${r(lx+w*0.45,y+h*0.25,w*0.4,h*0.6,pup)}${r(rx+w*0.15,y+h*0.25,w*0.4,h*0.6,pup)}</g>`;

const BOSSES={
lander:()=>`<svg viewBox="0 0 240 240" aria-hidden="true">
  ${R(6,112,40,64,"#7f8391")}${R(194,112,40,64,"#7f8391")}
  ${R(0,168,52,40,"#6b6f7c")}${R(188,168,52,40,"#6b6f7c")}
  ${R(64,204,40,32,"#6b6f7c")}${R(136,204,40,32,"#6b6f7c")}
  ${R(38,34,164,176,"#a3a7b3")}
  ${r(52,48,44,30,"#8d919e")}${r(150,52,36,24,"#8d919e")}${r(56,168,30,26,"#8d919e")}${r(148,170,38,26,"#8d919e")}
  ${r(42,38,156,6,"rgba(255,255,255,.35)")}
  <g class="flick">${r(116,34,10,28,"#ff8a1f")}${r(108,60,10,18,"#ff8a1f")}${r(172,120,26,8,"#ff8a1f")}${r(160,128,14,8,"#ffc23a")}${r(40,140,24,8,"#ff8a1f")}${r(136,184,10,26,"#ffc23a")}</g>
  <g>${r(62,80,48,12,INK,'transform="rotate(14 86 86)"')}${r(130,80,48,12,INK,'transform="rotate(-14 154 86)"')}</g>
  ${eyes(66,138,96,38,26,"#ffd43b",INK)}
  ${R(82,142,76,30,INK)}${r(90,142,12,12,"#fff")}${r(110,142,12,12,"#fff")}${r(130,142,12,12,"#fff")}${r(100,160,12,12,"#fff")}${r(124,160,12,12,"#fff")}
</svg>`,
wearable:()=>`<svg viewBox="0 0 240 240" aria-hidden="true">

let AC=null;
function ac(){ if(!S.sound) return null; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended") AC.resume(); }catch(e){return null;} return AC; }
function tone(f,dur,type="square",vol=.08,f2=null,delay=0){
  const a=ac(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol=.15,delay=0){
  const a=ac(); if(!a) return;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s=a.createBufferSource(), g=a.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g); g.connect(a.destination); s.start(a.currentTime+delay);
}

  zap:()=>tone(300,.35,"sawtooth",.05,1400),
  hit:()=>{noise(.25,.22);tone(140,.25,"triangle",.2,50);},
  crit:()=>{noise(.35,.28);tone(180,.4,"triangle",.22,40);tone(1046,.25,"square",.05,null,.05);},
  wrong:()=>{tone(220,.2,"square",.07,150);tone(150,.35,"square",.07,90,.18);},
  heal:()=>{tone(400,.3,"sine",.08,900);tone(600,.3,"sine",.06,1200,.12);},
  tick:()=>tone(1200,.04,"square",.03),
  rage:()=>{tone(110,.6,"sawtooth",.1,70);noise(.5,.15,.1);},
  win:()=>{[523,659,784,1046,784,1046].forEach((f,i)=>tone(f,.22,"square",.07,null,i*.14));tone(1318,.6,"square",.07,null,.84);},
  lose:()=>{[392,330,262].forEach((f,i)=>tone(f,.3,"triangle",.1,null,i*.25));},

function seg(el,opts,get,set){
  el.innerHTML="";
  opts.forEach(([val,label])=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=label;
    b.setAttribute("aria-pressed",String(get()===val));
    b.addEventListener("click",()=>{set(val);SFX.click();save();renderLobby();});
    el.appendChild(b);
  });
}
function renderLobby(){
  const cards=$("cards");
  if(!cards.children.length){
    ORDER.forEach(id=>{
      const c=CH[id], b=document.createElement("button");
      b.type="button"; b.className="card"; b.dataset.arena=id; b.dataset.id=id;
      b.innerHTML=`<span class="check">Picked!</span><div class="art">${BOSSES[id]()}</div><div class="info"><h3>${esc(c.name)}</h3><span>Boss: ${esc(c.boss)} · ${c.qs.length} questions</span></div>`;
      b.addEventListener("click",()=>{S.challenge=id;SFX.click();renderLobby();});
      cards.appendChild(b);
    });
  }
  [...cards.children].forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.id===S.challenge)));
  seg($("segTeams"),[[2,"2"],[3,"3"],[4,"4"]],()=>S.teamCount,v=>S.teamCount=v);

function show(id){["lobby","battle","results"].forEach(s=>$(s).hidden=s!==id);}

function startGame(){
  const c=CH[S.challenge];
  const n=S.nq===0?c.qs.length:Math.min(S.nq,c.qs.length);
  const qs=shuffle(c.qs).slice(0,n).map(([q,opts,why])=>{
    const order=shuffle([0,1,2,3]);
    return {q,why,opts:order.map(i=>opts[i]),ans:order.indexOf(0)};
  });
  const teams=[];
  for(let i=0;i<S.teamCount;i++) teams.push({name:(S.names[i]||"").trim()||TEAM_PRESETS[i].name,color:TEAM_PRESETS[i].color,acc:i,score:0,correct:0,tries:0,streak:0,best:0,steals:0});
  const max=Math.max(300,Math.round(n*100*0.7/50)*50);
  G={c,id:S.challenge,qs,qi:0,turn:0,teams,hp:max,max,rage:false,phase:"intro",answerer:0,locked:true,wrongPicks:[],history:[],timerId:null,tLeft:0,over:false};
  const bt=$("battle"); bt.dataset.arena=S.challenge;
  $("bTitle").textContent=c.full;
  $("bossName").textContent=c.boss;
  $("bossInner").innerHTML=BOSSES[S.challenge]();
  $("boss").classList.remove("rage"); $("rageTag").hidden=true;
  $("boss").style.opacity=""; $("boss").style.transform="";
  $("decor").innerHTML=DECOR[S.challenge];
  renderTeams(); updateHP(true); renderSoundBtn();
  $("qText").textContent=""; $("answers").innerHTML=""; $("turnWho").textContent=""; $("turn").style.removeProperty("--tc");
  $("qCount").textContent=`Question 0 of ${n}`;
  show("battle"); keepAwake();
  intro();
}
function renderTeams(){
  const wrap=$("teams"); wrap.innerHTML="";
  G.teams.forEach((t,i)=>{
    const d=document.createElement("div"); d.className="team"; d.id="team"+i; d.style.setProperty("--tc",t.color);
    d.innerHTML=`<span class="streak" id="streak${i}"></span><div class="av">${avatarSVG(t.color,t.acc)}</div><div class="plate"><span class="nm">${esc(t.name)}</span><span class="sc" id="score${i}">0</span></div>`;
    wrap.appendChild(d);
  });
}
function setActive(i){
  G.teams.forEach((t,j)=>$("team"+j).classList.toggle("active",j===i));
  const t=G.teams[i];

  $("turnWho").textContent=t.name;
}
function updateScores(){
  G.teams.forEach((t,i)=>{
    $("score"+i).textContent=t.score;
    const s=$("streak"+i);
    s.textContent=t.streak>=2?`${t.streak} in a row!`:"";
    s.classList.toggle("on",t.streak>=2);
  });
}
function updateHP(instant){
  const p=Math.max(0,G.hp)/G.max;
  const f=$("hpFill"), g=$("hpGhost");
  if(instant){f.style.transition=g.style.transition="none";}
  f.style.width=(p*100)+"%"; g.style.width=(p*100)+"%";
  f.style.setProperty("--hpc",p>.5?"#3bd16f":p>.25?"#ffcd2e":"#ff4b3e");
  $("hpNum").textContent=`HP ${Math.max(0,G.hp)} / ${G.max}`;
  if(instant){void f.offsetWidth;f.style.transition=g.style.transition="";}
}

function nextQuestion(first){
  if(!first){G.qi++;G.turn++;}
  if(G.qi>=G.qs.length){endGame(false);return;}
  G.phase="answer"; G.answerer=G.turn%G.teams.length; G.wrongPicks=[];
  const Q=G.qs[G.qi];
  $("qCount").textContent=`Question ${G.qi+1} of ${G.qs.length}`;
  $("turnLbl").textContent="YOUR TURN";
  setActive(G.answerer);
  $("qText").textContent=Q.q;
  const box=$("answers"); box.innerHTML="";
  Q.opts.forEach((o,i)=>{
    const b=document.createElement("button"); b.type="button"; b.className="ans"; b.dataset.i=i;
    b.innerHTML=`<span class="key">${"ABCD"[i]}</span><span class="txt">${esc(o)}</span>`;
    b.addEventListener("click",()=>choose(i));
    box.appendChild(b);
  });
  if(!RM){[...box.children].forEach((b,i)=>b.animate([{transform:"translateY(20px)",opacity:0},{transform:"none",opacity:1}],{duration:260,delay:i*60,easing:"ease-out",fill:"backwards"}));
    $("qText").animate([{opacity:0},{opacity:1}],{duration:250});}
  G.locked=false;
  startTimer(S.timer);
}

function startTimer(sec){
  stopTimer(); const el=$("timer");
  if(!sec){el.hidden=true;return;}
  el.hidden=false; G.tLeft=sec; const total=sec; const end=Date.now()+sec*1000; let lastWhole=sec;
  const tick=()=>{
    const left=Math.max(0,(end-Date.now())/1000); const whole=Math.ceil(left);
    $("timerNum").textContent=whole; el.style.setProperty("--p",left/total);
    el.style.setProperty("--tcol",left/total>.5?"var(--good)":left/total>.25?"var(--gold)":"var(--bad)");
    el.classList.toggle("low",left<=5);
    if(whole!==lastWhole&&whole<=5&&whole>0) SFX.tick();
    lastWhole=whole;
    if(left<=0){stopTimer();timeUp();}
  };
  tick(); G.timerId=setInterval(tick,200);
}
function stopTimer(){if(G&&G.timerId){clearInterval(G.timerId);G.timerId=null;} $("timer").classList.remove("low");}
function timeUp(){ if(G.locked) return; choose(-1); }

function lockAnswers(){ G.locked=true; [...$("answers").children].forEach(b=>b.disabled=true); }

async function choose(i){
  if(G.locked||G.over) return;
  const Q=G.qs[G.qi]; const steal=G.phase==="steal";
  if(i>=0 && G.wrongPicks.includes(i)) return;
  stopTimer(); lockAnswers();
  const g=G, gone=()=>G!==g||g.quit;
  const t=G.teams[G.answerer]; t.tries++;
  const btns=[...$("answers").children];
  if(i===Q.ans){
    btns[i].classList.add("right");
    btns.forEach((b,j)=>{if(j!==i&&!b.classList.contains("wrong")) b.classList.add("dim");});
    t.correct++; if(!steal){t.streak++;t.best=Math.max(t.best,t.streak);} else t.steals++;
    SFX.correct();
    const mult=steal?0.5:1;
    let d=100+Math.min(Math.max(t.streak-1,0),4)*25;
    const crit=Math.random()<.15; if(crit) d=Math.round(d*1.5);
    d=Math.round(d*mult/5)*5;
    t.score+=d; updateScores();
    G.history.push({q:Q.q,a:Q.opts[Q.ans],why:Q.why,result:steal?"stolen":"correct",team:t.name});
    await attack(G.answerer,d,crit,steal);
    if(gone()) return;
    if(G.hp<=0){ await bossDefeated(); return; }
    reveal(true,`${t.name} ${steal?"stole it":"got it"}! ${d} damage${crit?" (CRITICAL HIT!)":""}`);
  } else {
    if(i>=0){btns[i].classList.add("wrong"); G.wrongPicks.push(i);}
    if(!steal){t.streak=0;}
    updateScores();
    SFX.wrong();
    if(!RM && i>=0) btns[i].animate([{transform:"translateX(0)"},{transform:"translateX(-10px)"},{transform:"translateX(10px)"},{transform:"translateX(0)"}],{duration:280});
    const heal=G.rage?40:25;
    await bossStrike(G.answerer, steal?0:heal, i<0);
    if(gone()) return;
    if(!steal && S.steal && G.teams.length>1){ offerSteal(i<0); return; }
    G.history.push({q:Q.q,a:Q.opts[Q.ans],why:Q.why,result:"missed",team:""});
    showCorrect();
    reveal(false,i<0?"Time's up!":(steal?`No steal this time.`:`Not quite!`));
  }
}
function showCorrect(){
  const Q=G.qs[G.qi]; const btns=[...$("answers").children];
  btns.forEach((b,j)=>{ if(j===Q.ans) b.classList.add("right"); else if(!b.classList.contains("wrong")) b.classList.add("dim"); });
}
function offerSteal(timeout){
  G.phase="stealOffer";
  const owner=G.turn%G.teams.length;
  const btns=G.teams.map((t,j)=>j===owner?"":`<button class="btn" data-team="${j}" style="--bc:${t.color}">${esc(t.name)}</button>`).join("");
  const ov=overlay(`<h2 class="result-bad">${timeout?"Time's up!":"Not quite!"}</h2><p>Can another team steal it for half damage?</p>
    <div class="btns">${btns}<button class="btn ghost" data-team="-1">No steal, show the answer</button></div>`,true);
  ov.querySelectorAll("[data-team]").forEach(b=>b.addEventListener("click",()=>{
    const j=+b.dataset.team; SFX.click(); hideOverlay();
    if(j<0){ const Q=G.qs[G.qi]; G.history.push({q:Q.q,a:Q.opts[Q.ans],why:Q.why,result:"missed",team:""}); showCorrect(); reveal(false,"Here's the answer."); return; }
    G.phase="steal"; G.answerer=j; setActive(j); $("turnLbl").textContent="STEAL!";
    [...$("answers").children].forEach((b,k)=>{ b.disabled=G.wrongPicks.includes(k); });
    G.locked=false; startTimer(S.timer?Math.max(15,Math.round(S.timer/2)):0);
  }));
}
function reveal(good,headline){
  G.phase="reveal";
  const Q=G.qs[G.qi];
  const last=G.qi>=G.qs.length-1;
  const ov=overlay(`<h2 class="${good?"result-good":"result-bad"}">${esc(headline)}</h2>
    ${good?"":`<p>Answer: ${esc(Q.opts[Q.ans])}</p>`}
    <span class="why-label">FROM THE CHALLENGE RULES</span><p>${esc(Q.why)}</p>
    <div class="btns"><button class="btn" id="nextBtn">${last?"Finish":"Next question"}</button></div>`,true);
  ov.querySelector("#nextBtn").addEventListener("click",()=>{SFX.click();hideOverlay();nextQuestion(false);});
  setTimeout(()=>{const b=$("nextBtn");b&&b.focus();},50);
}

/* ================= FX ================= */
function center(el){const r=el.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};}
function fx(el){$("fx").appendChild(el);return el;}
function popText(txt,x,y,cls){
  const p=fx(Object.assign(document.createElement("div"),{className:"pop "+(cls||""),textContent:txt}));
  p.style.left=x+"px"; p.style.top=y+"px";
  const a=p.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:0},{transform:"translate(-50%,-90%) scale(1.15)",opacity:1,offset:.25},{transform:"translate(-50%,-160%) scale(1)",opacity:1,offset:.75},{transform:"translate(-50%,-200%) scale(1)",opacity:0}],{duration:RM?600:1400,easing:"ease-out"});
  a.onfinish=()=>p.remove();
}
function burst(x,y,colors,count,spread){
  if(RM) return;
  for(let k=0;k<count;k++){
    const s=fx(document.createElement("div")); s.className="shard"; const sz=8+Math.random()*18;
    s.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${pick(colors)}`;
    const ang=Math.random()*Math.PI*2, dist=spread*(.4+Math.random()*.8);
    const a=s.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},{transform:`translate(${Math.cos(ang)*dist-sz/2}px,${Math.sin(ang)*dist+spread*.35}px) rotate(${Math.random()*720-360}deg)`,opacity:0}],{duration:700+Math.random()*600,easing:"cubic-bezier(.2,.7,.4,1)"});
    a.onfinish=()=>s.remove();
  }
}
async function attack(ti,d,crit,steal){
  const t=G.teams[ti], av=$("team"+ti).querySelector(".av"), bossEl=$("bossInner");
  const a=center(av), b=center(bossEl);
  if(!RM) av.animate([{transform:"translateY(0)"},{transform:"translateY(-40%) rotate(-8deg)"},{transform:"translateY(0)"}],{duration:420,easing:"ease-out"});
  await wait(180);
  SFX.zap();
  const bolt=fx(document.createElement("div")); bolt.className="bolt"; bolt.style.background=t.color;
  bolt.style.left=(a.x-20)+"px"; bolt.style.top=(a.y-20)+"px";
  const dx=b.x-a.x, dy=b.y-a.y;
  await bolt.animate([{transform:"translate(0,0) rotate(0) scale(.6)"},{transform:`translate(${dx*.5}px,${dy*.5-120}px) rotate(360deg) scale(1.3)`},{transform:`translate(${dx}px,${dy}px) rotate(720deg) scale(1)`}],{duration:RM?120:520,easing:"ease-in"}).finished.catch(()=>{});
  bolt.remove();
  crit?SFX.crit():SFX.hit();
  if(!RM){ bossEl.animate([{transform:"translateX(0)",filter:"brightness(1)"},{transform:"translateX(-5%) rotate(-3deg)",filter:"brightness(2.2)"},{transform:"translateX(4%) rotate(2deg)",filter:"brightness(1.6)"},{transform:"translateX(-2%)",filter:"brightness(1.2)"},{transform:"translateX(0)",filter:"brightness(1)"}],{duration:480});
    if(crit) $("arena").animate([{transform:"translate(0,0)"},{transform:"translate(-8px,5px)"},{transform:"translate(7px,-5px)"},{transform:"translate(0,0)"}],{duration:300}); }
  burst(b.x,b.y,[t.color,"#fff",...G.c.colors],crit?26:14,b.w*.6);
  popText((crit?"CRIT! ":"")+"-"+d,b.x,b.y-b.h*.15,crit?"crit":"");
  G.hp=Math.max(0,G.hp-d); updateHP();
  if(G.hp>0){
    await wait(500);
    popText(pick(G.c.hurt),b.x,b.y-b.h*.55,"small");
    if(!G.rage && G.hp<=G.max/2){ await enrage(); }
  }
  await wait(650);
}
async function enrage(){
  G.rage=true; SFX.rage();
  $("boss").classList.add("rage"); $("rageTag").hidden=false;
  const bn=fx(Object.assign(document.createElement("div"),{className:"banner",innerHTML:`RAGE MODE!<div style="font-size:.32em;-webkit-text-stroke:2px ${INK}">Wrong answers now heal the boss more</div>`}));
  await bn.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:0},{transform:"translate(-50%,-50%) scale(1.1)",opacity:1,offset:.2},{transform:"translate(-50%,-50%) scale(1)",opacity:1,offset:.8},{transform:"translate(-50%,-50%) scale(1.3)",opacity:0}],{duration:RM?500:1900}).finished.catch(()=>{});
  bn.remove();
}
async function bossStrike(ti,heal,timeout){
  const av=$("team"+ti).querySelector(".av"), bossEl=$("bossInner");
  const a=center(av), b=center(bossEl);
  if(!RM) await bossEl.animate([{transform:"scale(1)"},{transform:"scale(1.12) translateX(-4%)"},{transform:"scale(.95) translateX(3%)"},{transform:"scale(1)"}],{duration:420}).finished.catch(()=>{});
  const orb=fx(document.createElement("div")); orb.className="orb"; orb.style.setProperty("--oc",G.c.orb);
  orb.style.left=(b.x-28)+"px"; orb.style.top=(b.y-28)+"px";
  await orb.animate([{transform:"translate(0,0) scale(.5)"},{transform:`translate(${(a.x-b.x)*.5}px,${(a.y-b.y)*.5-80}px) scale(1.2)`},{transform:`translate(${a.x-b.x}px,${a.y-b.y}px) scale(1)`}],{duration:RM?120:480,easing:"ease-in"}).finished.catch(()=>{});
  orb.remove(); noise(.2,.15);
  burst(a.x,a.y,[G.c.orb,"#fff"],10,a.w*1.2);
  if(!RM) av.animate([{transform:"rotate(0)"},{transform:"rotate(-14deg) translateX(-10px)"},{transform:"rotate(10deg)"},{transform:"rotate(-5deg)"},{transform:"rotate(0)"}],{duration:500});
  popText(timeout?"Too slow!":"Oof!",a.x,a.y-a.h*.5,"small");
  await wait(420);
  if(heal>0){
    SFX.heal();
    G.hp=Math.min(G.max,G.hp+heal); updateHP();
    popText("+"+heal,b.x,b.y-b.h*.15,"heal");
    await wait(450);
    popText(pick(G.c.taunt),b.x,b.y-b.h*.55,"small");
  }
  await wait(600);
}
async function bossDefeated(){
  G.over=true; stopTimer(); const g=G;
  const bossEl=$("bossInner"), b=center(bossEl);
  popText(G.c.defeat,b.x,b.y-b.h*.6,"small");
  await wait(900);
  SFX.boom();
  if(!RM){
    await $("boss").animate([{transform:"scale(1) rotate(0)",filter:"brightness(1)"},{transform:"scale(1.1) rotate(-4deg)",filter:"brightness(3)"},{transform:"scale(1.15) rotate(4deg)",filter:"brightness(4)"}],{duration:700}).finished.catch(()=>{});
  }
  burst(b.x,b.y,G.c.colors.concat(["#fff",INK]),60,b.w*1.1);
  $("boss").style.opacity="0";
  const bn=fx(Object.assign(document.createElement("div"),{className:"banner",textContent:"BOSS DEFEATED!"}));
  SFX.win(); confetti();
  await bn.animate([{transform:"translate(-50%,-50%) scale(.2)",opacity:0},{transform:"translate(-50%,-50%) scale(1.15)",opacity:1,offset:.2},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:RM?300:900,fill:"forwards"}).finished.catch(()=>{});
  await wait(1600);
  bn.remove();
  if(G!==g||g.quit) return;
  endGame(true);
}
function confetti(){
  if(RM) return;
  const cols=["#e5433a","#2c84de","#2fae4e","#ffcd2e","#fff"];
  for(let k=0;k<90;k++){
    const s=fx(document.createElement("div")); s.className="shard"; const sz=10+Math.random()*14;
    s.style.cssText=`left:${Math.random()*100}vw;top:-30px;width:${sz}px;height:${sz*0.7}px;background:${pick(cols)}`;
    const a=s.animate([{transform:"translate(0,0) rotate(0)"},{transform:`translate(${Math.random()*200-100}px,${innerHeight+60}px) rotate(${Math.random()*900}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*900,easing:"cubic-bezier(.3,.1,.6,1)",fill:"backwards"});
    a.onfinish=()=>s.remove();
  }
}

/* ================= RESULTS ================= */
function endGame(won){
  G.over=true; stopTimer(); hideOverlay();
  const c=G.c;
  $("results").dataset.arena=G.id;
  $("resTitle").textContent=won?"Victory!":`${c.boss} got away!`;
  const tot=G.history.length, right=G.history.filter(h=>h.result!=="missed").length;
  $("resSub").textContent=won
    ?`You beat ${c.boss} in ${G.qi+1} question${G.qi?"s":""}. The class got ${right} of ${tot} right!`
    :`${c.boss} escaped with ${G.hp} HP left. The class got ${right} of ${tot} right. Rematch?`;
  const ranked=G.teams.map((t,i)=>({...t,i})).sort((a,b)=>b.score-a.score||b.correct-a.correct);
  const places=[]; ranked.forEach((t,k)=>{places[k]=(k>0&&t.score===ranked[k-1].score)?places[k-1]:k+1;});
  const heights=["28vh","23vh","19vh","16vh"];
  const order=ranked.length>=3?[1,0,2,3].filter(k=>k<ranked.length):ranked.map((_,k)=>k);
  $("podium").innerHTML=order.map(k=>{const t=ranked[k];const pl=places[k];
    return `<div class="pod" style="--tc:${t.color}">${pl===1&&t.score>0?'<span class="mvp">MVP</span>':""}<div class="av">${avatarSVG(t.color,t.acc)}</div>
      <div class="block" style="min-height:${heights[Math.min(pl-1,3)]}"><span class="place">${pl}${["st","nd","rd","th"][Math.min(pl-1,3)]}</span><span class="pname">${esc(t.name)}</span>
      <span class="pstat">${t.score} damage</span><span class="pstat">${t.correct} right${t.best>=2?` · best streak ${t.best}`:""}</span></div></div>`;}).join("");
  $("reviewList").innerHTML=G.history.map(h=>`<li><span class="tag ${h.result}">${h.result==="correct"?"Correct":h.result==="stolen"?"Stolen":"Missed"}</span>
     <span class="rq">${esc(h.q)}</span><span class="ra">Answer: <strong>${esc(h.a)}</strong>. ${esc(h.why)}</span></li>`).join("")||"<li>No questions answered yet.</li>";
  $("review").hidden=true; $("reviewBtn").textContent="Review the questions";
  show("results");
  if(!won) SFX.lose();
  else confetti();
}

/* ================= WIRING ================= */
$("fsBtn1").innerHTML=ICON.fs; $("fsBtn2").innerHTML=ICON.fs; $("quitBtn").innerHTML=ICON.quit;
$("fsBtn1").addEventListener("click",toggleFS); $("fsBtn2").addEventListener("click",toggleFS);
$("soundBtn").addEventListener("click",()=>{S.sound=!S.sound;save();renderSoundBtn();SFX.click();});
$("startBtn").addEventListener("click",()=>{if(!S.challenge)return;ac();startGame();});
$("quitBtn").addEventListener("click",()=>{
  if(!G||G.over){show("lobby");return;}
  const wasLocked=G.locked; G.locked=true; stopTimer();
  const ov=overlay(`<h2>Leave the battle?</h2><p>Scores for this game will be lost.</p><div class="btns"><button class="btn" style="--bc:var(--bad)" id="qYes">Quit to menu</button><button class="btn ghost" id="qNo">Keep playing</button></div>`);
  const prevPhase=G.phase;
  ov.querySelector("#qYes").addEventListener("click",()=>{stopTimer();G.over=true;G.quit=true;hideOverlay();document.getElementById("fx").innerHTML="";show("lobby");renderLobby();});
  ov.querySelector("#qNo").addEventListener("click",()=>{
    hideOverlay();
    if(prevPhase==="intro"){intro();return;}
    if(prevPhase==="reveal"){ // restore reveal panel
      const last=G.history[G.history.length-1]; reveal(last&&last.result!=="missed","Ready for the next one?"); return; }
    if(prevPhase==="stealOffer"){offerSteal(false);return;}
    G.locked=wasLocked; if(!wasLocked) startTimer(S.timer?Math.max(10,Math.round(S.timer/2)):0);
  });
});
$("againBtn").addEventListener("click",()=>{SFX.click();S.challenge=G.id;startGame();});
$("menuBtn").addEventListener("click",()=>{SFX.click();show("lobby");renderLobby();});
$("reviewBtn").addEventListener("click",()=>{const r=$("review");r.hidden=!r.hidden;$("reviewBtn").textContent=r.hidden?"Review the questions":"Hide the review";if(!r.hidden)r.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"});});
document.addEventListener("keydown",e=>{
  if(!G||$("battle").hidden||e.target.tagName==="INPUT") return;
  const k=e.key.toLowerCase(); const map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  if((G.phase==="answer"||G.phase==="steal") && !G.locked && k in map){e.preventDefault();choose(map[k]);}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G&&!G.over)keepAwake();});

renderLobby();
})();
</script>
