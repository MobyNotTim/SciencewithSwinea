/* ---------- mode rules ---------- */
async function reward(ti,steal){
  const t=G.teams[ti];
  if(G.mode==="boss"){
    let d=100+Math.min(Math.max(t.streak-1,0),4)*25;const crit=Math.random()<.15;if(crit)d=Math.round(d*1.5);if(steal)d=Math.round(d/2/5)*5;
    t.score+=d;updateScores();await attack(ti,d,crit);
    if(G.hp<=0){await bossDefeated();return "";}
    return `${t.name} ${steal?"stole it":"got it"}! ${d} damage${crit?" (CRITICAL!)":""}`;
  }
  if(G.mode==="obby"){
    const steps=steal?1:(t.streak>=3?2:1);
    t.pos=Math.min(G.L,t.pos+steps);t.score=t.pos;updateScores();
    await jump(ti,steps);
    if(t.pos>=G.L){await finishLine(t);return "";}
    return steps===2?`Double jump! ${t.name} is on platform ${t.pos}.`:`${t.name} jumps to platform ${t.pos}!`;
  }
  if(G.mode==="tycoon"){
    let c=100+Math.min(Math.max(t.streak-1,0),4)*20;if(steal)c=50;
    t.coins+=c;t.earned+=c;t.score=t.earned;updateScores();
    const builtNow=await earn(ti,c);
    if(G.solo&&t.built>=9){await labDone(t);return "";}
    return builtNow?`+${c} coins! ${t.name} built: ${builtNow}`:`+${c} coins for ${t.name}!`;
  }
}
async function penalty(ti,steal,timeout){
  if(G.mode==="boss"){await bossStrike(ti,steal?0:(G.rage?40:25),timeout);return;}
  const a=$(G.mode==="tycoon"?"actor"+ti:"actor"+ti);
  if(a&&!RM)a.querySelector(".hopper").animate([{transform:"rotate(0)"},{transform:"rotate(-14deg)"},{transform:"rotate(10deg)"},{transform:"rotate(0)"}],{duration:450});
  if(a){const c=center(a);popText(timeout?"Too slow!":G.mode==="obby"?"Wobble!":"No coins!",c.x,c.y-c.h*.5,"small");}
  await wait(700);
}
async function botTurn(){
  if(!(G.mode==="obby"&&G.bot))return;
  if(Math.random()<.5){G.bot.pos=Math.min(G.L,G.bot.pos+1);updateScores();
    const el=$("actorBot");placeRunners();if(!RM)el.querySelector(".hopper").animate([{transform:"translateY(0)"},{transform:"translateY(-45%)"},{transform:"translateY(0)"}],{duration:650,easing:"ease-out"});
    tone(220,.2,"square",.04,440);await wait(800);
    if(G.bot.pos>=G.L){await finishLine(G.bot);}}
}

/* ---------- fx ---------- */

  const a=p.animate([{transform:"translate(-50%,-50%) scale(.4)",opacity:0},{transform:"translate(-50%,-90%) scale(1.15)",opacity:1,offset:.25},{transform:"translate(-50%,-160%) scale(1)",opacity:1,offset:.75},{transform:"translate(-50%,-200%) scale(1)",opacity:0}],{duration:RM?600:1400,easing:"ease-out"});a.onfinish=()=>p.remove();}
function burst(x,y,colors,count,spread){if(RM)return;for(let k=0;k<count;k++){const s=fx(document.createElement("div"));s.className="shard";const sz=8+Math.random()*18;s.style.cssText=`left:${x}px;top:${y}px;width:${sz}px;height:${sz}px;background:${pick(colors)}`;
  const ang=Math.random()*Math.PI*2,dist=spread*(.4+Math.random()*.8);const a=s.animate([{transform:"translate(-50%,-50%) rotate(0)",opacity:1},{transform:`translate(${Math.cos(ang)*dist-sz/2}px,${Math.sin(ang)*dist+spread*.35}px) rotate(${Math.random()*720-360}deg)`,opacity:0}],{duration:700+Math.random()*600,easing:"cubic-bezier(.2,.7,.4,1)"});a.onfinish=()=>s.remove();}}
function confetti(){if(RM)return;const cols=["#e5433a","#2c84de","#2fae4e","#ffcd2e","#fff"];for(let k=0;k<90;k++){const s=fx(document.createElement("div"));s.className="shard";const sz=10+Math.random()*14;s.style.cssText=`left:${Math.random()*100}vw;top:-30px;width:${sz}px;height:${sz*.7}px;background:${pick(cols)}`;
  const a=s.animate([{transform:"translate(0,0) rotate(0)"},{transform:`translate(${Math.random()*200-100}px,${innerHeight+60}px) rotate(${Math.random()*900}deg)`}],{duration:2200+Math.random()*1800,delay:Math.random()*900,easing:"cubic-bezier(.3,.1,.6,1)",fill:"backwards"});a.onfinish=()=>s.remove();}}
async function bigBanner(text,ms){const bn=fx(Object.assign(document.createElement("div"),{className:"banner",textContent:text}));
  await bn.animate([{transform:"translate(-50%,-50%) scale(.2)",opacity:0},{transform:"translate(-50%,-50%) scale(1.15)",opacity:1,offset:.2},{transform:"translate(-50%,-50%) scale(1)",opacity:1}],{duration:RM?300:900,fill:"forwards"}).finished.catch(()=>{});
  await wait(ms);bn.remove();}

/* boss fx */
async function attack(ti,d,crit){
  const t=G.teams[ti],av=$("actor"+ti),bossEl=$("bossInner"),a=center(av),b=center(bossEl);
  if(!RM)av.querySelector(".hopper").animate([{transform:"translateY(0)"},{transform:"translateY(-40%) rotate(-8deg)"},{transform:"translateY(0)"}],{duration:420,easing:"ease-out"});
  await wait(180);SFX.zap();
  const bolt=fx(document.createElement("div"));bolt.className="bolt";bolt.style.background=t.color;bolt.style.left=(a.x-20)+"px";bolt.style.top=(a.y-20)+"px";
  const dx=b.x-a.x,dy=b.y-a.y;
  await bolt.animate([{transform:"translate(0,0) rotate(0) scale(.6)"},{transform:`translate(${dx*.5}px,${dy*.5-120}px) rotate(360deg) scale(1.3)`},{transform:`translate(${dx}px,${dy}px) rotate(720deg) scale(1)`}],{duration:RM?120:520,easing:"ease-in"}).finished.catch(()=>{});
  bolt.remove();crit?SFX.crit():SFX.hit();
  if(!RM)bossEl.animate([{transform:"translateX(0)",filter:"brightness(1)"},{transform:"translateX(-5%) rotate(-3deg)",filter:"brightness(2.2)"},{transform:"translateX(4%) rotate(2deg)",filter:"brightness(1.6)"},{transform:"translateX(0)",filter:"brightness(1)"}],{duration:480});
  burst(b.x,b.y,[t.color,"#fff","#fff3c4",G.bossColor],crit?26:14,b.w*.6);
  popText((crit?"CRIT! ":"")+"-"+d,b.x,b.y-b.h*.15,crit?"crit":"");
  G.hp=Math.max(0,G.hp-d);updateHP();
  if(G.hp>0){await wait(450);popText(pick(["Ouch! You know your words!","Hey! That's not fair!","Argh! Too smart!","My letters!"]),b.x,b.y-b.h*.55,"small");
    if(!G.rage&&G.hp<=G.max/2){G.rage=true;SFX.rage();$("boss").classList.add("rage");$("rageTag").hidden=false;await bigBanner("RAGE MODE!",900);}}
  await wait(650);
}
async function bossStrike(ti,heal,timeout){
  const av=$("actor"+ti),bossEl=$("bossInner"),a=center(av),b=center(bossEl);
  if(!RM)await bossEl.animate([{transform:"scale(1)"},{transform:"scale(1.12) translateX(-4%)"},{transform:"scale(.95) translateX(3%)"},{transform:"scale(1)"}],{duration:420}).finished.catch(()=>{});
  const orb=fx(document.createElement("div"));orb.className="orb";orb.style.setProperty("--oc",G.bossColor);orb.style.left=(b.x-28)+"px";orb.style.top=(b.y-28)+"px";
  await orb.animate([{transform:"translate(0,0) scale(.5)"},{transform:`translate(${(a.x-b.x)*.5}px,${(a.y-b.y)*.5-80}px) scale(1.2)`},{transform:`translate(${a.x-b.x}px,${a.y-b.y}px) scale(1)`}],{duration:RM?120:480,easing:"ease-in"}).finished.catch(()=>{});
  orb.remove();noise(.2,.15);burst(a.x,a.y,[G.bossColor,"#fff"],10,a.w*1.2);
  if(!RM)av.querySelector(".hopper").animate([{transform:"rotate(0)"},{transform:"rotate(-14deg) translateX(-10px)"},{transform:"rotate(10deg)"},{transform:"rotate(0)"}],{duration:500});
  popText(timeout?"Too slow!":"Oof!",a.x,a.y-a.h*.5,"small");await wait(420);
  if(heal>0){SFX.heal();G.hp=Math.min(G.max,G.hp+heal);updateHP();popText("+"+heal,b.x,b.y-b.h*.15,"heal");await wait(450);popText(pick(["Yum! A wrong answer!","Chomp! I'm healing!","Ha! More letters for me!"]),b.x,b.y-b.h*.55,"small");}
  await wait(600);
}
async function bossDefeated(){
  G.over=true;stopTimer();const g=G,bossEl=$("bossInner"),b=center(bossEl);
  popText("Nooo! You know too many words!",b.x,b.y-b.h*.6,"small");await wait(900);SFX.boom();
  if(!RM)await $("boss").animate([{transform:"scale(1)",filter:"brightness(1)"},{transform:"scale(1.1) rotate(-4deg)",filter:"brightness(3)"},{transform:"scale(1.15) rotate(4deg)",filter:"brightness(4)"}],{duration:700}).finished.catch(()=>{});
  burst(b.x,b.y,[G.bossColor,"#fff3c4","#fff",INK],60,b.w*1.1);$("boss").style.opacity="0";SFX.win();confetti();
  await bigBanner("BOSS DEFEATED!",1600);if(G!==g||g.quit)return;endGame(true);
}
/* obby fx */
async function jump(ti,steps){
  const el=$("actor"+ti);SFX.jump();placeRunners();
  if(!RM)el.querySelector(".hopper").animate([{transform:"translateY(0)"},{transform:"translateY(-55%) rotate(-10deg)"},{transform:"translateY(0)"}],{duration:650,easing:"ease-out"});
  await wait(700);const c=center(el);burst(c.x,c.y+c.h*.45,["#fff",G.teams[ti].color],8,40);
  if(steps===2)popText("DOUBLE JUMP!",c.x,c.y-c.h*.6,"gold");
  await wait(500);
}
async function finishLine(who){
  G.over=true;stopTimer();const g=G;SFX.win();confetti();
  await bigBanner(who===G.bot?"Bolt wins!":`${who.name} wins!`,1700);if(G!==g||g.quit)return;endGame(who!==G.bot,who===G.bot,who);
}
/* tycoon fx */
async function earn(ti,c){
  const t=G.teams[ti],plot=$("plot"+ti),pc=center(plot.querySelector(".bld")),tc=center($("sc"+ti));
  SFX.coin();popText("+"+c,pc.x,pc.y-pc.h*.3,"gold");
  if(!RM){for(let k=0;k<5;k++){const co=fx(document.createElement("div"));co.className="coin";co.style.left=(pc.x-15)+"px";co.style.top=(pc.y-15)+"px";
    const a=co.animate([{transform:"translate(0,0) scale(.6)",opacity:1},{transform:`translate(${(tc.x-pc.x)*.5+(Math.random()*80-40)}px,${(tc.y-pc.y)*.5-60}px) scale(1.1)`},{transform:`translate(${tc.x-pc.x}px,${tc.y-pc.y}px) scale(.6)`,opacity:.9}],{duration:700,delay:k*70,easing:"ease-in"});a.onfinish=()=>co.remove();}}
  await wait(800);
  const names=[];
  while(t.coins>=G.cost&&t.built<9){t.coins-=G.cost;t.built++;names.push(LAB_NAMES[t.built-1]);
    updatePlot(ti);SFX.build();const piece=plot.querySelector(`.pc[data-i="${t.built-1}"]`);
    if(piece&&!RM)piece.animate([{transform:"translateY(-60px)",opacity:0},{transform:"translateY(6px)",opacity:1,offset:.7},{transform:"none",opacity:1}],{duration:500,easing:"ease-out"});
    await wait(550);}
  updatePlot(ti);updateScores();
  if(t.built>=9&&names.length){burst(pc.x,pc.y,["#ffcd2e","#fff",t.color],24,pc.w*.6);popText("LAB COMPLETE!",pc.x,pc.y-pc.h*.5,"gold");await wait(700);}
  return names.join(", ");
}
async function labDone(t){G.over=true;stopTimer();const g=G;SFX.win();confetti();await bigBanner("Lab complete!",1600);if(G!==g||g.quit)return;endGame(true);}

/* ================= RESULTS ================= */
function endGame(won,botWon,winner){
  G.over=true;stopTimer();hideOverlay();hush();
  const tot=G.history.length,right=G.history.filter(h=>h.result!=="missed").length;
  const pct=tot?right/tot:0;
  let title,sub;
  if(G.solo){const t=G.teams[0];
    if(G.mode==="boss")title=won?"Victory!":"Jumble got away!";
    if(G.mode==="obby")title=won?"You win!":botWon?"Bolt wins this time!":"Out of questions!";
    if(G.mode==="tycoon")title=t.built>=9?"Lab complete!":`You built ${t.built} of 9!`;
    sub=`You got ${right} of ${tot} right.${won||t.built>=9?"":" Play again to beat your score!"}`;
  } else {
    title=G.mode==="boss"?(won?"Victory!":"Jumble got away!"):G.mode==="obby"?(winner?`${winner.name} wins the race!`:"Race results"):"Build-off results";
    sub=`The class got ${right} of ${tot} right.`+(G.mode==="boss"&&!won?` Jumble escaped with ${G.hp} HP.`:"");
  }
  $("resTitle").textContent=title;$("resSub").textContent=sub;
  const stars=$("stars");stars.hidden=!G.solo;if(G.solo){const n=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;stars.innerHTML=[0,1,2].map(k=>starSVG(k<n)).join("");}
  const val=t=>G.mode==="boss"?t.score:G.mode==="obby"?t.pos:(t.built*1000+t.earned);
  const stat=t=>G.mode==="boss"?`${t.score} damage`:G.mode==="obby"?`Platform ${t.pos} of ${G.L}`:`${t.built}/9 built · ${t.earned} coins`;
  const ranked=G.teams.map(t=>({...t})).sort((a,b)=>val(b)-val(a)||b.correct-a.correct);
  const places=[];ranked.forEach((t,k)=>{places[k]=(k>0&&val(t)===val(ranked[k-1]))?places[k-1]:k+1;});
  const heights=["26vh","21vh","17vh","14vh"];
  const order=ranked.length>=3?[1,0,2,3].filter(k=>k<ranked.length):ranked.map((_,k)=>k);
  $("podium").innerHTML=G.solo?`<div class="pod" style="--tc:${ranked[0].color}"><div class="av">${avatarSVG(ranked[0].color,ranked[0].acc)}</div><div class="block"><span class="pname">${esc(ranked[0].name)}</span><span class="pstat">${stat(ranked[0])}</span><span class="pstat">Best streak ${ranked[0].best}</span></div></div>`
   :order.map(k=>{const t=ranked[k],pl=places[k];return `<div class="pod" style="--tc:${t.color}">${pl===1&&val(t)>0?'<span class="mvp">MVP</span>':""}<div class="av">${avatarSVG(t.color,t.acc)}</div>
    <div class="block" style="min-height:${heights[Math.min(pl-1,3)]}"><span class="place">${pl}${["st","nd","rd","th"][Math.min(pl-1,3)]}</span><span class="pname">${esc(t.name)}</span><span class="pstat">${stat(t)}</span><span class="pstat">${t.correct} right${t.best>=2?` · streak ${t.best}`:""}</span></div></div>`;}).join("");
  $("reviewList").innerHTML=G.history.map(h=>{const w=h.Q.w;
    if(h.Q.src==="story")return `<li><span class="tag ${h.result}">${h.result==="correct"?"Correct":h.result==="stolen"?"Stolen":"Missed"}</span><span class="rq">${h.Q.q}</span><span class="ra">Answer: <strong>${esc(h.Q.correctText)}</strong>. ${esc(h.Q.why)} <em>(${h.Q.cmp?`${esc(h.Q.book.t)} and ${esc(h.Q.book.nf.t)}, compare`:`${esc(h.Q.srcTitle)}${h.Q.nf?", nonfiction":""}`})</em></span></li>`;
    return `<li><span class="tag ${h.result}">${h.result==="correct"?"Correct":h.result==="stolen"?"Stolen":"Missed"}</span><span class="rq">${esc(w.w)}</span><span class="ra"><strong>${esc(w.m)}</strong>${w.ex?`. "${esc(w.ex)}"`:""}</span></li>`;}).join("")||"<li>No questions answered yet.</li>";
  $("review").hidden=true;$("reviewBtn").textContent=G.src==="story"?"Review the questions":"Review the words";
  show("results");
  if(won||(!G.solo&&G.mode!=="boss"))confetti();else SFX.lose();
}

/* ================= WIRING ================= */
$("fsBtn1").innerHTML=ICON.fs;$("fsBtn2").innerHTML=ICON.fs;$("quitBtn").innerHTML=ICON.quit;$("sayBtn").innerHTML=ICON.say;
$("fsBtn1").addEventListener("click",toggleFS);$("fsBtn2").addEventListener("click",toggleFS);
$("soundBtn").addEventListener("click",()=>{S.sound=!S.sound;save();renderSoundBtn();SFX.click();});
$("sayBtn").addEventListener("click",()=>{if(!G||G.qi>=G.qs.length)return;const Q=G.qs[G.qi];sayText(Q.speak+" "+Q.opts.map((o,i)=>"ABCD"[i]+". "+o+".").join(" "));});
$("startBtn").addEventListener("click",()=>{if($("startBtn").disabled)return;ac();startGame();});
$("quitBtn").addEventListener("click",()=>{
  if(!G||G.over){show("lobby");renderLobby();return;}
  const wasLocked=G.locked,prev=G.phase;G.locked=true;stopTimer();hush();
  const ov=overlay(`<h2>Leave the game?</h2><p>Scores for this game will be lost.</p><div class="btns"><button class="btn" style="--bc:var(--bad)" id="qYes">Quit to menu</button><button class="btn ghost" id="qNo">Keep playing</button></div>`);
  ov.querySelector("#qYes").addEventListener("click",()=>{G.over=true;G.quit=true;hideOverlay();$("fx").innerHTML="";show("lobby");renderLobby();});
  ov.querySelector("#qNo").addEventListener("click",()=>{hideOverlay();
    if(prev==="intro"){intro();return;}
    if(prev==="reveal"){const l=G.history[G.history.length-1];reveal(l&&l.result!=="missed","Ready for the next one?");return;}
    if(prev==="stealOffer"){offerSteal(false);return;}
    G.locked=wasLocked;if(!wasLocked)startTimer(S.timer?Math.max(10,Math.round(S.timer/2)):0);});
});
$("againBtn").addEventListener("click",()=>{SFX.click();startGame();});
$("menuBtn").addEventListener("click",()=>{SFX.click();show("lobby");renderLobby();});
$("reviewBtn").addEventListener("click",()=>{const r=$("review");r.hidden=!r.hidden;$("reviewBtn").textContent=r.hidden?(G&&G.src==="story"?"Review the questions":"Review the words"):"Hide the review";if(!r.hidden)r.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"});});
document.addEventListener("keydown",e=>{if(!G||$("play").hidden||e.target.tagName==="INPUT")return;const k=e.key.toLowerCase(),map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  if((G.phase==="answer"||G.phase==="steal")&&!G.locked&&k in map&&map[k]<G.qs[G.qi].opts.length){e.preventDefault();choose(map[k]);}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G&&!G.over)keepAwake();});
window.addEventListener("resize",()=>{if(G&&G.mode==="obby"&&!$("play").hidden)placeRunners();});

renderLobby();
/* Re-read the words and stories from the live site so edits on index.html show up here automatically. */
if(location.protocol.startsWith("http")){
  fetch("index.html",{cache:"no-cache"}).then(r=>r.ok?r.text():Promise.reject()).then(txt=>{
    const d=parseSite(txt);const n=Object.values(d).reduce((s,q)=>s+q.words.length,0);
    if(n>=20)DATA=d;
    const st=parseStories(txt);const ns=Object.values(st).reduce((s,q)=>s+q.books.length,0);
    if(ns>=10)STORIES=st;
    if(!$("lobby").hidden)renderLobby();
  }).catch(()=>{});
}
})();
</script>
