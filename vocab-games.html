/* Layout: one-screen arcade for a 16:9 smart panel (also works on Chromebooks/phones).
   Lobby = grade -> quarter -> game style -> players. Play = top bar with scores, arena, question deck.
   Single deliberate blocky-toy look that matches MESA Boss Battle. */
:root{
  color-scheme:light;
  --ink:#1b2236; --paper:#fffdf5; --paper-2:#eef3f8; --muted:#5a6580;
  --sky-1:#39b6e6; --sky-2:#bfeaf8; --grass:#5cbf4b; --grass-2:#3d8d33;
  --gold:#ffcd2e; --good:#2fae4e; --bad:#e5433a; --heal:#33d17a;
  --a:#e5433a; --b:#2c84de; --c:#f0ad12; --d:#2fae4e;
  --g3:#7cc35a; --g4:#13ada0; --g5:#0b7b8a;
  --display:"MJ Five More Minutes","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"MJ Prettily Printed","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  --step-q:clamp(24px,5.2vh,72px); --step-ans:clamp(20px,4vh,56px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-2);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 70%)}
#app{height:100%;position:relative}
.screen{height:100%;box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);text-wrap:balance}

.btn{font-family:var(--display);font-size:clamp(20px,3.3vh,42px);color:#fff;background:var(--bc,var(--good));border:4px solid var(--ink);border-radius:14px;
  box-shadow:0 6px 0 var(--ink);padding:.3em 1em .4em;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;text-shadow:0 2px 0 rgba(0,0,0,.25);text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#9aa3b5;cursor:not-allowed;filter:none}
.btn.small{font-size:clamp(16px,2.5vh,30px);padding:.2em .8em .3em;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.iconbtn{width:clamp(38px,5.4vh,64px);height:clamp(38px,5.4vh,64px);display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:58%;height:58%}

/* ---------- lobby ---------- */
#lobby{overflow-y:auto;padding-block:2vh 3vh;display:flex;flex-direction:column;gap:1.8vh}
.logo-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(38px,8vh,104px);line-height:.95;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 9px 0 rgba(27,34,54,.35)}
.logo small{display:block;font-size:.34em;-webkit-text-stroke:0;color:var(--ink);text-shadow:none;margin-top:.35em;font-family:var(--body);font-weight:700}
.toprt{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lobby-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2vh 26px;align-items:start}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:1.8vh 20px 2.2vh;display:flex;flex-direction:column;gap:1.4vh;min-width:0}
.step{font-size:clamp(20px,3.3vh,40px);display:flex;align-items:center;gap:.4em}
.step b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;background:var(--gold);border:3px solid var(--ink);border-radius:8px;font-weight:400;font-size:.8em;flex:none}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grade{font-family:var(--display);font-size:clamp(20px,3.4vh,42px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:var(--gc);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:1vh 8px 1.2vh;cursor:pointer;line-height:1}
.grade small{display:block;font-size:.5em;-webkit-text-stroke:0;margin-top:.2em;opacity:.95}
.grade:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.grade[aria-pressed="true"],.qcard[aria-pressed="true"],.mcard[aria-pressed="true"]{outline:6px solid var(--gold);outline-offset:3px}
.qcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qcard{text-align:left;background:var(--paper-2);border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:.8vh 14px 1vh;cursor:pointer;display:flex;flex-direction:column;gap:.2vh;min-width:0}
.qcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.qcard .qn{font-family:var(--display);font-size:clamp(15px,2.3vh,28px);color:var(--muted)}
.qcard .qt{font-family:var(--display);font-size:clamp(18px,3vh,36px);line-height:1.05}
.qcard .qw{font-size:clamp(15px,2.3vh,28px);font-weight:700;color:var(--muted)}
.answers.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.books{display:flex;flex-wrap:wrap;gap:8px}
.books button{font-family:var(--body);font-weight:700;font-size:clamp(16px,2.5vh,30px);background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:.15em .6em .25em;cursor:pointer;text-align:left}
.books button[aria-pressed="true"]{background:var(--gold)}
.books button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.kindrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qcard.all{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
.qcard[aria-pressed="true"]{background:#fff4c2}
.hint{font-size:clamp(16px,2.4vh,30px);font-weight:700;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcard{border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:0;cursor:pointer;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;min-width:0;text-align:left}
.mcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mcard .art{height:clamp(60px,10vh,130px);background:linear-gradient(180deg,var(--m1),var(--m2));border-bottom:4px solid var(--ink);display:grid;place-items:center}
.mcard .art svg{height:86%;width:auto;max-width:92%}
.mcard .mi{padding:.6vh 10px 1vh;display:flex;flex-direction:column}
.mcard h3{font-size:clamp(18px,3vh,38px);line-height:1.05}
.mcard span{font-size:clamp(14px,2.2vh,27px);font-weight:700;color:var(--muted);line-height:1.15}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-family:var(--display);font-size:clamp(17px,2.7vh,34px);min-width:2.4em;background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:.12em .55em .22em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold)}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt .lbl{font-size:clamp(17px,2.8vh,34px);font-weight:700}
.team-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8vh 12px}
.team-row{display:flex;align-items:center;gap:8px;min-width:0}
.team-row svg{height:clamp(36px,5.4vh,66px);flex:none}
.team-row input{flex:1;min-width:0;font-family:var(--display);font-size:clamp(18px,2.8vh,36px);padding:.15em .45em .25em;border:3px solid var(--ink);border-radius:12px;background:var(--paper-2);color:var(--ink)}
.start-row .btn{font-size:clamp(22px,3.8vh,48px);width:100%}
.ground-strip{height:5vh;min-height:30px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));flex:none;border-top:4px solid var(--ink);
  background-image:linear-gradient(90deg,rgba(0,0,0,.12) 3px,transparent 3px),linear-gradient(var(--grass),var(--grass) 55%,var(--grass-2) 55%);background-size:54px 100%,100% 100%}
.loadnote{font-size:clamp(15px,2.2vh,26px);font-weight:700;color:var(--muted)}

/* ---------- play ---------- */
#play{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.1vh;padding-block:1.1vh 1.5vh}
.topbar{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .title{font-family:var(--display);font-size:clamp(17px,3.2vh,42px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.chip{font-family:var(--display);display:inline-flex;align-items:center;gap:.4em;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:.08em .7em .16em;box-shadow:0 3px 0 var(--ink);font-size:clamp(15px,2.7vh,34px);white-space:nowrap}
.scores{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.score{font-family:var(--display);display:flex;align-items:center;gap:.4em;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:.05em .6em .12em .3em;font-size:clamp(15px,2.7vh,34px);white-space:nowrap;transition:transform .2s}
.score i{width:1em;height:1em;border:2px solid var(--ink);border-radius:4px;background:var(--tc);display:inline-block}
.score b{font-weight:400;font-variant-numeric:tabular-nums}
.score .nm{max-width:9em;overflow:hidden;text-overflow:ellipsis;color:var(--tc);-webkit-text-stroke:.5px var(--ink)}
.score.active{outline:4px solid var(--gold);outline-offset:2px;transform:translateY(-2px)}
.score .st{font-size:.75em;background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:0 .3em}

.arena{position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);background:linear-gradient(180deg,var(--a-sky1),var(--a-sky2));min-height:170px}
.arena[data-mode="boss"]{--a-sky1:#123049;--a-sky2:#2f7f8f;--a-g1:#9aa0b5;--a-g2:#71768a}
.arena[data-mode="obby"]{--a-sky1:#38b6ff;--a-sky2:#d4f4ff}
.arena[data-mode="tycoon"]{--a-sky1:#7fd3ff;--a-sky2:#e8fbff;--a-g1:#6cc84f;--a-g2:#45a035}
.ground{position:absolute;left:0;right:0;bottom:0;height:20%;border-top:4px solid var(--ink);
  background-image:linear-gradient(90deg,rgba(0,0,0,.12) 3px,transparent 3px),linear-gradient(var(--a-g1),var(--a-g1) 40%,var(--a-g2) 40%);background-size:64px 100%,100% 100%}
.stage{position:absolute;inset:0}
.av svg{height:100%;display:block}
.actor{position:absolute;aspect-ratio:60/118;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.actor .hopper svg{width:100%;height:100%}
.actor .hopper{height:100%}
.actor.active .hopper{animation:hop 1.1s ease-in-out infinite}
.actor .tag{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(10px,1.6vh,20px);white-space:nowrap;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 .4em .1em;color:var(--tc);margin-bottom:2px}
@keyframes hop{0%,100%{translate:0 0}50%{translate:0 -8%}}

/* boss */
.teams{position:absolute;left:3%;bottom:6%;width:50%;height:30%;display:flex;align-items:flex-end;justify-content:space-around}
.teams .actor{position:relative;height:100%}
.teams .actor.active{transform:scale(1.12);transform-origin:bottom center}
.bosswrap{position:absolute;right:5%;bottom:7%;height:66%;aspect-ratio:1/1;max-width:42%}
.boss{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite}
.boss .inner{width:100%;height:100%}
.boss svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.boss.rage svg{filter:drop-shadow(0 0 14px #ff2d2d) drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.boss.rage{animation-duration:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
.hp{position:absolute;right:3%;top:4%;width:min(40%,620px);display:flex;flex-direction:column;gap:.5vh;z-index:2}
.hp .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hp .bname{font-family:var(--display);font-size:clamp(18px,3.4vh,46px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.hp .num{font-family:var(--display);font-size:clamp(15px,2.6vh,34px);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp .bar{height:clamp(16px,3vh,38px);background:#2b2f3f;border:4px solid var(--ink);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 4px 0 var(--ink)}
.hp .ghost{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.6;transition:width 1s .35s ease}
.hp .fill{position:absolute;inset:0 auto 0 0;background:var(--hpc,#3bd16f);transition:width .45s ease;background-image:linear-gradient(180deg,rgba(255,255,255,.35) 0 35%,transparent 35%)}
.rage-tag{align-self:flex-end;font-family:var(--display);background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 .5em .1em;font-size:clamp(12px,2vh,26px);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.flick{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{transform:translateY(-4px)}}

/* obby */
.slime{position:absolute;left:0;right:0;bottom:0;height:11%;border-top:4px solid var(--ink);background:repeating-linear-gradient(90deg,#7be04a 0 38px,#62cc35 38px 76px)}
.slime::after{content:"";position:absolute;inset:-12px 0 auto;height:12px;background:radial-gradient(circle at 12px 12px,#7be04a 10px,transparent 11px) 0 0/48px 24px repeat-x}
.plat{position:absolute;height:5%;min-height:14px;border:4px solid var(--ink);border-radius:6px;box-shadow:0 5px 0 rgba(0,0,0,.25);transform:translateX(-50%);
  background-image:linear-gradient(180deg,rgba(255,255,255,.35) 0 30%,transparent 30%)}
.plat .pn{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(12px,2vh,26px);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;margin-top:4px}
.flag{position:absolute;transform:translateX(-50%)}
.flag svg{height:100%;display:block;overflow:visible}
.obby-actor{transition:left .65s cubic-bezier(.3,.7,.4,1),bottom .65s cubic-bezier(.3,.7,.4,1);transform:translateX(-50%)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.7;box-shadow:30px 10px 0 -6px #fff,-26px 8px 0 -8px #fff}

/* tycoon */
.plots{position:absolute;left:2%;right:2%;bottom:4%;top:6%;display:flex;gap:2%;align-items:flex-end;justify-content:center}
.plot{flex:1;max-width:44%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;min-width:0}
.plot .bld{height:76%;width:100%;display:flex;align-items:flex-end;justify-content:flex-end;position:relative}
.plot .bld>svg{height:100%;max-width:76%;overflow:visible}
.plot .bld .actor{position:absolute;left:0;bottom:0;height:40%}
.plot.active .bld .actor .hopper{animation:hop 1.1s ease-in-out infinite}
.plot .sign{font-family:var(--display);background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:.1em .6em .2em;font-size:clamp(14px,2.5vh,32px);text-align:center;margin-top:.8vh;max-width:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plot.active .sign{outline:4px solid var(--gold);outline-offset:2px}
.plot .meter{width:80%;height:clamp(10px,1.6vh,20px);border:3px solid var(--ink);border-radius:8px;background:#e7ecf3;overflow:hidden;margin-top:.6vh}
.plot .meter div{height:100%;background:var(--gold);transition:width .4s}
.pc{transform-box:fill-box;transform-origin:center bottom}
.pc.off{display:none}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:3%;background:rgba(15,20,35,.35);z-index:5}
.overlay .card2{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:2vh 26px 2.4vh;max-width:min(980px,92%);display:flex;flex-direction:column;gap:1.2vh;align-items:center;text-align:center;box-sizing:border-box}
.overlay h2{font-size:clamp(26px,5.8vh,78px);line-height:1}
.overlay p{margin:0;font-size:clamp(19px,3.6vh,48px);font-weight:700;line-height:1.25;max-width:44ch;-webkit-text-stroke:.02em currentColor}
.overlay .lab{font-family:var(--display);font-size:clamp(14px,2.4vh,30px);color:var(--muted);letter-spacing:.05em}
.overlay .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.overlay.slim{place-items:start start;background:transparent;padding:2%}
.overlay.slim .card2{padding-block:1.4vh 1.8vh;gap:.9vh;max-width:min(1150px,62%)}
.result-good{color:var(--good)} .result-bad{color:var(--bad)}

.deck{display:flex;flex-direction:column;gap:1.1vh;min-width:0}
.qrow{display:flex;align-items:stretch;gap:12px;min-width:0}
.turn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;background:var(--tc,#888);color:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:.6vh 14px;min-width:clamp(100px,13vw,240px);max-width:26%}
.turn .who{font-family:var(--display);font-size:clamp(17px,3.2vh,42px);line-height:1;text-align:center;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;overflow-wrap:anywhere}
.turn .lbl{font-family:var(--display);font-size:clamp(13px,2.2vh,28px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 .5em .1em}
.qbox{flex:1;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:1vh 18px;display:flex;align-items:center;gap:14px}
.qkind{font-family:var(--display);font-size:clamp(13px,2.3vh,30px);color:var(--muted);letter-spacing:.04em}
.qtext{font-size:var(--step-q);line-height:1.18;font-weight:700;-webkit-text-stroke:.025em currentColor;text-wrap:balance}
.qtext .w{background:#fff1a8;border:2px solid var(--ink);border-radius:8px;padding:0 .25em;white-space:nowrap}
.qmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3vh}
.timer{flex:none;width:clamp(46px,7.6vh,96px);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;background:conic-gradient(var(--tcol,var(--good)) calc(var(--p,1)*360deg),#d9dee8 0);position:relative}
.timer span{position:absolute;inset:16%;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:clamp(15px,2.8vh,36px);font-variant-numeric:tabular-nums}
.timer.low{animation:pulse .5s ease-in-out infinite}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2vh 16px}
.ans{--ac:var(--a);display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:4px solid var(--ink);border-radius:16px;
  box-shadow:0 6px 0 var(--ink),inset 0 -6px 0 color-mix(in srgb,var(--ac) 22%,transparent);min-height:clamp(58px,11vh,150px);padding:.5vh 16px .5vh 10px;cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s,background .2s;min-width:0}
.ans:nth-child(2){--ac:var(--b)} .ans:nth-child(3){--ac:var(--c)} .ans:nth-child(4){--ac:var(--d)}
.ans .key{flex:none;width:clamp(42px,7.4vh,96px);aspect-ratio:1;display:grid;place-items:center;background:var(--ac);color:#fff;border:4px solid var(--ink);border-radius:12px;font-family:var(--display);font-size:clamp(20px,4.2vh,54px);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.ans .txt{font-size:var(--step-ans);line-height:1.15;font-weight:700;-webkit-text-stroke:.022em currentColor;min-width:0;overflow-wrap:anywhere}
.ans.long .txt{font-size:clamp(18px,3.3vh,46px)}
.ans:hover:not([disabled]){background:color-mix(in srgb,var(--ac) 12%,var(--paper))}
.ans:active:not([disabled]){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.ans[disabled]{cursor:default}
.ans.dim{opacity:.38}
.ans.right{background:#d9f7df;outline:6px solid var(--good);outline-offset:-2px} .ans.right .key{background:var(--good)}
.ans.wrong{background:#fde0de} .ans.wrong .key{background:var(--bad)} .ans.wrong .txt{text-decoration:line-through;text-decoration-thickness:3px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.bolt{position:absolute;width:40px;height:40px;border:4px solid var(--ink);border-radius:6px;box-shadow:0 0 18px 6px rgba(255,255,255,.75)}
.orb{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--oc,#9b59ff) 45%,#2a0b4d);border:4px solid var(--ink);box-shadow:0 0 24px 8px var(--oc,#9b59ff)}
.coin{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffcd2e 55%,#d99a00);border:3px solid var(--ink)}
.pop{position:absolute;font-family:var(--display);font-size:clamp(26px,5.6vh,80px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap;transform:translate(-50%,-50%)}
.pop.heal{color:var(--heal)} .pop.crit,.pop.gold{color:var(--gold)} .pop.small{font-size:clamp(17px,3.2vh,46px)}
.shard{position:absolute;border:3px solid var(--ink);border-radius:3px}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(34px,8.5vh,130px);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);white-space:nowrap;text-align:center}

#results{overflow-y:auto;padding-block:2vh 3vh;display:flex;flex-direction:column;gap:2vh}
.res-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6vh}
.res-head h1{font-size:clamp(38px,8.5vh,116px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);line-height:1}
.res-head p{margin:0;font-size:clamp(18px,3.5vh,44px);font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:.2em .8em .3em;box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:.02em currentColor;max-width:90%}
.stars{display:flex;gap:12px;justify-content:center}
.stars svg{width:clamp(50px,10vh,120px);height:auto}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,32px)}
.pod{display:flex;flex-direction:column;align-items:center;gap:.6vh;width:clamp(100px,17vw,260px)}
.pod .av{height:clamp(70px,15vh,190px)}
.pod .block{width:100%;box-sizing:border-box;padding:1vh 4px;background:var(--tc);border:4px solid var(--ink);border-radius:12px 12px 0 0;box-shadow:inset 0 -8px 0 rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;gap:.4vh;color:#fff}
.pod .place{font-family:var(--display);font-size:clamp(26px,5.5vh,72px);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;line-height:1}
.pod .pname{font-family:var(--display);font-size:clamp(15px,2.5vh,32px);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:.05em .5em .15em;max-width:92%;box-sizing:border-box;text-align:center;overflow-wrap:anywhere}
.pod .pstat{font-size:clamp(15px,2.5vh,30px);font-weight:700;background:rgba(27,34,54,.55);border-radius:8px;padding:0 .5em .1em;text-align:center}
.mvp{font-family:var(--display);background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:0 .5em .1em;font-size:clamp(16px,2.8vh,36px);box-shadow:0 3px 0 var(--ink)}
.res-btns{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.review{max-width:1100px;width:100%;margin-inline:auto;box-sizing:border-box}
.review ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1vh}
.review li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:start;border-bottom:2px dashed #c9d0dc;padding-bottom:1vh}
.review li:last-child{border-bottom:0}
.review .tag{font-family:var(--display);font-size:clamp(12px,1.8vh,22px);border:2px solid var(--ink);border-radius:8px;padding:0 .5em .1em;color:#fff;grid-row:span 2;align-self:center;text-align:center;min-width:5.5em}
.review .tag.correct{background:var(--good)} .review .tag.stolen{background:var(--b)} .review .tag.missed{background:var(--bad)}
.review .rq{font-size:clamp(17px,2.8vh,36px);font-weight:700;-webkit-text-stroke:.02em currentColor}
.review .ra{font-size:clamp(16px,2.5vh,32px);color:var(--muted);font-weight:700}
.review .ra strong{color:var(--ink)}

@media (max-width:860px){
  .answers.three{grid-template-columns:minmax(0,1fr)}
  body{overflow:auto}
  .lobby-grid{grid-template-columns:minmax(0,1fr)}
  #play{height:auto;min-height:100%}
  .arena{height:44vh}
  .answers{grid-template-columns:minmax(0,1fr)}
  .qrow{flex-direction:column}
  .turn{max-width:none;flex-direction:row}
  .topbar{flex-wrap:wrap}
  .topbar .title{flex-basis:100%}
  .hp{width:56%} .bosswrap{max-width:46%;height:55%}
  .overlay.slim .card2{max-width:96%}
  .team-rows{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){ .modes{grid-template-columns:minmax(0,1fr)} .mcard{flex-direction:row} .mcard .art{width:34%;height:auto;border-bottom:0;border-right:4px solid var(--ink)} }
@media (prefers-reduced-motion:reduce){ .boss,.actor.active .hopper,.plot.active .bld .actor .hopper,.flick,.blink,.timer.low,.rage-tag{animation:none!important} .obby-actor{transition:none} }
</style>
</head>
<body>
<div id="app">
  <section id="lobby" class="screen">
    <div class="logo-row">
      <div class="logo">Science Arcade<small>Pick your words or stories. Pick your game. Play!</small></div>
      <div class="toprt"><a class="btn small ghost" href="index.html#/arcade">Back to Science Arcade</a><button class="iconbtn" id="fsBtn1" aria-label="Full screen" title="Full screen"></button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h2 class="step"><b>1</b> Pick your grade</h2>
        <div class="grades" id="grades"></div>
        <h2 class="step"><b>2</b> Pick what to practice</h2>
        <div class="kindrow"><div class="seg" id="segKind"></div></div>
        <div class="qcards" id="qcards"></div>
        <div class="books" id="books" hidden></div>
        <div class="opt" id="textRow" hidden><span class="lbl">Questions from</span><div class="seg" id="segText"></div></div>
        <p class="loadnote" id="loadNote"></p>
      </div>
      <div class="panel">
        <h2 class="step"><b>3</b> Pick a game</h2>
        <div class="modes" id="modes"></div>
        <h2 class="step"><b>4</b> Who is playing?</h2>
        <div class="seg" id="segPlayers"></div>
        <div class="team-rows" id="teamRows"></div>
        <div class="opt"><span class="lbl">Questions</span><div class="seg" id="segQ"></div></div>
        <div class="opt"><span class="lbl">Timer</span><div class="seg" id="segTimer"></div></div>
        <div class="opt"><span class="lbl">Sound</span><div class="seg" id="segSound"></div></div>
        <div class="start-row"><button class="btn" id="startBtn" disabled>Pick your words first</button></div>
      </div>
    </div>
    <div class="ground-strip" aria-hidden="true"></div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="topbar">
      <div class="title" id="pTitle"></div>
      <div class="scores" id="scores"></div>
      <span class="chip" id="qCount"></span>
      <button class="iconbtn" id="soundBtn" aria-label="Sound on or off" title="Sound"></button>
      <button class="iconbtn" id="fsBtn2" aria-label="Full screen" title="Full screen"></button>
      <button class="iconbtn" id="quitBtn" aria-label="Quit to menu" title="Quit to menu"></button>
    </div>
    <div class="arena" id="arena"><div class="stage" id="stage"></div><div class="overlay" id="ov" hidden></div></div>
    <div class="deck">
      <div class="qrow">
        <div class="turn" id="turn"><span class="lbl" id="turnLbl">YOUR TURN</span><span class="who" id="turnWho"></span></div>
        <div class="qbox">
          <div class="qmain"><span class="qkind" id="qKind"></span><div class="qtext" id="qText"></div></div>
          <button class="iconbtn" id="sayBtn" aria-label="Read the question out loud" title="Read it to me"></button>
          <div class="timer" id="timer" hidden><span id="timerNum"></span></div>
        </div>
      </div>
      <div class="answers" id="answers"></div>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="res-head"><h1 id="resTitle"></h1><p id="resSub"></p></div>
    <div class="stars" id="stars" hidden></div>
    <div class="podium" id="podium"></div>
    <div class="res-btns">
      <button class="btn" id="againBtn">Play again</button>
      <button class="btn" style="--bc:var(--b)" id="menuBtn">Change game or words</button>
      <button class="btn ghost" id="reviewBtn">Review the words</button>
    </div>
    <div class="panel review" id="review" hidden><h2 class="step">Review</h2><ol id="reviewList"></ol></div>
    <div class="ground-strip" aria-hidden="true"></div>
  </section>
</div>

/* Vocabulary snapshot taken from index.html when this page was built.

const SNAPSHOT={"3-1":{"name":"Forces and Interactions","words":[{"w":"claim","say":"claim","m":"A statement you think is true","ex":"My claim is that the magnet will pick up the nail."},{"w":"evidence","say":"ev-i-dence","m":"Facts you see or measure that show whether a claim is true","ex":"Our evidence is that the nail stuck to the magnet."},{"w":"reasoning","say":"rea-son-ing","m":"Explaining how your evidence supports your claim","ex":"My reasoning is that nails are steel, and magnets pull on steel."},{"w":"force","say":"force","m":"A push or a pull","ex":"A force made the ball roll."},{"w":"motion","say":"mo-tion","m":"Moving, or changing how something moves","ex":"The swing is in motion."},{"w":"balanced forces","say":"bal-anced for-ces","m":"Forces that are the same size and pull opposite ways, so nothing changes","ex":"Balanced forces keep the book still on the table."},{"w":"unbalanced forces","say":"un-bal-anced for-ces","m":"Forces that are not equal, so the object speeds up, slows down, or changes direction","ex":"Unbalanced forces made the wagon speed up."},{"w":"gravity","say":"grav-i-ty","m":"A force that pulls things toward Earth","ex":"Gravity pulled the pencil to the floor."},{"w":"pattern","say":"pat-tern","m":"Something that repeats in a way you can count on","ex":"The swing moves in a pattern: back, forth, back, forth."},{"w":"predict","say":"pre-dict","m":"Say what you think will happen next, using what you know","ex":"I predict the car will go farther on the high ramp."},{"w":"pendulum","say":"pen-du-lum","m":"A weight that swings back and forth from a string","ex":"The pendulum swung nine times."},{"w":"friction","say":"fric-tion","m":"A force that slows things down when they rub together","ex":"Friction slowed the toy car on the carpet."},{"w":"measure","say":"meas-ure","m":"Find out how long, how heavy, or how many","ex":"We measured the string with a ruler."},{"w":"static electricity","say":"stat-ic e-lec-tric-i-ty","m":"A buildup of electric charge that makes things cling","ex":"Static electricity made the paper bits cling to the balloon."},{"w":"magnet","say":"mag-net","m":"An object that pulls on some metals","ex":"The magnet picked up the paper clip."},{"w":"attract","say":"at-tract","m":"To pull together","ex":"Opposite poles attract."},{"w":"repel","say":"re-pel","m":"To push apart","ex":"Matching poles repel."},{"w":"pole","say":"pole","m":"The end of a magnet where the pull is strongest","ex":"Each magnet has two poles."},{"w":"problem","say":"prob-lem","m":"Something that needs to be fixed or improved","ex":"The problem was that the cabinet kept opening."},{"w":"design","say":"de-sign","m":"To plan and make something that solves a problem","ex":"We designed a magnet latch."},{"w":"solution","say":"so-lu-tion","m":"An idea or tool that solves a problem","ex":"The magnet was our solution."},{"w":"test","say":"test","m":"Try it out to see if it works","ex":"We tested the latch ten times."},{"w":"improve","say":"im-prove","m":"Change it so it works better","ex":"We improved the latch with a second magnet."}]},"3-2":{"name":"Weather and Climate","words":[{"w":"weather","say":"weath-er","m":"What the air outside is like right now","ex":"Today's weather is cloudy."},{"w":"season","say":"sea-son","m":"One of four parts of the year: winter, spring, summer, fall","ex":"Fall is my favorite season."},{"w":"temperature","say":"tem-per-a-ture","m":"How hot or cold something is","ex":"The temperature was 60 degrees."},{"w":"precipitation","say":"pre-cip-i-ta-tion","m":"Water that falls from the sky, like rain, snow, or sleet","ex":"Precipitation fell on most days in April."},{"w":"graph","say":"graph","m":"A picture that shows data","ex":"We made a graph of the daily temperatures."},{"w":"climate","say":"cli-mate","m":"The usual weather in a place over many years","ex":"The desert has a dry climate."},{"w":"region","say":"re-gion","m":"A large area with something in common","ex":"Our region has four seasons."},{"w":"tropical","say":"trop-i-cal","m":"Hot and rainy most of the year","ex":"Tropical places are warm and wet."},{"w":"desert","say":"des-ert","m":"A place with very little rain","ex":"Few plants grow in the desert."},{"w":"polar","say":"po-lar","m":"Very cold, near the North or South Pole","ex":"Polar regions are covered with ice."},{"w":"hazard","say":"haz-ard","m":"Something that can cause harm","ex":"Lightning is a weather hazard."},{"w":"severe weather","say":"se-vere weath-er","m":"Dangerous weather, like a hurricane or tornado","ex":"We practiced what to do in severe weather."},{"w":"merit","say":"mer-it","m":"How good or useful something is","ex":"The slanted roof had more merit than the flat roof."}]},"3-3":{"name":"Fossils, Traits, and Variation","words":[{"w":"fossil","say":"fos-sil","m":"What is left of a living thing from long ago, preserved in rock","ex":"We found a fossil shell."},{"w":"organism","say":"or-gan-ism","m":"Any living thing","ex":"A bean plant is an organism."},{"w":"environment","say":"en-vi-ron-ment","m":"Everything around a living thing, like light, water, food, and weather","ex":"The environment helps plants grow."},{"w":"extinct","say":"ex-tinct","m":"No longer living anywhere on Earth","ex":"Dinosaurs are extinct."},{"w":"data","say":"da-ta","m":"Information you collect, like measurements","ex":"We recorded data on each puppy."},{"w":"trait","say":"trait","m":"A feature of a living thing, like fur color or leaf shape","ex":"Fur color is a trait."},{"w":"inherit","say":"in-her-it","m":"To get a trait from your parents","ex":"Puppies inherit traits from both parents."},{"w":"offspring","say":"off-spring","m":"The young of a plant or animal","ex":"The puppies are the dog's offspring."},{"w":"variation","say":"var-i-a-tion","m":"Differences among living things of the same kind","ex":"There is variation in bean size."},{"w":"influence","say":"in-flu-ence","m":"To change or have an effect on","ex":"Light can influence how a plant grows."},{"w":"characteristic","say":"char-ac-ter-is-tic","m":"A feature, like color, size, or speed","ex":"Color is a characteristic of the beetle."},{"w":"advantage","say":"ad-van-tage","m":"Something that helps you do better","ex":"Speed is an advantage for a rabbit."},{"w":"camouflage","say":"cam-ou-flage","m":"Colors or patterns that help a living thing blend in","ex":"The green beetle used camouflage."},{"w":"species","say":"spe-cies","m":"One kind of living thing","ex":"All the green beetles are one species."},{"w":"adaptation","say":"ad-ap-ta-tion","m":"A body part or behavior that helps a living thing survive where it lives","ex":"A thick coat is an adaptation for cold places."}]},"3-4":{"name":"Ecosystems and Life Cycles","words":[{"w":"biodiversity","say":"bi-o-di-ver-si-ty","m":"The many different kinds of living things in a place","ex":"A meadow with many plants has high biodiversity."},{"w":"habitat","say":"hab-i-tat","m":"The place where a living thing lives","ex":"A pond is a frog's habitat."},{"w":"needs","say":"needs","m":"Things a living thing must have to live, like food, water, and shelter","ex":"A frog's needs include water."},{"w":"survive","say":"sur-vive","m":"To stay alive","ex":"Camels survive in hot, dry places."},{"w":"compete","say":"com-pete","m":"To try to get the same food, water, or space as others","ex":"Squirrels compete for acorns."},{"w":"life cycle","say":"life cy-cle","m":"The stages of a living thing's life, from birth to death","ex":"A butterfly has a life cycle with four stages."},{"w":"reproduce","say":"re-pro-duce","m":"To make new living things of the same kind","ex":"Plants reproduce by making seeds."},{"w":"metamorphosis","say":"met-a-mor-pho-sis","m":"A big body change, like a caterpillar becoming a butterfly","ex":"A tadpole goes through metamorphosis."},{"w":"stage","say":"stage","m":"One step in a life cycle","ex":"The chrysalis is one stage of the life cycle."},{"w":"group","say":"group","m":"A number of animals that live or move together","ex":"Meerkats live in a group."},{"w":"defend","say":"de-fend","m":"To protect from danger","ex":"The lookout helps defend the group."},{"w":"change","say":"change","m":"To become different","ex":"Heavy rain can change a creek."},{"w":"trade-off","say":"trade-off","m":"A good thing you give up to get another good thing","ex":"Cleanup is quick, but grasses last longer, so choosing is a trade-off."}]},"4-1":{"name":"Earth’s Systems","words":[{"w":"claim","say":"claim","m":"A statement about how something works that you can test","ex":"My claim is that the bottom layer is the oldest."},{"w":"evidence","say":"ev-i-dence","m":"What you observe or measure that shows whether a claim is true","ex":"Our evidence is the jar with the gravel on the bottom."},{"w":"reasoning","say":"rea-son-ing","m":"Explaining how your evidence supports your claim","ex":"My reasoning is that heavy pieces settle first."},{"w":"map","say":"map","m":"A drawing that shows where places and things are","ex":"The map shows rivers and mountains."},{"w":"feature","say":"fea-ture","m":"A part of the land or sea, like a river or a mountain","ex":"A river is a feature of the land."},{"w":"pattern","say":"pat-tern","m":"Something that repeats in a way you can count on","ex":"Volcanoes form a pattern around the Pacific Ocean."},{"w":"mountain range","say":"moun-tain range","m":"A long line of mountains","ex":"The Rockies are a mountain range."},{"w":"trench","say":"trench","m":"A deep, narrow valley on the ocean floor","ex":"The deepest part of the ocean is in a trench."},{"w":"rock layer","say":"rock lay-er","m":"A band of rock that formed during one period of time","ex":"The bottom rock layer is usually the oldest."},{"w":"sediment","say":"sed-i-ment","m":"Small bits of sand, mud, or rock that settle","ex":"Sediment settled to the bottom of the jar."},{"w":"fossil","say":"fos-sil","m":"What is left of a living thing from long ago, preserved in rock","ex":"A fossil seashell shows the area was once under water."},{"w":"landscape","say":"land-scape","m":"The land and its features, like hills, rivers, and shores","ex":"Rivers can change a landscape."},{"w":"weathering","say":"weath-er-ing","m":"Breaking rock into smaller pieces","ex":"Ice and water cause weathering."},{"w":"erosion","say":"e-ro-sion","m":"Moving broken rock and soil from one place to another","ex":"Rain caused erosion on the hill."},{"w":"vegetation","say":"veg-e-ta-tion","m":"Plants growing in an area","ex":"Vegetation holds soil in place."},{"w":"rate","say":"rate","m":"How fast something happens","ex":"Plants slow the rate of erosion."},{"w":"natural process","say":"nat-u-ral proc-ess","m":"Something that happens in nature, like an earthquake or a flood","ex":"A flood is a natural process."},{"w":"hazard","say":"haz-ard","m":"Something that can cause harm","ex":"An earthquake is a natural hazard."},{"w":"solution","say":"so-lu-tion","m":"An idea or tool that solves a problem","ex":"A wall of rocks was our solution."},{"w":"compare","say":"com-pare","m":"Look at how things are alike and different","ex":"We compared two tower designs."},{"w":"test","say":"test","m":"Try it out to see if it works","ex":"We tested each tower."}]},"4-2":{"name":"Energy","words":[{"w":"energy","say":"en-er-gy","m":"The ability to make things move, heat up, or change","ex":"A moving car has energy."},{"w":"speed","say":"speed","m":"How fast something moves","ex":"The faster car had more speed."},{"w":"motion energy","say":"mo-tion en-er-gy","m":"The energy a moving object has","ex":"A fast ball has more motion energy than a slow ball."},{"w":"predict","say":"pre-dict","m":"Say what you think will happen next, using what you know","ex":"I predict the marble will roll farther."},{"w":"collision","say":"col-li-sion","m":"When two objects hit each other","ex":"Energy moves in a collision."},{"w":"outcome","say":"out-come","m":"What happens in the end","ex":"The outcome of the crash was that the second marble rolled away."},{"w":"heat","say":"heat","m":"Energy that makes things warmer","ex":"Heat moved up the metal spoon."},{"w":"transfer","say":"trans-fer","m":"To move from one place to another","ex":"Energy can transfer from the water to the spoon."},{"w":"conduct","say":"con-duct","m":"To let heat or electricity pass through","ex":"Metal conducts heat well."},{"w":"vibration","say":"vi-bra-tion","m":"A fast back-and-forth shake","ex":"A vibration makes sound."},{"w":"electric current","say":"e-lec-tric cur-rent","m":"Electricity flowing through a path, like a wire","ex":"Electric current lit the bulb."},{"w":"device","say":"de-vice","m":"A tool or machine made for a purpose","ex":"A flashlight is a device."},{"w":"convert","say":"con-vert","m":"To change from one form to another","ex":"A solar panel converts light into electricity."},{"w":"form of energy","say":"form of en-er-gy","m":"A kind of energy, like light, heat, sound, motion, or electrical","ex":"Heat is one form of energy."},{"w":"improve","say":"im-prove","m":"Change it so it works better","ex":"We improved the car's wheels."}]},"4-3":{"name":"Resources, Waves, and Information","words":[{"w":"natural resource","say":"nat-u-ral re-source","m":"Something from nature that people use","ex":"Water is a natural resource."},{"w":"fuel","say":"fu-el","m":"A material burned to make heat or power","ex":"Coal is a fuel."},{"w":"renewable","say":"re-new-a-ble","m":"Can be replaced, or never runs out","ex":"Wind is a renewable resource."},{"w":"nonrenewable","say":"non-re-new-a-ble","m":"Takes millions of years to form, so it can run out","ex":"Oil is a nonrenewable resource."},{"w":"environment","say":"en-vi-ron-ment","m":"Everything around living things, like air, water, and land","ex":"Burning fuel can affect the environment."},{"w":"wave","say":"wave","m":"A repeating pattern of motion that carries energy","ex":"A wave carries energy across the pool."},{"w":"amplitude","say":"am-pli-tude","m":"How tall a wave is","ex":"A tall wave has a big amplitude."},{"w":"wavelength","say":"wave-length","m":"The distance from one peak of a wave to the next","ex":"A long wave has a long wavelength."},{"w":"model","say":"mod-el","m":"A drawing or object that shows how something works","ex":"We drew a model of a wave."},{"w":"code","say":"code","m":"A set of patterns that stand for letters, words, or ideas","ex":"We used a code to send a message."},{"w":"signal","say":"sig-nal","m":"A message sent using light, sound, or movement","ex":"The flashing light was a signal."},{"w":"information","say":"in-for-ma-tion","m":"Facts or messages","ex":"Our eyes send information to the brain."},{"w":"sense","say":"sense","m":"A way of taking in information: sight, hearing, smell, taste, or touch","ex":"Touch is one of our senses."},{"w":"brain","say":"brain","m":"The body part that makes sense of information","ex":"The brain tells the hand to squeeze."},{"w":"respond","say":"re-spond","m":"To act in answer to something","ex":"Pepper responded to the squeak."},{"w":"reaction","say":"re-ac-tion","m":"A quick response to something","ex":"Catching the ruler tests your reaction."}]},"4-4":{"name":"Light, Senses, and Structures","words":[{"w":"light","say":"light","m":"Energy that lets us see","ex":"We see when light enters our eyes."},{"w":"reflect","say":"re-flect","m":"To bounce off a surface","ex":"A mirror reflects light."},{"w":"light source","say":"light source","m":"Something that makes its own light","ex":"The Sun is a light source."},{"w":"path","say":"path","m":"The route something follows","ex":"Light follows a path to our eyes."},{"w":"structure","say":"struc-ture","m":"A part of a living thing","ex":"A beak is a structure."},{"w":"function","say":"func-tion","m":"The job a part does","ex":"The function of roots is to take in water."},{"w":"internal","say":"in-ter-nal","m":"On the inside","ex":"The heart is an internal structure."},{"w":"external","say":"ex-ter-nal","m":"On the outside","ex":"A claw is an external structure."},{"w":"survive","say":"sur-vive","m":"To stay alive","ex":"Structures help animals survive."}]},"5-1":{"name":"Matter and Energy From the Sun","words":[{"w":"claim","say":"claim","m":"A statement about science that you can test with evidence","ex":"My claim is that sugar is still there after it dissolves."},{"w":"evidence","say":"ev-i-dence","m":"What you observe or measure that supports or challenges a claim","ex":"The crystals left in the dish are evidence."},{"w":"reasoning","say":"rea-son-ing","m":"Explaining how your evidence supports your claim","ex":"My reasoning is that the salt came back when the water evaporated."},{"w":"qualitative","say":"qual-i-ta-tive","m":"Describes what you observe using words, like color or texture","ex":"A qualitative observation is that the rock is rough."},{"w":"quantitative","say":"quan-ti-ta-tive","m":"Describes what you measure using numbers","ex":"A quantitative observation is that the rock weighs 40 grams."},{"w":"matter","say":"mat-ter","m":"Anything that takes up space and has weight","ex":"Air is matter."},{"w":"weight","say":"weight","m":"How heavy something is","ex":"The bag weighed 85 grams."},{"w":"measure","say":"meas-ure","m":"Find out how heavy, how long, or how much","ex":"We measured the weight before and after."},{"w":"graph","say":"graph","m":"A picture that shows data","ex":"Our graph shows the weight stayed the same."},{"w":"conserved","say":"con-served","m":"Stays the same in total","ex":"Matter is conserved when ice melts."},{"w":"dissolve","say":"dis-solve","m":"To mix into a liquid so evenly that you cannot see the pieces","ex":"Salt dissolves in warm water."},{"w":"property","say":"prop-er-ty","m":"A feature you can observe or test, like color or hardness","ex":"Hardness is a property of a rock."},{"w":"material","say":"ma-te-ri-al","m":"What something is made of","ex":"The spoon is made of a metal material."},{"w":"conductor","say":"con-duc-tor","m":"A material that lets heat or electricity pass through easily","ex":"Metal is a good conductor of heat."},{"w":"magnetic","say":"mag-net-ic","m":"Pulled by a magnet","ex":"Steel is magnetic."},{"w":"particle","say":"par-ti-cle","m":"A piece of matter too small to see","ex":"Salt is made of tiny particles."},{"w":"model","say":"mod-el","m":"A drawing or object that shows how something works","ex":"We drew a model with dots."},{"w":"solid, liquid, gas","say":"sol-id, liq-uid, gas","m":"The three common states of matter","ex":"Water can be a solid, a liquid, or a gas."},{"w":"mixture","say":"mix-ture","m":"Two or more substances put together","ex":"Salt and pepper make a mixture."},{"w":"substance","say":"sub-stance","m":"A single kind of matter","ex":"Baking soda is a substance."},{"w":"physical change","say":"phys-i-cal change","m":"A change in how matter looks, with no new substance made","ex":"Melting ice is a physical change."},{"w":"chemical change","say":"chem-i-cal change","m":"A change that makes a new substance","ex":"Rusting is a chemical change."},{"w":"reaction","say":"re-ac-tion","m":"A change that makes new substances","ex":"Baking soda and vinegar have a reaction."},{"w":"plant","say":"plant","m":"A living thing that makes its own food using sunlight","ex":"A plant takes in water through its roots."},{"w":"soil","say":"soil","m":"The dirt where many plants grow","ex":"Soil gives plants small amounts of minerals."},{"w":"carbon dioxide","say":"car-bon di-ox-ide","m":"A gas in the air that plants take in","ex":"Plants use carbon dioxide from the air."},{"w":"photosynthesis","say":"pho-to-syn-the-sis","m":"How plants use sunlight, water, and carbon dioxide to make food","ex":"Photosynthesis happens in a plant's leaves."}]},"5-2":{"name":"Ecosystems and Earth’s Systems","words":[{"w":"energy","say":"en-er-gy","m":"The ability to make things move, heat up, or change","ex":"Food gives our bodies energy."},{"w":"food chain","say":"food chain","m":"A line showing who eats what"," rt of the water cycle."},{"w":"biome","say":"bi-ome","m":"A large area with a certain climate, plants, and animals","ex":"A desert is a biome."},{"w":"impact","say":"im-pact","m":"An effect on something","ex":"Trash has an impact on a creek."},{"w":"resource","say":"re-source","m":"Something from nature that people use","ex":"Trees are a resource."},{"w":"conserve","say":"con-serve","m":"To use less so there is more for later","ex":"We conserve water by turning off the tap."},{"w":"recycle","say":"re-cy-cle","m":"To turn used materials into new things","ex":"We recycle bottles and cans."},{"w":"pollution","say":"pol-lu-tion","m":"Harmful stuff in the air, water, or land","ex":"Pollution can hurt animals."},{"w":"community","say":"com-mu-ni-ty","m":"A group of people who live or work together","ex":"Our community recycles."}]},"5-3":{"name":"Space Systems","words":[{"w":"gravity","say":"grav-i-ty","m":"A force that pulls objects toward the center of Earth","ex":"Gravity pulls things down."},{"w":"force","say":"force","m":"A push or a pull","ex":"Gravity is a force."},{"w":"direction","say":"di-rec-tion","m":"The way something points or moves","ex":"The direction of gravity is toward the ground."},{"w":"center","say":"cen-ter","m":"The middle","ex":"Gravity pulls toward the center of Earth."},{"w":"star","say":"star","m":"A huge ball of hot gas that makes its own light","ex":"The Sun is a star."},{"w":"Sun","say":"Sun","m":"The star closest to Earth","ex":"The Sun looks bright because it is close."},{"w":"brightness","say":"bright-ness","m":"How bright something looks","ex":"The brightness of a star depends on its distance."},{"w":"distance","say":"dis-tance","m":"How far apart two things are","ex":"Distance changes how bright a light looks."},{"w":"shadow","say":"shad-ow","m":"A dark area made when something blocks light","ex":"The shadow was shortest at noon."},{"w":"rotate","say":"ro-tate","m":"To spin around","ex":"Earth rotates once a day."},{"w":"orbit","say":"or-bit","m":"To travel around something in a path","ex":"Earth orbits the Sun."},{"w":"season","say":"sea-son","m":"One of four parts of the year: winter, spring, summer, fall","ex":"Seasons change as Earth orbits the Sun."},{"w":"pattern","say":"pat-tern","m":"Something that repeats in a way you can count on","ex":"Shadows follow a pattern each day."}]},"5-4":{"name":"Macroplastics and Taking Action","words":[{"w":"producer","say":"pro-duc-er","m":"A living thing, like a plant, that makes its own food using sunlight","ex":"Plants are producers."},{"w":"consumer","say":"con-sum-er","m":"A living thing that eats other living things","ex":"A cow is a consumer."},{"w":"decomposer","say":"de-com-pos-er","m":"A living thing that breaks down dead plants and animals","ex":"Fungi are decomposers."},{"w":"ecosystem","say":"ec-o-sys-tem","m":"All the living and nonliving things in an area and how they interact","ex":"A pond is an ecosystem."},{"w":"impact","say":"im-pact","m":"An effect on something","ex":"Trash has an impact on a creek."},{"w":"resource","say":"re-source","m":"Something from nature that people use","ex":"Trees are a resource."},{"w":"conserve","say":"con-serve","m":"To use less so there is more for later","ex":"We conserve water by turning off the tap."},{"w":"recycle","say":"re-cy-cle","m":"To turn used materials into new things","ex":"We recycle bottles and cans."},{"w":"pollution","say":"pol-lu-tion","m":"Harmful stuff in the air, water, or land","ex":"Pollution can hurt animals."},{"w":"community","say":"com-mu-ni-ty","m":"A group of people who live or work together","ex":"Our community recycles."}]}};
const STORY_SNAPSHOT={"3-1":{"name":"Forces and Interactions","books":[{"id":"3-PS2-1","t":"The Tug of War","qs":[{"q":"What did Kennedy think when the towel did not move?","opts":["There were no forces","The towel was too heavy","The boys were not trying"],"why":"Kennedy thought that if nothing moves, there are no forces. The crew tested that idea."},{"q":"What happened when Christian pulled harder?","opts":["The ribbon slid toward Christian","The ribbon stayed over the tape","The towel tore in half"],"why":"One force was bigger, so the forces were unbalanced and the ribbon moved."},{"q":"What are balanced forces?","opts":["Forces that are the same size and pull in opposite directions","Forces that make things speed up","Forces that only act on bikes"],"why":"Balanced forces cancel out, so the motion does not change."},{"q":"Why does a book sit still on a table?","opts":["Gravity pulls it down and the table pushes it up equally","Nothing is pushing or pulling on it","The table is very heavy"],"why":"The forces on the book are balanced, so it stays still."}],"nf":{"t":"Pushes, Pulls, and Balanced Forces","q":[{"q":"What is a force?","opts":["A push or a pull","A kind of energy drink","Something that only happens in space"],"why":"The text says a force is a push or a pull."},{"q":"Why does a book on a desk stay still?","opts":["Gravity pulls down and the desk pushes up with the same strength","No forces are acting on the book","The book is too heavy to move"],"why":"The forces are balanced, so they cancel out and the book's motion does not change."},{"q":"What can unbalanced forces do?","opts":["Make an object start, stop, speed up, slow down, or turn","Only make objects float","Nothing at all"],"why":"Unbalanced forces change an object's motion."},{"q":"In tug of war, which way does the rope move?","opts":["Toward the team that pulls harder","Toward the team that pulls softer","It never moves"],"why":"The stronger pull makes the forces unbalanced, so the rope moves t a medium string would swing about 8 times?","opts":["She used the pattern from the short and long strings","She guessed","She read it in a book"],"why":"The short string made 11 swings and the long string made 6, so a medium string would be in between."}],"nf":{"t":"Swinging in a Pattern","q":[{"q":"What is a pendulum?","opts":["A weight that swings back and forth from a string or rod","A kind of magnet","A ball that rolls in a straight line"],"why":"The text defines a pendulum as a hanging weight that swings back and forth."},{"q":"What changes how fast a pendulum swings?","opts":["The length of the string","The color of the weight","How loudly you count"],"why":"Long pendulums swing slowly and short pendulums swing quickly."},{"q":"What does a pattern help scientists do?","opts":["Predict what will happen next","Stop all motion","Make objects heavier"],"why":"When motion repeats in a pattern, you can predict what comes next."},{"q":"According to the story, how did Galileo time a swinging lamp?","opts":["With his own pulse","With a cell phone","With a sand timer"],"why":"The text says he timed the swings with his pulse."},{"q":"Why were pendulums used in clocks?","opts":["They swing in a steady pattern","They are very light","They make loud music"],"why":"Each steady swing helps a clock keep time."},{"q":"Why can scientists print tide charts months ahead of time?","opts":["Tides rise and fall in a repeating pattern","Tides never change","Tides are controlled by people"],"why":"Repeating patterns make predictions possible."}],"c":[{"q":"In both texts, what changes how a pendulum swings?","opts":["The length of the string","The weight on the end","How hard you push it"],"why":"The crew found this in the story, and the nonfiction text explains it too."},{"q":"Jaylen thought a heavier weight would swing faster. What does the nonfiction text say about that idea?","opts":["A heavier weight does not change the swing time very much","Heavier weights always swing twice as fast","Weight is the only thing that matters"],"why":"Both texts show that string length, not weight, changes the pattern."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["The story of Galileo timing a swinging lamp","A shorter string swings faster","Clocks use pendulums"],"why":"Both texts mention string length and clocks. Only the nonfiction text tells about Galileo."}]}},{"id":"3-PS2-3","t":"The Dancing Paper Bits","qs":[{"q":"What did April think about magnets?","opts":["They stick to all metals","They only stick to paper","They never pull on anything"],"why":"April thought magnets stick to all metals. The test showed that was not true."},{"q":"Which items did the magnet pick up?","opts":["The paper clip and the nail","The foil and the penny","All four items"],"why":"Magnets pull on iron and steel, but not on aluminum foil or a copper penny."},{"q":"What happens when two matching magnet poles meet?","opts":["They repel","They attract","Nothing happens"],"why":"Opposite poles attract, and matching poles repel."},{"q":"What made the paper bits jump to the balloon?","opts":["Static electricity","A hidden magnet","The wind"],"why":"Rubbing the balloon on hair builds up static electricity, which pulls without touching."}],"nf":{"t":"Invisible Pushes and Pulls","q":[{"q":"What makes magnets and static electricity special?","opts":["They can push or pull without touching","They only work underwater","They make objects disappear"],"why":"Both can act on objects without touching them."},{"q":"Which of these will stick to a magnet?","opts":["A steel paper clip","An aluminum can","A copper penny"],"why":"Magnets pull on iron and steel, not on aluminum or copper."},{"q":"What happens when two north poles face each other?","opts":["They push apart","They pull together","Nothing happens"],"why":"Like poles repel, or push apart."},{"q":"Why does a compass needle point north?","opts":["Earth acts like a giant magnet","The wind pushes it","It is painted red on one end"],"why":"Earth's magnetism pulls on the compass needle."},{"q":"What is lightning?","opts":["A giant spark of static electricity","A kind of magnet","Light reflecting off rain"],"why":"Charge builds up in storm clouds and jumps as a giant spark."},{"q":"What is lodestone?","opts":["A natural magnet rock","A kind of static electricity","A metal that magnets cannot pull"],"why":"Lodestone was used to make early compasses."}],"c":[{"q":"What do BOTH texts say about magnets and metals?","opts":["Magnets pull on iron and steel, but not on all metals","Magnets pull on every metal","Magnets only pull on paper"],"why":"April learned this in the story, and the nonfiction text says it too."},{"q":"Which force appears in BOTH texts along with magnets?","opts":["Static electricity","Friction","Wind"],"why":"Jaylen's balloon in the story and the nonfiction text both show static electricity."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Lightning is a giant spark of static electricity","Opposite poles attract","A penny does not stick to a magnet"],"why":"Poles and pennies are in both texts. Lightning is only in the nonfiction text."}]}},{"id":"3-PS2-4","t":"The Magnet Latch","qs":[{"q":"What problem did the crew want to solve?","opts":["Pepper kept opening the treat cabinet","The cabinet door was too heavy","The magnets were lost"],"why":"They needed a latch that kept Pepper out but was easy for people to open."},{"q":"Why did Jaylen’s first design fail?","opts":["The frame was wood, and a magnet cannot pull on wood","The magnet was upside down","The door was too small"],"why":"A magnet needs something made of iron or steel to pull on."},{"q":"How did the crew improve the latch?","opts":["They added a second magnet and washer","They used more tape only","They took off the door"],"why":"With two magnets, Pepper could not open it, but Jaylen could with a gentle tug."},{"q":"What does the story show about engineers?","opts":["They test, find problems, and improve their designs","Their first design is always perfect","They never change an idea"],"why":"Testing helped the crew find the flaw and fix it."}],"nf":{"t":"Magnets Solve Problems","q":[{"q":"What do engineers do first?","opts":["Name the problem","Paint the design","Throw away their ideas"],"why":"Engineers start by naming a problem."},{"q":"Why does a refrigerator door have a magnetic strip?","opts":["To pull the door closed so cold air stays in","To make the food colder","To play music"],"why":"The magnetic strip holds the door tightly shut."},{"q":"How does a maglev train move so fast?","opts":["It floats above the track using magnets","It has very big wheels","It is pulled by horses"],"why":"Because it floats, it does not rub on the track."},{"q":"What should an engineer do if a design does not work?","opts":["Test it, find the problem, and improve it","Give up right away","Make it exactly the same again"],"why":"Engineers expect to test and improve their designs."},{"q":"Which is NOT named in the text as something that uses magnets?","opts":["A wooden pencil","A refrigerator door","A toy train"],"why":"Pencils were not mentioned. Fridge doors and toy trains both use magnets."},{"q":"Why must people remove iron or steel objects before an MRI?","opts":["The machine has a very powerful magnet","The machine is very cold","The machine uses water"],"why":"A strong magnet would pull on iron and steel."}],"c":[{"q":"What do BOTH texts say engineers do when a design does not work?","opts":["Test it, find the problem, and improve it","Give up and start a new problem","Keep the design exactly the same"],"why":"The crew improved their latch, and the nonfiction text describes the same steps."},{"q":"In the story, why did Jaylen's first latch fail?","opts":["The magnet had nothing made of iron or steel to pull on","The magnet was too strong","Pepper broke the magnet"],"why":"The nonfiction text explains that a magnet needs the right metal to
