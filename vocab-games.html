raphs help them see patterns over many days and years."},{"q":"How does knowing typical weather help cities?","opts":["They can get snowplows ready before winter","They can stop it from snowing","They can make summer shorter"],"why":"Cities plan ahead using the typical weather for each season."},{"q":"What does it mean that the typical high in January is in the low 40s?","opts":["Most January days are around that temperature, but any one day can be different","Every January day is exactly 41 degrees","It never snows in January"],"why":"Typical describes a pattern, not every single day."}],"c":[{"q":"What idea do BOTH texts share?","opts":["Typical weather is the pattern over many days, not the same every day","Every fall day is exactly 60 degrees","Weather never changes"],"why":"Jaylen learned this in the story, and the nonfiction text explains it."},{"q":"Which tool appears in BOTH texts?","opts":["A thermometer","A rain gauge","An anemometer"],"why":"The crew used a thermometer. The rain gauge and anemometer are only in the nonfiction text."},{"q":"How is the story different from the nonfiction text?","opts":["The story shows kids collecting their own data for two weeks","The story explains what meteorologists are","The story has no graphs"],"why":"The crew made their own weather log and graph."}]}},{"id":"3-ESS2-2","t":"Postcards From Four Places","qs":[{"q":"What did Christian think about Maryland’s climate?","opts":["It is snowy because it snowed once","It is a desert","It is a rainforest"],"why":"One snowy day is weather. Climate is the pattern over many years."},{"q":"What is the difference between weather and climate?","opts":["Weather is one day; climate is the usual weather over many years","Weather is over many years; climate is one day","They mean the same thing"],"why":"Climate is the usual pattern of weather in a region."},{"q":"Which place is hot with very little rain?","opts":["A desert","A rainforest","A polar region"],"why":"Deserts get very little rain."},{"q":"What does climate help decide?","opts":["Which plants can grow and which animals can live there","What time school starts","How tall people grow"],"why":"Climate shapes the plants, animals, and even the homes in a region."}],"nf":{"t":"Climates Around the World","q":[{"q":"What is climate?","opts":["The usual weather in a place over many years","The weather today","How hot one afternoon is"],"why":"Climate is the pattern of weather over many years."},{"q":"Which climate is hot and rainy almost all year?","opts":["Tropical","Desert","Polar"],"why":"The Amazon rainforest has a tropical climate."},{"q":"What kind of climate does Maryland have?","opts":["Temperate, with four seasons","Polar","Desert"],"why":"Maryland's climate changes through four seasons."},{"q":"Why might a building in a polar place have thick walls?","opts":["To keep heat in","To let snow inside","To stay cool in summer"],"why":"Thick walls help keep buildings warm in a very cold climate."},{"q":"Which crop needs cool winters?","opts":["Apples","Bananas","Pineapples"],"why":"The text says apples need cool winters."},{"q":"How do a fennec fox's large ears help it in the desert?","opts":["They help release body heat","They store water","They keep it warm"],"why":"Large ears let heat escape from the body."}],"c":[{"q":"What difference do BOTH texts explain?","opts":["Weather is one day, and climate is the pattern over many years","Weather and climate mean the same thing","Climate changes every hour"],"why":"Christian mixed these up in the story."},{"q":"Which climate is described in BOTH texts as very cold with ice and snow?","opts":["Polar","Tropical","Desert"],"why":"Both texts describe the polar climate."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Bananas grow in tropical places, while apples need cool winters","Maryland has four seasons","Deserts get very little rain"],"why":"Maryland's seasons and deserts are in both texts. The crops are only in the nonfiction text."}]}},{"id":"3-ESS3-1","t":"The Storm Models","qs":[{"q":"What did April think at first?","opts":["We can stop storms","Storms are never dangerous","Houses cannot be changed"],"why":"People cannot stop storms, but they can design ways to reduce the harm."},{"q":"What happened in the fan test?","opts":["The flat roof blew off, but the slanted taped roof stayed on","Both roofs blew off","Neither roof moved"],"why":"A good design made a difference."},{"q":"What did the wall of rocks do in the flood model?","opts":["It slowed the water","It made the water faster","It made the water disappear"],"why":"A barrier can reduce the harm from a flood."},{"q":"What can a good design do about severe weather?","opts":["Reduce the harm it causes","Stop the storm","Make storms stronger"],"why":"Designs like strong roofs and barriers make people safer."}],"nf":{"t":"Staying Safe in Severe Weather","q":[{"q":"What is a hazard?","opts":["Something that can cause harm","A kind of cloud","A tool for measuring rain"],"why":"The text defines a hazard as something that can cause harm."},{"q":"What does a lightning rod do?","opts":["Gives lightning a safe path into the ground","Makes lightning stronger","Stops storms from forming"],"why":"Lightning rods send lightning safely into the ground."},{"q":"Can people stop severe weather?","opts":["No, but they can reduce the damage","Yes, with big fans","Yes, by building tall walls"],"why":"People cannot stop weather, but good designs reduce harm."},{"q":"What do levees and flood walls do?","opts":["Hold back rising rivers","Measure wind speed","Make it rain less"],"why":"Levees and flood walls protect land from flooding."},{"q":"Which item belongs in an emergency kit?","opts":["A flashlight and batteries","A kite","Ice cream"],"why":"The text lists water, food, a flashlight, and batteries."},{"q":"What does a hurricane's category tell people?","opts":["How strong its winds are","What day it will arrive","How many clouds it has"],"why":"Higher categories have stronger winds."}],"c":[{"q":"What do BOTH texts say about severe weather?","opts":["People cannot stop it, but good designs reduce the harm","People can stop storms if they are smart","Storms never cause damage"],"why":"April learned this in the story, and the nonfiction text says it too."},{"q":"Which solution appears in BOTH texts?","opts":["Building walls or barriers to hold back water","Lightning rods","Hurricane categories"],"why":"Christian's rock wall and the nonfiction text's flood walls are both barriers."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Benjamin Franklin's idea for lightning rods","A slanted, taped roof stayed on in the wind","Families can keep a kit with water and a flashlight"],"why":"The roof is only in the story, and the kit is in both. Lightning rods are only in the nonfiction text."}]}}]},"3-3":{"name":"Fossils, Traits, and Variation","books":[{"id":"3-LS4-1","t":"The Fossil Box","qs":[{"q":"What did April think about fossils?","opts":["All fossils come from dinosaurs","Fossils are only plants","Fossils are only shells"],"why":"The box had a clam shell, a fern leaf, and a shark tooth, and no dinosaur bones."},{"q":"What was in the fossil box?","opts":["A clam shell, a fern leaf, and a shark tooth","Only dinosaur bones","Only footprints"],"why":"Fossils can be plants, shells, teeth, and many other things."},{"q":"What do the clam shell and shark tooth suggest?","opts":["An ocean was there long ago","A desert was there long ago","A glacier was there long ago"],"why":"These fossils come from ocean animals."},{"q":"What is a fossil?","opts":["What is left of a living thing from long ago, preserved in rock","A living thing from today","A rock with no history"],"why":"Fossils are clues about life long ago."}],"nf":{"t":"Clues From Long Ago","q":[{"q":"What is a fossil?","opts":["The remains or marks of a living thing from long ago, saved in rock","A shiny rock that grows","A new kind of plant"],"why":"Fossils are remains or traces of ancient living things."},{"q":"What kind of fossil is most common?","opts":["Shells, plants, and small sea animals","Dinosaur bones","Woolly mammoths"],"why":"Most fossils are shells, plants, and small animals."},{"q":"What is Maryland's state fossil?","opts":["A sea snail shell called Ecphora","A dinosaur tooth","A palm tree leaf"],"why":"Ecphora was a sea snail that lived millions of years ago."},{"q":"A fish fossil is found far from any ocean. What does that tell scientists?","opts":["The land was once under water","Fish can walk on land","The fossil is fake"],"why":"Fossils give clues about what an environment used to be like."},{"q":"What does extinct mean?","opts":["No longer living anywhere on Earth","Very large","Living only in the ocean"],"why":"Extinct living things, like dinosaurs, are gone from Earth."},{"q":"What is amber?","opts":["Hardened tree sap","A kind of shell","A dinosaur bone"],"why":"Some insects were trapped and preserved in amber."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That all fossils come from dinosaurs","That fossils are found in rock","That shells can be fossils"],"why":"April thought every fossil was a dinosaur. The nonfiction text says most are not."},{"q":"What do BOTH texts say a sea fossil found on land tells scientists?","opts":["The land was once covered by water","Sea animals once walked on land","The fossil was brought there by people"],"why":"Jaylen reasoned this in the story, and the nonfiction text explains it."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Maryland's state fossil is a sea snail called Ecphora","Fossil shark teeth are found at Calvert Cliffs","Some living things are extinct"],"why":"Calvert Cliffs and extinction are in both texts. Ecphora is only in the nonfiction text."}]}},{"id":"3-LS3-1","t":"The Puppy Chart","qs":[{"q":"What did Jaylen first say about the puppies?","opts":["They all look like their mom","They are all black","They are all the same size"],"why":"The chart showed the puppies were not copies of their mom."},{"q":"What did the chart show?","opts":["Puppies had mixed traits from both parents and were all a little different","Puppies were exact copies of one parent","All puppies had pointy ears"],"why":"Offspring inherit traits from both parents."},{"q":"What is variation?","opts":["Differences among living things of the same kind","A kind of puppy food","Getting taller"],"why":"No two puppies were exactly alike."},{"q":"Where do offspring get their traits?","opts":["From both parents","Only from their mother","From their food"],"why":"Traits come from both parents."}],"nf":{"t":"Traits From Parents","q":[{"q":"What is a trait?","opts":["A feature of a living thing, like fur color","A kind of food","A place where animals live"],"why":"Traits are features like color, size, or shape."},{"q":"Where do offspring get their traits?","opts":["From both parents","Only from the mother","From the weather"],"why":"Offspring inherit traits from both parents."},{"q":"What is variation?","opts":["Differences among living things of the same kind","A type of plant food","When all puppies look the same"],"why":"Variation means no two individuals are exactly alike."},{"q":"Why might puppies in one litter look different?","opts":["Each puppy gets a different mix of traits from its parents","They ate different food at birth","They were born in different countries"],"why":"Brothers and sisters can inherit different traits."},{"q":"How do farmers use what they know about traits?","opts":["They choose seeds and animals with helpful traits","They paint their crops","They make all plants the same height"],"why":"Farmers pick plants and animals with traits they want."},{"q":"Why do doctors ask about family health history?","opts":["Some health traits can be inherited","To learn your favorite color","Because health has nothing to do with family"],"why":"Traits are not only things you can see."}],"c":[{"q":"What do BOTH texts say about where offspring get their traits?","opts":["From both parents","Only from the mother","Only from the father"],"why":"Jaylen thought the puppies would look like their mom. Both texts show traits come from both parents."},{"q":"What word do BOTH texts use for differences among living things of the same kind?","opts":["Variation","Metamorphosis","Erosion"],"why":"The puppies and the bean seeds showed variation."},{"q":"How is the story different from the nonfiction text?","opts":["The story collects real data about six puppies in a chart","The story says all puppies look the same","The story is about fossils"],"why":"The crew made a chart of fur color and ear shape."}]}},{"id":"3-LS3-2","t":"The Two Bean Plants","qs":[{"q":"What did Kennedy predict about the two plants?","opts":["They would look the same","The dark plant would grow best","The sun plant would die"],"why":"Kennedy thought plants only get traits from their parents."},{"q":"What did the plant in the dark closet look like?","opts":["Tall, thin, and pale","Short and green","It did not grow"],"why":"The sun plant was short, green, and strong."},{"q":"What changed how the two plants grew?","opts":["The environment, which was the amount of light","Their parents","Their names"],"why":"The same kind of plant can grow differently in a different environment."},{"q":"Why did Pepper get heavier?","opts":["She ate too many treats, which are part of her environment","She grew taller","She slept more"],"why":"Food is part of an animal’s environment."}],"nf":{"t":"The Environment Shapes Living Things","q":[{"q":"What is the environment?","opts":["Everything around a living thing, like light, water, and food","Only the weather","A kind of animal"],"why":"The environment includes light, water, food, soil, and more."},{"q":"How might a bean plant grown in the dark look?","opts":["Tall, thin, and pale","Short and dark green","Covered in flowers"],"why":"Plants in the dark stretch toward light and lose their green color."},{"q":"Why are flamingos pink?","opts":["Because of the shrimp and algae they eat","Because they are painted","Because their parents are red"],"why":"Their food gives them their pink color."},{"q":"What can change the color of hydrangea flowers?","opts":["The soil they grow in","The time of day","The size of the leaves"],"why":"Hydrangeas can bloom blue or pink depending on the soil."},{"q":"Which statement is true?","opts":["Traits can come from both parents and the environment","All traits come only from parents","The environment never changes living things"],"why":"Inherited traits and the environment both matter."},{"q":"What can the temperature of the sand affect in some turtle eggs?","opts":["Whether the baby turtles become males or females","The color of the shell only","Nothing at all"],"why":"The environment can affect how traits show up."}],"c":[{"q":"What did the bean plants in the story have in common with the nonfiction text's bean plants?","opts":["The one grown in the dark was tall, thin, and pale","The one grown in the dark was short and dark green","Both plants looked exactly the same"],"why":"Both texts describe this effect of light."},{"q":"What idea do BOTH texts share?","opts":["Traits come from parents, but the environment can change how they show up","Traits come only from the environment","The environment never matters"],"why":"Kennedy changed her mind in the story."},{"q":"Which example is in the nonfiction text but NOT in the story?","opts":["Flamingos get their pink color from their food","Pepper's weight depends on how many treats she eats","Gardeners adjust light and water"],"why":"Pepper is only in the story, and gardeners are in both. Flamingos are only in the nonfiction text."}]}},{"id":"3-LS4-2","t":"The Bean Hunt","qs":[{"q":"What did Jaylen think about beetles?","opts":["They change color on purpose","They are always green","They can fly"],"why":"Beetles cannot choose their color. The differences are already there."},{"q":"Which beans were found last?","opts":["The beans that matched the cloth","The biggest beans","The red beans"],"why":"Beans that blend in are hard to see."},{"q":"Why is camouflage an advantage?","opts":["It makes an animal harder for predators to see","It makes an animal faster","It makes an animal bigger"],"why":"Animals that blend in are more likely to survive and have young."},{"q":"Can a beetle choose its color?","opts":["No, the differences are already there","Yes, whenever it needs to","Only at night"],"why":"Helpful differences become more common over many generations."}],"nf":{"t":"Differences That Help Animals Survive","q":[{"q":"What is camouflage?","opts":["Colors or patterns that help a living thing blend in","A kind of food","A loud warning call"],"why":"Camouflage helps animals hide from predators."},{"q":"What is an advantage?","opts":["Something that helps an animal survive or have young","A sickness","A type of habitat"],"why":"An advantage helps a living thing do better."},{"q":"Why does a helpful trait become more common over time?","opts":["Animals with it survive and pass it to their young","Animals decide to change themselves","It is taught in school"],"why":"Survivors have young that inherit the helpful trait."},{"q":"Can an animal choose to change its traits when it needs to?","opts":["No, the differences are already there","Yes, whenever it wants","Yes, but only in winter"],"why":"Animals do not choose. Nature favors helpful differences that already exist."},{"q":"Why did dark peppered moths become more common?","opts":["They were harder for birds to see on dark tree trunks","They were bigger","They ate more food"],"why":"Dark moths had camouflage on the smoky, dark trees."},{"q":"How can bright colors help a monarch butterfly?","opts":["Birds learn the bright color means it tastes bad","The colors keep it warm","The colors help it hide"],"why":"Warning colors are another kind of advantage."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That animals can choose to change their traits","That animals have traits","That birds eat beetles"],"why":"Jaylen thought beetles changed color on purpose."},{"q":"What does the bean hunt in the story model?","opts":["Birds finding beetles that do not blend in","Plants growing in sunlight","How fossils form"],"why":"The beans stood for beetles, and the crew member stood for a bird."},{"q":"Which example is in the nonfiction text but NOT in the story?","opts":["Peppered moths in England","A faster rabbit escaping a fox","Camouflage helping beetles hide"],"why":"The rabbit and camouflage are in both texts. The peppered moths are only in the nonfiction text."}]}},{"id":"3-LS4-4","t":"The Creek Cleanup","qs":[{"q":"What did Kennedy think would fix the creek?","opts":["Picking up the trash","Planting grass","Moving the creek"],"why":"The cleanup helped, but it did not fix the whole problem."},{"q":"Why was the water still brown the next day?","opts":["Rain washed more soil from the bare bank into the creek","The trash came back","The frogs stirred up the mud"],"why":"Bare soil washes away when it rains."},{"q":"What did Jaylen suggest?","opts":["Planting grasses on the bank","Building a road","Adding more trash cans"],"why":"The roots of the grasses hold the soil in place."},{"q":"Why did the crew decide to do both solutions?","opts":["Cleanup helps right away and grasses help for years","They had extra time","Mrs. Swinea told them to"],"why":"Every solution has strengths and trade-offs."}],"nf":{"t":"When an Environment Changes","q":[{"q":"What can change an environment?","opts":["Floods, fires, droughts, and new buildings","Only the seasons","Nothing ever changes an environment"],"why":"The text lists floods, fires, droughts, buildings, and pollution."},{"q":"Why are oysters important to the Chesapeake Bay?","opts":["They clean the water","They make the water warmer","They eat all the fish"],"why":"One adult oyster can filter up to 50 gallons of water a day."},{"q":"Which is a solution people are using in Maryland?","opts":["Placing baby oysters on oyster reefs","Adding more trash to streams","Cutting down trees by streams"],"why":"People grow young oysters and put them on reefs."},{"q":"What is a trade-off?","opts":["Something you give up to get something else","A perfect solution","A type of fish"],"why":"Most solutions have strengths and trade-offs."},{"q":"What does merit mean?","opts":["How good or useful a solution is","How old a solution is","How expensive a solution is"],"why":"Scientists judge a solution's merit using evidence."},{"q":"What is an invasive species?","opts":["A living thing brought to a new place that spreads quickly","A fish that has always lived in a place","A kind of trash"],"why":"Invasive species can harm native living things."}],"c":[{"q":"What do BOTH texts say about solutions?","opts":["Every solution has strengths and trade-offs","There is always one perfect solution","Solutions never work"],"why":"Kennedy learned this when the cleanup did not fix everything."},{"q":"In BOTH texts, what do plants along the water help with?","opts":["Holding soil in place so it does not wash into the water","Making the water saltier","Bringing in more trash"],"why":"Jaylen suggested grasses, and the nonfiction text describes planting trees and grasses."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["One adult oyster can filter up to 50 gallons of water a day","Groups plant marsh grasses along the Chesapeake Bay","Picking up trash helps right away"],"why":"Marsh grasses and trash cleanup are in both texts. The oyster fact is only in the nonfiction text."}]}}]},"3-4":{"name":"Ecosystems and Life Cycles","books":[{"id":"3-LS4-3","t":"The Habitat Match","qs":[{"q":"What did April think about animals and places?","opts":["Any animal can live anywhere if it tries hard","Each animal needs a special place","Animals do not need homes"],"why":"Trying hard does not change what a body needs."},{"q":"Why could a penguin not live in the desert?","opts":["It would overheat and have no ocean to hunt in","Deserts have too much water","Penguins cannot walk"],"why":"A habitat has to match an animal’s needs."},{"q":"What does a good habitat provide?","opts":["The things a living thing needs","Only a place to sleep","Nothing special"],"why":"Habitats provide food, water, and shelter."},{"q":"What did the ferns show in the yard?","opts":["Same yard, different habitats: ferns did better in the shade","Ferns only grow in sun","Ferns do not need water"],"why":"Different spots in one yard can be different habitats."}],"nf":{"t":"A Place to Call Home","q":[{"q":"What is a habitat?","opts":["The place where a plant or animal lives","A kind of food","An animal's family"],"why":"A habitat is where a living thing lives."},{"q":"What does a good habitat provide?","opts":["Food, water, shelter, and space","Only sunshine","Toys and games"],"why":"Living things need food, water, shelter, and space."},{"q":"How does a cactus survive in the desert?","opts":["Its thick stem stores water","It has gills","It has thick fur"],"why":"The thick stem stores water for dry times."},{"q":"Why could a polar bear not survive in a hot desert?","opts":["It would overheat","It would freeze","It would drown"],"why":"Its thick fur and fat are made for the cold Arctic."},{"q":"What do scientists check before releasing an animal into the wild?","opts":["That the habitat has the right food, water, and shelter","That the habitat is very noisy","That the habitat has many people"],"why":"The habitat must meet the animal's needs."},{"q":"Why can a koala live in only a few places?","opts":["It eats mostly eucalyptus leaves","It can eat almost anything","It needs salt water"],"why":"A koala's needs limit where it can live."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That any animal could live anywhere if it tried hard enough","That animals need food and water","That habitats are different"],"why":"April had this idea at the start of the story."},{"q":"What do BOTH texts say a cactus or penguin shows?","opts":["A living thing's body fits certain habitats","All living things need the same habitat","Habitats do not matter"],"why":"Bodies are built for particular habitats."},{"q":"How is the story different from the nonfiction text?","opts":["The story uses cards and the backyard to test matches","The story says frogs live in deserts","The story has no evidence"],"why":"The crew matched cards and checked ferns in sun and shade."}]}},{"id":"3-LS1-1","t":"The Caterpillar Cup","qs":[{"q":"What did Kennedy think about the caterpillar?","opts":["It was a baby butterfly that would just get bigger","It would turn into a frog","It would stay the same"],"why":"The caterpillar changed in a special way, called metamorphosis."},{"q":"Which stages did the butterfly go through?","opts":["Egg, caterpillar, chrysalis, butterfly","Seed, sprout, flower","Egg, tadpole, frog"],"why":"The butterfly lays eggs, so the cycle begins again."},{"q":"What is metamorphosis?","opts":["A big body change, like a caterpillar becoming a butterfly","Growing a little taller","Laying eggs"],"why":"The butterfly looked nothing like the caterpillar."},{"q":"What is true of every living thing’s life cycle?","opts":["It is born, grows, reproduces, and dies","It looks the same at every stage","It has the same stages as a butterfly"],"why":"The stages can look very different, but the big steps are the same."}],"nf":{"t":"Every Life Has a Cycle","q":[{"q":"What are the big steps in every life cycle?","opts":["Born, grow, reproduce, and die","Swim, fly, and run","Eat, sleep, and play"],"why":"Every living thing goes through these steps."},{"q":"What is metamorphosis?","opts":["A big body change, like a caterpillar becoming a butterfly","A kind of food","A place where frogs live"],"why":"Butterflies and frogs go through metamorphosis."},{"q":"What comes right after the caterpillar stage of a butterfly?","opts":["The chrysalis","The egg","The tadpole"],"why":"The caterpillar forms a chrysalis, and then the adult comes out."},{"q":"How does a tadpole breathe?","opts":["With gills","With lungs only","Through its tail"],"why":"Tadpoles live in water and breathe with gills."},{"q":"What does reproduce mean?","opts":["To make new living things of the same kind","To grow taller","To change color"],"why":"Reproducing makes the next generation."},{"q":"Which animal in the text can live more than 100 years?","opts":["A giant tortoise","An adult mayfly","A dog"],"why":"Life spans vary a lot."}],"c":[{"q":"What do BOTH texts say about how a caterpillar becomes a butterfly?","opts":["It goes through metamorphosis inside a chrysalis","It just grows bigger and bigger","It hatches from a seed"],"why":"Kennedy thought it would just grow bigger, but both texts show metamorphosis."},{"q":"Which other living thing's life cycle appears in BOTH texts?","opts":["A frog","A shark","A mushroom"],"why":"The tadpole stage appears in both texts."},{"q":"How is the story different from the nonfiction text?","opts":["The story shows kids watching one caterpillar change day by day","The story says caterpillars never change","The story is about weather"],"why":"The crew drew and measured the caterpillar each morning."}]}},{"id":"3-LS2-1","t":"The Meerkat Lookout","qs":[{"q":"What did April think about animal groups?","opts":["Animals live in groups just to be friends","Animals never live in groups","Groups only help babies"],"why":"The crew found evidence that groups help animals survive."},{"q":"What did the meerkat lookout do?","opts":["Barked an alarm so the group could hide","Dug for food","Fought the hawk"],"why":"Lookouts help keep the whole group safe."},{"q":"How do groups help animals?","opts":["They help find food, stay safe, and care for young","They make animals taller","They stop animals from sleeping"],"why":"A group can do things that one animal cannot."},{"q":"What is a claim?","opts":["A statement you say is true","A kind of animal","A guess with no reason"],"why":"A good claim is backed up with evidence."}],"nf":{"t":"Living in Groups","q":[{"q":"Why do many animals live in groups?","opts":["It helps them find food, stay safe, and raise young","They like loud noises","They cannot see well"],"why":"Groups help with food, safety, and caring for young."},{"q":"What does a meerkat lookout do?","opts":["Watches for danger and gives a warning call","Finds all the food","Builds the burrow"],"why":"The lookout warns the group so everyone can hide."},{"q":"How do wolves benefit from hunting together?","opts":["They can catch animals bigger than one wolf could","They run slower","They need less sleep"],"why":"Working together helps wolves catch large prey."},{"q":"How do honeybees tell each other where flowers are?","opts":["With a special dance","By drawing maps","By changing color"],"why":"Bees dance to share where food is."},{"q":"Who leads an elephant herd?","opts":["The oldest female","The youngest calf","A different animal"],"why":"The oldest female leads the herd."},{"q":"Why do emperor penguins huddle together?","opts":["To stay warm","To find shade","To hide food"],"why":"Huddling in a group saves warmth."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That animals live in groups just to be friendly","That meerkats live in groups","That wolves hunt"],"why":"April thought animals only stayed together for fun."},{"q":"Which animal group appears in BOTH texts?","opts":["Wolves hunting together","Ants building bridges","Penguins huddling"],"why":"Ants and penguins are only in the nonfiction text."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Honeybees dance to show where flowers are","A meerkat lookout gives a warning call","Fish in a school are hard for a predator to catch"],"why":"The meerkat and fish are in both texts. The bee dance is only in the nonfiction text."}]}}]},"4-1":{"name":"Earth’s Systems","books":[{"id":"4-ESS2-2","t":"The Mystery Map","qs":[{"q":"What did April predict about the volcano dots?","opts":["They would be scattered with no pattern","They would make a ring","They would make a line"],"why":"The dots made a ring around the Pacific Ocean."},{"q":"What shape did the dots make around the Pacific Ocean?","opts":["A ring","A square","A single line"],"why":"That is definitely not random."},{"q":"Where do many volcanoes and earthquakes line up?","opts":["Along the edges of Earth’s large plates","In the middle of deserts","Only near cities"],"why":"Scientists use maps to find these patterns."},{"q":"What can maps help us do?","opts":["Find patterns in Earth’s features","Change the weather","Build mountains"],"why":"City planners use maps to decide where to build."}],"nf":{"t":"Patterns on Earth's Surface","q":[{"q":"What pattern do scientists see when they map volcanoes and earthquakes?","opts":["Most of them line up in long chains","They are spread out evenly everywhere","They only happen near the North Pole"],"why":"Mapped together, volcanoes and earthquakes form chains."},{"q":"What are Earth's plates?","opts":["Giant pieces of Earth's outer layer","Dishes used by scientists","Layers of clouds"],"why":"Earth's outer layer is broken into slowly moving plates."},{"q":"Where is the Ring of Fire?","opts":["Around the edge of the Pacific Ocean","In the middle of Africa","Across Antarctica"],"why":"It is a horseshoe-shaped chain around the Pacific."},{"q":"How fast do Earth's plates move?","opts":["About as fast as fingernails grow","As fast as a car","As fast as a running dog"],"why":"Plates move very slowly."},{"q":"Why are the Himalayas still growing?","opts":["Two plates are pushing into each other","It rains there a lot","People keep adding rocks"],"why":"The pushing plates slowly lift the mountains higher."},{"q":"What does a seismometer measure?","opts":["How much the ground shakes","How tall a mountain is","How deep the ocean is"],"why":"Seismometers record earthquake shaking."}],"c":[{"q":"What pattern did BOTH texts find?","opts":["Volcanoes and earthquakes line up, especially around the Pacific Ocean","Volcanoes are scattered randomly","Volcanoes only happen in deserts"],"why":"April thought they were random, but both texts show a pattern."},{"q":"What do BOTH texts say about mountain ranges?","opts":["They form long lines, not random dots","They are all the same height","They are only found in Maryland"],"why":"Christian traced the long lines of the Andes, Rockies, and Himalayas."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["The Mariana Trench is deeper than Mount Everest is tall","There is a ring of volcanoes around the Pacific","City planners use maps"],"why":"The ring and city planners are in both texts. The Mariana Trench is only in the nonfiction text."}]}},{"id":"4-ESS1-1","t":"The Layers in the Creek Bank","qs":[{"q":"What did Kennedy predict about rock layers?","opts":["The top layer is the oldest","The bottom layer is the oldest","All layers are the same age"],"why":"In the jar, the bottom layer settled first."},{"q":"What settled first in the jar?","opts":["Gravel","Soil","Water"],"why":"Then sand settled, and last came the fine soil."},{"q":"Which rock layer is usually the oldest?","opts":["The bottom layer","The top layer","The middle layer"],"why":"Newer layers settle on top."},{"q":"What did the shell fossil in the creek bank suggest?","opts":["The land was probably under water long ago","The creek was always dry","A dinosaur lived there"],"why":"Fossils and layers are clues about how land changed."}],"nf":{"t":"Reading the Rock Layers","q":[{"q":"How do many rock layers form?","opts":["Sediment settles and is pressed into rock over a long time","Lava pours down from the sky","Trees turn into stone overnight"],"why":"Sand, mud, and shells settle and slowly become rock."},{"q":"Which rock layer is usually the oldest?","opts":["The bottom layer","The top layer","The middle layer"],"why":"New layers settle on top of older ones."},{"q":"What fossils are found at Calvert Cliffs in Maryland?","opts":["Shark teeth, whale bones, and seashells","Dinosaur eggs","Palm tree leaves"],"why":"Calvert Cliffs is famous for fossil shark teeth."},{"q":"What do seashell fossils near the top of Mount Everest tell us?","opts":["That rock was once under the ocean","Sharks can climb mountains","People left shells there"],"why":"Sea fossils show the land was once under water."},{"q":"What is sediment?","opts":["Small bits of sand, mud, or rock that settle","A kind of fossil","The top of a mountain"],"why":"Sediment settles to form new layers."},{"q":"How can fossils help scientists match rock layers in different places?","opts":["The same kind of fossil means the layers likely formed around the same time","Fossils make layers the same color","Fossils show which layer is heaviest"],"why":"Some fossils work like a time stamp."}],"c":[{"q":"What do BOTH texts say about which layer is usually oldest?","opts":["The bottom layer","The top layer","The middle layer"],"why":"Kennedy thought the top was oldest, but the jar model and the nonfiction text both show the bottom."},{"q":"In the story, the crew shook soil, sand, and gravel in a jar. What does this model?","opts":["How sediment settles into layers","How volcanoes erupt","How fossils glow"],"why":"The nonfiction text explains that sediment settles to form rock layers."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Seashell fossils were found near the top of Mount Everest","Fossil shark teeth wash out of Calvert Cliffs","A seashell fossil means land was once under water"],"why":"Calvert Cliffs and the seashell idea are in both texts. Mount Everest is only in the nonfiction text."}]}},{"id":"4-ESS2-1","t":"The Hill and the Rain","qs":[{"q":"What did Jaylen think about weathering and erosion?","opts":["They are the same thing","They are opposites","They never happen outside"],"why":"They are different, and the tests showed how."},{"q":"What is weathering?","opts":["Breaking rock into smaller pieces","Moving pieces away","Growing plants"],"why":"The shaken sugar cube crumbled into tiny grains."},{"q":"What is erosion?","opts":["Moving pieces of rock and soil from one place to another","Breaking rock apart","Freezing water"],"why":"The water carried soil down the slope."},{"q":"What slowed erosion on the second pan?","opts":["Grass and small rocks","More water","A steeper hill"],"why":"Vegetation holds soil in place."}],"nf":{"t":"Weathering and Erosion","q":[{"q":"What is weathering?","opts":["Breaking rock into smaller pieces","Moving sediment to a new place","Making new mountains"],"why":"Weathering breaks rock down."},{"q":"What is erosion?","opts":["Moving broken rock and soil from one place to another","Breaking rock with ice","A kind of weather"],"why":"Erosion carries the pieces away."},{"q":"How does freezing water break rock?","opts":["It expands in cracks and pushes them wider","It melts the rock","It makes the rock heavier"],"why":"Ice takes up more space than water and widens cracks."},{"q":"What carved the Grand Canyon?","opts":["The Colorado River, over millions of years","A giant earthquake in one day","People with shovels"],"why":"The river slowly carried away rock and sediment."},{"q":"How do plants help slow erosion?","opts":["Their roots hold soil in place","They make it rain more","They push soil into the water"],"why":"Roots hold soil so it is harder to wash away."},{"q":"What does a silt fence at a construction site do?","opts":["Catches soil before it flows into streams","Keeps animals out","Holds up the building"],"why":"Bare soil erodes easily, so fences catch it."}],"c":[{"q":"What difference do BOTH texts explain?","opts":["Weathering breaks rock down, and erosion carries the pieces away","Weathering and erosi ng during shaking","To look fancy","To hold up signs"],"why":"X braces help buildings stand up to earthquakes."},{"q":"Which solution helps protect homes from floods?","opts":["Raising houses up on stilts","Painting houses blue","Building on the riverbank"],"why":"Raised homes stay above floodwater."},{"q":"What can scientists NOT predict about earthquakes?","opts":["Exactly when one will happen","Where they are likely to happen","That they shake the ground"],"why":"Scientists know where, but not exactly when."},{"q":"How can a few seconds of earthquake warning help?","opts":["Trains can slow down and people can take cover","It can stop the earthquake","It makes buildings taller"],"why":"Warnings give people time to get safe."}],"c":[{"q":"What do BOTH texts say engineers do to reduce harm from natural hazards?","opts":["Come up with several designs, test them, and compare","Build the tallest building possible","Wait until after the earthquake"],"why":"The crew tested three towers, just like engineers."},{"q":"What do BOTH texts say scientists cannot predict?","opts":["Exactly when an earthquake will happen","Where earthquakes are likely","That earthquakes shake the ground"],"why":"Both texts say planning matters for this reason."},{"q":"Which design idea is in the nonfiction text but NOT in the story?","opts":["Rubber pads called base isolators","A wide base","Triangle braces"],"why":"Wide bases and triangles were in the story. Base isolators are only in the nonfiction text."}]}}]},"4-2":{"name":"Energy","books":[{"id":"4-PS3-1","t":"The Fast Car Test","qs":[{"q":"What did April think at first?","opts":["Only big, heavy things can push something far","Cars always go the same distance","Cups can push cars"],"why":"The test used the same car, so weight was not the difference."},{"q":"How far did the cup slide from the low ramp and the high ramp?","opts":["5 cm and 20 cm","20 cm and 5 cm","10 cm and 10 cm"],"why":"The higher ramp made the car faster, so it pushed the rgy to safety."},{"q":"How is the story different from the nonfiction text?","opts":["The story measures how far a cup slides from two ramps","The story says energy is the same at all speeds","The story is about plants"],"why":"The crew used a fair test with the same car."}]}},{"id":"4-PS3-3","t":"The Marble Crash","qs":[{"q":"What did Kennedy think happens to energy in a crash?","opts":["It disappears","It doubles","It turns into light only"],"why":"Energy does not disappear. It moves to the other object."},{"q":"What happened when the first marble hit the still marble?","opts":["The still marble rolled away","Both marbles stopped","The still marble shrank"],"why":"Energy moved from one marble to the other."},{"q":"Where did the energy go?","opts":["To the other marble, and some became sound","It vanished","Into the floor only"],"why":"The click was some of the energy turning into sound."},{"q":"Why did the ball barely bounce on the rug?","opts":["The rug soaked up some of the energy","The rug made the ball heavier","The ball got smaller"],"why":"Soft surfaces absorb energy."}],"nf":{"t":"What Happens When Objects Collide","q":[{"q":"What is a collision?","opts":["When two objects hit each other","When an object stands still","When water freezes"],"why":"A collision is when objects bump into each other."},{"q":"In pool, what happens when the cue ball hits another ball?","opts":["Energy moves to the other ball and it rolls","Both balls stop forever","The energy disappears"],"why":"The cue ball passes energy to the ball it hits."},{"q":"Besides motion, what can the energy in a collision become?","opts":["Sound and heat","Water","Light only"],"why":"Some energy becomes sound and heat."},{"q":"Does energy disappear in a collision?","opts":["No, it moves or changes form","Yes, all of it","Only on hot days"],"why":"Energy is transferred or changed, not lost."},{"q":"Why are playgrounds covered with wood chips or rubber?","opts":["To absorb the energy of a fall","To make ern carries the message and the code helps you read it."},{"q":"Which code sent HI faster?","opts":["Short and long flashes, with 6 flashes","Counting flashes, with 17 flashes","They took the same time"],"why":"The counting code was much slower."},{"q":"Where else are patterns used to carry information?","opts":["Barcodes and QR codes","Only on ships","Nowhere else"],"why":"Phones and computers use patterns too."}],"nf":{"t":"Sending Messages With Patterns","q":[{"q":"What is a code?","opts":["A set of patterns that stand for letters or ideas","A secret password only","A kind of light bulb"],"why":"A code is any pattern both sides agree on."},{"q":"What signals does Morse code use?","opts":["Dots and dashes","Colors and shapes","Pictures"],"why":"Morse code uses short and long signals."},{"q":"What is the Morse code for SOS?","opts":["Three dots, three dashes, three dots","One long dash","Ten short dots"],"why":"SOS is a famous distress signal."},{"q":"How do computers send information?","opts":["As patterns of 1s and 0s","As drawings","As smoke signals"],"why":"Computers use patterns of two signals."},{"q":"What must be true for a code to work?","opts":["The sender and receiver agree on what each pattern means","It must be very loud","It must use light"],"why":"Both sides have to know the code."},{"q":"Why do computers add extra signals to messages?","opts":["So the receiver can check for mistakes","To make messages longer for fun","To hide the message"],"why":"Extra signals help catch errors."}],"c":[{"q":"What do BOTH texts say is needed for a code to work?","opts":["The sender and receiver agree on what each pattern means","A very bright light","A secret password"],"why":"Kennedy's first flashes did not work because Jaylen did not know the code."},{"q":"Which patterns appear in BOTH texts?","opts":["Barcodes and QR codes","Smoke signals","Drums"],"why":"Smoke signals and drums are only in the nonfiction text."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Samuel Morse helped create Morse code","Short and long flashes can stand for letters","Ships use signal lamps"],"why":"Flashes and ship lamps are in both texts. Samuel Morse is only in the nonfiction text."}]}},{"id":"4-LS1-2","t":"The Ruler Catch","qs":[{"q":"What did Jaylen first think about his brain?","opts":["It had little to do with catching the ruler","It did all the work","It was asleep"],"why":"His brain was in charge the whole time."},{"q":"Where did Jaylen catch the ruler the second time?","opts":["At 10 cm","At 15 cm","At 25 cm"],"why":"A shorter distance means a faster reaction."},{"q":"What path does information take?","opts":["Senses send it to the brain, and the brain tells the body how to respond","The hand sends it to the eyes","The brain sends it to the senses"],"why":"Senses collect information and the brain makes sense of it."},{"q":"How did Pepper respond to the squeak?","opts":["Her ears perked up and she ran to her toy","She hid under the table","She barked at the wall"],"why":"Animals sense, process, and respond too."}],"nf":{"t":"Senses, Brain, and Response","q":[{"q":"Which body part makes sense of the information from your senses?","opts":["The brain","The eyes","The skin"],"why":"Senses collect information, but the brain processes it."},{"q":"What carries signals from your senses to your brain?","opts":["Nerves","Bones","Blood"],"why":"Nerves work almost like wires."},{"q":"What is a reflex?","opts":["A very fast response that happens without thinking","A kind of sense","A slow decision"],"why":"Pulling away from something hot is a reflex."},{"q":"About how long does it take to catch a falling ruler?","opts":["About a quarter of a second","About ten seconds","About one minute"],"why":"Sensing, deciding, and responding happen very fast."},{"q":"How do an owl's large eyes help it survive?","opts":["They help it see at night","They help it swim","They help it smell food"],"why":"Animals use their senses to survive."},{"q":"Why can practice make responses faster?","opts":["The brain builds stronger connections","Your eyes get bigger","Your muscles stop needing the brain"],"why":"Practice strengthens brain connections."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That the eyes and hands do all the work without the brain","That people have senses","That rulers fall"],"why":"Jaylen thought his brain had little to do with catching."},{"q":"What do BOTH texts say happens when you catch a falling ruler?","opts":["The eyes sense it, the brain decides, and muscles respond","The hand moves on its own","The ruler stops by itself"],"why":"Both texts describe sense, process, respond."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Pulling away from something hot is a reflex","Jaylen identified a marble by touch","Pepper recognized the squeak of her toy"],"why":"The marble and Pepper are only in the story. Reflexes are only in the nonfiction text."}]}}]},"4-4":{"name":"Light, Senses, and Structures","books":[{"id":"4-PS4-2","t":"The Dark Box","qs":[{"q":"What did Christian think about eyes?","opts":["Eyes make their own light","Eyes can see in total darkness","Eyes only see color"],"why":"The dark box test showed that we need light from outside."},{"q":"What happened when Jaylen shined the flashlight in the side hole?","opts":["Christian could see the dinosaur","Nothing changed","The dinosaur disappeared"],"why":"Light bounced off the dinosaur and into Christian’s eyes."},{"q":"How do we see an object?","opts":["Light bounces off it and into our eyes","Our eyes send out light","The object always makes its own light"],"why":"Without light to bounce, there is nothing to see."},{"q":"What did April’s mirror show?","opts":["Light reflects off mirrors too","Mirrors make light","Mirrors block light"],"why":"The flashlight’s light bounced onto the wall."}],"nf":{"t":"How We See","q":[{"q":"What is a light source?","opts":["Something that makes its own light, like the Sun","Anything that is shiny","An object you can see"],"why":"Light sources make their own light."},{"q":"How do you see a book?","opts":["Light bounces off the book and enters your eyes","Your eyes send out light to the book","The book makes its own light"],"why":"Reflected light travels into your eyes."},{"q":"Why does the Moon look bright?","opts":["Sunlight reflects off it","It makes its own light","It is on fire"],"why":"The Moon reflects sunlight."},{"q":"What does reflect mean?","opts":["To bounce off a surface","To make light","To soak up all light"],"why":"Light reflects off objects."},{"q":"How do reflective stripes keep people safe at night?","opts":["They bounce headlight beams back toward drivers","They make their own light","They make people invisible"],"why":"Reflective stripes help drivers see people."},{"q":"Which material blocks light completely?","opts":["Cardboard","Clear glass","Wax paper"],"why":"Cardboard and wood make shadows."}],"c":[{"q":"What do BOTH texts say lets us see an object?","opts":["Light bouncing off it and entering our eyes","Light coming out of our eyes","Nothing, we see in the dark"],"why":"Christian wondered if eyes make their own light."},{"q":"What do BOTH texts say about mirrors?","opts":["They reflect light very well","They make their own light","They block all light"],"why":"April bounced a flashlight beam off a mirror."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["The Moon shines because sunlight reflects off it","Nothing is visible in a closed dark box","Cameras and glasses control light's path"],"why":"The dark box is only in the story, and cameras are in both. The Moon is only in the nonfiction text."}]}},{"id":"4-LS1-1","t":"Beaks, Roots, and Burrs","qs":[{"q":"What did April think about plants?","opts":["Only animals have body parts with jobs","Plants have no roots","Plants have beaks"],"why":"Plants have structures with jobs too."},{"q":"Which tool worked best for picking up rice?","opts":["Tweezers","A spoon","A clothespin"],"why":"Each tool did one job best, like different beaks."},{"q":"What is a structure’s function?","opts":["The job it does","Its color","Its size"],"why":"A beak’s shape matches the food a bird eats."},{"q":"What did the burrs on Pepper’s fur inspire?","opts":["Velcro","Sunglasses","Zippers"],"why":"Engineers study living things to solve problems."}],"nf":{"t":"Structures That Help Living Things Survive","q":[{"q":"What is a structure?","opts":["A body part of a living thing","A building only","A kind of food"],"why":"Structures are parts of plants and animals."},{"q":"What is a function?","opts":["The job a structure does","The color of a structure","The size of an animal"],"why":"Each structure has a function, or job."},{"q":"Which beak is best for reaching nectar deep in flowers?","opts":["A long, thin beak","A short, strong beak","A sharp, hooked beak"],"why":"Hummingbirds have long, thin beaks for nectar."},{"q":"How do burrs help a plant?","opts":["Their hooks catch on fur so seeds travel to new places","They store water","They make food from sunlight"],"why":"Burrs hitch a ride on animals."},{"q":"What invention came from studying burrs?","opts":["Velcro","The airplane","The light bulb"],"why":"George de Mestral invented Velcro after studying burrs."},{"q":"How do a maple seed's wings help the plant?","opts":["The wind can carry the seeds far away","They help the seed swim","They store water"],"why":"Some structures help plants spread seeds."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That only animals have structures with jobs","That beaks help birds eat","That plants are alive"],"why":"April thought plants just sit there."},{"q":"What do BOTH texts say about a bird's beak?","opts":["Its shape matches the food the bird eats","All beaks are the same","Beaks are internal structures"],"why":"The tool challenge in the story modeled different beaks."},{"q":"Which invention appears in BOTH texts?","opts":["Velcro, inspired by burrs","The airplane","The telephone"],"why":"Pepper's burrs and George de Mestral's dog both led to Velcro."}]}}]},"5-1":{"name":"Matter and Energy From the Sun","books":[{"id":"5-PS1-3","t":"The Mystery Powders","qs":[{"q":"What did April think about the powders?","opts":["She could tell them apart just by looking","Taste would work best","All powders dissolve"],"why":"Looking alone was not enough, and we never taste in science."},{"q":"What happened with powders C and E in water?","opts":["They made cloudy water and the powder sank","They dissolved into clear water","They floated"],"why":"Different powders have different properties."},{"q":"What is a property?","opts":["A feature you can observe or test","A kind of house","A secret code"],"why":"Color, hardness, and dissolving are properties."},{"q":"Why do engineers choose steel for bridges?","opts":["Steel is strong","Steel is clear","Steel is flexible like rubber"],"why":"The right material depends on its properties."}],"nf":{"t":"Identifying Materials by Their Properties","q":[{"q":"What is a property?","opts":["A feature of a material you can observe or test","The price of a material","The name of a material"],"why":"Properties include color, hardness, and whether a material dissolves."},{"q":"Why can't you identify white powders by looking alone?","opts":["Different powders can look the same","White powders are invisible","Powders change color"],"why":"Scientists test several properties to tell look-alike materials apart."},{"q":"Which white powder fizzes when vinegar is added?","opts":["Baking soda","Sugar","Salt"],"why":"Baking soda fizzes with vinegar."},{"q":"Why is copper used inside electrical wires?","opts":["It is a great conductor of electricity","It is magnetic","It is transparent"],"why":"Electricity passes easily through copper."},{"q":"How do recycling plants separate steel cans from aluminum cans?","opts":["With magnets, because steel is magnetic","By color","By smell"],"why":"Steel is magnetic and aluminum is not."},{"q":"Why can a huge steel ship float?","opts":["Its hollow shape holds air, so the whole ship is less dense than water","Steel is lighter than water","Ships are made of wood"],"why":"Density depends on how much matter is packed into a space."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That you can identify materials by looks alone","That powders exist","That magnets pull on steel"],"why":"April thought looking would be enough."},{"q":"Which properties are tested in BOTH texts?","opts":["Whether it dissolves and whether a magnet pulls on it","Taste and smell","Price and size"],"why":"Both texts test several properties. Remember, never taste in science."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Copper is used inside wires because it conducts electricity","Steel is used for bridges","A magnet picked up only the steel nail"],"why":"Bridges and the nail are in the story. Copper wire is only in the nonfiction text."}]}},{"id":"5-PS1-2","t":"Does It Weigh Less?","qs":[{"q":"What did Kennedy predict about melted ice?","opts":["It would weigh less","It would weigh more","It would weigh the same"],"why":"The weight stayed the same."},{"q":"What did the sealed bag weigh before and after the ice melted?","opts":["85 grams both times","85 grams, then 70 grams","70 grams, then 85 grams"],"why":"Matter changed form, but the total stayed the same."},{"q":"What does conserved mean?","opts":["The total amount stays the same","It disappears","It doubles"],"why":"Matter is conserved when it melts or dissolves."},{"q":"Why did the crew keep the bag sealed?","opts":["So nothing could escape and change the weight","To keep the ice cold","To keep the scale dry"],"why":"A sealed bag means the matter has nowhere to go."}],"nf":{"t":"Matter Never Disappears","q":[{"q":"What does it mean that matter is conserved?","opts":["The total amount of matter stays the same","Matter gets used up","Matter always gets heavier"],"why":"When matter changes form, the total stays the same."},{"q":"An ice cube melts in a sealed bag. What happens to its weight?","opts":["It stays the same","It gets lighter","It gets heavier"],"why":"Melting changes the form, not the amount of matter."},{"q":"What happens to sugar stirred into water?","opts":["It is still there, mixed into the water","It disappears forever","It turns into air"],"why":"Dissolved sugar is still matter, and it still has weight."},{"q":"What did Antoine Lavoisier discover?","opts":["In a closed container, total weight never changed","Ice is heavier than water","Sugar is made of salt"],"why":"His careful weighing showed matter is not created or destroyed."},{"q":"Where does the water go when a puddle dries up?","opts":["It becomes water vapor in the air","It vanishes completely","It turns into rock"],"why":"The water changes into an invisible gas."},{"q":"When wood burns, where does most of its matter go?","opts":["Into smoke and gases in the air","It is destroyed","Into the ground"],"why":"Matter is conserved even when it becomes a gas."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That melted ice weighs less","That ice can melt","That scales measure weight"],"why":"Kennedy thought some of the ice went away."},{"q":"What do BOTH texts say about sugar dissolved in water?","opts":["The total weight stays the same","The sugar disappears completely","The water gets lighter"],"why":"The crew measured 210 grams before and after."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["Antoine Lavoisier weighed materials in the 1700s","Recycling depends on matter not being lost","The ice was kept in a sealed bag"],"why":"Recycling and the sealed bag are in both texts. Lavoisier is only in the nonfiction text."}]}},{"id":"5-PS1-1","t":"The Disappearing Salt","qs":[{"q":"What did Jaylen think about dissolved salt?","opts":["It is just gone","It turns into water","It turns into air"],"why":"The salt was still there, just too small to see."},{"q":"What was left when the salty water dried up?","opts":["White salt crystals","Nothing","Sugar"],"why":"The salt particles came back together as crystals."},{"q":"What is all matter made of?","opts":["Particles too small to see","Solid blocks","Only liquids"],"why":"A drawing with dots can show what we cannot see."},{"q":"Is air matter?","opts":["Yes, it is a gas made of particles","No, it is nothing","Only on windy days"],"why":"Air takes up space and fills a balloon."}],"nf":{"t":"Tiny Particles Everywhere","q":[{"q":"What is matter?","opts":["Anything that takes up space and has weight","Only things you can see","Only solids"],"why":"The text defines matter this way."},{"q":"How are particles arranged in a solid?","opts":["Packed tightly and staying in place","Far apart and moving freely","Floating in the air"],"why":"Tightly packed particles help a solid keep its shape."},{"q":"Why does a gas spread out to fill a space?","opts":["Its particles are far apart and move freely","Its particles are stuck together","It has no particles"],"why":"Gas particles move around freely."},{"q":"How do we know air is matter?","opts":["It takes up space, like in a balloon, and has weight","Because we can see it","Because it is cold"],"why":"A full basketball weighs a little more than a flat one."},{"q":"What happens to dissolved salt when the water evaporates?","opts":["The salt is left behind","The salt disappears too","The salt turns into sugar"],"why":"The salt particles were there all along."},{"q":"Why does a balloon shrink in a cold freezer?","opts":["The air particles slow down and move closer together","The air leaks out completely","The balloon melts"],"why":"Temperature changes how particles move."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That dissolved salt and air are nothing","That water is wet","That balloons can float"],"why":"Jaylen thought dissolved things disappear and air is nothing."},{"q":"What do BOTH texts say is left when salty water evaporates?","opts":["The salt","Nothing at all","Sugar"],"why":"The crew found white crystals in the dish."},{"q":"How are particles in a gas described in BOTH texts?","opts":["Far apart and moving freely","Packed tightly in place","Stuck together in rows"],"why":"Christian's dot model showed this."}]}},{"id":"5-PS1-4","t":"The Fizz Test","qs":[{"q":"What did Kennedy think about mixing?","opts":["Any mixture makes something new","Mixtures never change","Only liquids can mix"],"why":"Only some of the mixtures made something new."},{"q":"Which mixture made bubbles?","opts":["Baking soda and vinegar","Sugar and water","Salt and pepper"],"why":"The bubbles were a gas that had not been there before."},{"q":"What is a sign of a new substance?","opts":["Bubbles, a color change, or heat","Stirring","Using a spoon"],"why":"These are clues that a reaction happened."},{"q":"What formed on the steel wool in vinegar?","opts":["Orange rust","Sugar crystals","Salt"],"why":"Rust is a new substance."}],"nf":{"t":"Mixing or Making Something New?","q":[{"q":"What is a mixture?","opts":["Substances put together that keep their own properties","A brand-new substance","A kind of gas only"],"why":"In a mixture, the parts can be separated again."},{"q":"Which is a mixture?","opts":["Trail mix","Burning wood","Rusting metal"],"why":"You can pick trail mix apart."},{"q":"What do baking soda and vinegar make when they react?","opts":["Carbon dioxide gas","Salt water","Sugar"],"why":"The bubbles are carbon dioxide gas."},{"q":"Which is a sign that a new substance has formed?","opts":["Bubbles of gas or a color change","Pouring water into a cup","Cutting paper in half"],"why":"Gas, color change, temperature change, and new smells are signs of a reaction."},{"q":"Why should some cleaners never be mixed?","opts":["They can react and make dangerous gases","They become too heavy","They lose their color"],"why":"Some reactions are dangerous."},{"q":"What makes a glow stick light up?","opts":["Two liquids mix and react","A tiny battery","Sunlight stored inside"],"why":"Reactions can give off light."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That mixing two things always makes something new","That baking soda fizzes","That salt is a solid"],"why":"Kennedy predicted all three mixtures would make something new."},{"q":"Which mixture appears in BOTH texts as one that can be separated again?","opts":["Salt and pepper","Baking soda and vinegar","Steel wool and vinegar"],"why":"Salt and pepper just combine."},{"q":"Which sign of a new substance did the crew see with baking soda and vinegar, as described in both texts?","opts":["Bubbles of gas","A new color only","Ice forming"],"why":"The gas bubbles are carbon dioxide."}]}},{"id":"5-LS1-1","t":"The Bean in the Bag","qs":[{"q":"What did Jaylen think plants eat?","opts":["Soil","Rocks","Sunlight only"],"why":"Most of a plant’s body comes from air and water."},{"q":"What happened to the bean with no soil?","opts":["It grew roots, a stem, and leaves","It did not grow","It turned to dust"],"why":"The bean grew without any soil."},{"q":"What do plants mostly build their bodies from?","opts":["Air and water","Soil only","Sunlight only"],"why":"Soil gives small amounts of minerals and support."},{"q":"What did the celery in blue water show?","opts":["Water moves up the stem","Celery is blue inside","Plants cannot drink"],"why":"The plant pulls water up from the roots."}],"nf":{"t":"Plants Are Built From Air and Water","q":[{"q":"What is most of a plant's body made from?","opts":["Air and water","Soil","Rocks"],"why":"Plants build their bodies mostly from carbon dioxide and water."},{"q":"What did Jan van Helmont's willow tree experiment show?","opts":["The tree gained a lot of weight, but the soil lost very little","The tree ate all the soil","The tree did not grow"],"why":"The tree's new mass did not come from the soil."},{"q":"What gas do plants take in from the air?","opts":["Carbon dioxide","Oxygen","Helium"],"why":"Plants take in carbon dioxide through their leaves."},{"q":"What do plants use to turn carbon dioxide and water into sugar?","opts":["Energy from sunlight","Energy from the soil","Energy from rocks"],"why":"Photosynthesis uses sunlight."},{"q":"What does soil give a plant?","opts":["Support and small amounts of minerals","Most of its weight","Sunlight"],"why":"Soil holds the plant up and provides minerals."},{"q":"Where does about half of the oxygen in our air come from?","opts":["Tiny ocean living things called phytoplankton","Rocks","Car engines"],"why":"Plants and plantlike living things release oxygen."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That plants eat soil to grow","That plants need water","That seeds can sprout"],"why":"Jaylen thought plants eat dirt."},{"q":"Which famous experiment appears in BOTH texts?","opts":["A willow tree grown in weighed soil for five years","A bean grown in the dark","A plant grown on the Moon"],"why":"The soil lost almost no weight while the tree grew a lot."},{"q":"Which detail is in the nonfiction text but NOT in the story?","opts":["The process is called photosynthesis and releases oxygen","A bean sprouted in a bag with no soil","Water moved up a celery stalk"],"why":"The bag and celery are only in the story. Photosynthesis is named only in the nonfiction text."}]}}]},"5-2":{"name":"Ecosystems and Earth’s Systems","books":[{"id":"5-LS2-1","t":"The Rot Jar","qs":[{"q":"What did Kennedy think happens to dead things?","opts":["They just disappear","They turn into animals","They stay the same forever"],"why":"Decomposers turn them into nutrients for plants."},{"q":"What happened in the jar after two weeks?","opts":["The apple got soft and moldy, and the soil got darker","Nothing changed","The leaves grew bigger"],"why":"The dead things did not disappear. They changed."},{"q":"What do decomposers do?","opts":["Break down dead things and return nutrients to the soil","Make sunlight","Eat only plants"],"why":"Matter keeps moving through the ecosystem."},{"q":"Why do gardeners make compost?","opts":["To speed up decomposition and make rich soil","To waste food","To attract bugs"],"why":"Scraps and leaves turn into soil for new plants."}],"nf":{"t":"Nature's Recyclers","q":[{"q":"What is an ecosystem?","opts":["All the living and nonliving things in an area and how they interact","Only the animals in a forest","A kind of decomposer"],"why":"An ecosystem includes living and nonliving things."},{"q":"What does a decomposer do?","opts":["Breaks down dead plants and animals","Makes food from sunlight","Hunts other animals"],"why":"Decomposers return nutrients to the soil."},{"q":"Which is a decomposer?","opts":["A mushroom","A hawk","A rabbit"],"why":"Fungi, like mushrooms, are decomposers."},{"q":"What would happen without decomposers?","opts":["Dead leaves and trees would pile up","Plants would grow faster","Animals would never get hungry"],"why":"Decomposers keep matter cycling."},{"q":"What is compost?","opts":["Scraps broken down into rich soil","A kind of fertilizer made in a factory","A type of rock"],"why":"People use compost to copy nature's cycle."},{"q":"Why do gardeners keep compost piles damp and turn them?","opts":["Decomposers work fastest when it is warm, damp, and has air","To keep decomposers away","To make the pile freeze"],"why":"Conditions affect how fast decomposers work."}],"c":[{"q":"What mistaken idea do BOTH texts correct?","opts":["That dead things just disappear","That leaves fall from trees","That apples are food"],"why":"Kennedy thought dead things vanish."},{"q":"Which decomposers are named in BOTH texts?","opts":["Fungi, bacteria, and worms","Hawks and rabbits","Grass and trees"],"why":"Both texts name these decomposers."},{"q":"How is the story different from the nonfiction text?","opts":["The story watches an apple and leaves rot in a sealed jar","The story says decomposers do not exist","The story is about magnets"],"why":"The crew built a small model of a rotting pile."}]}},{"id":"5-PS3-1","t":"Lunch From the Sun","qs":[{"q":"Where did April think food energy started?","opts":["At the grocery store","In the sun","In the ocean"],"why":"It started in the sun."},{"q":"Where did the energy in the pizza crust start?","opts":["In sunlight, captured by wheat plants","In a factory","In the oven"],"why":"Every food chain leads to a plant, and every plant needs the sun."},{"q":"What is a producer?","opts":["A living thing that makes its own food using sunlight","An animal that eats plants","A living thing that breaks down dead things"],"why":"Plants are producers."},{"q":"What does the body use food energy for?","opts":["Moving, staying warm, growing, and healing","Only moving","Only staying cool"],"why":"Your body needs energy to rebuild, like healing a cut."}],"nf":{"t":"Energy From the Sun to Your Plate","q":[{"q":"Where does the energy in food almost always start?","opts":["The Sun","The grocery store","The soil"],"why":"Plants capture energy from sunlight."},{"q":"What does a food chain show?","opts":["The path energy takes from one living thing to another","How to cook food","Where animals sleep"],"why":"A food chain shows who eats what."},{"q":"In the food chain sun, grass, rabbit, fox, which is the producer?","opts":["Grass","Rabbit","Fox"],"why":"Plants are producers."},{"q":"Why are there more rabbits than foxes in an ecosystem?","opts":["Only a small part of the energy passes up the food chain","Foxes are faster","Rabbits are bigger"],"why":"Most energy is used for living or lost as heat at each step."},{"q":"Where did the energy in milk first come from?","opts":["Sunlight captured by the grass a cow ate","The cow's water","The milk carton"],"why":"Even milk traces back to sunlight."},{"q":"What unit do people use to measure food energy?","opts":["Calories","Inches","Degrees function tone(f,dur,type="square",vol=.08,f2=null,delay=0){const a=ac();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);}
function noise(dur,vol=.15,delay=0){const a=ac();if(!a)return;const b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g);g.connect(a.destination);s.start(a.currentTime+delay);}

/* ================= WORD SETS & QUESTIONS ================= */
function wordsFor(grade,set){
  if(!grade||!set)return [];
  if(set==="all"){const out=[];const seen=new Set();for(let q=1;q<=4;q++){const k=grade+"-"+q;(DATA[k]?DATA[k].words:[]).forEach(w=>{if(!seen.has(w.w.toLowerCase())){seen.add(w.w.toLowerCase());out.push(Object.assign({q:k},w));}});}return out;}
  return (DATA[set]?DATA[set].words:[]).map(w=>Object.assign({q:set},w));
}
function booksFor(grade,set){
  if(!grade||!set)return [];
  if(set==="all"){const out=[],seen=new Set();for(let q=1;q<=4;q++){(STORIES[grade+"-"+q]?STORIES[grade+"-"+q].books:[]).forEach(b=>{if(!seen.has(b.id)){seen.add(b.id);out.push(b);}});}return out;}
  return STORIES[set]?STORIES[set].books:[];
}
function chosenBooks(){const bs=booksFor(S.grade,S.set);if(S.book){const b=bs.find(x=>x.id===S.book);if(b)return [b];}return bs;}
function bookItems(b){const t=S.text==="both"?"all":S.text,out=[];
  if(t==="all"||t==="story")b.qs.forEach(x=>out.push({b,x,nf:false,cmp:false}));
  if((t==="all"||t==="nf")&&b.nf)b.nf.q.forEach(x=>out.push({b,x,nf:true,cmp:false}));
  if((t==="all"||t==="compare")&&b.nf&&b.nf.c)b.nf.c.forEach(x=>out.push({b,x,nf:false,cmp:true}));
  return out;}
function poolSize(){return S.kind==="words"?wordsFor(S.grade,S.set).length:chosenBooks().reduce((a,b)=>a+bookItems(b).length,0);}
function buildStoryQuestions(books,n){
  const items=shuffle(books.flatMap(bookItems));
  const take=n===0?items.length:Math.min(n,items.length);
  return items.slice(0,take).map(({b,x,nf,cmp})=>{const order=shuffle(x.opts.map((_,i)=>i));
    return {src:"story",nf,cmp,book:b,srcTitle:nf?b.nf.t:b.t,why:x.why,kindLabel:cmp?`COMPARE: "${b.t.toUpperCase()}" + "${b.nf.t.toUpperCase()}"`:nf?`NONFICTION: "${b.nf.t.toUpperCase()}"`:`STORY: "${b.t.toUpperCase()}"`,q:esc(x.q),speak:x.q,opts:order.map(i=>x.opts[i]),ans:order.indexOf(0),correctText:x.opts[0]};});
}
function setLabel(){
  if(S.kind==="stories"){const bs=chosenBooks();if(S.book&&bs.length===1)return `${GRADE_INFO[S.grade].name} · ${bs[0].t}`;
    if(S.set==="all")return `${GRADE_INFO[S.grade].name} · Stories from the whole year`;
    const q=S.set.split("-")[1];return `${GRADE_INFO[S.grade].name} · Quarter ${QWORD[q]} stories`;}
  if(S.set==="all")return `${GRADE_INFO[S.grade].name} · Whole year`;
  const q=S.set.split("-")[1];return `${GRADE_INFO[S.grade].name} · Quarter ${QWORD[q]}: ${DATA[S.set]?DATA[S.set].name:""}`;
}
function blankOf(w){const re=new RegExp("(^|[^A-Za-z])("+reEsc(w.w)+")(?![A-Za-z])","i");const m=w.ex.match(re);if(!m)return null;return w.ex.replace(re,(all,pre)=>pre+"_____");}
function buildQuestions(words,n){
  const total=n===0?words.length:Math.min(n,Math.max(words.length,n));
  const order=[];while(order.length<total){order.push(...shuffle(words));}
  const kinds=["def","rev","blank"];let kc=Math.floor(Math.random()*3);
  return order.slice(0,total).map((w,i)=>{
    let kind=kinds[(kc+i)%3]; const bl=blankOf(w);
    if(kind==="blank"&&!bl) kind=Math.random()<.5?"def":"rev";
    // distractors: prefer same quarter, then the rest of the set
    const same=shuffle(words.filter(x=>x!==w&&x.q===w.q&&x.w.toLowerCase()!==w.w.toLowerCase()&&x.m!==w.m));
    const rest=shuffle(words.filter(x=>x!==w&&x.q!==w.q&&x.w.toLowerCase()!==w.w.toLowerCase()&&x.m!==w.m));
    let pool=same.concat(rest);
    if(kind==="blank") pool=pool.filter(x=>!new RegExp("(^|[^A-Za-z])"+reEsc(x.w)+"(?![A-Za-z])","i").test(bl));
    const dis=pool.slice(0,3);
    const field=kind==="def"?"m":"w";
    const opts=shuffle([w].concat(dis)).map(x=>({t:x[field],ok:x===w}));
    let q,kindLabel,speak;
    if(kind==="def"){kindLabel="WHAT DOES IT MEAN?";q=`What does <span class="w">${esc(w.w)}</span> mean?`;speak=`What does ${w.w} mean?`;}
    else if(kind==="rev"){kindLabel="WHICH WORD?";q=`Which word means: ${esc(w.m)}?`;speak=`Which word means: ${w.m}?`;}
    else {kindLabel="FILL IN THE BLANK";q=esc(bl).replace("_____",'<span class="w">_____</span>');speak=bl.replace("_____","blank");}
    return {src:"word",w,kind,kindLabel,q,speak,opts:opts.map(o=>o.t),ans:opts.findIndex(o=>o.ok)};
  });
}

    b.innerHTML=`<span class="key">${"ABCD"[i]}</span><span class="txt">${esc(o)}</span>`;b.addEventListener("click",()=>choose(i));box.appendChild(b);});

function startTimer(sec){stopTimer();const el=$("timer");if(!sec){el.hidden=true;return;}el.hidden=false;const total=sec,end=Date.now()+sec*1000;let last=sec;
  const tick=()=>{const left=Math.max(0,(end-Date.now())/1000),whole=Math.ceil(left);$("timerNum").textContent=whole;el.style.setProperty("--p",left/total);el.style.setProperty("--tcol",left/total>.5?"var(--good)":left/total>.25?"var(--gold)":"var(--bad)");el.classList.toggle("low",left<=5);if(whole!==last&&whole<=5&&whole>0)SFX.tick();last=whole;if(left<=0){stopTimer();if(!G.locked)choose(-1);}};
  tick();G.timerId=setInterval(tick,200);}
function stopTimer(){if(G&&G.timerId){clearInterval(G.timerId);G.timerId=null;}$("timer").classList.remove("low");}
function lockAnswers(){G.locked=true;[...$("answers").children].forEach(b=>b.disabled=true);}

async function choose(i){
  if(G.locked||G.over)return;
  const Q=G.qs[G.qi],steal=G.phase==="steal";
  if(i>=0&&G.wrongPicks.includes(i))return;
  stopTimer();lockAnswers();hush();
  const g=G,gone=()=>G!==g||g.quit;
  const t=G.teams[G.answerer];t.tries++;
  const btns=[...$("answers").children];
  if(i===Q.ans){
    btns[i].classList.add("right");btns.forEach((b,j)=>{if(j!==i&&!b.classList.contains("wrong"))b.classList.add("dim");});
    t.correct++;if(!steal){t.streak++;t.best=Math.max(t.best,t.streak);}
    SFX.correct();
    G.history.push({Q,result:steal?"stolen":"correct"});
    const msg=await reward(G.answerer,steal);
    if(gone())return;
    if(G.over)return;
    await botTurn(); if(gone()||G.over)return;
    reveal(true,msg);
  } else {
    if(i>=0){btns[i].classList.add("wrong");G.wrongPicks.push(i);if(!RM)btns[i].animate([{transform:"translateX(0)"},{transform:"translateX(-10px)"},{transform:"translateX(10px)"},{transform:"translateX(0)"}],{duration:280});}
    if(!steal)t.streak=0;
    updateScores();SFX.wrong();
    await penalty(G.answerer,steal,i<0);
    if(gone())return;
    if(!steal&&!G.solo){offerSteal(i<0);return;}
    G.history.push({Q,result:"missed"});
    await botTurn(); if(gone()||G.over)return;
    showCorrect();reveal(false,i<0?"Time's up!":steal?"No steal this time.":"Not quite!");
  }
}
function showCorrect(){const Q=G.qs[G.qi];[...$("answers").children].forEach((b,j)=>{if(j===Q.ans)b.classList.add("right");else if(!b.classList.contains("wrong"))b.classList.add("dim");});}
function offerSteal(timeout){

  const ov=overlay(`<h2 class="result-bad">${timeout?"Time's up!":"Not quite!"}</h2><p>Can another team steal it?</p><div class="btns">${btns}<button class="btn ghost" data-team="-1">No steal, show the answer</button></div>`,true);
  ov.querySelectorAll("[data-team]").forEach(b=>b.addEventListener("click",()=>{const j=+b.dataset.team;SFX.click();hideOverlay();
    if(j<0){G.history.push({Q:G.qs[G.qi],result:"missed"});showCorrect();reveal(false,"Here's the answer.");return;}
    G.phase="steal";G.answerer=j;setActive(j);$("turnLbl").textContent="STEAL!";
