[`Jaylen rolled his toy car down a ramp. It bumped a paper cup. The cup slid! "How far will it slide next time?" asked Christian.`,`April had an idea. "Only big, heavy things can push far." Kennedy said, "Let's test it. We need **evidence**."`,`They used the same car each time. First a low ramp, then a high ramp. Christian wrote, "The high ramp will push the cup farther."`,`Low ramp: the cup slid a little, 5 cm. High ramp: the cup slid a lot, 20 cm! Kennedy wrote it down.`,`It was the same car. It was only faster. The faster car had more **energy**. It pushed the cup farther.`,`Jaylen rolled a ball slowly. It barely moved a block. Then he rolled it fast. The block went flying!`,`That is why cars have speed limits. A fast car has more energy in a crash. Seatbelts help keep people safe.`,`A faster object has more energy.`],
`*Tell it again:* First, ______. Then, ______. This shows that faster things ______.

*Words to know:* **energy** · **speed** · **motion energy** · **evidence**

*Try it at home:* Roll a toy car down a ramp made from a book. Let it bump a cup. Try a taller ramp. Which one pushes the cup farther?`,
[`On Saturday, Jaylen built a ramp from a board and a stack of books. He let a toy car roll down and crash into a paper cup at the bottom, and the cup slid across the table. "I wonder how far it would go if the ramp were taller," said Christian.`,`April shook her head. "I bet only big, heavy things can push something far." Kennedy opened her notebook. "That's an idea, but it isn't **evidence** yet. Let's find out." Jaylen grinned. "Same car, different ramps. That's a fair test."`,`Mrs. Swinea showed the crew how to measure with a ruler. They set up two ramps, one with a single book and one with three books. Each person made a prediction. Christian wrote, "The taller ramp will make the car faster, so the cup will slide farther."`,`Jaylen released the car from the low ramp, and the cup slid 5 centimeters. From the high ramp, the cup slid 20 centimeters! Kennedy recorded both numbers. They repeated each test three times and got nearly the same results.`,`April studied the data. "It was the same car both times," she said. "It wasn't heavier, just faster." A faster object has more motion **energy**, so it can push things farther. Their data showed that speed matters, not only weight.`,`Back outside, Pepper chased a tennis ball. A slowly rolling ball barely nudged a small block of wood. When Jaylen rolled it fast, the block went tumbling. "Same ball, more speed, more energy," Christian said.`,`That evidence explains why cities set speed limits. A speeding car has far more energy than a slow one, so a crash can do much more harm. Seatbelts, airbags, and helmets help absorb that energy to protect people.`,`The crew read through their notebook. Each test showed the same thing: the faster something moves, the more energy it has. Their evidence was in the numbers.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that faster objects ______. Why does speed matter for safety? ______

*Words to know:* **energy** · **speed** · **motion energy** · **evidence**

*Try it at home:* Roll a toy car down a ramp made from a book and let it bump a cup. Predict what will happen with a taller ramp, then measure how far the cup slides each time.`);
b('4-PS3-3','The Marble Crash',
[`Christian watching a marble roll toward another marble on a cardboard track, Pepper nearby.`,`Kennedy tapping a pencil, April shaking her head.`,`A track with one still marble, Mrs. Swinea pointing, Christian writing a prediction.`,`Two marbles at the moment of impact, tape marks on the floor showing where they stopped.`,`Simple diagram: an arrow of energy from the first marble to the second, with a small sound wave.`,`A row of falling dominoes.`,`A ball bouncing high on tile and barely bouncing on a rug, Pepper watching.`,`The crew around the notebook.`],
[`Christian rolled a marble down a track. CLICK! It hit another marble. The second marble rolled away! "Where did the **energy** go?" he asked.`,`Kennedy said, "I think the energy just disappears." April said, "Let's **predict** and test it."`,`They put one marble still in the middle of the track. They rolled a second marble slowly into it. Christian wrote, "The still marble will roll."`,`CLICK! The still marble rolled away. Then they rolled faster. The still marble rolled even farther!`,`The energy did not disappear. It moved from one marble to the other. Energy can **transfer** in a **collision**. Some energy became the click sound too.`,`Jaylen set up dominoes. He tipped the first one. They all fell, one after another. Energy moved all down the line!`,`Pepper's ball bounced high on the tile. On the soft rug, it barely bounced. The rug soaked up some of the energy.`,`In a collision, energy moves from one object to another.`],
`*Tell it again:* First, ______. Then, ______. This shows that in a crash, energy ______.

*Words to know:* **collision** · **energy** · **transfer** · **predict** · **outcome**

*Try it at home:* Roll one marble into another on a smooth floor. Try a slow roll and a fast roll. Which one sends the second marble farther?`,
[`Christian rolled a marble down a folded cardboard track. Click! It struck a second marble resting near the bottom, and that marble shot away. "The first marble slowed down, and the second one sped up," he said. "Where did the **energy** go?"`,`Kennedy tapped her pencil. "I think the energy just disappears in a crash." April shook her head. "Let's make a **prediction** and test it. If energy disappears, the second marble shouldn't move."`,`The crew set one marble still in the middle of the track. Mrs. Swinea reminded them to change only one thing at a time. First they would roll the other marble slowly, then faster. Christian wrote, "The still marble will roll away, and it will go farther when the first marble is faster."`,`Jaylen rolled the first marble slowly. It hit the still marble with a soft click, and the still marble rolled a short way. On the faster roll, the click was louder and the still marble rolled much farther. Kennedy marked each stopping spot with tape.`,`"The energy didn't disappear," said April. "It moved!" In a **collision**, energy **transfers** from one object to another. Some energy also turns into sound, which is why they heard the click. Mrs. Swinea added that a tiny bit can become heat, too.`,`Jaylen lined up dominoes and tipped the first one. They toppled one after another down the whole line. Each falling domino hit the next and passed its energy along. "It's like a chain of tiny collisions," said Christian.`,`Outside, Pepper's ball bounced high on the tile floor but barely bounced on the soft rug. The rug absorbed much of the ball's energy. Engineers use this idea to design playground surfaces, bike helmets, and car bumpers that protect people in crashes.`,`The crew looked over their notebook. Every collision showed energy moving from one object to another, with some turning into sound. Their prediction had been right, and now they had the evidence.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that in a collision, energy ______. Where else have you seen a collision pass along energy? ______

*Words to know:* **collision** · **energy** · **transfer** · **predict** · **outcome**

*Try it at home:* Roll one marble into another on a smooth floor. Predict what a slow roll and a fast roll will do, then test and compare.`);
b('4-PS3-2','The Warm Spoon Mystery',
[`Close-up of Jaylen's hand on a spoon handle, steam rising, Pepper at his feet.`,`Kennedy holding a notebook, Jaylen shrugging, April grinning.`,`A cup with two spoons, four kids and Mrs. Swinea leaning in, Pepper watching.`,`Kennedy touching each handle, April holding a timer.`,`Simple diagram: arrows from the water up the spoon to a fingertip.`,`Christian with fingers on his throat, wavy lines moving outward.`,`Flashlight beam on a wall, Mrs. Swinea pointing at a battery-and-wire inset.`,`The four kids, Mrs. Swinea, and Pepper around the cup, notebook open.`],
[`Jaylen left his spoon in his warm cocoa. He touched the handle. It was warm! "How did the **heat** get up here?" he asked.`,`"The spoon makes its own heat," said Jaylen. Kennedy shook her head. "Let's test it. We need **evidence**."`,`Mrs. Swinea poured warm water in a cup. The kids put in a metal spoon and a wooden spoon. "Which handle will get warm first?" asked Christian.`,`They waited three minutes. Kennedy touched the metal handle. It was warm! She touched the wood handle. It was not.`,`The **energy** moved from the water, up the metal spoon, to Kennedy's finger. Energy can **transfer**. It moves from place to place. "The spoon did not make heat," said Jaylen. "It carried it!"`,`Christian hummed. He put his fingers on his throat. Buzz! "I feel a **vibration**!" he said. Sound is energy too. It moves from Christian to our ears.`,`April clicked on a flashlight. A bright circle lit the wall. Energy moved from the battery, through the wires, to the bulb. Then it traveled to the wall as light. The wires carry **electric current**.`,`Energy can move from place to place. Heat, sound, light, and electric current can all carry it.`],
`*Tell it again:* First, ______. Then, ______. This shows that energy can ______.

*Words to know:* **energy** · **transfer** · **vibration** · **electric current** · **evidence**

*Try it at home:* Put a metal spoon and a wooden spoon in a cup of warm water. Ask a grown-up to pour. Which handle gets warm first?`,
[`On Saturday morning, Jaylen left a metal spoon resting in his mug of warm cocoa. When he reached for it, the handle felt surprisingly warm. "That's weird," he said. "The cocoa is down there, but the heat is all the way up here. How did it get to the handle?"`,`"Maybe the spoon makes its own **heat**," Jaylen suggested. Kennedy flipped open her notebook. "That's an idea, but it isn't **evidence** yet. We should design a test." April grinned. "A fair test needs two spoons."`,`The crew gathered a metal spoon and a wooden spoon. Mrs. Swinea, their lead scientist, poured warm water into a cup, and the kids stood both spoons in it with the handles sticking out. Each person wrote a prediction. Kennedy's said, "I think the metal handle will warm up first, because it felt warm in the cocoa."`,`April set a timer for three minutes, and the crew watched. When it beeped, Kennedy carefully touched the metal handle. It was noticeably warm. Then she touched the wooden handle, which stayed almost as cool as before. "That's our evidence," she said, writing it down.`,`"The spoon didn't make the heat," Jaylen realized. "It carried it!" Kennedy nodded. Heat **energy** moved from the warm water, up through the metal, to her finger. Scientists call this a **transfer** of energy. Metal passes heat along much better than wood does, so the metal handle warmed first.`,`Christian had been quiet, humming a song. Suddenly he stopped and pressed his fingers to his throat. "Feel this," he said. "It buzzes when I hum." The buzz was a **vibration**, a fast back-and-forth shake. Sound is energy too. The vibration moves through the air in waves, carrying energy from Christian to everyone's ears.`,`Pepper barked at the dark corner of the room. April clicked on a flashlight, and a bright circle of light appeared on the wall. "There's energy moving here too," said Mrs. Swinea. Inside the flashlight, energy flows from the battery through the wires as **electric current**. The bulb changes it into light, and the light carries that energy across the room.`,`The crew looked at their notebook. Energy had moved in four different ways: as heat, as sound, as light, and as electric current. Each time, they had evidence to prove it.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that energy can ______. Why does it matter that energy can move? ______

*Words to know:* **energy** · **transfer** · **vibration** · **electric current** · **evidence**

*Try it at home:* Put a metal spoon and a wooden spoon in a cup of warm water. Ask a grown-up to pour. Predict which handle will warm first, then test it. What would you expect if you tried a plastic spoon?`);
b('4-PS3-4','The Rubber-Band Racer',
[`Mrs. Swinea holding a challenge card, the crew looking at a cardboard car body, Pepper sniffing a rubber band.`,`April's first car with bottle-cap wheels taped flat, Kennedy writing in a notebook.`,`Close-up of a rubber band wound tight around a straw axle.`,`The car barely rolling, Jaylen lying on the floor looking at the wheels, a ruler beside the car.`,`The improved car with straws around the axles, a long trail mark behind it, April cheering.`,`Simple diagram: a stretched rubber band labeled stored energy with an arrow to a moving car labeled motion energy.`,`Christian blowing on a pinwheel, a solar panel on a roof in an inset.`,`The crew with both cars side by side and the notebook open.`],
[`Mrs. Swinea gave the crew a challenge. "Build a car. A rubber band will make it go." Pepper sniffed the rubber band.`,`April built the first car. Kennedy said, "Let's **test** it. I will write what happens."`,`They wound the rubber band tight. It stored **energy**. April let go.`,`The car only rolled a little. Jaylen looked at the wheels. "They rub on the cardboard!"`,`April moved the wheels and added straws. The car zoomed across the floor! "We **improved** it!" said April.`,`The rubber band stored energy. The car **converted** it to motion. Energy changed form.`,`Christian blew on a pinwheel. It spun! Wind energy changed to motion. Solar panels change light to electricity.`,`A **device** can change energy from one form to another.`],
`*Tell it again:* First, ______. Then, ______. This shows that a device can ______.

*Words to know:* **convert** · **device** · **form of energy** · **test** · **improve**

*Try it at home:* Make a pinwheel or a rubber-band car. What energy goes in? What energy comes out?`,
[`On Saturday, Mrs. Swinea set out cardboard, bottle caps, straws, and a rubber band. "Today's challenge," she said, "is to design a **device** that changes one form of energy into another. Build a car that uses a stretched rubber band to move." Pepper sniffed the rubber band curiously.`,`April built the first design. She taped the wheels flat against the cardboard body and hooked the rubber band to the axle. Kennedy opened her notebook. "Before we run it, let's decide how to measure," she said. "We'll record how far it travels."`,`They twisted the rubber band tight. As it wound up, it stored **energy**, like a spring ready to release. April set the car on the floor, and everyone made a prediction. Christian wrote, "I think it will roll across the whole room."`,`April let go. The car lurched forward and rolled only about thirty centimeters before it stopped. Jaylen got down at floor level and peered at the wheels. "They're rubbing against the cardboard," he said. "That's slowing it down."`,`April moved the wheels outward and slid a straw around each axle so they could spin freely. On the second test, the car zoomed nearly two meters! "We **improved** it," April cheered. Mrs. Swinea smiled. "Engineers test, find the problem, and try again."`,`Mrs. Swinea explained what they had built. The wound rubber band stored energy, and the car **converted** that stored energy into motion. A device that changes energy from one form to another is something engineers design all the time.`,`Christian blew on a paper pinwheel and watched it spin. "The wind's energy turns into motion!" he said. Mrs. Swinea added that solar panels convert light energy into electricity, and a toaster converts electricity into heat. Each one is a device that changes energy's form.`,`The crew looked at the two cars side by side. Their first car had shown them what to fix, and their second proved the change worked. They now had evidence that careful testing leads to better designs.`],
`*Tell it again:* First, ______. Then, ______. This shows that a device can ______. What would you improve next? ______

*Words to know:* **convert** · **device** · **form of energy** · **test** · **improve**

*Try it at home:* Make a pinwheel or a rubber-band car. Describe what energy goes in and what energy comes out. Test it, then change one thing to improve it.`);

b('4-PS4-1','The Duck in the Pool',
[`Christian splashing in a small plastic pool, rings of ripples, a yellow rubber duck bobbing, Pepper at the edge.`,`Jaylen pointing across the pool, April placing a piece of tape at the edge to mark the duck's spot.`,`Kennedy watching the duck with her notebook, Christian making waves.`,`The duck still near the tape mark, Jaylen looking surprised.`,`Side view diagram: water moving up and down in place with an arrow showing the wave's energy traveling sideways.`,`April and Christian stretching a Slinky across the grass, one tall wave and one short wave.`,`Kennedy's drawing of a wave with the height and the distance between peaks labeled.`,`The crew and Pepper around the notebook.`],
[`Christian splashed in a little pool. Waves rolled across the water. A rubber duck bobbed on top.`,`"The waves will push the duck to the other side," said Jaylen. April put tape on the edge to mark where the duck started.`,`They made more waves. Kennedy watched the duck. She wrote, "The duck will go to the other side."`,`The duck went up and down, up and down. It stayed near the tape! "My idea was wrong," said Jaylen. "That is good to know."`,`A **wave** carries energy. The water moves up and down in place. The energy moves across the pool.`,`April shook a Slinky. A big shake made a tall wave. Tall waves have a big **amplitude**. Christian shook it slowly. Slow shakes made long waves. The distance from peak to peak is the **wavelength**.`,`Kennedy drew a **model** of a wave. She labeled the height and the length. Sound and light travel as waves too.`,`Waves carry energy. The water just bobs up and down.`],
`*Tell it again:* First, ______. Then, ______. This shows that a wave ______.

*Words to know:* **wave** · **amplitude** · **wavelength** · **pattern** · **model**

*Try it at home:* Make waves in a tub or pan of water with a floating toy. Watch the toy. Does it travel with the wave?`,
[`It was a hot afternoon, so Christian filled a small plastic pool in Jaylen's backyard. When he splashed, ripples spread across the water in rings. A yellow rubber duck bobbed on the surface as the waves rolled past.`,`"The waves are pushing the duck to the other side," Jaylen said confidently. Kennedy tilted her head. "Maybe, but let's watch carefully and collect evidence." April placed a piece of tape on the pool's edge to mark the duck's starting spot.`,`Christian made more waves while Kennedy kept her eyes on the duck. She wrote her prediction: "The duck will travel to the opposite side." Mrs. Swinea reminded everyone to make waves the same way each time so the test would be fair.`,`After several minutes of waves, the duck was still nearly at the tape mark! It had moved up and down with every wave, but it had hardly traveled sideways at all. "Whoa," said Jaylen. "My idea was wrong, and that's useful to know."`,`Mrs. Swinea explained that a **wave** carries energy, not water, from place to place. The water moves up and down in place as each wave passes, and the energy keeps traveling across the pool. That's why the duck bobbed instead of floating away.`,`April stretched a long Slinky across the grass. She flicked it gently to make a small wave, then harder to make a tall wave. "The tall wave has a bigger **amplitude**," Kennedy noted. Christian shook the Slinky slowly, then quickly, making long waves and short waves. "The distance from one peak to the next is the **wavelength**," he said.`,`Kennedy drew a **model** of what they had found, with a tall wave, a short wave, and labels for the height and the length. Mrs. Swinea told them that sound and light travel as waves too. Scientists use models like this to study ocean waves, earthquakes, and even music.`,`The crew reviewed their notebook. The waves had moved energy across the pool without moving the duck along. Jaylen's wrong guess had led them to the best evidence of the day.`],
`*Tell it again:* First, ______. Then, ______. This shows that a wave carries ______ but not ______. Where else do you see waves? ______

*Words to know:* **wave** · **amplitude** · **wavelength** · **pattern** · **model**

*Try it at home:* Make waves in a tub or pan of water with a floating toy. Predict whether the toy will travel with the wave, then test it. Try bigger and smaller waves.`);
b('4-PS4-2','The Dark Box',
[`Christian peeking into the end of a shoebox, a toy dinosaur drawn faintly inside, Pepper next to him.`,`Christian thinking with a thought bubble of light rays coming out of eyes, Mrs. Swinea smiling, Kennedy with a notebook.`,`April taping the lid shut, Jaylen with scissors and a small side hole covered by tape.`,`Two panels: dark view with no dinosaur, then a flashlight beam through the side hole and the dinosaur lit up.`,`Diagram: a flashlight, a dinosaur, and an eye with arrows from the light to the dinosaur and into the eye.`,`April holding a small mirror, a spot of light bouncing onto the wall.`,`Kennedy's drawing of a lamp, an object, and an eye with arrows showing the path of light.`,`The crew around the drawing, Christian grinning, Pepper at his feet.`],
[`Christian looked into a shoebox. A toy dinosaur was inside. "I can't see it. It is too dark!"`,`"Maybe my eyes make light so I can see," said Christian. "Great idea to test!" said Mrs. Swinea. Kennedy said, "We need **evidence**."`,`April taped the lid shut. She wrote, "If eyes make light, Christian will see the dinosaur."`,`Christian looked through the hole. Dark! No dinosaur. Then Jaylen shined a flashlight in the side hole. "I see it!" said Christian.`,`Light from the flashlight hit the dinosaur. It **reflected**, or bounced, into Christian's eyes. That is how we see.`,`April used a mirror. The flashlight light bounced onto the wall. Mirrors reflect light too.`,`Kennedy drew a **model**. She drew arrows: lamp, object, eye. The arrows show the **path** of the light.`,`We see when light bounces off things and goes into our eyes.`],
`*Tell it again:* First, ______. Then, ______. This shows that we see when light ______.

*Words to know:* **light** · **reflect** · **light source** · **model** · **path**

*Try it at home:* Put a toy in a shoebox with a small peephole. Look in. Then shine a flashlight through a side hole. What changes?`,
[`Christian peeked through a hole in the end of a shoebox. Inside sat a small toy dinosaur, but all he could see was darkness. "I know it's in there," he said. "Why can't I see it?"`,`"Maybe my eyes make their own light, so I can see things," Christian wondered. "That's a great idea to test," said Mrs. Swinea. Kennedy opened her notebook. "If that's true, he should see the dinosaur inside a dark box. We need **evidence**."`,`April taped the lid shut so no light could get in. She made a prediction: "If eyes make light, Christian will see the dinosaur." Christian wrote his own prediction right beside hers. Jaylen cut a small hole in the side of the box, but they kept it covered for now.`,`Christian looked through the peephole with the side hole covered. He saw only black. Then Jaylen uncovered the side hole and shined a flashlight through. "I see it!" Christian shouted. Kennedy wrote down both results.`,`Mrs. Swinea explained what had happened. Light from the flashlight, a **light source**, traveled to the dinosaur and **reflected**, or bounced, off it. Some of that light entered Christian's eyes, and that's how he saw the toy. Without light to bounce, there is nothing to see.`,`April wondered if light could bounce off other things. She held a small mirror and aimed the flashlight at it. A bright spot of light jumped onto the wall! "Mirrors reflect almost all the light that hits them," said Kennedy.`,`Kennedy drew a **model** of how we see. She drew a lamp, a dinosaur, and an eye, with arrows showing the **path** of the light from the lamp to the dinosaur and then into the eye. Mrs. Swinea said that cameras, glasses, and car mirrors all work by controlling light's path.`,`The crew studied the drawing. Christian grinned. "My idea led us to a really good test," he said. "Now we know it's light bouncing into our eyes that lets us see." Kennedy circled that sentence in the notebook as their evidence.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that we see when light ______. Why can't we see in a completely dark room? ______

*Words to know:* **light** · **reflect** · **light source** · **model** · **path**

*Try it at home:* Put a toy in a shoebox with a small peephole. Predict what you will see, look in, then shine a flashlight through a side hole. Draw the path of the light.`);
b('4-PS4-3','The Flashlight Code',
[`Mrs. Swinea holding up a challenge card in a backyard at dusk, Pepper wagging her tail.`,`Kennedy flashing a flashlight toward the far end of the yard, Christian beside her with a question mark.`,`Jaylen at the far end of the yard shrugging, small flash lines crossing the yard.`,`April and Christian writing a chart of short and long flashes next to a second chart of counted flashes.`,`Simple diagram: a flashlight, a pattern of short and long flashes, and a person decoding at the other end.`,`Two columns comparing the same word sent two ways: a short row of flashes and a long row of flashes.`,`A ship with a signal lamp, a barcode, and a QR code in a small collage.`,`The crew and Pepper around the code chart.`],
[`Mrs. Swinea gave the crew a challenge. "Send a message across the yard. No talking!" Pepper wagged her tail.`,`Kennedy flashed her flashlight. "They will understand!" Christian asked, "How will Jaylen know what it means?"`,`Jaylen was across the yard. He shrugged. "I don't know what that means!"`,`April said, "We need a **pattern** we both know." They made two **codes**. Code 1: short and long flashes. Code 2: count the flashes.`,`A message can travel as a **signal**. The sender and the receiver must know the code.`,`They sent HI both ways. Short and long flashes: 6 flashes. Counting flashes: 17! The first code was faster.`,`Ships use flashing lights to send messages. Barcodes and QR codes are patterns too.`,`Patterns can send information.`],
`*Tell it again:* First, ______. Then, ______. This shows that a code is ______.

*Words to know:* **pattern** · **code** · **signal** · **information** · **compare**

*Try it at home:* Make a code with short and long flashes or taps. Send a short word to someone in another room. Can they decode it?`,
[`At dusk, Mrs. Swinea handed the crew a challenge card. "Send a message from one end of the yard to the other without talking," she said. "Design at least two ways, then compare them." Pepper wagged her tail, ready to help.`,`Kennedy grabbed a flashlight. "I'll just flash the light, and Jaylen will understand." Christian frowned. "How will he know what the flashes mean?" Kennedy shrugged. "We'll see."`,`Jaylen walked to the far end of the yard. Kennedy flashed the light a few times, but all he could do was wave back in confusion. "I saw something," he called, "but I have no idea what it means!"`,`April tapped her pencil. "We need a **pattern** that both the sender and the receiver agree on." She and Christian made a code chart. In Code 1, short and long flashes stood for different letters. In Code 2, the number of flashes told the position of each letter in the alphabet.`,`Mrs. Swinea explained that information can travel as a **signal**, such as light, sound, or electricity, as long as both people know the **code**. "The pattern carries the message," she said. "The code helps you read it."`,`The crew compared their codes by sending the word HI. With short and long flashes, it took only six flashes. With the counting code, H needed eight flashes and I needed nine, for seventeen in all. "Code 1 is much faster," said April, "but we have to memorize the chart."`,`Mrs. Swinea showed them that ships use signal lamps when radios fail. Barcodes at the store use patterns of lines, and QR codes use patterns of squares. Phones and computers send information as patterns too.`,`The crew looked at their chart. Kennedy's first idea had not worked, but it had led them to something better. They had a pattern, a code, and evidence that one solution was faster than the other.`],
`*Tell it again:* First, ______. Then, ______. This shows that a code ______. Which code would you choose, and why? ______

*Words to know:* **pattern** · **code** · **signal** · **information** · **compare**

*Try it at home:* Invent two different codes using flashes or taps. Send the same short word both ways. Which code was faster? Which was easier to read?`);

b('4-LS1-1','Beaks, Roots, and Burrs',
[`Christian by a window watching a bird with a short, thick beak at a feeder, Pepper at his feet.`,`April shaking her head, Kennedy with a notebook.`,`A table with tweezers, a spoon, a clothespin, chopsticks, and small bowls of rice, cereal, and water.`,`Jaylen picking up rice with tweezers, Christian lifting water with a spoon.`,`Diagram: a bird beak labeled structure with an arrow labeled function (cracks seeds).`,`A plate with a carrot, celery, and lettuce with labels root, stem, and leaf.`,`Pepper with burrs stuck in her fur, a Velcro strip in an inset.`,`The crew and Pepper around the notebook.`],
[`Christian watched a bird at the feeder. It cracked a seed with its short, thick beak. "Why does it have that beak?" he asked.`,`April said, "Only animals have body parts with jobs. Plants do not." Kennedy said, "Let's test it. We need **evidence**."`,`Mrs. Swinea set out tweezers, a spoon, and a clothespin. She also set out rice, cereal, and water. "Each tool is like a beak."`,`Jaylen picked up rice with tweezers. Christian scooped water with a spoon. Each tool did one job best.`,`A **structure** is a body part. Its **function** is its job. A bird's beak shape helps it eat.`,`Kennedy brought a salad. A carrot is a root. Celery is a stem. Lettuce is a leaf. Plants have structures too!`,`Pepper came back with burrs in her fur. "Velcro was invented by copying burrs!" said Mrs. Swinea.`,`Plants and animals have structures that help them **survive**.`],
`*Tell it again:* First, ______. Then, ______. This shows that a structure ______.

*Words to know:* **structure** · **function** · **internal** · **external** · **survive**

*Try it at home:* Try picking up rice, cereal, and water with a spoon, tweezers, and a clothespin. Which tool works best for each?`,
[`Christian sat by the window watching a bird at the feeder. It cracked open a sunflower seed with its short, thick beak. "I wonder why that beak is shaped that way," he said. "Would a long, thin beak work as well?"`,`"I think only animals have body parts with special jobs," April announced. "Plants just sit there." Kennedy flipped open her notebook. "That's a claim, but we need evidence. Let's investigate."`,`Mrs. Swinea set up a challenge. Each tool stood for a different kind of beak: tweezers, a spoon, a clothespin, and chopsticks. The foods were rice, cereal, and a cup of water. The crew predicted which tool would work best for each food.`,`Jaylen picked up grains of rice with tweezers, easy as that. Christian scooped water with the spoon, but the tweezers could not hold it. The clothespin worked well for cereal. "Each tool is built for one job," Kennedy wrote.`,`Mrs. Swinea explained that a body part is a **structure**, and the job it does is its **function**. A bird's beak shape matches the food it eats. Structures can be **external**, like a beak or a claw, or **internal**, like a heart that pumps blood.`,`Kennedy sliced a carrot, a stalk of celery, and a lettuce leaf. "These are plant structures," she said. The carrot is a root that holds the plant and takes in water. The celery stem carries water upward. The lettuce leaf catches sunlight to make food.`,`Pepper bounded back with burrs stuck in her fur. Mrs. Swinea told them that an inventor noticed burrs sticking to his dog and invented Velcro. "Engineers study the structures of living things to solve problems," she said.`,`April closed the notebook. "I was wrong," she admitted. "Plants have structures with jobs, too." The crew had learned that every structure, inside or out, helps a living thing survive, grow, or reproduce.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that a structure ______. What structure helps you? ______

*Words to know:* **structure** · **function** · **internal** · **external** · **survive**

*Try it at home:* Use a spoon, tweezers, and a clothespin to pick up rice, cereal, and water. Predict which tool is best for each. Then name a plant part and its job.`);
b('4-LS1-2','The Ruler Catch',
[`Kennedy holding a ruler at the top while Jaylen's hand waits below, Pepper watching the ruler.`,`Jaylen pointing to his eyes and hand, Mrs. Swinea smiling.`,`April pointing to the centimeter marks on the ruler, Jaylen ready.`,`Jaylen catching the ruler, with a close-up of his thumb at the 15 cm mark.`,`Diagram: eye, then an arrow to the brain, then an arrow to the hand.`,`Christian holding a paper bag, Jaylen's hand inside, a marble drawn faintly in the bag.`,`Pepper with her ears up, a squeaky toy, and her running toward it.`,`The crew around the notebook, Pepper with the toy.`],
[`Kennedy held a ruler. "Catch it when I let go!" Jaylen got ready.`,`"My eyes and my hand do all the work," said Jaylen. "My brain does nothing." Mrs. Swinea said, "Let's find out."`,`April showed the numbers on the ruler. "Where you catch it shows how fast you react," she said. Jaylen wrote, "I will catch it fast."`,`Kennedy dropped the ruler. Jaylen caught it at 15 cm. He tried again. This time he caught it at 10 cm.`,`Your eyes **sense** the ruler falling. They send a message to your **brain**. Your brain tells your hand to squeeze. It all happens fast!`,`Christian had a mystery bag. Jaylen felt something smooth and round. His hand sent a message to his brain. "A marble!"`,`Pepper heard a squeak. Her ears went up. Her brain said, "Toy!" She ran.`,`Senses give **information**. The brain decides. The body **responds**.`],
`*Tell it again:* First, ______. Then, ______. This shows that the brain ______.

*Words to know:* **sense** · **brain** · **information** · **respond** · **reaction**

*Try it at home:* Have a friend drop a ruler. Try to catch it. Measure where you catch it. Practice and try again.`,
[`Kennedy held a ruler at the top while Jaylen waited with his thumb and finger open at the bottom. "I'm going to let go without warning," she said. "See if you can catch it." Pepper stared at the ruler with her head tilted.`,`"I don't think my brain has much to do with this," said Jaylen. "My eyes see the ruler, and my hand catches it." Mrs. Swinea smiled. "That's an interesting claim. Let's test it and see what the evidence says."`,`April pointed to the centimeter marks on the ruler. "The place where Jaylen catches it shows how quickly he responds," she explained. "A shorter distance means a faster reaction." Jaylen wrote a prediction: "I'll catch it within 10 centimeters."`,`Kennedy let go. Jaylen snapped his fingers shut, catching it at 15 centimeters. He tried again, concentrating harder, and caught it at 10 centimeters. "Practice helped," he said. April recorded both numbers.`,`Mrs. Swinea explained what had happened in that split second. His eyes **sensed** the ruler moving and sent that **information** to his **brain**. His brain processed the message and told the muscles in his hand to close. "Your brain was doing a lot of work," she said.`,`Christian held out a paper bag. Jaylen reached in without looking and felt something smooth, round, and cool. His skin sensed it, and his brain pieced the clues together. "It's a marble!" he said. "I knew it by touch."`,`Back inside, Pepper heard a squeak across the room. Her ears perked up, and her brain recognized the sound of her toy. She bounded over and grabbed it. "Animals sense, process, and respond, too," said Kennedy.`,`Jaylen grinned at the notebook. "My idea was wrong," he said. "My brain was in charge the whole time." The crew had evidence that senses collect information, the brain makes sense of it, and the body responds.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the brain ______. How does an animal use its senses to stay safe? ______

*Words to know:* **sense** · **brain** · **information** · **respond** · **reaction**

*Try it at home:* Have a friend drop a ruler while you try to catch it. Measure where you catch it. Practice, then try again. Did your response get faster?`);
b('4-ESS1-1','The Layers in the Creek Bank',
[`The crew standing by a creek, a striped bank behind them, Pepper sniffing the water's edge.`,`Kennedy pointing to the top stripe, Jaylen holding a jar.`,`A clear jar with soil, sand, gravel, and water, Mrs. Swinea pouring, April writing a prediction.`,`Two panels of the jar: freshly shaken and then settled in layers with gravel at the bottom.`,`Diagram: the settled jar with a label for oldest at the bottom and newest at the top.`,`Christian slicing a stack of colored play dough with a small shell between layers.`,`Jaylen holding a rock with a shell print, Pepper sniffing it, a small inset of a shark tooth.`,`The crew and Pepper around the notebook and the jar.`],
[`The crew walked by a creek. The bank had stripes. "What made those stripes?" asked Christian.`,`Kennedy said, "The top layer is the oldest." Jaylen said, "Let's make layers and see."`,`Mrs. Swinea gave them a jar. They added soil, sand, gravel, and water. April wrote, "The first to settle goes to the bottom."`,`They shook the jar and waited. Gravel settled first. Then sand. Then soil on top.`,`The bottom layer settled first. New layers settle on top. Rock **layers** form that way.`,`Christian made play dough layers with a shell in the middle. When he cut it, the shell was under the top layer. The shell was older.`,`Jaylen found a shell **fossil** in a rock. "This land was once under water!" said Mrs. Swinea. Pepper sniffed it.`,`Rock layers and fossils are clues. They show how land has changed.`],
`*Tell it again:* First, ______. Then, ______. This shows that the oldest layer is on the ______.

*Words to know:* **rock layer** · **fossil** · **landscape** · **evidence** · **sediment**

*Try it at home:* Shake soil, sand, and gravel in a jar of water. Let it sit. What settles first? Where is the oldest layer?`,
[`On a field trip, the crew stopped beside a creek. The steep bank behind it was striped with bands of different colors. "Those layers look like a giant sandwich," said Christian. "How did they get there?"`,`"The top layer is the oldest," Kennedy said confidently. Jaylen shook his head. "I'm not sure. Let's make layers of our own and look for evidence." Mrs. Swinea handed him a clear jar.`,`The crew added soil, sand, gravel, and water to the jar. Before shaking it, each person made a prediction. April wrote, "The heaviest pieces will sink first and end up at the bottom." Kennedy wrote, "The top layer will be the oldest."`,`Jaylen shook the jar until the water turned muddy. They watched it settle. First the gravel dropped, forming a layer at the bottom. Next came the sand, and last came the fine soil, which settled on top.`,`"The bottom layer settled first," said April. "The newest layer is on top!" Mrs. Swinea explained that rock **layers** form the same way. **Sediment** settles in layers, and the oldest layer is usually at the bottom, unless something has disturbed it.`,`Christian built another model with colored play dough, tucking a small shell between two layers. When he sliced the stack, the shell was buried in the middle. "Whatever is in the lower layers is older," he said, "like a time capsule."`,`Back at the creek, Jaylen spotted a **fossil** shell pressed into a rock. "Seashells in a creek bank?" Mrs. Swinea smiled. "This land was probably under water long ago." She told them that fossil shark teeth wash out of the cliffs at Calvert Cliffs in Maryland for the same reason.`,`Kennedy looked at her prediction and laughed. "I was wrong, and now I have evidence," she said. The crew had learned that rock layers and fossils are clues about how a landscape has changed over time.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the oldest layer is usually on the ______. What can a fossil tell us about a place? ______

*Words to know:* **rock layer** · **fossil** · **landscape** · **evidence** · **sediment**

*Try it at home:* Shake soil, sand, and gravel in a jar of water and let it settle. Predict the order of the layers first. Then draw what you see and label oldest and newest.`);

b('4-ESS2-1','The Hill and the Rain',
[`Rain falling on a grassy yard with a muddy trickle running down a hill, Christian watching from the porch, Pepper under cover.`,`Jaylen shrugging, Kennedy holding a notebook.`,`Two jars with sugar cubes, Mrs. Swinea holding one, April writing a prediction.`,`A shaken cube crumbled in the jar next to a whole cube.`,`A baking pan of dirt tilted on a book, Christian pouring water from a cup, a muddy stream flowing out the bottom.`,`A second pan with grass clippings and small rocks on the slope, and clear water running out.`,`A Chesapeake Bay shoreline with marsh grasses and a map pin, Pepper at the water's edge.`,`The crew around the notebook with the two pans.`],
[`Rain poured on Jaylen's yard. Mud ran down the hill. "Where is the dirt going?" asked Christian.`,`"Weathering and erosion are the same thing," said Jaylen. Kennedy said, "Let's test it. We need **evidence**."`,`Mrs. Swinea gave them two sugar cubes in two jars. "The cubes are like rocks." April wrote, "If we shake one, it will break."`,`They shook one jar. The cube crumbled into tiny bits. The other cube stayed whole. Breaking into pieces is **weathering**.`,`Christian tipped a pan of dirt on a book. He poured water. The dirt washed downhill. Moving the pieces away is **erosion**.`,`Kennedy put grass on a second pan. Less dirt washed away. Plants help hold the soil.`,`At the Chesapeake Bay, people plant grasses to stop shores from washing away.`,`Weathering breaks. Erosion moves.`],
`*Tell it again:* First, ______. Then, ______. This shows that weathering ______ and erosion ______.

*Words to know:* **weathering** · **erosion** · **sediment** · **vegetation** · **rate**

*Try it at home:* Pour water over a pan of dirt on a slope. Then try a pan with grass or rocks on top. Which pan loses less dirt?`,
[`A thunderstorm drenched Jaylen's yard. By the time it ended, a stream of muddy water was running down the hill and carrying dirt with it. "Where is all that soil going?" Christian asked, watching from the porch. Pepper stayed dry under the step.`,`"I think weathering and erosion are the same thing," Jaylen said. Kennedy opened her notebook. "They might be different. We need evidence." Mrs. Swinea nodded. "Let's design two tests, one for each word."`,`For the first test, Mrs. Swinea set two sugar cubes in two jars. "These stand in for rocks," she said. The crew would shake one jar and leave the other alone. April predicted, "The shaken cube will break into tiny pieces, but the still cube will stay whole."`,`Jaylen shook one jar for a full minute. The shaken cube crumbled into tiny grains, while the still cube hadn't changed. "That's **weathering**," said Mrs. Swinea. "It breaks rock into smaller pieces. Water, ice, wind, and roots can all do it."`,`For the second test, Christian tilted a baking pan of dirt on top of a book and slowly poured water over the top. Muddy water ran down the slope, and the dirt collected at the bottom. "That's **erosion**," said Mrs. Swinea. "It moves pieces from one place to another."`,`Kennedy wondered if plants made a difference. She set up a second pan with grass clippings and small rocks across the slope and poured the same amount of water. Much less dirt washed away. "Vegetation holds soil in place," she wrote, "and that slows the rate of erosion."`,`Mrs. Swinea told them that Maryland's shoreline along the Chesapeake Bay and the Potomac River is eroding, and that people plant marsh grasses to protect it. "The same idea you tested in a baking pan helps protect real land," she said.`,`Jaylen looked at the notebook. "They really are different," he said. "Weathering breaks rock down, and erosion carries the pieces away." The crew had the evidence to prove it.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that weathering ______ and erosion ______. What could slow erosion near your home? ______

*Words to know:* **weathering** · **erosion** · **sediment** · **vegetation** · **rate**

*Try it at home:* Pour the same amount of water over a pan of bare dirt and a pan with grass or rocks on a slope. Predict which will lose more dirt, then measure.`);
b('4-ESS2-2','The Mystery Map',
[`Mrs. Swinea pinning a large world map to a wall, the crew looking up, Pepper sitting in front.`,`April waving at the map, Kennedy holding stickers.`,`A list of volcano locations on a card, the crew sticking dots on the map.`,`The finished map with a ring of dots around the Pacific Ocean.`,`Simple diagram: Earth's surface divided into large pieces with dots along the edges.`,`A map close-up of long mountain ranges, such as the Andes and the Rockies, drawn as lines.`,`A terrain map of the local area with a river, a bay, and hills, Christian pointing to home.`,`The crew and Pepper around the finished map.`],
[`Mrs. Swinea hung a big map on the wall. "Look at the mountains and volcanoes. What do you notice?"`,`"They are in random places," said April. Kennedy said, "Let's test it. We can put stickers on the map."`,`Mrs. Swinea gave them a list of volcanoes. April wrote, "The stickers will be all over the place."`,`They put on the stickers. The dots made a ring around the Pacific Ocean!`,`Earth's features make **patterns**. Volcanoes and earthquakes often line up along the edges of giant plates.`,`Mountain ranges make long lines. They are not random either.`,`Christian found home on a **map** of our area. He saw the river, the bay, and the hills. Maps help us see patterns.`,`Maps show patterns in Earth's **features**.`],
`*Tell it again:* First, ______. Then, ______. This shows that mountains and volcanoes ______.

*Words to know:* **map** · **feature** · **pattern** · **mountain range** · **trench**

*Try it at home:* Look at a world map or globe. Find a mountain range and an ocean trench. What pattern do you see?`,
[`Mrs. Swinea pinned a large world map to the wall. "Today we're detectives," she said. "Look at where the mountains and volcanoes are. Do you notice anything?" Pepper sat down right in front of the map.`,`"I think they're scattered in random places," April said, waving at the map. Kennedy held up a sheet of stickers. "We can test that. If we mark where the volcanoes are, we'll see whether they're random."`,`Mrs. Swinea handed them a card with the locations of many volcanoes. The crew made predictions before placing a single dot. April wrote, "The dots will be all over the map with no pattern."`,`One by one, they placed the stickers. When they stepped back, a huge ring of dots stretched around the Pacific Ocean. "Whoa," said Jaylen. "That's definitely not random."`,`"Earth's features form **patterns**," said Mrs. Swinea. Many volcanoes, earthquakes, and deep ocean trenches line up along the edges of Earth's large plates. Scientists use maps like this one to find patterns and learn how Earth works.`,`Christian traced the mountain ranges with his finger. The Andes, the Rockies, and the Himalayas all stretched in long lines, not scattered like dust. "Mountains form patterns too," he said. Kennedy marked them with a highlighter.`,`Mrs. Swinea showed them a terrain map of their own area. Christian found the river, the Chesapeake Bay, and the hills to the west. "Maps help us describe the land we live on," she said. "City planners use them to decide where to build."`,`April looked at the finished map. "My prediction was wrong," she said, "but I learned something better." The crew had evidence that Earth's features follow patterns.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that Earth's features ______. What pattern would you look for on a map of our area? ______

*Words to know:* **map** · **feature** · **pattern** · **mountain range** · **trench**

*Try it at home:* Use a world map or globe to find volcanoes, mountain ranges, and ocean trenches. Predict a pattern, then mark the places with stickers and check.`);
b('4-ESS3-1','The Power Hunt',
[`The crew sitting in a dim room during a power outage, a flashlight on the table, Pepper curled up.`,`Kennedy pointing at a wall outlet, Mrs. Swinea drawing on a whiteboard.`,`Mrs. Swinea's diagram: a power plant, wires, and a house, with a question mark above the plant.`,`Close-up of the diagram showing a coal plant, a wind turbine, a solar panel, and a dam.`,`Index cards labeled sun, wind, water, coal, oil, and natural gas sorted into two piles.`,`Split picture: a smokestack with smoke on one side and a wind farm with a small bird on the other.`,`The lights back on, Christian cheering, a chart of energy-saving habits on the wall.`,`The crew and Pepper around the sorted cards.`],
[`The lights went out! The crew sat in the dark. "Where does our electricity come from?" asked Christian.`,`"It comes from the wall," said Kennedy. Mrs. Swinea said, "Let's follow the wires and find out."`,`Mrs. Swinea drew a map. April wrote, "A power plant makes it."`,`The map showed a power plant, wires, and a house. Power plants use **natural resources** like coal, gas, wind, water, or sunlight.`,`The crew sorted cards. Sun, wind, and water are **renewable**. They can be used again and again. Coal, oil, and gas are **nonrenewable**. They take millions of years to form.`,`Burning fuels makes smoke. It can hurt the air. Wind and solar make less smoke, but they need space.`,`The lights came on! "Thank you, power plant!" said Christian. The crew made a list of ways to save energy.`,`We get energy from natural resources. How we use them affects the **environment**.`],
`*Tell it again:* First, ______. Then, ______. This shows that our energy comes from ______.

*Words to know:* **natural resource** · **fuel** · **renewable** · **nonrenewable** · **environment**

*Try it at home:* Look around your home. Find five things that use energy. Where does each one get its energy?`,
[`A storm knocked out the power, and the whole room went dark. The crew switched on a flashlight and huddled around the table while Pepper curled up beside them. "Where does our electricity actually come from?" Christian asked.`,`"I think it just comes out of the wall," Kennedy said, pointing at the outlet. Mrs. Swinea picked up a marker. "The outlet is only the end of the story. Let's follow the wires back and find out where the energy starts."`,`Mrs. Swinea sketched a diagram on the whiteboard: a house, a long line of wires, and a large building with a question mark. April predicted, "I think a power plant makes the electricity, and the plant needs some kind of fuel."`,`"You're right," said Mrs. Swinea. She added pictures of a coal plant, a natural gas plant, a wind turbine, a solar panel, and a dam. "These all use **natural resources** to make electricity. Some burn a **fuel**, and some use wind, water, or sunlight."`,`Jaylen wrote each resource on an index card, and the crew sorted them. Sun, wind, and water went into the **renewable** pile because they can be replaced or never run out. Coal, oil, and natural gas went into the **nonrenewable** pile because they take millions of years to form.`,`"Does using these resources change the **environment**?" asked Christian. Mrs. Swinea nodded. Burning fuels releases smoke and gases into the air. Wind farms and solar fields make much less pollution, but they take up land and can affect wildlife. "Every choice has trade-offs," she said.`,`Just then, the lights flickered and came back on. Everyone cheered. The crew made a chart of ways to use less energy, such as turning off lights, unplugging chargers, and taking shorter showers. "Saving energy helps every resource last longer," April wrote.`,`Kennedy tapped her notebook. "I was wrong about the wall," she said. "The energy starts at a power plant, from natural resources." The crew had learned how energy is made and used, and that how we get it affects the world around us.`],
`*Tell it again:* First, ______. Then, ______. This shows that energy comes from ______. What is one way your family could use less energy? ______

*Words to know:* **natural resource** · **fuel** · **renewable** · **nonrenewable** · **environment**

*Try it at home:* Walk through your home and list five things that use energy. For each, find out where the energy comes from. Sort your list into renewable and nonrenewable.`);
b('4-ESS3-2','The Shake Table',
[`The crew watching a news clip on a tablet of buildings shaking, Pepper looking worried.`,`April standing tall with arms folded, Kennedy sketching three designs in a notebook.`,`Three toothpick-and-marshmallow towers on a baking sheet: one tall and skinny, one wide, one wide with triangle braces.`,`The baking sheet being shaken, the skinny tower falling and the braced tower standing.`,`Diagram: a tower with triangles highlighted and a wide base, with a label stronger shape.`,`Christian placing a block tower on a pan of gelatin, Pepper watching it wobble.`,`A family holding a checklist, a person under a table in drop, cover, and hold-on position.`,`The crew and Pepper around the three towers and the notebook.`],
[`The crew watched a video of an earthquake. Buildings shook. "How can we make buildings safer?" asked Christian.`,`April said, "A tall, heavy building is the strongest." Kennedy said, "Let's test it. We can build three designs and **compare** them."`,`Mrs. Swinea gave them marshmallows and toothpicks. Design 1: tall and skinny. Design 2: wide at the bottom. Design 3: wide with triangles. Jaylen wrote, "Design 3 will stay up."`,`They shook the baking sheet like an earthquake. Design 1 fell. Design 2 wobbled. Design 3 stayed up!`,`Triangles and wide bottoms make buildings stronger. Engineers test different **solutions** and compare them.`,`Christian built a tower on a pan of gelatin. It shook a lot! Soft ground shakes more than hard ground.`,`Scientists cannot say exactly when an earthquake will happen. That is why people plan ahead. Practice drop, cover, and hold on.`,`People can reduce harm from natural **hazards**.`],
`*Tell it again:* First, ______. Then, ______. This shows that a good design ______.

*Words to know:* **natural process** · **hazard** · **solution** · **compare** · **test**

*Try it at home:* Build two toothpick-and-marshmallow towers. Shake a baking sheet. Which tower stands up better? Why?`,
[`The crew gathered around a tablet to watch a news clip about an earthquake. Buildings swayed, and some cracked and crumbled. Pepper whimpered at the sounds. "How can people build things to stay standing in an earthquake?" Christian asked.`,`"Easy," said April, folding her arms. "The tallest, heaviest building is the strongest." Kennedy opened her notebook and began to sketch. "That's a prediction, not evidence. Let's build three designs and **compare** them."`,`Mrs. Swinea handed out marshmallows, toothpicks, and a baking sheet to act as the ground. The crew built three towers. Design 1 was tall and skinny. Design 2 had a wide base. Design 3 had a wide base and triangle braces on every side. Jaylen wrote, "Design 3 will do best because triangles don't bend easily."`,`Jaylen shook the baking sheet back and forth like an earthquake. Design 1 toppled right away. Design 2 wobbled and finally leaned over. Design 3 swayed but stayed standing. "My tall tower was the first to fall," April admitted.`,`"Triangles and wide bases make strong structures," said Mrs. Swinea. "Engineers test several **solutions**, compare the results, and choose the best one. That's how they reduce the harm from a natural **hazard**."`,`Christian built a block tower on a pan of gelatin to model soft ground. It shook much more than the towers on the baking sheet, and it tipped faster. "Soft ground can make shaking worse," said Mrs. Swinea, "so builders prepare the ground and foundations carefully."`,`Mrs. Swinea reminded them that scientists can tell where earthquakes are likely but not exactly when they will happen. "That's why planning matters," she said. The crew wrote a family plan with a meeting place and practiced drop, cover, and hold on under the table.`,`April grinned at the notebook. "My idea was wrong, but now I know how to do better," she said. The crew had evidence that design choices, like triangles, wide bases, and good planning, can reduce the harm from natural hazards.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that a good design ______. What would you change in your next try? ______

*Words to know:* **natural process** · **hazard** · **solution** · **compare** · **test**

*Try it at home:* Build two toothpick-and-marshmallow towers with different designs. Predict which will stand up better, shake a baking sheet, and compare. Then change one thing and try again.`);

b('5-PS1-1','The Disappearing Salt',
[`Christian stirring salt into a clear cup of warm water, Pepper watching the swirl.`,`Jaylen shrugging, Kennedy with a notebook.`,`Mrs. Swinea pouring salty water into a shallow dish, April placing it on a sunny windowsill.`,`The dish two days later with white salt crystals around the edge.`,`Diagram: salt dissolving with tiny dots spreading out in the water.`,`Kennedy blowing up a balloon, a lunch bag filled with air next to it.`,`Christian's dot models of a solid, a liquid, and a gas in three boxes.`,`The crew and Pepper around the dish and the model drawings.`],
[`Christian stirred salt into warm water. The salt vanished! "Where did it go?" he asked.`,`"It's gone," said Jaylen. "And air is nothing." Kennedy said, "Let's test it. We need **evidence**."`,`Mrs. Swinea poured the salt water into a dish. They set it in the sun. April wrote, "When the water is gone, nothing will be left."`,`Two days later, the water was gone. White crystals were left! "The salt was there the whole time," said April.`,`All **matter** is made of tiny **particles**. We cannot see them. The salt particles were spread out in the water.`,`Kennedy blew up a balloon. It took up space. Air is matter too! Air is a **gas** made of particles.`,`Christian drew a **model** with dots. Solid: dots packed together. Liquid: dots slide. Gas: dots spread out.`,`Matter is made of particles too small to see.`],
`*Tell it again:* First, ______. Then, ______. This shows that matter is made of ______.

*Words to know:* **matter** · **particle** · **solid, liquid, gas** · **dissolve** · **model**

*Try it at home:* Dissolve salt in warm water. Pour it in a dish and leave it in the sun. What is left when the water is gone?`,
[`Christian stirred a spoonful of salt into a glass of warm water and watched it swirl and disappear. "Where did the salt go?" he asked. Pepper watched the glass with her head tilted. "It looks like plain water now."`,`"It's just gone," Jaylen said. "Things that dissolve disappear, and air is nothing at all." Kennedy opened her notebook. "Those are claims. Let's gather evidence." Mrs. Swinea handed April a shallow dish.`,`The crew poured the salty water into the dish and set it on a sunny windowsill. April wrote her prediction: "When the water is gone, the dish will be completely empty." Everyone agreed to check on it in two days.`,`When the crew checked the dish, the water had evaporated, and a ring of white crystals was left behind. April touched one and held it up. "The salt didn't disappear," she said. "It was in the water the whole time, just too small to see."`,`Mrs. Swinea explained that all **matter** is made of **particles** too small to see, and that when salt **dissolves**, its particles spread out evenly through the water. "When the water evaporates," she said, "the particles come back together as crystals."`,`Kennedy blew up a balloon and held it up. "It takes up space," she said. "Is air matter, too?" Mrs. Swinea nodded. Air is a **gas**, made of particles that are far apart and moving freely. They fill the balloon and push on its walls.`,`Christian drew a **model** with dots to show how particles are arranged. In a solid, the dots are packed tightly in place. In a liquid, they slide past each other. In a gas, they are far apart and spread out. "A drawing can show what we can't see," he said.`,`Jaylen looked at the crystals and then at the balloon. "I thought air and dissolved stuff was nothing," he said. "But they're matter, made of particles." The crew had the evidence to prove it.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that matter is made of ______. How could you use dots to show what happens when sugar dissolves? ______

*Words to know:* **matter** · **particle** · **solid, liquid, gas** · **dissolve** · **model**

*Try it at home:* Dissolve salt in warm water, pour it into a shallow dish, and leave it in the sun. Predict what will be left, then check in a day or two. Draw a dot model of what happened.`);
b('5-PS1-2','Does It Weigh Less?',
[`An ice cube melting in a zip bag on a kitchen counter, Christian looking closely.`,`Kennedy with her arms crossed, April holding a kitchen scale.`,`A sealed bag of ice on a scale reading 85 g, Mrs. Swinea pointing.`,`The same bag after melting on the scale reading 85 g, and a cup with sugar on a scale reading 210 g twice.`,`Diagram: ice, water, and steam with the label same amount of matter in each.`,`April's bar graph with two equal bars labeled before and after.`,`A recycling bin with bottles turning into new bottles.`,`The crew and Pepper around the scale and the graph.`],
[`Kennedy's ice cube melted in a bag. "Is there less now?" asked Christian.`,`"Melting makes it weigh less," said Kennedy. April said, "Let's **measure**."`,`Mrs. Swinea sealed an ice cube in a bag. It weighed 85 grams. Kennedy wrote, "It will weigh less."`,`After it melted, the bag still weighed 85 grams. Next, they weighed a cup with a sugar cube. It weighed 210 grams. After the sugar dissolved, it still weighed 210 grams.`,`**Matter** can change form. The total **weight** stays the same. We say matter is **conserved**.`,`April made a **graph**. The "before" bar and the "after" bar were the same height.`,`Recycling works because matter is not lost. It can be used again.`,`When matter changes form, the total weight stays the same.`],
`*Tell it again:* First, ______. Then, ______. This shows that when ice melts, the weight ______.

*Words to know:* **conserved** · **weight** · **measure** · **graph** · **dissolve**

*Try it at home:* Weigh a sealed bag of ice on a kitchen scale. Let it melt. Weigh it again. What do you find?`,
[`Kennedy left an ice cube in a sealed bag on the kitchen counter, and by lunchtime it had turned into a puddle of water. "It looks like less than before," said Christian. "Did something disappear?"`,`"When ice melts, it weighs less," Kennedy said confidently. "Some of it just goes away." April picked up a kitchen scale. "That's a claim. Let's measure the weight before and after, so we have numbers." Mrs. Swinea reminded them to keep the bag sealed.`,`Mrs. Swinea put a sealed bag with an ice cube on the scale, and it read 85 grams. Kennedy wrote her prediction: "After it melts, it will weigh less than 85 grams." April set a timer so they could check every ten minutes.`,`When the ice had completely melted, the bag still weighed 85 grams. "It's exactly the same," said Christian. Then they tried a second test. A cup of water with a sugar cube weighed 210 grams, and after the sugar dissolved, it still weighed 210 grams.`,`Mrs. Swinea explained that matter can change form when it is heated, cooled, or mixed, but the total amount of matter stays the same. "We say that matter is **conserved**," she said. "The ice became water, but none of it was lost. Dissolving works the same way."`,`April made a bar **graph** with a bar for before and a bar for after in each test. Both pairs of bars were the same height. "The graph is our evidence," she said. Jaylen added a note: "We can only see this if nothing escapes the bag."`,`Mrs. Swinea told them that recycling and pollution tracking depend on the idea that matter is never lost. Recycled bottles become new bottles, and scientists follow where pollution goes because it doesn't vanish.`,`Kennedy looked at the graph. "I thought it would weigh less," she said. "But the weight stayed the same." The crew had evidence that matter is conserved when it melts or dissolves.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that matter is ______ when it changes form. Why did we keep the bag sealed? ______

*Words to know:* **conserved** · **weight** · **measure** · **graph** · **dissolve**

*Try it at home:* Weigh a sealed bag with an ice cube on a kitchen scale. Predict the weight after it melts, then check. Make a bar graph of before and after.`);
b('5-PS1-3','The Mystery Powders',
[`Mrs. Swinea setting out five cups of white powder labeled A to E, Pepper sniffing from a distance.`,`April pointing at the cups, Kennedy writing in a notebook.`,`A tray with cups, spoons, magnifying glasses, and cups of water, with a do-not-taste sign.`,`A results chart with columns for look, feel, and dissolves, five rows of checkmarks.`,`Diagram: a material with labeled properties such as color, hardness, and dissolves.`,`A tray of objects being tested: a nail, a penny, aluminum foil, wood, and a small tub of water for float and sink.`,`A steel bridge, a glass window, and a rubber boot in a small collage.`,`The crew and Pepper around the chart.`],
[`Mrs. Swinea set out five white powders in cups. "What are they?" asked Christian. "We never taste."`,`"I can tell what they are by looking," said April. Kennedy said, "Let's test their **properties**."`,`They looked, felt, and stirred each powder into water. April wrote, "They all look the same, so they are the same."`,`All five looked white. Three dissolved in water. Two made cloudy water. One felt squeaky. One felt soft.`,`A **property** is something you can see or test. Different **materials** have different properties.`,`They tested a nail, a penny, foil, and wood. A magnet picked up the nail. Wood floated. The penny sank.`,`Engineers choose materials by their properties. Steel is strong for bridges. Glass lets in light.`,`Properties help us tell materials apart.`],
`*Tell it again:* First, ______. Then, ______. This shows that we can tell materials apart by their ______.

*Words to know:* **property** · **material** · **conductor** · **dissolve** · **magnetic**

*Try it at home:* Test a few white powders from your kitchen. Do not taste. Look, feel, and stir each into water. Which are alike? Which are different?`,
[`Mrs. Swinea set five cups of white powder on the table, each labeled with a letter from A to E. "These are all common kitchen powders," she said. "Your job is to find out how they're different. And remember, we never taste anything in science." Pepper sniffed from a safe distance.`,`"They all look the same," April said. "So I bet we can just look at them and know what they are." Kennedy opened her notebook. "Looking is one test, but properties can be different even when things look alike. Let's try a few." Jaylen handed out magnifying glasses.`,`The crew planned three tests: look closely with a magnifying glass, rub a pinch between their fingers, and stir a spoonful into a cup of water. April wrote her prediction: "All five powders will act the same, because they all look the same."`,`The results showed differences. A, B, and D dissolved and made clear water. C and E turned the water cloudy, and the powder slowly sank. C felt squeaky between their fingers, while E felt soft and fluffy. "They aren't the same at all," said Christian. Kennedy filled in the chart.`,`Mrs. Swinea explained that a **property** is a feature you can observe or test, like color, hardness, whether it **dissolves**, or whether it is attracted to a magnet. "Scientists identify a **material** by testing several properties, because one property is often not enough." She handed over the answer key so the crew could match the labels.`,`To practice, Jaylen tested a tray of objects: a steel nail, a penny, a piece of aluminum foil, and a wooden stick. The magnet picked up only the nail. The wood floated, and the penny and nail sank. Christian noted that the metal spoon felt colder to the touch because it is a good **conductor** of heat.`,`Mrs. Swinea told them that engineers choose materials by their properties. Steel is strong, so it is used for bridges. Glass is hard and clear, so it is used for windows. Rubber is flexible and waterproof, so it is used for boots. "The right material for the job depends on its properties," she said.`,`April looked at the chart. "I was wrong," she said. "They looked alike, but their properties were different." The crew had learned that testing several properties is the best way to identify a material.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that materials can be identified by their ______. Which property was most helpful, and why? ______

*Words to know:* **property** · **material** · **conductor** · **dissolve** · **magnetic**

*Try it at home:* Test a few white kitchen powders without tasting them. Look, feel, and stir each into water. Make a chart of what you find, then sort the powders into groups.`);
b('5-PS1-4','The Fizz Test',
[`Jaylen's cup of fizzing baking soda and vinegar on a tray, Pepper barking at the bubbles, Mrs. Swinea nearby.`,`Kennedy with her chin up, April with a notebook.`,`Three trays: sugar and water, salt and pepper, and baking soda and vinegar, each with a label.`,`Three panels: sugar dissolved in water, salt and pepper still separate grains, and the fizzing cup with bubbles.`,`Diagram: two substances combining into a new substance and gas with labels bubbles, color change, heat.`,`Two cups with steel wool, one in water and one in vinegar, with orange rust on the second.`,`Cookie dough on a tray next to a baked cookie, a warning sign about mixing cleaners.`,`The crew and Pepper around the tray and notebook.`],
[`Jaylen mixed baking soda and vinegar in a cup. Fizz! Pepper barked at the bubbles. "What happened?" he asked.`,`"Any time you mix two things, you make something new," said Kennedy. April said, "Let's test it."`,`They mixed sugar and water. Then salt and pepper. Then baking soda and vinegar. Kennedy wrote, "All three will make something new."`,`Sugar and water: the sugar dissolved. Nothing new. Salt and pepper: both were still there. Baking soda and vinegar: bubbles!`,`Sometimes mixing makes a new **substance**. Here, a **gas** formed. Bubbles, a color change, or heat can be signs.`,`They put steel wool in vinegar. After three days, orange rust grew. Rust is a new substance.`,`Baking cookies makes new substances too. Never mix cleaners at home. They can make harmful gas.`,`Some mixtures make new substances. Some do not.`],
`*Tell it again:* First, ______. Then, ______. This shows that mixing can ______.

*Words to know:* **mixture** · **substance** · **reaction** · **gas** · **evidence**

*Try it at home:* With a grown-up, mix baking soda and vinegar in a cup. Compare with sugar in water. Which one made something new?`,
[`Jaylen stirred a spoonful of baking soda into a cup of vinegar, and the cup erupted in a hissing foam of bubbles. Pepper barked at it and backed away. "What just happened?" Jaylen asked. Mrs. Swinea stood nearby to keep an eye on the tray.`,`"Any time you mix two things together, you make something brand new," Kennedy said. April opened her notebook. "That's a claim. Let's test a few mixtures and look for evidence." Christian lined up three trays.`,`The crew planned three tests: sugar and water, salt and pepper, and baking soda and vinegar. They agreed to look for signs of a new substance, such as bubbles, a color change, or heat. Kennedy wrote her prediction: "All three mixtures will make something new."`,`In the first tray, the sugar dissolved, and nothing new formed: no bubbles, no color change, and no heat. The salt and pepper stayed as separate grains that they could pick apart. Only the baking soda and vinegar fizzed and made bubbles. "Two out of three didn't make anything new," said April.`,`Mrs. Swinea explained that when substances mix and a **reaction** happens, new **substances** form that have different properties from the originals. The bubbles were a **gas** that hadn't been there before. "In the other mixtures, the substances just combined," she said. "You could separate them again."`,`Christian set up a longer test. He put steel wool in two cups, one with water and one with vinegar. After three days, the steel wool in vinegar was covered in orange rust, and the other had only a little. "Rust is a new substance," said Mrs. Swinea, "and it formed more quickly with vinegar."`,`Mrs. Swinea told them that baking cookies, rusting nails, and even digesting food all involve new substances forming. She warned that some household cleaners react dangerously, and should never be mixed. "Knowing the difference keeps you safe," she said.`,`Kennedy looked at her prediction and laughed. "I thought every mixture would make something new," she said. "But only some of them did." The crew had evidence of which mixtures made new substances.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that a new substance formed when ______. What signs would you look for? ______

*Words to know:* **mixture** · **substance** · **reaction** · **gas** · **evidence**

*Try it at home:* With a grown-up nearby, mix baking soda and vinegar in a cup and compare it with sugar stirred into water. Record the signs you see, then decide which one made something new.`);
b('5-PS2-1','Which Way Is Down?',
[`Christian dropping a pencil that falls to the floor, Pepper watching it.`,`Jaylen pointing to a globe and shrugging, April with a clipboard.`,`A plumb line made from a string and a washer taped to a doorway, Kennedy writing a prediction.`,`Three panels: the plumb line hanging straight in the kitchen, upstairs, and the garage, with arrows pointing down.`,`Diagram: Earth with an arrow labeled gravity pointing to the center from several places.`,`A globe with little figures standing on every side and arrows pointing toward the center.`,`A builder holding a plumb line against a wall.`,`The crew and Pepper around the plumb line.`],
[`Christian dropped his pencil. It fell to the floor. "Why does everything fall down?"`,`Jaylen said, "Down is only down for us. People on the other side of Earth would fall off." April said, "Let's get **evidence**."`,`They made a plumb line from a string and a washer. Kennedy wrote, "It will point down."`,`In every room, it pointed straight down. A ball fell down. Water poured down.`,`**Gravity** is a **force** that pulls things toward the **center** of Earth. "Down" means toward the ground, wherever you are.`,`Mrs. Swinea showed a globe. She stuck small figures on every side. Arrows pointed to the center. Everyone has "down" toward the ground.`,`Builders use plumb lines to keep walls straight.`,`Gravity pulls toward the center of Earth.`],
`*Tell it again:* First, ______. Then, ______. This shows that gravity pulls ______.

*Words to know:* **gravity** · **force** · **direction** · **center** · **evidence**

*Try it at home:* Tie a washer to a string and hang it in a few rooms. Which way does it point?`,
[`Christian's pencil rolled off the edge of the desk and clattered onto the floor. Pepper pounced on it. "Everything falls down," he said. "But why? And what does 'down' even mean?"`,`"Down is just the direction toward our floor," said Jaylen, turning a globe in his hands. "If you lived on the other side of the world, you'd fall off." April picked up a clipboard. "That's a claim. Let's collect evidence from different places."`,`The crew made a plumb line by tying a washer to a string and taping the other end to a doorframe. Kennedy wrote her prediction: "It will point toward the floor." Mrs. Swinea suggested hanging it in three different spots in the house.`,`In the kitchen, the string hung straight down. Upstairs, the washer pointed straight down at the floor. In the garage, same thing. They also dropped a ball and poured a cup of water, and both moved toward the ground. "Everything points toward the ground," said Christian.`,`Mrs. Swinea explained that **gravity** is a **force** that pulls objects toward the **center** of Earth, so "down" means toward the ground wherever you stand. Earth is round, but gravity always pulls toward the middle. "Your plumb line is a great piece of evidence," she said.`,`She pointed to the globe and stuck small paper figures on the top, the bottom, and the sides. Then she drew an arrow from each figure toward the center. "Everyone is pulled toward the ground," she said. "Nobody falls off, because 'down' is always toward the center of Earth."`,`Mrs. Swinea told them that builders use plumb lines and levels to make sure walls stand straight, and engineers account for gravity in every bridge, building, and rocket. "Gravity is always at work," she said.`,`Jaylen looked at the globe. "I thought 'down' was different for people on the other side," he said. "But it's toward the ground for everybody." The crew had evidence that gravity pulls toward the center of Earth.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that gravity pulls ______. Why do people on the other side of Earth not fall off? ______

*Words to know:* **gravity** · **force** · **direction** · **center** · **evidence**

*Try it at home:* Hang a washer on a string in three places. Predict which way it will point, then check. Draw an arrow showing the direction of gravity.`);
b('5-PS3-1','Lunch From the Sun',
[`Christian holding a slice of pizza at lunch, Pepper looking up at him.`,`April shrugging, Kennedy with a notebook.`,`A list of pizza ingredients: crust, cheese, and sauce, with a question mark above each.`,`A path of arrows: sun to wheat to crust, sun to grass to cow to cheese, sun to tomato to sauce.`,`Diagram: sun with an arrow to plants and then arrows to animals and people.`,`The crew doing jumping jacks, sweating a little, a thermometer in an inset.`,`Pepper eating dog food, a faint line back to a field and the sun.`,`The crew and Pepper around the food chain map.`],
