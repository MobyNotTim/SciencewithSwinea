They can send and decode a simple message and explain why one pattern worked better than another.

**Common mix-up**

Kids often think a code is only for secrets. A code is any pattern that the sender and receiver both agree on.`);
g('4-LS1-1','Structures That Help Living Things Survive',`*At school we're practicing: arguing from evidence*

**What your child is learning**

Plants and animals have body parts, inside and out, that do important jobs. A bird's beak helps it eat, a cactus's thick stem stores water, and a heart pumps blood. Students make arguments about how a structure helps a living thing survive, grow, and reproduce.

**Before and after**

- **Before:** In first grade, students learned how plant and animal parts help them survive.
- **After:** In middle school they study how cells, tissues, and body systems work together.

**Why it matters in real life**

Engineers copy nature's structures to solve problems. Velcro was inspired by burrs, and airplane wings by birds. Doctors and veterinarians rely on knowing how structures work.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| structure | A part of a living thing |
| function | The job a part does |
| internal | On the inside |
| external | On the outside |
| survive | To stay alive |

**Try it at home**

- **Beak challenge (20 min, tweezers, a spoon, a clothespin, chopsticks, small foods like rice or cereal, a cup of water):** Try picking up each food with each tool. Which tool works best for which food?
- **Plant parts snack (10 min, carrot, celery, lettuce, broccoli):** Name which part of the plant you are eating: root, stem, leaf, or flower.
- **Structure and job (20 min, outdoors or a book):** Pick an animal or plant. Name three parts and the job each one does.

**Talk about it**

- What is this part, and what is its job?
- How does it help the animal or plant survive?

**You'll know they've got it when...**

They can point to a body part and explain how it helps the living thing survive, grow, or reproduce.

**Common mix-up**

Kids often think only animals have structures. Plants have them too. Roots, stems, leaves, and flowers each have a job.`);
g('4-LS1-2','Senses, Brain, and Response',`*At school we're practicing: using a model*

**What your child is learning**

Animals get information about the world through their senses. The brain then processes that information, and the animal responds. Students use a model to show how information moves from senses to the brain to an action.

**Before and after**

- **Before:** In first grade, students learned that animals use their body parts to sense the world around them.
- **After:** In middle school they learn how nerve cells carry signals and how the brain interprets them.

**Why it matters in real life**

Drivers, athletes, and pilots all depend on quick responses to what they sense. Doctors test senses and reflexes to check on how the nervous system works.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| sense | A way of taking in information: sight, hearing, smell, taste, touch |
| brain | The body part that makes sense of information |
| information | Facts about the world around you |
| respond | To act in answer to something |
| reaction | A quick response to something |

**Try it at home**

- **Mystery bag (10 min, a paper bag, small household items):** Reach in without looking and guess each item by touch. What clues did your hands give your brain?
- **Five senses walk (10 min, outdoors):** Notice one thing you see, hear, smell, and feel. How does your body respond?
- **Ruler catch (15 min, a ruler):** One person drops a ruler. The other catches it. Measure where it was caught. Practice and compare. Which senses and body parts were part of the response?

**Talk about it**

- What did your senses notice? What did your brain decide?
- How would an animal use its senses to find food or stay safe?

**You'll know they've got it when...**

They can describe the path from sense to brain to response in a real example.

**Common mix-up**

Kids often think the eyes and ears do all the work. They collect information, but the brain makes sense of it.`);
g('4-ESS1-1','Rock Layers and Changing Landscapes',`*At school we're practicing: finding evidence in patterns*

**What your child is learning**

Rock layers and the fossils inside them are clues to how a place has changed over a very long time. Layers at the bottom usually formed first. A seashell fossil on a mountain tells us that area may once have been under water. Students use these patterns as evidence.

**Before and after**

- **Before:** In 2nd and 3rd grade, students learned that Earth changes slowly and quickly and that fossils tell about long-ago life.
- **After:** In middle school they learn about the geologic time scale and how scientists date rocks and fossils.

**Why it matters in real life**

Geologists read rock layers to find water, fuel, and building stone, and to understand past climates and hazards. Builders study layers to know what is safe to build on.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| rock layer | A band of rock that formed in one period of time |
| fossil | The remains or marks of a living thing from long ago, preserved in rock |
| landscape | The land and its features, like hills, rivers, and shores |
| evidence | Clues that help explain what happened |
| sediment | Small bits of sand, mud, or rock that settle |

**Try it at home**

- **Sediment jar (20 min, a jar with a lid, soil, sand, gravel, water):** Shake it up and let it sit. What settles first? Where is the oldest material?
- **Layer model (20 min, play dough in different colors, a small shell or toy):** Stack layers with an item between them. Slice the stack and read it from bottom to top.
- **Find the layers (20 min, a road cut, creek bank, or photos):** Look for stripes in the rock. What might have happened to make each one?

**Talk about it**

- Which layer is oldest? How can you tell?
- If you found a seashell fossil far from the ocean, what might that tell you?

**You'll know they've got it when...**

They can use rock layers and fossils as clues to explain that the land has changed over time.

**Common mix-up**

Kids often think the top layer is the oldest. Usually the bottom layer formed first and newer layers settled on top.`);

g('4-ESS2-1','Weathering and Erosion',`*At school we're practicing: planning and carrying out investigations*

**What your child is learning**

Water, ice, wind, and plants slowly break rock into smaller pieces (weathering) and carry those pieces away (erosion). Students make observations and measurements to see how fast these changes happen and what slows them down.

**Before and after**

- **Before:** In 2nd grade, students compared ways to keep wind and water from changing the land.
- **After:** In 5th grade they model how Earth's land, water, air, and living things interact. In middle school they study how these processes shape Earth's surface over long periods.

**Why it matters in real life**

Erosion shapes riverbanks, beaches, and farmland. People plant grass and trees, build walls, and design drainage to protect homes and soil. Along the Chesapeake Bay and Potomac River, shoreline erosion is a real concern.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| weathering | Breaking rock into smaller pieces |
| erosion | Moving broken rock and soil from one place to another |
| sediment | Small bits of sand, mud, or rock |
| vegetation | Plants growing in an area |
| rate | How fast something happens |

**Try it at home**

- **Sugar cube shake (15 min, sugar cubes, two jars with lids, water):** Shake one cube in a jar with water for one minute. Leave another cube in water without shaking. Compare. What did the shaking do?
- **Rain on a hill (30 min, a pan of dirt tilted on a book, a cup of water, grass clippings or small rocks; outdoors or in a sink):** Slowly pour water over bare dirt. Then try again with plants or rocks on top. Compare how much dirt washed away.
- **Ice power (overnight, a plastic cup filled to the brim, a freezer):** Mark the water level and freeze it. What happened to the ice? How could that crack a rock?

**Talk about it**

- What changed? What caused it?
- What slowed the erosion down?

**You'll know they've got it when...**

They can explain that weathering breaks rock apart while erosion moves it away, and give an example like running water or ice.

**Common mix-up**

Kids often use weathering and erosion as the same word. Weathering breaks rock down. Erosion carries the pieces away.`);
g('4-ESS2-2','Patterns in Earth\u2019s Features',`*At school we're practicing: analyzing data from maps*

**What your child is learning**

Mountains, volcanoes, earthquakes, and ocean trenches are not scattered at random. They form patterns around the world, and maps help us see them. Students look at maps and describe the patterns they find.

**Before and after**

- **Before:** In 2nd grade, students learned that maps show the shapes and kinds of land and water.
- **After:** In middle school they learn how moving plates in Earth's crust explain these patterns.

**Why it matters in real life**

City planners, builders, and emergency managers use maps of Earth's features to decide where to build and how to prepare for earthquakes and volcanoes.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| map | A picture of an area that shows where things are |
| feature | A part of the land or sea, like a mountain or river |
| pattern | Something that repeats in a way you can count on |
| mountain range | A long line of mountains |
| trench | A deep, narrow valley on the ocean floor |

**Try it at home**

- **Map treasure hunt (20 min, an atlas or online map):** Find mountain ranges, volcanoes, and ocean trenches. Where are they? What do you notice about where they line up?
- **Dot the map (30 min, a world map, stickers or dots):** Mark volcanoes or earthquake locations from a book or website. What shape do the dots make?
- **Local features (15 min, a terrain map of our area):** Find rivers, hills, and the Chesapeake Bay. How would you describe the land around us?

**Talk about it**

- What patterns do you see on this map?
- Why might volcanoes and earthquakes happen in the same places?

**You'll know they've got it when...**

They can look at a map and describe a pattern, such as mountain ranges lining up or volcanoes circling an ocean.

**Common mix-up**

Kids often think volcanoes, mountains, and earthquakes are scattered randomly. They tend to line up along the edges of Earth's plates.`);
g('4-ESS3-1','Energy and Natural Resources',`*At school we're practicing: obtaining and combining information*

**What your child is learning**

The energy that powers homes, cars, and schools comes from natural resources like coal, oil, natural gas, wind, water, and sunlight. How we get and use these resources affects the environment. Students gather information from different sources and put it together.

**Before and after**

- **Before:** In earlier grades, students learned that people use natural resources and can affect the land, water, and air.
- **After:** In 5th grade they study how communities protect resources. In middle school they evaluate the trade-offs of different energy sources.

**Why it matters in real life**

Choices about energy affect electric bills, air quality, jobs, and the planet. Families and communities decide how to save energy and which sources to use.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| natural resource | Something from nature that people use |
| fuel | A material burned to make heat or power |
| renewable | Can be replaced or never runs out, like sun and wind |
| nonrenewable | Takes millions of years to form, like coal and oil |
| environment | Everything around living things |

**Try it at home**

- **Energy hunt (20 min, paper):** Walk through your home and list five things that use energy. Where does each one get its energy from?
- **Sort the sources (15 min, index cards or paper):** Write coal, oil, natural gas, sun, wind, and water on cards. Sort them into renewable and nonrenewable.
- **Save-energy week (7 days, a chart):** Pick two habits, like turning off lights or unplugging chargers. Check them off each day and talk about the results.

**Talk about it**

- Where does the electricity in our home come from?
- How might using this resource affect the environment?

**You'll know they've got it when...**

They can name a few natural resources we use for energy and describe one way using them affects the environment.

**Common mix-up**

Kids often think electricity just comes from the outlet. It is made somewhere else, using resources like gas, coal, wind, water, or sunlight.`);
g('4-ESS3-2','Reducing the Impact of Natural Hazards',`*At school we're practicing: generating and comparing solutions*

**What your child is learning**

Earthquakes, volcanoes, floods, and storms are natural processes that can hurt people and damage buildings. Engineers and communities design ways to reduce that harm. Students come up with several solutions, then compare them using what they learn from testing.

**Before and after**

- **Before:** In 3rd grade, students judged solutions for weather hazards.
- **After:** In middle school they study how hazards are mapped and forecast and how communities reduce risk.

**Why it matters in real life**

Building codes, earthquake-resistant bridges, flood walls, and warning systems save lives. Families use the same thinking when they make an emergency plan.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| natural process | Something that happens in nature, like an earthquake or flood |
| hazard | Something that can cause harm |
| solution | An idea or tool that fixes a problem |
| compare | To look at how things are alike and different |
| test | To try it out and see if it works |

**Try it at home**

- **Shake-proof tower (30 min, marshmallows and toothpicks, or spaghetti and tape, a baking sheet):** Build a tower, then shake the sheet like an earthquake. Build a second design and compare which stood up better.
- **Jello earthquake (30 min, a pan of gelatin, blocks or small boxes):** Build on the gelatin and gently shake the pan. What helps buildings stay up?
- **Safety practice (10 min, nothing needed):** Practice what to do in an emergency: drop, cover, and hold on, or go to your family meeting place.

**Talk about it**

- Which design held up best? Why do you think so?
- What would you change in your next try?

**You'll know they've got it when...**

They can describe two different ways to reduce harm from a hazard and explain which one worked better and why.

**Common mix-up**

Kids often think scientists can predict exactly when an earthquake will happen. Scientists can tell where they are likely, but not exactly when.`);

g('5-PS1-1','Matter Is Made of Tiny Particles',`*At school we're practicing: building and using models*

**What your child is learning**

Everything around us, including solids, liquids, and gases like air, is matter, and matter is made of particles too small to see. Students build models, like drawings with dots, to show how particles are arranged and why things like air and dissolved sugar still count as matter even when we cannot see them.

**Before and after**

- **Before:** In 2nd grade, students described and sorted materials by their properties and saw that heating and cooling can change them.
- **After:** In middle school they learn about atoms and molecules and how they combine.

**Why it matters in real life**

Cooking, cleaning, medicine, and making new materials all depend on how tiny particles behave. Scientists who design new plastics, fuels, and medicines work at the particle level.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| matter | Anything that takes up space and has weight |
| particle | A piece of matter too small to see |
| solid, liquid, gas | The three common states of matter |
| dissolve | To mix into a liquid so evenly that you cannot see the pieces |
| model | A drawing or object that shows how something works |

**Try it at home**

- **Salt comes back (10 min to start, then 1-2 days; salt, warm water, a shallow dish):** Dissolve salt in warm water, pour it in the dish, and leave it in a sunny spot. What is left when the water is gone?
- **Air is matter (10 min, a balloon, a lunch bag):** Fill a balloon and a paper bag with air. How do you know air takes up space?
- **Dot models (15 min, paper):** Draw how particles look in a solid, a liquid, and a gas. How do the dots differ?

**Talk about it**

- What do you think is happening to the salt when it disappears into water?
- How does your drawing show particles in a solid compared with a gas?

**You'll know they've got it when...**

They can use a particle drawing to explain why air is matter and why dissolved sugar or salt is still there.

**Common mix-up**

Kids often think air is nothing. Air is a gas made of particles. It takes up space and has weight.`);
g('5-PS1-2','Matter Is Conserved',`*At school we're practicing: measuring and graphing*

**What your child is learning**

When matter is heated, cooled, or mixed, it can change form, but the total amount of matter stays the same. Ice that melts weighs exactly what the ice weighed. Students measure and graph to prove it.

**Before and after**

- **Before:** In 2nd grade, students saw that some changes, like melting and freezing, can be undone.
- **After:** In middle school they use this idea, called conservation of mass, to explain chemical reactions.

**Why it matters in real life**

Chemists, cooks, and recyclers rely on the idea that matter is never lost, only moved or changed. It is why scientists can track pollution and why recycling programs can reuse materials.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| conserved | Stays the same in total |
| weight | How heavy something is |
| measure | To find out how heavy, long, or how much |
| graph | A picture that shows data |
| dissolve | To mix into a liquid so evenly that you cannot see the pieces |

**Try it at home**

- **Melting ice (15 min, a kitchen scale, ice in a sealed zip bag):** Weigh the sealed bag. Let the ice melt. Weigh again. What do you find?
- **Sugar and water (15 min, a kitchen scale, a cup, water, a sugar cube):** Weigh the cup, water, and cube. Stir until the sugar dissolves. Weigh again.
- **Make a graph (15 min, paper):** Make a bar graph of your before and after weights.

**Talk about it**

- What did the scale show before and after?
- What does your graph tell us about the matter?

**You'll know they've got it when...**

They can use measurements to show that the total weight stays the same when something melts, freezes, or dissolves.

**Common mix-up**

Kids often think an object weighs less after it melts or dissolves because it disappears. The matter is still there, just in a different form.`);
g('5-PS1-3','Identifying Materials by Their Properties',`*At school we're practicing: planning and carrying out investigations*

**What your child is learning**

Different materials have different properties, like color, hardness, whether they dissolve in water, whether they are attracted to magnets, and whether heat or electricity passes through them. Students design tests to figure out what a material is.

**Before and after**

- **Before:** In 2nd grade, students described and sorted materials by their properties.
- **After:** In middle school they identify pure substances by their properties and study how they interact.

**Why it matters in real life**

Engineers choose materials by their properties, like steel for strength and glass for transparency. Scientists, police labs, and recycling plants identify materials by testing properties.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| property | A feature you can observe or test, like color or hardness |
| material | What something is made of |
| conductor | A material that lets heat or electricity pass through easily |
| dissolve | To mix into a liquid so evenly that you cannot see the pieces |
| magnetic | Pulled by a magnet |

**Try it at home**

- **Mystery powders (20 min, flour, baking soda, cornstarch, salt, sugar, spoons, cups of water; do not taste):** Compare how each looks and feels. Stir a spoonful of each into water. Which dissolve? Which do not?
- **Float or sink (15 min, a tub of water, small household objects):** Predict, then test. Sort by float or sink.
- **Property sort (10 min, five household objects):** Sort by shiny, bendy, magnetic, or waterproof. Which properties help you decide what an object is made of?

**Talk about it**

- What properties did you test? What did each test tell you?
- Which test was most helpful for telling two materials apart?

**You'll know they've got it when...**

They can name several properties and explain which test helped them identify a material.

**Common mix-up**

Kids often identify materials by looks alone. Different materials can look alike, like white powders, so scientists test several properties.`);
g('5-PS1-4','Mixing and New Substances',`*At school we're practicing: planning and carrying out investigations*

**What your child is learning**

Sometimes mixing two or more substances only combines them, like sugar in water. Other times it makes a brand-new substance with different properties, like baking soda and vinegar making gas bubbles. Students test mixtures and look for signs of new substances.

**Before and after**

- **Before:** Earlier this year, students studied properties of matter and how to identify materials.
- **After:** In middle school they study chemical reactions and how atoms rearrange to form new substances.

**Why it matters in real life**

Cooking, baking, cleaning, and making medicines all rely on substances that react. Knowing the difference between mixing and reacting helps people stay safe, such as not mixing certain cleaners.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| mixture | Two or more substances put together |
| substance | A single kind of matter |
| reaction | A change that makes new substances |
| gas | Matter that spreads out to fill its space, like air |
| evidence | What you see or measure that shows something is true |

**Try it at home**

- **Fizz test (15 min, baking soda, vinegar, a cup, a tray; outdoors or in a sink):** Mix a spoonful of baking soda with a splash of vinegar. What do you see and hear? Compare this with sugar stirred into water.
- **Steel wool rust (10 min to start, then daily for a few days; steel wool, vinegar, water, two cups):** Put steel wool in each cup, one with water and one with vinegar. Check daily. Rust is a new substance.
- **Kitchen chemistry (10 min, a baking recipe):** Compare the dough before baking with the cookie after. Which properties changed?

**Talk about it**

- Did something new form? What is your evidence?
- How is this mixing different from sugar and water?

**You'll know they've got it when...**

They can tell a mixture that only combines from a mixture that makes something new, and point to evidence such as bubbles, color change, or heat.

**Common mix-up**

Kids often think any time you mix two things you make something new. Many mixtures, like salt and pepper, just combine and can be separated again.`);
g('5-PS2-1','Gravity Pulls Down',`*At school we're practicing: arguing from evidence*

**What your child is learning**

Gravity is a force that pulls objects toward the center of Earth. No matter where you are on Earth, "down" means toward the ground. Students collect evidence and build an argument for the direction gravity pulls.

**Before and after**

- **Before:** In 3rd grade, students studied balanced and unbalanced forces.
- **After:** In middle school they learn that gravity depends on how much matter objects have and how far apart they are.

**Why it matters in real life**

Builders use gravity to make sure walls stand straight, using tools like plumb lines and levels. Engineers account for gravity in bridges, rockets, and amusement park rides.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| gravity | A force that pulls things toward Earth |
| force | A push or a pull |
| direction | The way something points or moves |
| center | The middle |
| evidence | What you see or measure that shows something is true |

**Try it at home**

- **Plumb line (15 min, string, a washer or nut, tape):** Hang the weight from a doorframe and let it settle. Which way does it point? Check it in different rooms.
- **Drop and toss (10 min, a ball or soft toys; indoors on a soft floor or outdoors):** Drop an object, then toss one up. Where does each end up? What does this tell you about gravity?
- **Pouring (5 min, a cup of water, a sink):** Tilt the cup. Which way does the water go?

**Talk about it**

- Which direction did everything fall? What does that tell us?
- Why do people on the other side of the world not fall off?

**You'll know they've got it when...**

They can explain that gravity pulls things toward the center of Earth and support it with what they saw.

**Common mix-up**

Kids often think "down" is the same direction everywhere. Gravity pulls toward the center of Earth, so "down" is toward the ground wherever you stand.`);

g('5-PS3-1','Food Energy Comes From the Sun',`*At school we're practicing: building and using models*

**What your child is learning**

Animals, including people, use the energy in food to grow, repair their bodies, move, and stay warm. That energy started as sunlight. Plants capture the sun's energy to make food, and animals get that energy by eating plants or by eating animals that ate plants. Students make models that trace energy back to the sun.

**Before and after**

- **Before:** In 4th grade, students learned that energy moves from place to place and changes form.
- **After:** In middle school they learn how photosynthesis and food break-down store and release energy.

**Why it matters in real life**

Farmers, nutritionists, and athletes all rely on understanding where food energy comes from and what it does in the body. It also explains why energy from the sun supports nearly all life on Earth.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| energy | The ability to make things move, heat up, or change |
| food chain | A line showing who eats what |
| producer | A living thing, like a plant, that makes its own food using sunlight |
| consumer | A living thing that eats other living things |
| model | A drawing or object that shows how something works |

**Try it at home**

- **Back to the sun (15 min, paper):** Pick a favorite meal, like a burger, cereal, or pizza. Draw arrows from the food back to the plants it came from, then to the sun.
- **What is energy for? (10 min, nothing needed):** List the jobs your body uses food energy for: growing, healing, moving, and staying warm. Give an example of each.
- **Warm-up test (10 min, nothing needed):** Do 20 jumping jacks. How do your body and breathing change? What is food energy being used for?

**Talk about it**

- Where did the energy in your lunch start?
- What would happen to the food chain if the sun stopped shining?

**You'll know they've got it when...**

They can draw a food chain with arrows that trace energy all the way back to the sun and tell what the body uses it for.

**Common mix-up**

Kids often think food energy starts at the grocery store, or with the animal. It starts with sunlight captured by plants.`);
g('5-LS1-1','What Plants Need to Grow',`*At school we're practicing: arguing from evidence*

**What your child is learning**

Plants build their bodies mostly from air and water, not from soil. They take in carbon dioxide from the air and water through the roots, and use sunlight to turn them into food and building material. Students collect evidence to support this idea.

**Before and after**

- **Before:** In 2nd grade, students learned that plants need sunlight and water to grow.
- **After:** In middle school they study photosynthesis in detail, including how plants make sugar.

**Why it matters in real life**

Farmers, gardeners, and scientists who design food for space missions all depend on knowing what plants need. Understanding plant growth also helps us see how forests and plants affect the air we breathe.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| plant | A living thing that makes its own food using sunlight |
| carbon dioxide | A gas in the air that plants take in |
| water | A liquid plants take in through their roots |
| soil | The dirt where many plants grow |
| evidence | What you see or measure that shows something is true |

**Try it at home**

- **Seed in water (10 min to start, then watch for a week or two; a bean seed, a jar, a wet paper towel, water):** Grow a bean seed in a jar with only a wet paper towel and no soil. What grows? What does that tell you?
- **Celery drinks (20 min to start, then overnight; celery, water, food coloring):** Stand celery in colored water. What do you see in the stem and leaves?
- **Leaf bag (15 min to start, then a day; a clear plastic bag, string, a leafy plant outdoors):** Tie the bag around a leafy branch. What collects inside later? Where did it come from?

**Talk about it**

- Where do you think most of a plant's body comes from?
- What does your experiment show?

**You'll know they've got it when...**

They can explain that plants get most of what they need to grow from air and water, and use evidence to say so.

**Common mix-up**

Kids often think plants eat soil. Most of a plant's body comes from air and water. Soil gives small amounts of minerals and support.`);
g('5-LS2-1','How Matter Moves in an Ecosystem',`*At school we're practicing: building and using models*

**What your child is learning**

In an ecosystem, matter moves in a cycle. Plants take in matter from air, water, and soil. Animals eat plants or other animals. Decomposers, like fungi and bacteria, break down dead plants and animals and return nutrients to the soil. Students make models that show these movements.

**Before and after**

- **Before:** In 3rd grade, students learned that animals and plants survive in certain habitats.
- **After:** In middle school they study how energy and matter cycle through food webs and how ecosystems change.

**Why it matters in real life**

Gardeners use compost to turn scraps into rich soil. Scientists who study forests, farms, and oceans track how matter moves to keep ecosystems healthy.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| ecosystem | All the living and nonliving things in an area and how they interact |
| producer | A living thing, like a plant, that makes its own food |
| consumer | A living thing that eats other living things |
| decomposer | A living thing that breaks down dead plants and animals |
| matter | Anything that takes up space and has weight |

**Try it at home**

- **Rot watch (10 min to start, then weekly; a clear jar with a lid, soil, a few leaves, a bit of fruit scrap):** Keep the lid closed and do not open it. Draw what changes each week.
- **Leaf litter hunt (20 min, outdoors):** Look under logs and leaves. Which decomposers or signs of rotting do you find?
- **Draw the loop (20 min, paper):** Draw how matter moves from plant to animal to decomposer to soil and back to plant.

**Talk about it**

- Where does a fallen leaf go?
- What would happen to the forest if there were no decomposers?

**You'll know they've got it when...**

They can draw a loop that shows plants, animals, decomposers, and the environment passing matter along.

**Common mix-up**

Kids often think dead things just disappear. Decomposers break them down and return nutrients to the soil, where plants use them again.`);
g('5-ESS1-1','Why Stars Look Different',`*At school we're practicing: arguing from evidence*

**What your child is learning**

The Sun is a star, and it looks much brighter than other stars because it is much closer to us. Stars that look dim are very far away. Students collect evidence about how distance changes how bright a light looks.

**Before and after**

- **Before:** In first grade, students noticed patterns in the sky, like the Sun, Moon, and stars.
- **After:** In middle school they study the scale of the solar system and the galaxy.

**Why it matters in real life**

Astronomers use brightness and distance to learn about stars and to find planets around them. The same idea explains why a car's headlights look brighter as the car gets closer.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| star | A huge ball of hot gas that makes its own light |
| Sun | The star closest to Earth |
| brightness | How bright something looks |
| distance | How far away something is |
| evidence | What you see or measure that shows something is true |

**Try it at home**

- **Light distance test (15 min, two identical flashlights or phone lights, a dark room or hallway):** Hold one close and have someone hold the other far away. Which looks brighter? Now move them closer or farther.
- **Headlight watch (10 min, evening; an adult nearby):** Watch car headlights from far away and as they approach. How does their brightness change?
- **Night sky walk (20 min, outdoors at night, an optional star app):** Find the brightest stars. Talk about why some look brighter than others.

**Talk about it**

- If two lights are the same, why can one look brighter?
- Why does the Sun look so much brighter than all the other stars?

**You'll know they've got it when...**

They can explain that the Sun is a star and looks brightest because it is the closest, backed up by a light-distance test.

**Common mix-up**

Kids often think the Sun is a different kind of object than the stars, or that it is brightest because it is the biggest. It looks brightest because it is closest.`);

g('5-ESS1-2','Shadows, Day and Night, and Seasonal Stars',`*At school we're practicing: representing data in graphs*

**What your child is learning**

Shadows get longer and shorter and change direction during the day. Day and night happen because Earth spins. Some stars can be seen only in certain seasons because Earth moves around the Sun. Students record data and graph it to find these patterns.

**Before and after**

- **Before:** In first grade, students noticed that the amount of daylight changes through the year.
- **After:** In middle school they build models of how Earth, the Sun, and the Moon move and cause seasons and phases.

**Why it matters in real life**

Sundials were the first clocks. Farmers, sailors, and builders have long used the sky to tell time and seasons, and solar panels are placed to follow the sun's path.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| shadow | A dark area made when something blocks light |
| rotate | To spin around |
| orbit | To travel around something in a path |
| season | One of four parts of the year |
| pattern | Something that repeats in a way you can count on |

**Try it at home**

- **Shadow stick (a few minutes each hour for a day, a stick or yardstick, chalk or paper, a sunny day):** Stand the stick in the sun. Mark the tip of its shadow each hour. Which way does it point in the morning? At noon? In the afternoon? Never look directly at the Sun.
- **Day length graph (15 min, a sunrise and sunset website, paper):** Look up daylight hours for each month and make a graph. When is it longest and shortest?
- **Seasonal stars (20 min, outdoors at night, an optional star app):** Find a constellation tonight, such as Orion in winter. Look again in a few months. Is it still there?

**Talk about it**

- What pattern do you see in the shadow marks?
- Why does it get dark at night?

**You'll know they've got it when...**

They can use their data or graph to describe how shadows and daylight change, and explain that Earth's spin causes day and night.

**Common mix-up**

Kids often think the Sun moves across the sky. It looks that way because Earth is spinning.`);
g('5-ESS2-1','Earth\u2019s Four Spheres Interact',`*At school we're practicing: building and using models*

**What your child is learning**

Earth has four connected systems: the geosphere (rock, soil, and land), the hydrosphere (water), the atmosphere (air), and the biosphere (living things). They affect each other all the time. Rain can wash away soil, and plant roots can break rock. Students build a model showing one example.

**Before and after**

- **Before:** In 4th grade, students studied how water, ice, wind, and plants change the land.
- **After:** In middle school they study the water cycle and how energy from the Sun drives Earth's systems.

**Why it matters in real life**

Farmers, city planners, and emergency managers think about how land, water, air, and living things affect each other, such as how a flood can change a forest or how trees can cool a city.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| geosphere | Earth's rock, soil, and land |
| hydrosphere | All of Earth's water |
| atmosphere | The layer of air around Earth |
| biosphere | All living things on Earth |
| interact | To affect each other |

**Try it at home**

- **Four spheres hunt (20 min, outdoors):** Pick one spot, like a puddle or a tree. Find an example of land, water, air, and living things there.
- **Rain on a hill (20 min, a tilted pan of dirt with a small plant, a cup of water):** Pour water over the soil. What moves? How does the plant help?
- **Model it (20 min, paper):** Draw a tree and show how it interacts with all four spheres.

**Talk about it**

- Which sphere affects which? How can you tell?
- What would change if one sphere changed, like less rain?

**You'll know they've got it when...**

They can use a drawing or model to show at least two spheres affecting each other.

**Common mix-up**

Kids often think land, water, air, and living things work separately. They are always affecting each other.`);
g('5-ESS2-2','Where Earth\u2019s Water Is',`*At school we're practicing: analyzing and graphing data*

**What your child is learning**

About 97% of Earth's water is salty ocean water. Only about 3% is fresh water, and most of that is frozen in glaciers and ice caps or underground. Very little is in lakes and rivers. Students describe and graph how water is divided up.

**Before and after**

- **Before:** In 2nd grade, students learned where water is found on Earth and in what forms.
- **After:** In middle school they study the water cycle and how people use and protect water supplies.

**Why it matters in real life**

People depend on a small share of Earth's water for drinking, farming, and industry. Cities, farmers, and engineers plan around how much fresh water is available.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| reservoir | A place where a large amount of water is stored |
| salt water | Water with salt in it, like the ocean |
| fresh water | Water with very little salt, like most lakes and rivers |
| glacier | A huge, slow-moving mass of ice |
| groundwater | Water stored underground |

**Try it at home**

- **Gallon model (20 min, a gallon jug of water, a measuring cup):** Let the jug stand for all of Earth's water. Pour out about half a cup. That is roughly the fresh water. Most of that half cup is frozen or underground.
- **Graph it (15 min, graph paper, a book or website for approximate figures):** Make a bar graph of oceans, glaciers and ice, and groundwater and other fresh water.
- **Water at home (10 min, paper):** List ways your family uses fresh water in a day. Pick one way to use less.

**Talk about it**

- Why is only a small part of Earth's water available for us to drink?
- What does your graph tell us about how we should use water?

**You'll know they've got it when...**

They can tell that most water is salty, that most fresh water is frozen or underground, and show it on a graph.

**Common mix-up**

Kids often think there is plenty of fresh water because Earth looks so blue. Most water is salty, and most fresh water is frozen or underground.`);
g('5-ESS3-1','Communities Protect Earth\u2019s Resources',`*At school we're practicing: obtaining and combining information*

**What your child is learning**

Communities use science ideas to protect natural resources and the environment. They conserve water and energy, recycle, reduce pollution, protect habitats, and plan how land is used. Students research real examples and combine information from different sources.

**Before and after**

- **Before:** In 4th grade, students learned that energy and fuels come from natural resources and that using them affects the environment.
- **After:** In middle school they weigh the benefits and costs of how people use resources and manage the environment.

**Why it matters in real life**

Clean water, healthy soil, and clean air depend on choices made by families, schools, businesses, and governments. Local efforts, like cleaning up waterways, add up to big results.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| conserve | To use less so there is more for later |
| resource | Something from nature that people use |
| recycle | To turn used materials into new things |
| pollution | Harmful stuff in the air, water, or land |
| community | A group of people who live or work together |

**Try it at home**

- **Local effort hunt (20 min, a computer or phone):** Look up a recycling, cleanup, or conservation program in our county or school. What problem does it solve? How does it use science?
- **Home resource check (15 min, paper):** Look at water, trash, and energy use at home. Choose one change to try for a week.
- **Mini campaign (30 min, poster paper):** Make a poster that teaches others one way to protect a resource.

**Talk about it**

- What resource is this effort protecting? How does it work?
- What is one thing our family could do?

**You'll know they've got it when...**

They can describe a real community effort to protect a resource and explain the science idea behind it.

**Common mix-up**

Kids often think only governments can protect the environment. Families, schools, and neighborhoods make a difference too.`);

function inl(s){s=esc(smart(s));s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');s=s.replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<em>$2</em>');return s}
function plain(s){return smart(s).replace(/\*/g,'').replace(/_{3,}/g,'blank')}
function cells(r){return r.replace(/^\||\|\s*$/g,'').split('|').map(function(c){return c.trim()})}
function table(rows){var h=cells(rows[0]);var body=rows.slice(2).map(cells);
  return '<div class="tscroll"><table class="t"><thead><tr>'+h.map(function(x){return '<th>'+inl(x)+'</th>'}).join('')+'</tr></thead><tbody>'+body.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inl(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function md(src){var L=src.replace(/\r/g,'').split('\n'),o=[],i=0,sp=/^(\||- |\d+\. |### )/;
  while(i<L.length){var ln=L[i];
    if(!ln.trim()){i++;continue}
    if(/^\|/.test(ln)){var rows=[];while(i<L.length&&/^\|/.test(L[i])){rows.push(L[i]);i++}o.push(table(rows));continue}
    if(/^- /.test(ln)){var it=[];while(i<L.length&&/^- /.test(L[i])){it.push(L[i].slice(2));i++}o.push('<ul>'+it.map(function(x){return '<li>'+inl(x)+'</li>'}).join('')+'</ul>');continue}
    if(/^\d+\. /.test(ln)){var it2=[];while(i<L.length&&/^\d+\. /.test(L[i])){it2.push(L[i].replace(/^\d+\. /,''));i++}o.push('<ol>'+it2.map(function(x){return '<li>'+inl(x)+'</li>'}).join('')+'</ol>');continue}
    if(/^### /.test(ln)){o.push('<h3>'+inl(ln.slice(4))+'</h3>');i++;continue}
    var p=[ln];i++;while(i<L.length&&L[i].trim()&&!sp.test(L[i])){p.push(L[i]);i++}
    var t=p.join(' ').trim();
    if(/^\*\*[^*]+\*\*$/.test(t))o.push('<h4 class="sec">'+inl(t.slice(2,-2))+'</h4>');else o.push('<p>'+inl(t)+'</p>');}
  return o.join('')}

function bindFair(){var g=document.getElementById('tgame');if(!g)return;
  var sc=document.getElementById('tscore'),rs=document.getElementById('treset');
  function build(){var tot=FAIR_TESTS.length,done=0,good=0;sc.textContent='';rs.hidden=true;g.innerHTML='';
    FAIR_TESTS.forEach(function(t,i){var box=document.createElement('div');box.className='qq';var wrong=false,solved=false;
      box.innerHTML='<p class="qtext"><strong>'+(i+1)+'.</strong> '+inl(t[0])+'</p><div class="opts two"></div><p class="fb" aria-live="polite"></p>';
      var opts=box.querySelector('.opts'),fb=box.querySelector('.fb');
      [['Testable',true],['Not testable',false]].forEach(function(o){var bt=document.createElement('button');bt.type='button';bt.className='opt';bt.textContent=o[0];
        bt.addEventListener('click',function(){if(solved)return;
          if(o[1]===t[1]){solved=true;bt.classList.add('right');bt.textContent='\u2713 '+o[0];fb.textContent='Correct! '+smart(t[2]);fb.className='fb ok';
            opts.querySelectorAll('.opt').forEach(function(b){b.disabled=true});done++;if(!wrong)good++;
            if(done===tot){sc.textContent='You got '+good+' of '+tot+' on the first try.';rs.hidden=false}}
          else{wrong=true;bt.classList.add('wrong');bt.disabled=true;bt.textContent='\u2717 '+o[0];fb.textContent='Not quite. Try the other one.';fb.className='fb no'}
        });opts.appendChild(bt)});
      g.appendChild(box)})}
  rs.addEventListener('click',build);build()}

        else if(p[4]==='guides')html=p[5]?vGuide(gr,qn,p[5]):vGuides(gr,qn);
        else if(p[4]==='vocab')html=vVocab(gr,qn);
        else if(p[4]==='reading')html=p[5]?vBook(gr,qn,p[5]):vReading(gr,qn);
        else if(p[4]==='home')html=vHome(gr,qn);
        else html=vMissing('/g/'+gr);
      } else html=vMissing('/g/'+gr);
    } else html=vMissing('/');
  }catch(e){html=vMissing('/');console.error(e)}
  document.body.setAttribute('data-page',pg);if(gr)document.body.setAttribute('data-g',gr);else document.body.removeAttribute('data-g');
  root.innerHTML=html;
  var hd=root.querySelector('h1');document.title=(hd?hd.textContent+' | ':'')+'Mrs. Swinea\u2019s Science Lab';
  window.scrollTo(0,0);
  var f=root.querySelector('h1[tabindex]');if(f&&cur!==null)f.focus({preventScroll:true});cur=h;

}

function bindQuiz(id){var Z=QUIZ[id],body=document.getElementById('qzbody');if(!Z||!body)return;
  var sc=document.getElementById('qzscore'),rs=document.getElementById('qzreset');
  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
  function build(){var tot=Z.length,done=0,good=0;sc.textContent='';rs.hidden=true;body.innerHTML='';
    Z.forEach(function(q,qi){var box=document.createElement('div');box.className='qq';var wrong=false,solved=false;
      box.innerHTML='<p class="qtext"><strong>'+(qi+1)+'.</strong> '+inl(q[0])+'</p><div class="opts"></div><p class="fb" aria-live="polite"></p>';
      var opts=box.querySelector('.opts'),fb=box.querySelector('.fb');
      shuffle(q[1]).forEach(function(o){var bt=document.createElement('button');bt.type='button';bt.className='opt';bt.textContent=smart(o);
        bt.addEventListener('click',function(){if(solved)return;
          if(o===q[1][0]){solved=true;bt.classList.add('right');bt.textContent='\u2713 '+smart(o);fb.textContent='Correct! '+smart(q[2]);fb.className='fb ok';
            opts.querySelectorAll('.opt').forEach(function(b){b.disabled=true});done++;if(!wrong)good++;
            if(done===tot){sc.textContent='You got '+good+' of '+tot+' on the first try.';rs.hidden=false}}
          else{wrong=true;bt.classList.add('wrong');bt.disabled=true;bt.textContent='\u2717 '+smart(o);fb.textContent='Not quite. Look back at the story and try another answer.';fb.className='fb no'}
        });opts.appendChild(bt)});
      body.appendChild(box)})}
  rs.addEventListener('click',build);build()}
