[`At lunch, Christian bit into a slice of pizza. "Where does the **energy** in my lunch come from?" he asked.`,`"It starts at the grocery store," said April. Kennedy said, "Let's trace the food back."`,`They listed the parts of the pizza: crust, cheese, and sauce. April wrote, "Each one starts at a store."`,`The crust is made from wheat. Wheat is a plant that uses sunlight. The cheese is made from milk. A cow made the milk. The cow ate grass. Grass uses sunlight! The sauce is made from tomatoes, a plant that uses sunlight.`,`Plants capture energy from the sun. Animals get that energy by eating plants or by eating animals that ate plants. Food energy started as sunlight.`,`The crew did jumping jacks. Their bodies got warm. Bodies use food energy to move, to stay warm, to grow, and to heal.`,`Pepper's dog food came from grain and meat. Her energy started with the sun too.`,`The energy in our food began as sunlight.`],
`*Tell it again:* First, ______. Then, ______. This shows that the energy in food began ______.

*Words to know:* **energy** · **food chain** · **producer** · **consumer** · **model**

*Try it at home:* Pick a favorite meal. Draw arrows from each food back to the plants it came from, and then to the sun.`,
[`At lunch, Christian took a big bite of pizza and then paused. "I wonder where all the **energy** in this slice comes from," he said. Pepper stared up at him, hoping for a crust. "Is it from the pizza itself?"`,`"It starts at the grocery store," April said. "That's where food comes from." Kennedy opened her notebook. "The store is where we buy it, but where did the energy start? Let's trace each ingredient back as far as we can."`,`The crew listed the three parts of the pizza: crust, cheese, and sauce. Mrs. Swinea suggested drawing a **food chain** for each one, with an arrow pointing from the food to whatever eats it. April wrote her prediction: "Every ingredient will end at a farm or a store."`,`The crust came from wheat, a plant that uses sunlight to grow. The cheese came from milk, made by a cow that ate grass, which also uses sunlight. The sauce came from tomatoes, another plant. "Every chain leads to a plant," said Christian, "and every plant needs the sun."`,`Mrs. Swinea explained that plants are **producers**, because they use sunlight to make their own food. Animals are **consumers**, because they get energy by eating plants or animals that ate plants. "The energy in your pizza began as sunlight," she said.`,`Jaylen led the crew in twenty jumping jacks. Afterward their cheeks were flushed and their bodies felt warm. Mrs. Swinea told them that the body uses food energy to move, to stay warm, to grow, and to repair itself. "That's why a cut heals," she said. "Your body needs energy to rebuild."`,`Christian noticed Pepper's bowl. Dog food is made from grains and meat, so her energy traces back to plants and the sun, too. Mrs. Swinea told them that farmers and nutritionists use food chains to understand how energy flows through living things.`,`April smiled at the map. "I thought it started at the store," she said. "But it started in the sun." The crew built a model that traced the energy in their lunch all the way back.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the energy in food began ______. What would happen to the food chain if the sun stopped shining? ______

*Words to know:* **energy** · **food chain** · **producer** · **consumer** · **model**

*Try it at home:* Choose one meal and draw a food chain for each food in it, ending at the sun. Label what the body uses food energy for.`);

b('5-LS1-1','The Bean in the Bag',
[`Jaylen watering a pot of bean plants on a sunny porch, Christian looking at the dirt, Pepper nearby.`,`Jaylen holding up a spoonful of soil, April with her notebook.`,`A zip bag with a damp paper towel and a bean seed taped to a window.`,`The same bag a week later with roots, a stem, and two small leaves, no soil in sight.`,`A drawing of a willow tree in a pot with two scales showing soil weight almost unchanged and tree weight much larger.`,`Diagram: a plant with arrows labeled water, air carbon dioxide, and sunlight pointing into it.`,`A stalk of celery standing in blue-colored water with a blue line up the stem.`,`The crew and Pepper around the bag and the celery.`],
[`Jaylen watered his bean plants. Christian asked, "Where does the plant get the stuff it grows from?"`,`"Plants eat soil," said Jaylen. April said, "Let's test it. We need **evidence**."`,`They put a bean seed in a bag with a wet paper towel. No soil! Jaylen wrote, "It will not grow."`,`A week later, the bean had roots, a stem, and two small leaves. It grew with no soil!`,`Mrs. Swinea told them about a scientist who grew a tree in a pot. The tree grew very big. The soil weighed almost the same.`,`Plants take in **water** with their roots. They take in **carbon dioxide** from the air. Sunlight helps them build their bodies.`,`Kennedy put celery in blue water. Blue lines climbed up the stem. The water moves up!`,`Plants get most of what they need to grow from air and water.`],
`*Tell it again:* First, ______. Then, ______. This shows that plants get what they need from ______.

*Words to know:* **plant** · **carbon dioxide** · **water** · **soil** · **evidence**

*Try it at home:* Grow a bean in a bag with a wet paper towel and no soil. Draw it each day.`,
[`Jaylen watered the bean plants on his porch, and Christian watched the water soak into the soil. "These plants have grown so much," said Christian. "Where does all of that new plant come from?" Pepper flopped down in the sun.`,`"They eat the soil," Jaylen said, holding up a spoonful of dirt. "That's how plants get bigger." April opened her notebook. "That's a claim. Let's design a test, and let's see what the evidence says." Mrs. Swinea handed out zip bags.`,`The crew placed a bean seed and a damp paper towel inside a zip bag and taped it to a sunny window. There was no soil in it. Jaylen wrote his prediction: "The seed will not grow without soil." Kennedy added a ruler so they could measure the sprout.`,`After a week, the seed had split open, and the bag held a root, a stem, and two small leaves. "It's growing, and there's no soil!" said Christian. Kennedy measured the stem and recorded it in her notebook.`,`Mrs. Swinea told them about a famous experiment. Hundreds of years ago, a scientist grew a small willow tree in a weighed pot of soil for five years, giving it only water. The tree grew by more than a hundred pounds, but the soil lost almost no weight. "So where did the tree's weight come from?" she asked.`,`She drew a diagram on the board. Plants take in **water** through their roots and **carbon dioxide** from the air through their leaves. Using energy from sunlight, they build their roots, stems, and leaves from these materials. "Most of a plant's body is built from air and water," she said. Soil gives small amounts of minerals and support.`,`Kennedy stood a stalk of celery in blue-colored water. After a few hours, blue lines climbed up the stem and into the leaves. "That's the water moving up," said April. "The plant pulls it up from the roots."`,`Jaylen looked at the bag and then at the diagram. "I thought they eat dirt," he said. "But the bean grew without any." The crew had evidence that plants get most of what they need to grow from air and water.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that plants get most of what they need from ______ and ______. What does the soil do for a plant? ______

*Words to know:* **plant** · **carbon dioxide** · **water** · **soil** · **evidence**

*Try it at home:* Grow a bean seed in a zip bag with a damp paper towel and no soil. Predict what will happen, then measure and draw the seedling every day.`);
b('5-LS2-1','The Rot Jar',
[`Christian kneeling by a pile of old leaves, the bottom layer dark and crumbly, Pepper sniffing the pile.`,`Kennedy shrugging, April with a clipboard.`,`A clear jar with soil, a few leaves, and an apple slice, with the lid sealed and a label.`,`The jar two weeks later: a dark soft apple, thin leaves, and a darker layer of soil.`,`Diagram: a mushroom, a worm, and tiny bacteria with arrows pointing to soil nutrients.`,`A loop: plant to animal to decomposer to soil to plant.`,`A compost bin in a garden with a gardener turning it.`,`The crew and Pepper around the jar and the loop.`],
[`Christian found a pile of old leaves. The ones at the bottom were turning to dirt. "Where did the leaves go?" he asked.`,`"Dead things just disappear," said Kennedy. April said, "Let's test it."`,`They sealed leaves, an apple slice, and soil in a jar. They drew it. Kennedy wrote, "It will stay the same."`,`Two weeks later, the apple was soft and dark. Fuzzy mold grew. The leaves were thin. The soil was darker. The dead things did not disappear. They changed.`,`**Decomposers** like fungi, bacteria, and worms break down dead things. They put nutrients back into the soil.`,`Plants take up the nutrients. Animals eat the plants. **Matter** moves in a loop.`,`Christian drew the loop. Gardeners make compost to help it along.`,`Decomposers help matter move through an **ecosystem**.`],
`*Tell it again:* First, ______. Then, ______. This shows that decomposers ______.

*Words to know:* **ecosystem** · **producer** · **consumer** · **decomposer** · **matter**

*Try it at home:* Look under leaves or logs outside. Find signs of decay. Draw the loop from plant to animal to decomposer to soil.`,
[`Christian poked a stick into a thick pile of old leaves at the edge of the yard. The ones on top were still crisp, but the leaves at the bottom had crumbled into dark, damp soil. "Where did the bottom leaves go?" he asked. Pepper sniffed at the pile and sneezed.`,`"Dead things just disappear," Kennedy said. "That's what happens when something dies." April picked up a clipboard. "That's a claim. Let's make a small model of a rotting pile and see what happens over a few weeks." Mrs. Swinea found a clear jar.`,`The crew put soil, a handful of leaves, and an apple slice in the jar and sealed the lid tightly. Mrs. Swinea reminded them not to open it once mold started to grow. Kennedy wrote her prediction: "The leaves and the apple will stay exactly the same." Christian drew the jar so they could compare it later.`,`Two weeks later, the apple slice was soft, dark, and covered in fuzzy mold. The leaves were thin and lacy, and the soil looked darker. "They didn't disappear," said April. "They changed into something else." Christian drew the new jar next to his first drawing.`,`Mrs. Swinea explained that **decomposers**, such as fungi, bacteria, and worms, break down dead plants and animals. As they do, they release nutrients into the soil. "Decomposers recycle matter," she said. "Without them, dead leaves and animals would pile up forever."`,`Jaylen drew a model on the whiteboard: a plant takes in nutrients and water from the soil, an animal eats the plant, and when either dies, decomposers return the nutrients to the soil. The cycle begins again. "**Matter** keeps moving through the **ecosystem**," said Mrs. Swinea.`,`Christian saw a gardener turning a compost bin. "That's the same idea," Mrs. Swinea said. "Gardeners speed up decomposition on purpose, so that kitchen scraps and leaves turn into rich soil for new plants."`,`Kennedy studied the jar and nodded. "I thought things just vanished," she said. "But decomposers turn them into nutrients for plants." The crew had evidence that matter moves in a cycle among plants, animals, decomposers, and the environment.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that decomposers ______. What would happen to a forest with no decomposers? ______

*Words to know:* **ecosystem** · **producer** · **consumer** · **decomposer** · **matter**

*Try it at home:* Look under leaves or logs outside for signs of decay and decomposers. Draw a loop that shows plants, animals, decomposers, and soil passing matter along.`);
b('5-ESS1-1','Same Flashlights, Different Distance',
[`The crew in the backyard at dusk looking at the first stars, a bright Sun setting behind them, Pepper beside them.`,`April pointing at the sunset, Kennedy with a notebook.`,`Two identical flashlights, one held close and one at the far end of a hallway, Mrs. Swinea nearby.`,`Two panels: the near flashlight looks big and bright, the far one looks small and dim, then both look similar after the far one moves closer.`,`Diagram: the Sun close to Earth and several stars far away with dotted lines showing distance.`,`A long line showing Earth, the Sun, and the next closest star far off the page, with a note about four years of light travel.`,`Car headlights far down a dark road looking small and bright when near.`,`The crew and Pepper around the flashlights.`],
[`At dusk, the crew saw the first stars. They looked like tiny dots. "The Sun is so bright," said Christian. "Why are stars so dim?"`,`"The Sun is not a star," said April. "It's something else." Kennedy said, "Let's test it. We need **evidence**."`,`Mrs. Swinea gave them two flashlights that were exactly the same. Jaylen held one close. Kennedy walked far away with the other. April wrote, "They will look the same."`,`The close light looked big and bright. The far light looked small and dim. When Kennedy walked closer, it got brighter.`,`**Distance** changes how bright a light looks. The Sun is a **star**. It looks brightest because it is the closest.`,`Other stars look dim because they are very far away. Light from the next closest star takes more than four years to get here.`,`Car headlights look small when they are far away. They look bright when they are close.`,`The Sun looks brighter because it is closer.`],
`*Tell it again:* First, ______. Then, ______. This shows that things look dimmer when they are ______.

*Words to know:* **star** · **Sun** · **brightness** · **distance** · **evidence**

*Try it at home:* Use two flashlights that are the same. Put one close and one far away in a dark room. Which looks brighter?`,
[`As the sun set, the crew sat on the back steps and watched the first stars blink on. They looked like tiny pinpricks of light. "The Sun is blinding in the daytime," said Christian, "but the stars are barely there. Why is that?" Pepper stretched out beside them.`,`"I don't think the Sun is a star," April said. "It's a different kind of thing, and that's why it's so bright." Kennedy flipped open her notebook. "That's a claim. Let's design a test using two lights that are exactly alike."`,`Mrs. Swinea gave the crew two identical flashlights. Jaylen held one a few feet away, and Kennedy walked to the far end of the hallway with the other. April wrote her prediction: "Both flashlights will look about the same, because they are the same kind."`,`In the dim hallway, the close flashlight looked big and bright, and the far flashlight looked small and dim. Then Kennedy walked toward them, and her light slowly grew brighter. "Same flashlight, different distance," said Christian. "That's amazing."`,`Mrs. Swinea explained that the Sun is a **star**, an ordinary one, and it looks so bright because it is the closest star to Earth. Other stars look dim because they are very far away. "How bright a light **appears** depends on both how bright it is and how far away it is," she said.`,`She drew a long line on the board, with Earth at one end and the Sun very close to it. The next closest star was off the edge of the board. "Its light takes more than four years to reach us," she said. "Some stars are brighter than the Sun, but they are so far that they look like tiny dots."`,`Christian remembered a car on a dark road. From far away, its headlights looked like two small dim dots, and as it got closer, they became bright and blinding. "It's the same idea," he said. "The closer the light, the brighter it looks."`,`April looked at the flashlight data. "I thought the Sun was something different," she said. "But it's a star that's just close." The crew had evidence that distance changes how bright a light looks.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the Sun looks brighter because ______. What would happen to the Sun's brightness if it were much farther away? ______

*Words to know:* **star** · **Sun** · **brightness** · **distance** · **evidence**

*Try it at home:* Use two matching flashlights or phone lights in a dark room. Hold one close and put the other far away. Predict which looks brighter, then test it and move the far one closer.`);

b('5-ESS1-2','The Shadow Stick',
[`Kennedy pointing at a tree's long morning shadow and a shorter afternoon shadow in two panels, Pepper lying in the shade.`,`Jaylen pointing up at the Sun (with sunglasses on), April holding chalk.`,`A yardstick standing in a schoolyard with chalk marks at the tip of its shadow every hour.`,`Chalk marks in an arc: long in the morning, shortest at noon, long again on the other side.`,`A lamp and a spinning globe with a sticker on our town and dark and light halves.`,`April's line graph of hours of daylight by month, high in June and low in December.`,`The night sky in winter with Orion and in summer with the Summer Triangle.`,`The crew and Pepper around the shadow chart.`],
[`Kennedy looked at the tree's shadow in the morning. It was long. In the afternoon, it was short and pointed a different way. "Why did the shadow change?" she asked.`,`"The Sun moves across the sky," said Jaylen. April said, "Let's collect **data**." Mrs. Swinea said, "Never look straight at the Sun."`,`They stood a yardstick in the ground. Every hour they marked the tip of its shadow with chalk. April wrote, "The shadow will change."`,`The shadows were long in the morning. They were shortest at noon. Then they were long again, on the other side.`,`Mrs. Swinea used a lamp and a globe. She spun the globe. Our town went from light to dark. The Sun seems to move because Earth **rotates**.`,`April made a **graph** of daylight. Summer days are long. Winter days are short.`,`Different stars show up in different **seasons**. Orion is a winter star. Earth moves around the Sun, so the night sky changes.`,`Earth spins. That gives us day and night.`],
`*Tell it again:* First, ______. Then, ______. This shows that day and night happen because Earth ______.

*Words to know:* **shadow** · **rotate** · **orbit** · **season** · **pattern**

*Try it at home:* Stand a stick in the sun. Mark the tip of its shadow every hour. Never look straight at the Sun.`,
[`Kennedy noticed that the shadow of the big oak tree was long and stretched toward the west in the morning. By afternoon, it was shorter and pointed in a different direction. "Why did the shadow change?" she wondered. Pepper lay down in the shade of the tree.`,`"The Sun moves across the sky," Jaylen said, squinting up with sunglasses on. "That's why the shadows move." April picked up a piece of chalk. "That's a claim. Let's collect data." Mrs. Swinea reminded everyone never to look straight at the Sun.`,`The crew stood a yardstick in the ground and marked the tip of its shadow with chalk every hour from morning to afternoon. April predicted, "The shadow will change as the day goes on." Kennedy kept a list of the times so they could graph the results later.`,`The chalk marks formed a clear pattern. In the morning, the shadow was long and pointed one way. Around noon, it was at its shortest. In the afternoon, it grew long again and pointed the opposite way. "It's the same pattern as the tree," said Christian.`,`Mrs. Swinea set a lamp on the table and held up a globe with a sticker on their town. When she spun the globe slowly, the sticker moved from the lit side into the dark. "Earth **rotates**, or spins, once a day," she said. "That causes day and night and makes the Sun appear to move across the sky."`,`April made a line **graph** of the hours of daylight each month. The line was highest in June, with about fifteen hours, and lowest in December, with about nine and a half. "Earth's tilt as it moves around the Sun changes our daylight through the year," said Mrs. Swinea. That is why we have **seasons**.`,`That night, the crew looked at the sky. Mrs. Swinea showed them Orion, a winter constellation, and told them that the Summer Triangle is easiest to see in summer. As Earth **orbits** the Sun, we face different parts of the sky at night. "The stars you see change with the seasons," she said.`,`Jaylen looked at the shadow chart and the globe. "I thought the Sun was moving," he said. "But it's Earth that's spinning." The crew had graphs and models showing the patterns of shadows, day and night, and the stars.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that Earth ______ and that is why ______. Why do we see different stars in winter and summer? ______

*Words to know:* **shadow** · **rotate** · **orbit** · **season** · **pattern**

*Try it at home:* Stand a stick in the sun and mark the tip of its shadow every hour on a sunny day. Graph the length of the shadow. Never look straight at the Sun.`);
b('5-ESS2-1','The Puddle Detective',
[`A puddle in the yard after rain with an earthworm nearby, Christian crouched beside it, Pepper splashing at the edge.`,`Kennedy shrugging, April with a notebook.`,`A baking pan of dirt tilted on a book with a small plant at the top, Mrs. Swinea holding a cup of water.`,`Four panels: water running down the dirt, soil moving, roots holding soil near the plant, and the puddle shrinking in the sun.`,`Diagram: four circles labeled geosphere, hydrosphere, atmosphere, and biosphere with arrows between them.`,`A tree with roots in soil, rain, wind, and birds in the branches.`,`A farmer's field with a river, hills, and weather clouds.`,`The crew and Pepper around the puddle and the model.`],
[`After the rain, Christian found a puddle. A worm wiggled on the sidewalk. "How are the water, the dirt, the air, and the worm connected?" he asked.`,`"They all work separately," said Kennedy. April said, "Let's test it."`,`Mrs. Swinea tipped a pan of dirt with a small plant on it. She told them the four spheres: **geosphere** (land), **hydrosphere** (water), **atmosphere** (air), and **biosphere** (living things). Kennedy wrote, "Changing one will not change the others."`,`They poured water on the dirt. The water moved the soil. The plant's roots held some in place. Later, the puddle got smaller. The water went into the air.`,`The four spheres **interact**. They change each other all the time.`,`A tree has roots in the soil. It takes in water. It gives off water vapor to the air. Birds live in its branches.`,`Farmers and city planners think about all four spheres.`,`Earth's spheres affect each other.`],
`*Tell it again:* First, ______. Then, ______. This shows that the spheres ______.

*Words to know:* **geosphere** · **hydrosphere** · **atmosphere** · **biosphere** · **interact**

*Try it at home:* Find a puddle or a plant outside. Name one example of land, water, air, and living things there. How do they affect each other?`,
[`The day after a big rain, Christian found a puddle in the yard, with an earthworm resting at its edge. He crouched down beside it while Pepper splashed in. "I wonder how the puddle, the soil, the air, and the worm are all connected," he said.`,`"I think the land, the water, the air, and the living things all work separately," Kennedy said. April opened her notebook. "That's a claim. Let's build a model and see how they affect each other." Mrs. Swinea set up a pan of dirt.`,`Mrs. Swinea tilted the pan on a book and planted a small seedling at the top. She introduced four names: the **geosphere** is the rock, soil, and land. The **hydrosphere** is all the water. The **atmosphere** is the air. The **biosphere** is all living things. Kennedy wrote her prediction: "Changing one sphere won't change the others."`,`Christian slowly poured water down the slope. The water carried soil to the bottom, and the roots of the seedling held the soil near the plant. By afternoon, the puddle in the yard had shrunk, because some of its water had evaporated into the air. "Everything changed something else," said April.`,`Mrs. Swinea explained that the four spheres **interact**: water changes the land, living things change the soil and the air, and the air carries water. "No sphere works alone," she said. "A change in one affects the others, and scientists track these links."`,`April drew a tree and labeled the spheres. Its roots grow into the soil (geosphere), take in water (hydrosphere), and give off water vapor into the air (atmosphere). Birds and insects live in its branches (biosphere). "One tree touches all four," she wrote.`,`Mrs. Swinea told them that farmers, city planners, and emergency managers think about how land, water, air, and living things affect each other. A flood can change a forest, and planting trees can cool a city and slow runoff. "Understanding the links helps people make better choices," she said.`,`Kennedy looked at the model and nodded. "I thought they worked separately," she said. "But they all affect each other." The crew built a model that showed all four spheres interacting.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the spheres ______. What would change if there were less rain? ______

*Words to know:* **geosphere** · **hydrosphere** · **atmosphere** · **biosphere** · **interact**

*Try it at home:* Pick one spot, like a puddle, a tree, or a garden. Find an example of each sphere there, then draw a model with arrows showing how they affect each other.`);
b('5-ESS2-2','The Gallon Jug',
[`The crew looking at a photo of Earth from space on a screen, mostly blue, Pepper drinking from her water bowl.`,`Christian with his arms spread wide, Kennedy with a notebook.`,`A gallon jug of water on a table next to measuring cups, Mrs. Swinea pointing, April writing a prediction.`,`Four panels: pouring out most of the jug into a bucket labeled salty ocean, a half cup left, ice cubes in that cup, and a few drops left over.`,`Diagram: a gallon jug split into oceans, glaciers and ice, groundwater, and lakes and rivers.`,`April's bar graph with a tall bar for oceans and short bars for ice, groundwater, and lakes and rivers, labeled approximate.`,`A family turning off a faucet and fixing a dripping tap.`,`The crew and Pepper around the jug and the graph.`],
[`The crew looked at a photo of Earth from space. It was mostly blue. "Look at all that water!" said Christian.`,`"There's so much water, we will never run out of water to drink," said Christian. Kennedy said, "Let's test it with a model."`,`Mrs. Swinea held up a gallon jug. "This jug is all of Earth's water." Christian wrote, "Most of it is drinkable."`,`They poured out the salty ocean water. About half a cup was left. That half cup was fresh water. Most of it was frozen in **glaciers** or underground. Only a few drops were in lakes and rivers.`,`Most of Earth's water is **salt water**. Only a small part is **fresh water**. We can use only a small part of that.`,`April made a bar graph. The ocean bar was very tall. The other bars were tiny.`,`Saving water matters. Turn off the tap. Fix drips.`,`Earth has lots of water, but not much of it is fresh and ready to use.`],
`*Tell it again:* First, ______. Then, ______. This shows that most water is ______.

*Words to know:* **reservoir** · **salt water** · **fresh water** · **glacier** · **groundwater**

*Try it at home:* Fill a gallon jug with water. Pour out all but half a cup. That half cup stands for all fresh water on Earth.`,
[`The crew studied a photo of Earth taken from space. The planet looked like a blue marble, with swirls of white clouds. "Wow, there's so much water," said Christian. Pepper lapped noisily from her water bowl.`,`"With that much water, we'll never run out of water to drink," Christian said. Kennedy opened her notebook. "That's an interesting claim. Let's find out how much of that water we can actually use. We can make a model."`,`Mrs. Swinea set a gallon jug of water on the table beside measuring cups. "Let this jug stand for all of the water on Earth," she said. Christian wrote his prediction: "Most of the water in the jug is fresh water that people can drink." April set out a bucket to catch what they poured out.`,`Mrs. Swinea told them the facts as they poured. About 97 percent of Earth's water is salty ocean water, so they poured nearly all of the jug into the bucket. A little over a half cup was left, which stood for all the fresh water. Of that, most was frozen in **glaciers** and ice caps, and most of the rest was underground. Only a few drops were left for lakes and rivers.`,`"A **reservoir** is a place where water is stored," said Mrs. Swinea. Earth's reservoirs include the oceans, the ice, the **groundwater** beneath our feet, and the lakes, rivers, and air. "Most of the water is **salt water**. Only a small share is **fresh water**, and a lot of that is hard to reach."`,`April drew a bar **graph** of the approximate shares of Earth's water. The ocean bar was almost off the page. Ice and groundwater were tiny bars, and the bar for lakes and rivers was too small to see. "The graph makes it obvious," she said. Kennedy labeled it as approximate because the numbers are estimates.`,`Jaylen asked what people can do with so little available fresh water. Mrs. Swinea told them that cities clean and reuse water, farmers use careful watering, and families fix leaks and turn off taps. "Every drop we save helps," she said. Pepper looked up from her bowl as if she agreed.`,`Christian looked at the jug and the graph. "I thought we had plenty of drinking water," he said. "But most water is salty or frozen." Kennedy smiled. "Your question started our model." The crew had evidence of where Earth's water is.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that most of Earth's water is ______ and only a small part is ______. How could your family use less water? ______

*Words to know:* **reservoir** · **salt water** · **fresh water** · **glacier** · **groundwater**

*Try it at home:* Fill a gallon jug to stand for all of Earth's water. Pour out all but about half a cup to stand for fresh water. Then make a bar graph of approximate shares from a book or website.`);
b('5-ESS3-1','The Community Helpers',
[`Christian pointing at new recycling bins in the school hallway, Pepper sniffing one.`,`April shrugging, Kennedy with a notebook.`,`The crew with a library book, a laptop, and a note from an interview, Mrs. Swinea guiding.`,`A chart with four examples: school recycling, a rain garden, oyster gardening on a dock, and town recycling pickup.`,`Diagram: a community with arrows labeled reduce, reuse, recycle, and plant.`,`Christian's home checklist for water, trash, and energy, with one item circled.`,`Kennedy's poster titled 3 ways our community protects Earth.`,`The crew and Pepper around the poster.`],
[`Christian saw new recycling bins at school. "Who put these here?" he asked.`,`"Only the government protects the environment," said April. Kennedy said, "Let's find **evidence**."`,`The crew read a book, looked at a website, and asked Mrs. Swinea. April wrote, "All the helpers will be the government."`,`They found four examples. Students started the school recycling. Neighbors built a rain garden. Volunteers grow oysters to clean the bay. The town picks up recycling.`,`**Communities** use science ideas to protect **resources**. They **conserve**, **recycle**, and plant.`,`Christian made a home checklist. He picked one change to try for a week.`,`Kennedy made a poster. It showed three ways our community protects Earth.`,`People and groups can protect Earth's resources.`],
`*Tell it again:* First, ______. Then, ______. This shows that ______ can protect the environment.

*Words to know:* **conserve** · **resource** · **recycle** · **pollution** · **community**

*Try it at home:* Look at your home's water, trash, and energy. Pick one change to try for a week.`,
[`Walking through the school hallway, Christian noticed shiny new recycling bins next to every classroom door. "Who decided to put these here?" he asked. Pepper, visiting with Jaylen, sniffed one of the bins.`,`"I think only the government protects the environment," April said. "Regular people can't do much." Kennedy opened her notebook. "That's a claim. Let's gather information from several sources and see what we can find." Mrs. Swinea handed them a list of questions.`,`The crew used three kinds of sources: a library book about conservation, a website about local efforts, and an interview with Mrs. Swinea about how the school program started. April wrote her prediction: "Every example will turn out to be run by the government."`,`The crew combined what they found into a chart. The school recycling program was started by a group of students and teachers. A neighborhood built a rain garden to soak up runoff. Volunteers along the Chesapeake Bay grow oysters on their docks to help clean the water. The town also runs a recycling pickup. "It's a mix," said Kennedy.`,`Mrs. Swinea explained that **communities** use science ideas to protect natural **resources** and the environment. They **conserve** water and energy, **recycle** materials, reduce **pollution**, and protect habitats. "These efforts work because someone figured out the science first," she said. "Oysters filter water, and rain gardens slow runoff."`,`Christian made a checklist for his family with three headings: water, trash, and energy. He picked one change to try for a week: turning off the faucet while brushing teeth. Jaylen chose to reuse a water bottle instead of buying new ones. Pepper chose nothing, but she approved.`,`Kennedy made a poster titled "3 Ways Our Community Protects Earth." It had the school recycling, the rain garden, and the oyster gardens, each with the science idea behind it. Mrs. Swinea hung it in the hallway next to the new bins.`,`April looked at the chart and smiled. "I thought only the government could help," she said. "But families, schools, and neighbors do too." The crew had evidence that communities protect resources by using science ideas.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that ______ can protect the environment. What is one thing our class could do? ______

*Words to know:* **conserve** · **resource** · **recycle** · **pollution** · **community**

*Try it at home:* Use a book and a website to find a local effort that protects a resource, like recycling or a cleanup. Explain the science idea behind it, then pick one change your family can try for a week.`);

g('3-PS2-1','Balanced and Unbalanced Forces',`*At school we're practicing: planning and carrying out investigations*

**What your child is learning**

A force is a push or a pull. When the forces on an object are balanced, the object stays still or keeps moving the same way. When they are unbalanced, the object speeds up, slows down, or changes direction. Students test this and use what they see as evidence.

**Before and after**

- **Before:** In kindergarten, students learned that pushes and pulls can start, stop, or redirect things.
- **After:** In 5th grade they learn that gravity pulls objects toward Earth. In middle school they measure how force changes motion.

**Why it matters in real life**

Seatbelts, bike brakes, and playground equipment are all designed around forces. Engineers use this idea to keep people safe and to make things move the way they want.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| force | A push or a pull |
| motion | Moving, or changing how something moves |
| balanced forces | Forces that cancel out, so nothing changes |
| unbalanced forces | Forces that do not cancel, so motion changes |
| evidence | What you see or measure that shows something is true |

**Try it at home**

- **Tug of war (10 min, a rolled-up towel):** Pull with equal strength from both sides, then have one person pull harder. What changes?
- **Gentle push, hard push (10 min, a toy car):** Push the car softly, then harder. Compare how far it goes.
- **Force hunt (5 min, nothing needed):** Find three things sitting still in the room. Talk about what is pushing and pulling on each one.

**Talk about it**

- What happened when one side pulled harder?
- How can you tell the forces were balanced?

**You'll know they've got it when...**

They can explain that a change in motion means the forces are unbalanced, and that something sitting still can still have forces on it.

**Common mix-up**

Kids often think a still object has no forces acting on it. It has balanced forces, like gravity pulling down and a table pushing up.`);
g('3-PS2-2','Patterns in Motion',`*At school we're practicing: finding patterns and using them to predict*

**What your child is learning**

Some motion repeats in a pattern, like a swing going back and forth or a ball rolling in a bowl. If you spot the pattern, you can predict what the object will do next. Students observe and measure motion to find these patterns.

**Before and after**

- **Before:** In earlier grades, students noticed that objects move in different ways.
- **After:** In middle school they use measurements of speed and force to predict motion with math.

**Why it matters in real life**

Patterns in motion help us predict when a tide will come in, how a clock keeps time, and where a thrown ball will land. Weather forecasters and engineers rely on patterns to plan ahead.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| pattern | Something that repeats in a way you can count on |
| predict | To say what will happen next, using evidence |
| pendulum | A weight that swings back and forth from a string |
| measure | To find out how long, how fast, or how many |
| motion | Moving, or changing how something moves |

**Try it at home**

- **Make a pendulum (15 min, string and a washer or nut):** Tie the weight to a string and let it swing. Count swings in 10 seconds, then predict the count for 20 seconds and check.
- **Change one thing (15 min, same pendulum):** Try a shorter string, then a longer one. Does the pattern change?
- **Playground patterns (10 min):** Count how many swings your child makes in 10 seconds, then try again and compare.

**Talk about it**

- What pattern do you notice? How could we use it to predict what happens next?
- What did you change, and what happened?

**You'll know they've got it when...**

They can describe a repeating motion and use it to make a prediction they then test.

**Common mix-up**

Kids often think a pendulum swings faster with a heavier weight or a harder push. String length is what changes the pattern.`);
g('3-PS2-3','Magnets and Static Electricity',`*At school we're practicing: asking questions about cause and effect*

**What your child is learning**

Magnets and electrically charged objects can push or pull on each other without touching. Students ask questions and investigate what causes these pulls and pushes, including attract (pull together) and repel (push apart).

**Before and after**

- **Before:** In kindergarten, students explored pushes and pulls that happen when things touch.
- **After:** In middle school they learn how electric and magnetic forces work at a distance.

**Why it matters in real life**

Magnets are in refrigerator doors, speakers, headphones, and electric motors. Static electricity explains why clothes cling in the dryer and why you sometimes get a zap from a doorknob.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| magnet | An object that pulls on some metals |
| attract | To pull together |
| repel | To push apart |
| pole | The end of a magnet where the pull is strongest |
| static electricity | A buildup of electric charge that makes things cling |

**Try it at home**

- **Balloon trick (10 min, a balloon):** Rub a balloon on hair or a wool sweater, then hold it near small bits of paper or a thin stream of water.
- **What sticks? (15 min, a fridge magnet and household items):** Test spoons, coins, foil, paper clips, and keys. Sort them into sticks and does not stick.
- **Push or pull (5 min, two magnets):** Flip one magnet around. What changes?

**Talk about it**

- What do you think will happen? What made you think that?
- What did the magnet do without touching?

**You'll know they've got it when...**

They can use the words attract and repel and explain that these forces work across a gap.

**Common mix-up**

Kids often think magnets stick to all metals. Magnets pull on only some metals, like iron and steel. Aluminum foil and copper coins do not stick.`);
g('3-PS2-4','Solving Problems with Magnets',`*At school we're practicing: defining a problem and designing a solution*

**What your child is learning**

Engineers start with a problem, then use science ideas to solve it. Students describe a simple problem, such as keeping a cabinet door closed or holding something in place, and use what they know about magnets to design a solution.

**Before and after**

- **Before:** Earlier in grade 3, students learned how magnets attract and repel.
- **After:** In 4th grade they design devices that move energy. In middle school they test and compare designs more carefully.

**Why it matters in real life**

Magnetic latches, toy building sets, whiteboard markers, and school locker holders all came from someone noticing a problem and designing a fix. Engineers do this every day.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| problem | Something that needs to be fixed or improved |
| design | To plan and make something that solves a problem |
| solution | An idea or tool that fixes the problem |
| test | To try it out and see if it works |
| improve | To change a design to make it work better |

**Try it at home**

- **Magnet fishing game (20 min, paper, paper clips, string, a small magnet):** Make paper fish with clips, then a fishing pole with a magnet on a string.
- **Fix-it design (15 min, magnets and tape):** Pick a small home problem, like keeping a note on the fridge or holding a lid shut. Sketch and test a magnet fix.
- **Strength test (10 min, magnets and paper clips):** Which magnet holds the most clips? How could you make a magnet work through paper?

**Talk about it**

- What problem were you trying to solve?
- What would you change to make it work better?

**You'll know they've got it when...**

They can name a problem, explain how a magnet helps solve it, and tell what they would improve.

**Common mix-up**

Kids often think the first design has to be perfect. Engineers expect to test, find what does not work, and improve.`);

g('3-ESS2-1','Weather by Season',`*At school we're practicing: representing data in tables and graphs*

**What your child is learning**

Weather is what the air is doing outside today: temperature, rain, snow, wind, and clouds. Typical weather means the pattern we expect during a season. Students collect weather data and show it in tables and graphs to describe what each season is usually like.

**Before and after**

- **Before:** In kindergarten, students noticed patterns in weather from day to day and season to season.
- **After:** Later in grade 3 they study weather hazards. In middle school they use data to forecast weather.

**Why it matters in real life**

Farmers plan planting, families plan trips, and cities plan for snow removal using what is typical for the season. Meteorologists use years of weather data to forecast.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| weather | What the air outside is like right now |
| season | One of four parts of the year: winter, spring, summer, fall |
| temperature | How hot or cold it is |
| precipitation | Water that falls from the sky, like rain, snow, or sleet |
| graph | A picture that shows data |

**Try it at home**

- **Weather log (5 min a day for two weeks, paper and a thermometer or weather app):** Write the temperature and sky each day.
- **Make a graph (20 min, graph paper):** Turn the log into a bar graph of daily highs.
- **Last year's weather (15 min, a weather website):** Look up this month last year. How does it compare to your log?

**Talk about it**

- What do you notice in the data?
- What kind of weather would you expect next week, and why?

**You'll know they've got it when...**

They can read a weather graph or table and describe what a season is typically like.

**Common mix-up**

Kids often think a season's weather is the same every day. Typical means the pattern over many days. Any single day can be different.`);
g('3-ESS2-2','Climates Around the World',`*At school we're practicing: obtaining and combining information*

**What your child is learning**

Climate is the pattern of weather in a place over many years. Different regions of the world have different climates, such as tropical, desert, polar, and temperate. Students gather information from different sources and put it together to describe them.

**Before and after**

- **Before:** Earlier in grade 3, students collected and graphed weather data.
- **After:** In middle school they learn how oceans, air, and Earth's tilt shape climates.

**Why it matters in real life**

Climate decides which crops can grow where, what homes are built like, and what people wear. Travelers and engineers use climate information to plan.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| climate | The usual weather in a place over many years |
| region | A large area with something in common |
| tropical | Hot and rainy most of the year |
| desert | A place with very little rain |
| polar | Very cold, near the North or South Pole |

**Try it at home**

- **Compare two places (20 min, a globe or online map):** Pick two places in the world. Find each one's usual temperature and rain. How are they alike and different?
- **Pack the suitcase (15 min, paper):** Decide what to pack for a trip to a desert, a rainforest, and the Arctic.
- **Postcard from a climate (20 min, paper and crayons):** Draw and write about a place with a very different climate than ours.

**Talk about it**

- What is the climate like where we live? How is that different from somewhere else?
- How do plants, animals, and people live differently in a different climate?

**You'll know they've got it when...**

They can describe the climate of at least two regions and say how they differ.

**Common mix-up**

Kids often mix up weather and climate. Weather is today. Climate is the pattern over many years in a region.`);
g('3-ESS3-1','Weather Hazards and Solutions',`*At school we're practicing: evaluating design solutions*

**What your child is learning**

Severe weather like floods, hurricanes, strong winds, lightning, and snowstorms can be dangerous. People cannot stop the weather, but they can design ways to reduce harm. Students judge how well a design solution works to reduce the impact of a weather hazard.

**Before and after**

- **Before:** In kindergarten, students learned how to prepare for severe weather.
- **After:** In 4th grade they compare solutions that reduce the effects of natural processes. In middle school they study how natural hazards are mapped and predicted.

**Why it matters in real life**

Buildings, levees, storm drains, warning systems, and evacuation plans are all designed to reduce the harm from weather hazards. Families can use the same ideas at home.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| hazard | Something that can cause harm |
| severe weather | Dangerous weather, like a hurricane or tornado |
| design | To plan and make something to solve a problem |
| solution | An idea or tool that fixes a problem |
| merit | How good or useful something is |

**Try it at home**

- **Family storm plan (20 min, paper):** Decide where you would go and what you would bring in a thunderstorm, flood, or winter storm. Make a simple checklist.
- **Wind-proof house (30 min, paper or cardboard, tape, a fan; an adult should handle the fan):** Build a small house and test it in the breeze. How could you make it stronger?
- **Flood barrier challenge (30 min, a baking pan, sand, cups of water):** Make a slope of sand and test barriers made of rocks, sponges, or clay. Which slows the water best?

**Talk about it**

- What is the hazard, and who or what could be harmed?
- How well does this solution work? What would you change?

**You'll know they've got it when...**

They can name a weather hazard, describe one way to reduce its harm, and explain how well it works.

**Common mix-up**

Kids often think we can stop dangerous weather. We cannot stop it, but good planning and design can reduce the damage.`);
g('3-LS4-1','Fossils',`*At school we're practicing: analyzing and interpreting data*

**What your child is learning**

Fossils are the remains or traces of living things from long ago, like shells, bones, leaves, and footprints. By studying fossils, scientists can figure out what plants and animals lived long ago and what their environment was like.

**Before and after**

- **Before:** In 2nd grade, students learned that Earth changes both quickly and slowly.
- **After:** In 4th grade they use rock layers and fossils to explain how landscapes changed. In middle school they study the fossil record as evidence of life changing over time.

**Why it matters in real life**

Paleontologists use fossils to learn about ancient life, climates, and mass extinctions. Fossils also help geologists find oil and other resources by dating rock layers.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| fossil | The remains or marks of a living thing from long ago, preserved in rock |
| organism | Any living thing |
| environment | The place and conditions a living thing lives in |
| extinct | No longer living anywhere on Earth |
| evidence | Clues that help explain what happened |

**Try it at home**

- **Make a fossil print (20 min, clay or salt dough, a shell or toy):** Press the object into the dough, remove it, and look at the print. What can the print tell you?
- **Rock watch (15 min, outdoors):** Look closely at rocks in the yard or park for shell prints or leaf shapes.
- **Fossil detective (20 min, books or a museum website):** Look at a fossil photo. What did this animal eat? What kind of place did it live in? Maryland's Calvert Cliffs State Park is known for fossil shark teeth on the beach.

**Talk about it**

- What clues does this fossil give us?
- If a fossil seashell is found far from the ocean, what might that tell us about the place long ago?

**You'll know they've got it when...**

They can look at a fossil and describe what kind of living thing it came from and what its environment might have been like.

**Common mix-up**

Kids often think all fossils are dinosaurs. Most fossils are shells, plants, small animals, and footprints.`);
g('3-LS3-1','Inherited Traits and Variation',`*At school we're practicing: analyzing and interpreting data*

**What your child is learning**

Plants and animals get traits from their parents, such as leaf shape, fur color, or beak size. But no two individuals are exactly alike, even in the same family. Students look at data to see both the similarities and the differences.

**Before and after**

- **Before:** In first grade, students learned that young plants and animals look like their parents but are not exactly the same.
- **After:** In middle school they learn that genes carry the instructions for traits.

**Why it matters in real life**

Farmers and gardeners choose seeds and animals with helpful traits. Doctors use family traits to understand health. Scientists track variation to protect species that are at risk.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| trait | A feature of a living thing, like color or size |
| inherit | To get a trait from your parents |
| offspring | The young of a plant or animal |
| variation | Differences among living things of the same kind |
| data | Information you collect, like measurements |

**Try it at home**

- **Leaf lineup (15 min, leaves from one tree, a ruler):** Collect ten leaves from the same tree. Measure and line them up. Same tree, same traits, but are they identical?
- **Seed sort (15 min, a bag of dried beans or seeds):** Sort by size and color. Make a simple chart of how many are in each group.
- **Pet or plant family (10 min):** Compare photos of puppies, kittens, or garden plants from the same parents. What is alike? What is different?

**Talk about it**

- Which traits are the same in this group? Which are different?
- What does your chart or lineup tell us?

**You'll know they've got it when...**

They can point out a trait that offspring share with their parents and one that varies, and use a chart or measurements to show it.

**Common mix-up**

Kids often think offspring look exactly like one parent. Traits come from both parents, and brothers and sisters can look different.`);
g('3-LS3-2','How the Environment Affects Traits',`*At school we're practicing: using evidence to support an explanation*

**What your child is learning**

Some traits come from parents, but the environment can change how they show up. A plant in the sun grows differently than the same kind of plant in the shade. An animal's size can depend on how much food it gets. Students use evidence to explain these effects.

**Before and after**

- **Before:** In 2nd grade, students learned that plants need sunlight and water to grow.
- **After:** In middle school they study how genes and the environment work together to shape growth.

**Why it matters in real life**

Gardeners and farmers adjust light, water, and soil to grow healthy plants. Doctors and coaches know that food, sleep, and exercise affect how bodies grow and stay strong.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| environment | Everything around a living thing, like light, water, food, and weather |
| trait | A feature of a living thing, like height or color |
| influence | To change or have an effect on |
| inherited | Passed down from parents |
| evidence | What you observe or measure that shows something is true |

**Try it at home**

- **Two seedlings (10 min to start, then watch for 1-2 weeks; two small cups, soil, bean seeds):** Put one cup in a sunny window and one in a dark closet. Water both the same. Measure and draw each week.
- **Sun and shade walk (10 min, outdoors):** Find the same kind of plant in sun and in shade. How do they compare?
- **Inherited or influenced? (10 min, paper):** Sort a few traits, like eye color, height, and a scraped knee, into from parents, from environment, or both.

**Talk about it**

- What was different about the two plants? What caused the difference?
- What would happen if we changed the water or light?

**You'll know they've got it when...**

They can explain that the same kind of plant or animal can look different depending on its surroundings, and back it up with what they measured or saw.

**Common mix-up**

Kids often think all traits come only from parents. Many traits come from both what is inherited and the environment.`);

g('3-LS4-2','Variation and Survival',`*At school we're practicing: constructing explanations*

**What your child is learning**

Individuals of the same kind can have small differences, and some differences can help them survive, find mates, and have young. A beetle whose color blends in with the leaves is harder for a bird to spot. Students explain how these advantages work.

**Before and after**

- **Before:** Earlier in grade 3, students learned that traits vary within a group.
- **After:** In middle school they learn how helpful traits become more common over many generations, called natural selection.

**Why it matters in real life**

Understanding variation helps scientists protect species when conditions change, and helps doctors understand why germs can become resistant to medicine.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| variation | Differences among living things of the same kind |
| characteristic | A feature, like color, size, or speed |
| advantage | Something that helps you do better |
| camouflage | Colors or patterns that help a living thing blend in |
| species | One kind of living thing |

**Try it at home**

- **Camouflage game (20 min, 20 dried beans or paper dots in different colors, a patterned cloth or lawn):** Scatter them, give everyone 10 seconds to grab as many as they can. Which colors were found last?
- **Design a bug (15 min, paper and crayons):** Draw a bug in a leafy, sandy, or snowy place. Give it a color or shape that helps it survive there.
- **Backyard look (10 min, outdoors):** Find insects or birds. How might their color or shape help them?

**Talk about it**

- Which bean was hardest to find? Why?
- How would a different color help this animal in a different place?

**You'll know they've got it when...**

They can explain why a certain trait gives an animal an advantage in its environment.

**Common mix-up**

Kids often think an animal can choose to change its traits when it needs to. Differences already exist in a group, and helpful ones become more common over many generations.`);
g('3-LS4-4','When the Environment Changes',`*At school we're practicing: evaluating solutions and making a claim about their merit*

**What your child is learning**

When an environment changes, the living things there can change too. Fires, floods, drought, new buildings, and invasive species can all help some living things and hurt others. Students look at a problem and judge how well a solution would work, which is called its merit.

**Before and after**

- **Before:** In kindergarten, students learned that people can change the land, water, and air around them.
- **After:** In 5th grade they learn how communities protect Earth's resources. In middle school they evaluate solutions that protect many kinds of living things.

**Why it matters in real life**

Communities weigh solutions like restoring wetlands, planting trees, and cleaning waterways. In Maryland, groups work to restore oysters and underwater grasses in the Chesapeake Bay.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| environment | Everything around a living thing |
| change | To become different |
| solution | An idea that fixes a problem |
| merit | How good or useful something is |
| trade-off | A good thing you give up to get another good thing |

**Try it at home**

- **Changed place (20 min, a walk):** Find a spot that has changed, like a cleared lot, a dry creek bed, or a new building. What might have lived there before?
- **Pick the best fix (15 min, paper):** Choose a problem, like trash in a creek. List two solutions with good points and drawbacks for each.
- **Help a habitat (30 min or more, outdoors):** Plant native flowers, set up a water dish for birds, or join a local cleanup.

**Talk about it**

- Who is helped by this change? Who is hurt?
- What are the good points and drawbacks of this solution?

**You'll know they've got it when...**

They can describe a change in an environment and explain whether a proposed solution would work, with reasons.

**Common mix-up**

Kids often think a solution is either perfect or useless. Most solutions have strengths and trade-offs.`);
g('3-LS4-3','Habitats and Survival',`*At school we're practicing: arguing from evidence*

**What your child is learning**

A habitat is the place where a plant or animal lives. In any one habitat, some living things do well, some barely get by, and some could not survive at all. A cactus thrives in a desert, but it would not survive in a rainforest. Students make a claim and support it with evidence.

**Before and after**

- **Before:** In kindergarten, students learned that plants and animals need certain things, like food, water, and shelter, from their surroundings.
- **After:** In 5th grade they study how matter and energy move through ecosystems. In middle school they study how living things depend on each other and on their environment.

**Why it matters in real life**

Wildlife managers decide where to release or protect animals by checking whether a habitat has what they need. Gardeners choose plants that match their yard's sun, soil, and rainfall.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| habitat | The place where a living thing lives |
| survive | To stay alive |
| needs | Things a living thing must have, like food, water, and shelter |
| environment | Everything around a living thing |
| claim | A statement you say is true |

**Try it at home**

- **Could it live here? (15 min, paper and pencil):** Pick an animal, such as a penguin, a camel, or a frog, and a place, such as a desert, ocean, or backyard. Make a claim about whether it could survive and give two reasons.
- **Backyard survey (20 min, outdoors):** List the living things you find in one small area. What does each one need that this spot provides?
- **Shoebox habitat (30 min, a shoebox and craft supplies):** Build a habitat for one animal with food, water, and shelter.

**Talk about it**

- What does this animal need? Does this habitat have it?
- What evidence supports your claim?

**You'll know they've got it when...**

They can explain why a plant or animal would do well, struggle, or not survive in a habitat, using its needs as evidence.

**Common mix-up**

Kids often think any animal can live anywhere if it tries hard enough. Each living thing's body and needs fit only certain habitats.`);
g('3-LS1-1','Life Cycles',`*At school we're practicing: building models*

**What your child is learning**

Every living thing has a life cycle: it is born, grows, reproduces, and eventually dies. The stages look different for different organisms. A butterfly, a frog, a bean plant, and a person all go through the same big steps in very different ways.

**Before and after**

- **Before:** In first grade, students learned that plants and animals have babies that look like their parents.
- **After:** In 4th grade they study body parts that help living things survive. In middle school they study how organisms reproduce and pass on traits.

**Why it matters in real life**

Farmers plan around plant and animal life cycles. Doctors and scientists use life cycles to study how diseases spread, such as those carried by mosquitoes, and to protect endangered species.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| organism | Any living thing |
| life cycle | The stages of a living thing's life, from birth to death |
| reproduce | To make new living things of the same kind |
| metamorphosis | A big body change, like a caterpillar becoming a butterfly |
| stage | One step in a life cycle |

**Try it at home**

- **Growth timeline (15 min, family photos):** Put photos in order from baby to now. What stayed the same? What changed?
- **Bean in a bag (10 min to start, then watch daily; a bean, a paper towel, a zip bag):** Place a damp towel and bean in the bag and tape it to a window. Draw what you see each day.
- **Draw a cycle (20 min, paper):** Pick a butterfly, frog, or plant. Draw and label each stage in a circle.

**Talk about it**

- What stages does this living thing go through?
- How is its life cycle like ours? How is it different?

**You'll know they've got it when...**

They can order the stages of a life cycle and explain that every living thing is born, grows, reproduces, and dies, even if the stages look different.

**Common mix-up**

Kids often think all animals grow up the same way people do. A caterpillar looks nothing like a butterfly, and a tadpole looks nothing like a frog.`);
g('3-LS2-1','Animal Groups',`*At school we're practicing: arguing from evidence*

**What your child is learning**

Some animals live and travel in groups, like wolf packs, bee hives, fish schools, and elephant herds. Being in a group helps members find food, stay safe, and care for their young. Students make a claim and back it up with evidence.

**Before and after**

- **Before:** In kindergarten, students learned that animals need food, water, and shelter.
- **After:** In 5th grade they study food webs and how matter moves through an ecosystem. In middle school they study how organisms interact and compete.

**Why it matters in real life**

Wildlife biologists study animal groups to protect species and plan safe habitats. Farmers who keep bees depend on how hives work. People also form groups, like families and teams, to get things done that one person cannot.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| group | A number of animals that live or move together |
| survive | To stay alive |
| defend | To protect from danger |
| claim | A statement you say is true |
| evidence | Facts that support your claim |

**Try it at home**

- **Watch and notice (20 min, a nature video):** Watch a clip of a herd, flock, or school. Pause and spot how the group helps each animal.
- **Alone or together? (10 min, paper):** List ten animals. Sort them into lives in groups and lives mostly alone. Talk about why.
- **Family jobs (10 min, nothing needed):** What jobs does your family share? How do they help everyone?

**Talk about it**

- How does being in a group help this animal stay safe or find food?
- What evidence supports your idea?

**You'll know they've got it when...**

They can state a claim like "Meerkats live in groups because lookouts spot danger" and give a reason.

**Common mix-up**

Kids often think animals group together just to be friendly. Groups mainly help with food, safety, and raising young.`);

g('4-PS3-1','Speed and Energy',`*At school we're practicing: using evidence to explain*

**What your child is learning**

Energy is the ability to make things move or change. The faster an object moves, the more energy it has. Students test this and use their results as evidence for an explanation.

**Before and after**

- **Before:** In 3rd grade, students studied forces and how pushes and pulls change motion.
- **After:** In 5th grade they trace the energy in food back to the sun. In middle school they learn how both mass and speed affect motion energy.

**Why it matters in real life**

Car engineers design bumpers and seatbelts knowing that faster speed means more energy in a crash. Speed limits and helmets exist for the same reason.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| energy | The ability to make things move, heat up, or change |
| speed | How fast something moves |
| motion energy | The energy a moving object has |
| evidence | What you see or measure that shows something is true |
| explain | To tell how and why something happens |

**Try it at home**

- **Ramp test (20 min, a toy car, a book, a plastic cup):** Prop a ramp low, then high. Roll the car into the cup each time. Measure how far the cup moves.
- **Splash test (20 min, a pan of flour or sand, a marble; outdoors or on newspaper):** Drop the marble from a low height, then a high one. Compare the dents.
- **Slow or fast? (5 min, nothing needed):** Would you rather be bumped by a slow ball or a fast one? Why?

**Talk about it**

- What happened when the car went faster?
- What evidence shows that faster things have more energy?

**You'll know they've got it when...**

They can say that a faster object has more energy and point to a result, like a farther push or a bigger dent, as proof.

**Common mix-up**

Kids often think only heavy things have a lot of energy. Speed matters too.`);
g('4-PS3-3','Energy in Collisions',`*At school we're practicing: asking questions and predicting outcomes*

**What your child is learning**

When two objects collide, energy moves from one to the other. A moving marble that hits a still marble passes along some of its energy and makes the other one roll. Some energy also becomes sound and heat. Students ask questions and predict what will happen.

**Before and after**

- **Before:** In 3rd grade, students studied how forces change an object's motion.
- **After:** In middle school they use math to describe what happens to energy and motion in collisions.

**Why it matters in real life**

Car crash tests, helmets, sports equipment, and playground surfaces are designed around what happens to energy in collisions. Engineers aim to spread out or absorb that energy to protect people.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| collide | To hit or bump into something |
| energy | The ability to make things move, heat up, or change |
| transfer | To move from one place to another |
| predict | To say what will happen next, using evidence |
| outcome | What happens in the end |

**Try it at home**

- **Marble bump (15 min, two marbles, a folded piece of cardboard as a track):** Roll one marble gently into a still one. Predict, then watch. Try again with a faster roll.
- **Bounce test (10 min, a ball, different surfaces):** Drop a ball on carpet, tile, and grass. Where does it bounce highest? Where did the energy go on the soft surface?
- **Domino chain (15 min, dominoes or books on end):** Tip the first one. How does the energy travel down the line?

**Talk about it**

- What do you predict will happen when they hit? Why?
- Where did the energy go after the crash?

**You'll know they've got it when...**

They can predict what happens in a collision and explain that energy moved from one object to another.

**Common mix-up**

Kids often think energy disappears in a crash. It moves to the other object and also becomes sound and heat.`);
g('4-PS3-2','Energy Moves From Place to Place',`*At school we're practicing: making observations and using them as evidence*

**What your child is learning**

Energy does not stay in one place. It travels. Sound, light, heat, and electric current are all ways energy gets from one spot to another. Students observe this happening and use what they see as proof.

**Before and after**

- **Before:** In earlier grades, students learned that sound comes from vibrations, light helps us see, and the sun warms the Earth.
- **After:** Later this year they design a device that changes energy from one form to another. In middle school they measure how energy transfers.

**Why it matters in real life**

Phones, lights, stoves, and speakers all depend on moving energy. Knowing how energy travels helps people stay safe around electricity and heat, and it is the basis for how we power homes and design new technology.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| energy | The ability to make things move, heat up, or change |
| transfer | To move from one place to another |
| vibration | A fast back-and-forth shake |
| electric current | Electricity flowing through a path, like a wire |
| conduct | To let energy pass through |
| evidence | What you see or measure that shows something is true |

**Try it at home**

- **Talk it out (5 min, nothing needed):** Hum with your fingers on your throat. What do you feel? Where is the energy going?
- **Heat travels (15 min, a metal spoon, a wooden spoon, a cup of warm water; an adult handles the water):** Put both spoons in the water. Wait a few minutes. Which handle gets warm first?
- **Light and sound (10 min, a light switch or a speaker):** Flip a light switch or turn on music. Where does the energy come from, and where does it go?

**Talk about it**

- Where did the energy come from, and where did it go?
- How do you know energy moved? What did you see, feel, or hear?

**You'll know they've got it when...**

They can point to something happening, like a warm spoon or a buzzing speaker, and explain how energy got there.

**Common mix-up**

Kids often think energy is used up and disappears. It actually moves or changes form.`);
g('4-PS3-4','Devices That Change Energy',`*At school we're practicing: designing, testing, and improving a solution*

**What your child is learning**

A device can change energy from one form to another. A solar panel changes light into electricity, a toaster changes electricity into heat, and a wind turbine changes motion into electricity. Students design, test, and improve a device that does this.

**Before and after**

- **Before:** Earlier this year, students learned how energy travels and what happens in collisions.
- **After:** In middle school they design devices to control how fast heat moves from one thing to another.

**Why it matters in real life**

Power plants, solar panels, batteries, and electric cars all depend on changing energy from one form to another. Engineers keep improving these devices to waste less energy.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| convert | To change from one form to another |
| form of energy | A kind of energy, like light, heat, sound, motion, or electrical |
| device | A tool or machine made for a purpose |
| test | To try it out and see if it works |
| improve | To change a design so it works better |

**Try it at home**

- **Rubber-band car (30 min, cardboard, bottle caps, straws, a rubber band):** Wind it up and let it go. Stored energy becomes motion. What can you change to make it go farther?
- **Pinwheel (15 min, paper, a pencil, a pin with an adult's help):** Blow on it or hold it in a breeze. What energy turns into what?
- **Pizza-box solar oven (45 min, a pizza box, foil, plastic wrap, an adult nearby):** Warm a small snack on a sunny day. How could you collect more sunlight?

**Talk about it**

- What energy goes in? What energy comes out?
- What did you change after your first test?

**You'll know they've got it when...**

They can describe a device in terms of the energy going in and the energy coming out, and explain what they would improve.

**Common mix-up**

Kids often think a device makes energy. Devices change energy from one form to another. They do not create it.`);
g('4-PS4-1','Waves',`*At school we're practicing: building and using models*

**What your child is learning**

Waves are repeating patterns of motion, like ripples in water or the shake of a rope. Waves can be tall or short (amplitude) and long or short from peak to peak (wavelength). Waves also make objects move. Students draw and use models to describe these patterns.

**Before and after**

- **Before:** In first grade, students learned that sound comes from vibrations.
- **After:** In middle school they use math to describe waves and study how light and sound travel as waves.

**Why it matters in real life**

Sound, light, ocean waves, earthquakes, and radio signals are all waves. Musicians, engineers, and oceanographers study them to build instruments, devices, and safer coastal plans.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| wave | A repeating pattern of motion that carries energy |
| amplitude | How tall a wave is |
| wavelength | The distance from one peak of a wave to the next |
| pattern | Something that repeats in a way you can count on |
| model | A drawing or object that shows how something works |

**Try it at home**

- **Rope or Slinky waves (15 min, a Slinky or a long rope):** Shake it slowly, then quickly. Make big waves and small waves. Which are longer? Which are taller?
- **Water waves (15 min, a baking pan with water, a small cork or toy):** Tap the water gently. Watch the floating toy as the waves pass.
- **Draw your waves (15 min, paper and crayons):** Draw a tall wave, a short wave, a long wave, and a short-wavelength wave. Label amplitude and wavelength.

**Talk about it**

- What is different about a big wave and a small wave?
- What happened to the floating toy when the wave passed?

**You'll know they've got it when...**

They can draw a wave, label its height and its length from peak to peak, and say that waves can move objects.

**Common mix-up**

Kids often think waves carry water forward. A floating cork mostly bobs up and down in place as the wave passes. The energy is what travels.`);

g('4-PS4-2','How We See',`*At school we're practicing: building and using models*

**What your child is learning**

We see an object when light bounces off it and enters our eyes. Without light, there is nothing to see. Students draw and use models to show the path light takes from a source to an object to the eye.

**Before and after**

- **Before:** In first grade, students learned that objects can be seen only when there is light.
- **After:** In middle school they study how light is reflected, absorbed, and passes through different materials.

**Why it matters in real life**

Mirrors in cars, cameras, eyeglasses, and microscopes all work by controlling how light travels. Reflective stripes on jackets and bikes keep people visible at night.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| light | Energy that lets us see |
| reflect | To bounce off a surface |
| light source | Something that makes its own light, like the sun or a lamp |
| model | A drawing or object that shows how something works |
| path | The route something follows |

**Try it at home**

- **Dark box peek (15 min, a shoebox, a small toy, a flashlight, tape):** Cut a peephole in one end and a small hole in the side. With the lid on and no light, can you see the toy? Shine the flashlight through the side hole.
- **Mirror bounce (15 min, a small mirror, a flashlight):** In a dim room, bounce the light off the mirror onto a wall or a target.
- **Draw the light path (10 min, paper):** Draw a lamp, an object, and an eye. Add arrows to show how the light travels.

**Talk about it**

- Where does the light come from? Where does it go next?
- Why can't we see in a completely dark room?

**You'll know they've got it when...**

They can draw or describe light traveling from a source, bouncing off an object, and into an eye.

**Common mix-up**

Kids often think our eyes send out something to see objects. We see because light bounces off objects and enters our eyes.`);
g('4-PS4-3','Patterns That Send Information',`*At school we're practicing: designing and comparing solutions*

**What your child is learning**

People send messages across distances using patterns, such as flashes of light, taps, or beeps. Both the sender and receiver have to agree on what each pattern means. Students design different ways to send information and compare which works best.

**Before and after**

- **Before:** In first grade, students learned that people use devices to communicate over a distance.
- **After:** In middle school they learn how digital signals carry information more reliably than other kinds.

**Why it matters in real life**

Morse code, barcodes, QR codes, and the digital signals in phones and computers all use patterns to carry information. Ships, planes, and rescue teams use signal patterns when voices cannot be heard.

**Vocabulary**

| Word | Kid-friendly meaning |
| --- | --- |
| pattern | Something that repeats in a way you can count on |
| code | A set of patterns that stand for letters, words, or ideas |
| signal | A message sent using light, sound, or movement |
| information | Facts or messages |
| compare | To look at how things are alike and different |

**Try it at home**

- **Flashlight signals (20 min, a flashlight, a code chart from a library book or website):** Send a short word across a dim room using short and long flashes.
- **Tap code (10 min, a table or wall):** Tap short and long patterns to spell a word for someone in another room.
- **Invent and compare (20 min, paper):** Make up two different codes for the same message. Test which is faster and which is easier to get right.

**Talk about it**

- What pattern did you use to stand for each letter or word?
- Which way of sending the message worked best? Why?

**You'll know they've got it when...**
