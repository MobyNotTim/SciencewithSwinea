<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mrs. Swinea’s Science Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Patrick+Hand&family=Sue+Ellen+Francisco&display=swap">
<style>:root{
  --hub:#f3ebf5; --g3:#f4ffe9; --g4:#e4fdfc; --g5:#d6e8eb;
  --pad:#ffea9b; --ring:#a5dbeb; --ink:#111; --sage:#c9deb2; --teal:#0cb4a4; --deep:#047a89; --pink:#ffd8dc; --star:#f4d746;
  --page:var(--hub); --text:#111; --muted:#4a4a52; --paper:#fff; --paper-text:#1a1a1f; --line:#111; --chip:#fff7d1;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --hub:#2b2433; --g3:#222f20; --g4:#18302f; --g5:#1a2d33;
    --text:#f2f2f4; --muted:#c3c3cc; --paper:#1d1d23; --paper-text:#ececf0; --chip:#3a3520;
  }
}
:root[data-theme="dark"]{
  --hub:#2b2433; --g3:#222f20; --g4:#18302f; --g5:#1a2d33;
  --text:#f2f2f4; --muted:#c3c3cc; --paper:#1d1d23; --paper-text:#ececf0; --chip:#3a3520;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:'Lora',Georgia,'Times New Roman',serif;line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);transition:background .25s}
body[data-page="hub"]{--page:var(--hub)} body[data-g="3"]{--page:var(--g3)} body[data-g="4"]{--page:var(--g4)} body[data-g="5"]{--page:var(--g5)}
a{color:inherit}
:focus-visible{outline:4px solid var(--deep);outline-offset:3px;border-radius:4px}
.display{font-family:'Sue Ellen Francisco','Comic Sans MS','Segoe Print',cursive;font-weight:400;text-transform:uppercase;line-height:1;letter-spacing:.02em;margin:0}
.hand{font-family:'Patrick Hand','Comic Sans MS','Segoe Print',cursive}
.scene{max-width:1240px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(20px,4vw,48px) 56px;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(36px,6vw,80px);align-items:center}
.scene.hub{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr)}
@media(max-width:860px){.scene,.scene.hub{grid-template-columns:1fr;min-height:0;padding-top:48px}}
.crumb{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:clamp(16px,3vw,32px);font-family:'Patrick Hand',cursive;font-size:1.15rem;z-index:5}
.crumb a{display:inline-block;background:var(--pad);color:#111;border:3px solid #111;border-radius:999px;padding:2px 16px;text-decoration:none}
.crumb a:hover{background:#fff3b8}
/* notepad */
.padwrap{position:relative;margin-top:44px}
.pad{position:relative;background:var(--pad);border:9px solid #111;border-radius:3px;padding:clamp(48px,6vw,64px) clamp(22px,4vw,44px) clamp(28px,4vw,44px);color:#111}
.rings{position:absolute;top:-47px;left:5%;right:5%;display:flex;justify-content:space-between;pointer-events:none}
.ring{position:relative;width:24px;height:74px;background:var(--ring);border:6px solid #111;border-radius:16px}
.ring::after{content:"";position:absolute;left:50%;bottom:-20px;width:38px;height:20px;margin-left:-19px;background:#111;border-radius:50% 50% 0 0}
.bigstar{position:absolute;width:clamp(58px,8vw,96px);height:auto;z-index:3;filter:drop-shadow(0 0 0 #111)}
.bigstar.s1{left:calc(-1 * clamp(26px,4vw,52px));top:28%} .bigstar.s2{right:calc(-1 * clamp(18px,3vw,38px));bottom:14%;width:clamp(44px,6vw,72px)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,3vw,30px)}
.note{position:relative;isolation:isolate;display:grid;place-items:center;aspect-ratio:1/1;padding:12px;text-align:center;text-decoration:none;color:#111;
  font-family:'Patrick Hand','Comic Sans MS',cursive;font-size:clamp(1.5rem,3.6vw,2.7rem);line-height:1.05}
.note::before,.card::before,.paper::before{content:"";position:absolute;inset:0;transform:translate(9px,9px) rotate(1.2deg);background:var(--sheet,#fff);border:3px solid #111;z-index:-2}
.note::after,.card::after,.paper::after{content:"";position:absolute;inset:0;background:var(--c,var(--sage));border:4px solid #111;border-radius:2px;z-index:-1}
.note .pin{position:absolute;top:-17px;left:63%;width:36px;height:36px;z-index:2}
.note:hover,.note:focus-visible{transform:translate(-2px,-3px)}
.note{transition:transform .15s}
.note.sage{--c:var(--sage)} .note.teal{--c:var(--teal)} .note.deep{--c:var(--deep)} .note.pink{--c:var(--pink)}
.note small{display:block;font-size:.42em;margin-top:.5em;opacity:.8}
.hubcard{text-align:center}
.hubcard h1{font-size:clamp(2.1rem,5vw,3.4rem);margin-bottom:.45em}
.hubcard p{font-family:'Patrick Hand',cursive;font-size:clamp(1.15rem,2.2vw,1.45rem);letter-spacing:.06em;line-height:1.55;margin:0 auto 18px;max-width:30ch}
.hubcard img{width:clamp(110px,16vw,150px);height:auto;display:block;margin:0 auto}
.lead h1{font-size:clamp(2.3rem,5.4vw,4.2rem);margin-bottom:.35em}
h1:focus{outline:none}
.lead p{font-size:clamp(1.05rem,1.8vw,1.25rem);line-height:1.9;text-align:center;margin:0 auto;max-width:46ch}
.lead .sub{font-family:'Patrick Hand',cursive;font-size:1.3rem;margin-top:18px}
/* content pages */
.page{max-width:1000px;margin:0 auto;padding:clamp(84px,9vw,110px) clamp(16px,4vw,40px) 80px;position:relative}
.page>header{margin-bottom:30px}
.page h1.display{font-size:clamp(2.4rem,6vw,4.2rem)}
.page .std{font-family:'Patrick Hand',cursive;font-size:1.3rem;margin:.4em 0 0;color:var(--muted)}
.tag{display:inline-block;border:4px solid #111;border-radius:2px;padding:2px 18px 4px;font-family:'Patrick Hand',cursive;font-size:1.5rem;color:#111;background:var(--c);transform:rotate(-1.5deg);margin-bottom:14px}
.tag.sage{--c:var(--sage)} .tag.teal{--c:var(--teal)} .tag.deep{--c:var(--deep);color:#fff} .tag.pink{--c:var(--pink)}
.paper{--c:var(--paper);--sheet:var(--paper);position:relative;isolation:isolate;color:var(--paper-text);padding:clamp(20px,4vw,40px)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px}
.card{position:relative;isolation:isolate;display:block;text-decoration:none;color:#111;padding:18px 18px 20px;min-height:132px;transition:transform .15s}
.card:hover,.card:focus-visible{transform:translate(-2px,-3px)}
.card .code{font-family:'Patrick Hand',cursive;font-size:1.1rem;opacity:.75}
.card .ttl{font-family:'Patrick Hand',cursive;font-size:1.65rem;line-height:1.1;display:block;margin-top:4px}
.card.sage{--c:var(--sage)} .card.teal{--c:var(--teal)} .card.deep{--c:var(--deep)} .card.pink{--c:var(--pink)}
.pagernav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;flex-wrap:wrap}
.btn{font-family:'Patrick Hand',cursive;font-size:1.2rem;background:var(--pad);color:#111;border:3px solid #111;border-radius:999px;padding:4px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#fff3b8}
.btn[aria-pressed="true"]{background:var(--teal)}
/* markdown content */
.md{font-size:1.06rem;line-height:1.75;max-width:70ch}
.md p{margin:.4em 0 .9em} .md ul,.md ol{margin:.3em 0 1em;padding-left:1.4em} .md li{margin:.3em 0}
.md h4.sec{font-family:'Patrick Hand',cursive;font-weight:400;font-size:1.45rem;margin:1.2em 0 .2em;color:var(--deep);border-bottom:3px dotted var(--ring);display:inline-block}
:root[data-theme="dark"] .md h4.sec{color:var(--ring)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .md h4.sec{color:var(--ring)}}
.md strong{font-weight:600}
.tscroll{overflow-x:auto;max-width:100%;margin:.4em 0 1.2em}
table.t{border-collapse:collapse;width:100%;font-size:.98rem}
table.t th,table.t td{border:2px solid #111;padding:8px 12px;text-align:left;vertical-align:top}
table.t th{background:var(--pad);color:#111;font-family:'Patrick Hand',cursive;font-size:1.15rem;font-weight:400}
.inclass{background:var(--chip);border:3px dashed #111;border-radius:4px;padding:10px 16px;margin:0 0 6px;font-size:1rem;max-width:70ch;color:var(--paper-text)}
/* reading */
.read{font-family:'Lexend','Verdana',sans-serif}
.seg{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 24px;align-items:center}
.pg{list-style:none;margin:0 0 26px;padding:0}
.pgcard{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;background:var(--paper);color:var(--paper-text);border:4px solid #111;border-radius:2px;padding:22px 24px;margin-bottom:20px;position:relative}
.pgcard .no{font-family:'Patrick Hand',cursive;font-size:1.3rem;background:var(--pad);color:#111;border:3px solid #111;border-radius:999px;padding:0 14px;width:max-content}
.pgcard .tx{font-size:clamp(1.3rem,2.6vw,1.65rem);line-height:1.8;letter-spacing:.015em;word-spacing:.08em;margin:0}
.pgcard .tx strong{background:var(--chip);padding:0 .2em;border-radius:4px;font-weight:600}
.pgcard .pic{border:3px dashed var(--muted);border-radius:6px;padding:10px 14px;font-family:'Lora',serif;font-size:.98rem;color:var(--muted)}
.pgcard .pic b{font-family:'Patrick Hand',cursive;font-weight:400;font-size:1.1rem;color:var(--paper-text)}
.listen{justify-self:start}
.hidepics .pic{display:none}
.tail p{margin:.5em 0}
.tail strong{background:var(--chip);padding:0 .2em;border-radius:4px;font-weight:600}
/* vocab */
.vtools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.vtools input{font:inherit;font-size:1.05rem;padding:8px 14px;border:3px solid #111;border-radius:999px;background:var(--paper);color:var(--paper-text);min-width:220px}
.vt td.w{font-weight:600;white-space:nowrap}
.vt button.sp{font-size:1rem;background:var(--pad);border:2px solid #111;border-radius:999px;cursor:pointer;margin-left:6px;padding:0 8px;color:#111}
.vt td .pic{color:var(--muted);font-style:italic}
@media(max-width:720px){
  .vt thead{display:none} .vt,.vt tbody,.vt tr,.vt td{display:block;width:100%}
  .vt tr{border:3px solid #111;border-radius:4px;margin-bottom:14px;padding:6px 4px;background:var(--paper)}
  .vt td{border:0;padding:4px 10px} .vt td::before{content:attr(data-l);display:block;font-family:'Patrick Hand',cursive;font-size:.95rem;color:var(--deep)}
  .vt td.w{white-space:normal;font-size:1.3rem}
}
.empty{text-align:center;padding:30px 10px}
.empty .display{font-size:2.4rem;margin-bottom:.3em}
.foot{text-align:center;font-family:'Patrick Hand',cursive;font-size:1.05rem;color:var(--muted);padding:0 0 30px}
.themebtn{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20}
@media print{
  body{background:#fff !important;color:#000}.crumb,.pagernav,.themebtn,.foot,.btn,.listen,.vtools{display:none !important}
  .paper::before,.card::before,.note::before,.paper::after{display:none}.page{padding:0}.paper{border:0;padding:0;color:#000;background:#fff}.md{max-width:none;font-size:11pt;line-height:1.45}
  .pgcard{break-inside:avoid;border-color:#000}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}

html,body{overflow-x:clip}
.inclass{margin-bottom:26px !important}
.note.deep small{color:#fff;opacity:1}
.paper.flat{}
@media(max-width:720px){
  .paper.flat{padding:0;--c:transparent}
  .paper.flat::before,.paper.flat::after{display:none}
  .themebtn{font-size:1rem;padding:2px 12px}
  .page{padding-top:92px}
}

.essay{padding:clamp(24px,5vw,56px) clamp(20px,6vw,72px)}
.essay p{font-family:'Lora',Georgia,serif;font-size:clamp(1.12rem,1.7vw,1.3rem);line-height:1.95;max-width:64ch;margin:0 0 1.15em}
.essay p:first-child::first-letter{font-family:'Sue Ellen Francisco','Comic Sans MS',cursive;float:left;font-size:4.6em;line-height:.78;padding:.06em .12em 0 0}
.essay strong{background:var(--chip);padding:0 .18em;border-radius:3px;font-weight:600}
.listenrow{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.homesec{margin-bottom:34px}
.homesec h2{font-size:clamp(1.8rem,4vw,2.6rem);margin:0}
.homesec .std{font-family:'Patrick Hand',cursive;font-size:1.2rem;color:var(--muted);margin:.2em 0 .6em}
.homesec ul{max-width:68ch}
.homesec li{margin:.6em 0}

.quiz h2{font-size:clamp(1.8rem,4vw,2.6rem)}
.quiz .std{font-family:'Patrick Hand',cursive;font-size:1.2rem;color:var(--muted);margin:.2em 0 1em}
.qq{margin:0 0 26px;max-width:62ch}
.qtext{font-size:1.12rem;margin:0 0 .6em}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:1.05rem;line-height:1.45;text-align:left;background:var(--paper);color:var(--paper-text);border:3px solid #111;border-radius:6px;padding:10px 14px;cursor:pointer}
.opt:hover:not(:disabled){background:var(--chip)}
.opt.right{background:var(--sage);color:#111;font-weight:600}
.opt.wrong{background:var(--pink);color:#111;text-decoration:line-through}
.opt:disabled{cursor:default}
.fb{margin:.6em 0 0;min-height:1.4em;font-size:1rem}
.fb.ok{font-weight:600}
.qzscore{font-family:'Patrick Hand',cursive;font-size:1.4rem;margin:.4em 0 .8em}
@media print{.quiz{display:none}}

.lead .tag{margin-bottom:10px}
.fairdate{text-align:center;margin:20px auto 0;max-width:46ch}
.how{max-width:42ch;margin:20px auto 0;padding-left:1.4em;font-size:1.05rem;line-height:1.7}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:26px}
.stepcard{position:relative;background:var(--paper);color:var(--paper-text);border:4px solid #111;border-radius:2px;padding:20px 24px 20px 92px;max-width:78ch}
.stepcard h2{font-size:clamp(1.6rem,3.4vw,2.2rem);margin:0 0 .3em}
.stepcard p{margin:.35em 0}
.stepcard .ex{background:var(--chip);border:2px dashed #111;border-radius:4px;padding:8px 12px;margin-top:.8em}
.stepno{position:absolute;left:20px;top:20px;width:52px;height:52px;border:4px solid #111;border-radius:50%;background:var(--c,var(--pad));color:#111;display:grid;place-items:center;font-family:'Patrick Hand',cursive;font-size:1.8rem}
@media(max-width:560px){.stepcard{padding:76px 18px 18px}.stepno{left:18px;top:16px}}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:26px;margin-bottom:26px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:26px}
.fcard{position:relative;background:var(--paper);color:var(--paper-text);border:4px solid #111;border-radius:2px;padding:20px 22px}
.fcard h2{font-size:clamp(1.6rem,3vw,2.1rem);margin:.2em 0 .3em}
.fcard ul{padding-left:1.3em;margin:.4em 0}.fcard li{margin:.35em 0}
.fcard .ex{background:var(--chip);border:2px dashed #111;border-radius:4px;padding:8px 12px}
.fcard.tip{background:var(--chip);max-width:none}
.fcard[style*="--c"]{border-top:18px solid var(--c)}
.chip{display:inline-block;font-family:'Patrick Hand',cursive;font-size:1.15rem;background:var(--c,var(--pad));color:#111;border:3px solid #111;border-radius:999px;padding:0 14px}
details.ans{margin:.3em 0 1.2em}
details.ans summary{cursor:pointer;font-family:'Patrick Hand',cursive;font-size:1.25rem;color:var(--deep)}
:root[data-theme="dark"] details.ans summary{color:var(--ring)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) details.ans summary{color:var(--ring)}}
.catname{font-size:clamp(1.7rem,3.4vw,2.4rem);margin:36px 0 14px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px}
.idea{background:var(--paper);color:var(--paper-text);border:4px solid #111;border-radius:2px;padding:16px 18px}
.idea h3{font-family:'Patrick Hand',cursive;font-weight:400;font-size:1.45rem;line-height:1.15;margin:0 0 .5em}
.idea p{margin:.3em 0;font-size:.98rem;line-height:1.5}
.idea .need{color:var(--muted)}
.board{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px;border:6px solid #111;background:var(--pad);padding:14px;border-radius:3px;max-width:820px;color:#111}
.bp{display:grid;gap:10px;align-content:start}
.bp b{display:grid;place-items:center;text-align:center;border:3px solid #111;border-radius:3px;background:#fff;padding:18px 8px;font-family:'Patrick Hand',cursive;font-weight:400;font-size:1.3rem}
.bp.l b:nth-child(odd){background:var(--sage)}.bp.m b:nth-child(odd){background:var(--pink)}.bp.r b:nth-child(odd){background:var(--teal)}
.bt{border:3px solid #111;border-radius:3px;background:var(--ring);text-align:center;padding:16px 8px;font-family:'Sue Ellen Francisco','Comic Sans MS',cursive;font-size:1.8rem;text-transform:uppercase}
@media(max-width:560px){.board{grid-template-columns:1fr}}
.opts.two{grid-template-columns:1fr 1fr;max-width:420px}
.btn.big{font-size:1.5rem;padding:8px 26px}
.soon{background:var(--chip);border:3px dashed #111;border-radius:4px;padding:12px 16px}
</style>

b('3-PS2-1','The Tug of War',
[`Jaylen and Christian pulling opposite ends of a towel, neither moving, Pepper between them.`,`Kennedy shaking her head, April holding a notebook.`,`A towel with a ribbon tied in the middle and a tape mark on the floor below it, Mrs. Swinea pointing.`,`Two panels: ribbon stays at the mark, then slides toward Christian.`,`Diagram: two equal arrows pointing opposite ways labeled balanced, and one long arrow with one short arrow labeled unbalanced.`,`A book on a table with an arrow pointing down labeled gravity and an arrow pointing up labeled table.`,`A kid on a bike braking, a seatbelt in an inset.`,`The crew and Pepper holding the towel together.`],
[`Jaylen and Christian pulled on a towel. Neither one moved! "Nothing is happening," said Jaylen.`,`Kennedy said, "If nothing moves, there are no **forces**." April said, "Let's test it. We need **evidence**."`,`Mrs. Swinea tied a ribbon to the middle of the towel. April wrote, "If one side pulls harder, the ribbon will move."`,`At first the ribbon stayed. Then Christian pulled harder. The ribbon moved toward him!`,`Forces that are the same size, pulling opposite ways, are **balanced**. Nothing changes. If one force is bigger, they are **unbalanced**. Motion changes.`,`A book sat on the table. Gravity pulls it down. The table pushes it up. The forces are balanced!`,`When you brake on a bike, the forces are unbalanced. The bike slows down.`,`Balanced forces: no change in motion. Unbalanced forces: motion changes.`],
`*Tell it again:* First, ______. Then, ______. This shows that unbalanced forces ______.

*Words to know:* **force** · **motion** · **balanced forces** · **unbalanced forces** · **evidence**

*Try it at home:* Play tug of war with a towel. Pull the same, then pull harder. What changes?`,
[`At recess, Jaylen and Christian each grabbed one end of a towel and pulled. They pulled as hard as they could, but the towel did not move an inch. "Nothing is happening," Jaylen said, a little out of breath.`,`"If nothing is moving, then there aren't any **forces**," Kennedy said. April opened her notebook. "I'm not sure that's right. We need evidence. Let's design a test." Pepper trotted over to see what the fuss was about.`,`Mrs. Swinea tied a ribbon in the middle of the towel and put a piece of tape on the ground under it. "Watch the ribbon," she said. April wrote her prediction: "If one person pulls harder than the other, the ribbon will move toward the stronger puller."`,`The boys pulled evenly at first, and the ribbon stayed right over the tape. Then Christian leaned back and pulled harder. The ribbon slid toward him. "The ribbon moved when one side was stronger!" April cheered.`,`Mrs. Swinea explained what the crew had seen. When forces are the same size and pull in opposite directions, they are **balanced**, so the object does not change how it moves. When one force is bigger, the forces are **unbalanced**, and the object speeds up, slows down, or changes direction. Kennedy realized that forces had been acting the whole time.`,`Christian placed a book on the table. "Is anything pushing or pulling on it?" he asked. Mrs. Swinea nodded. Gravity pulls the book down, and the table pushes it up, with the same strength. "Balanced forces keep it still," she said.`,`On the way home, Jaylen thought about his bike. When he squeezed the brakes, the forces on the bike became unbalanced, and it slowed down. Seatbelts and helmets are designed using the same idea, so that unbalanced forces do less harm to people.`,`Kennedy read her notes. "I was wrong," she said. "Something can be still and still have forces on it." The crew had evidence that balanced forces cancel out and unbalanced forces change motion.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that balanced forces ______ and unbalanced forces ______. What forces are acting on you right now? ______

*Words to know:* **force** · **motion** · **balanced forces** · **unbalanced forces** · **evidence**

*Try it at home:* Play tug of war with a rolled-up towel and a ribbon tied in the middle. Predict what will happen when one person pulls harder, then test it.`);
b('3-PS2-2','The Swinging Washer',
[`Jaylen holding a string with a washer swinging from a doorway, Christian watching, Pepper's head moving side to side.`,`Jaylen pointing to a heavier stack of washers, April with a notebook.`,`Three washers taped together and one single washer, April holding a timer.`,`Kennedy's data chart: one washer and three washers with the same number of swings.`,`Three strings of different lengths side by side with the shortest one swinging fastest.`,`April pointing to a medium string with a question mark.`,`A playground swing and a grandfather clock with a pendulum.`,`The crew and Pepper around the chart.`],
[`Jaylen made a **pendulum** from a string and a washer. It swung back and forth, back and forth. "There is a **pattern**," said Christian.`,`"A heavier weight will swing faster," said Jaylen. April said, "Let's test it. We need **evidence**."`,`They counted swings for 10 seconds. First with one washer. Then with three. The string stayed the same.`,`One washer: 9 swings. Three washers: 9 swings! The weight did not change the pattern.`,`Next they changed the string. Short string: 11 swings. Long string: 6 swings. A shorter string swings faster.`,`Now they could **predict**. April said, "A medium string will swing about 8 times." She was right!`,`A playground swing and a clock pendulum use patterns too. Patterns help us predict.`,`Some motion repeats in a pattern. We can use the pattern to predict.`],
`*Tell it again:* First, ______. Then, ______. This shows that a pattern can help us ______.

*Words to know:* **pattern** · **predict** · **pendulum** · **measure** · **motion**

*Try it at home:* Tie a washer to a string. Count swings in 10 seconds. Change the string length. What happens?`,
[`Jaylen tied a metal washer to a string and hung it from a doorframe. When he gave it a gentle push, it swung back and forth, back and forth. "Look at that," said Christian. "It keeps repeating. There's a **pattern**." Pepper's head moved side to side as she watched.`,`"I bet a heavier weight swings faster," Jaylen said. April grabbed her notebook. "That's an idea, but it isn't **evidence** yet. We should measure it." Mrs. Swinea reminded them to change only one thing at a time.`,`The crew taped three washers together and kept one washer by itself. April held a timer and Kennedy counted. Jaylen wrote his prediction: "The three-washer pendulum will swing faster." They used the same string length and the same starting push for both.`,`In ten seconds, the single washer swung 9 times. The three washers swung 9 times too! Kennedy recorded the results and checked them twice. "The weight didn't change the pattern," she said. "My idea was wrong," Jaylen admitted.`,`April suggested changing the string instead. With a short string, the pendulum swung 11 times in ten seconds. With a long string, it swung only 6 times. "The length of the string changes the pattern," Mrs. Swinea said. "A shorter string swings faster."`,`"Now we can use the pattern to make a **prediction**," said April. She tied a medium string and predicted about 8 swings. They tested it, and the pendulum swung 8 times. Kennedy circled the number in her notebook.`,`Back at the playground, Christian noticed that a swing moves in the same kind of pattern. Mrs. Swinea told them that old clocks use pendulums to keep time, and that tides, seasons, and the moon's phases follow patterns too. "Finding patterns lets us predict what comes next," she said.`,`The crew looked at the chart. They had evidence that the length of the string, not the weight, changes how a pendulum swings. Jaylen smiled. "A wrong idea helped us find the right one."`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the ______ changes how a pendulum swings. What other pattern could you use to predict something? ______

*Words to know:* **pattern** · **predict** · **pendulum** · **measure** · **motion**

*Try it at home:* Make a pendulum from a string and a washer. Count swings in 10 seconds. Predict what a shorter string will do, then test it.`);
b('3-PS2-3','The Dancing Paper Bits',
[`Christian holding a magnet near a paper clip that jumps toward it, Pepper tilting her head.`,`April holding up her hands, Kennedy with a notebook.`,`A tray with a paper clip, a steel nail, aluminum foil, and a penny, Mrs. Swinea pointing.`,`The magnet with the clip and nail stuck to it, the foil and penny left on the tray.`,`Diagram: a magnet with small arrows showing a pull across a gap.`,`Two bar magnets, one pair pulling together and one pair pushing apart.`,`Jaylen with a balloon over a pile of paper bits, Pepper's fur lifting toward the balloon.`,`The crew around the tray and the balloon.`],
[`Christian held a magnet near a paper clip. It jumped to the magnet! It did not even touch. "How did it do that?"`,`"Magnets stick to all metals," said April. Kennedy said, "Let's test it."`,`Mrs. Swinea set out a paper clip, a nail, foil, and a penny. April wrote, "All of them will stick."`,`The clip and the nail stuck. The foil and the penny did not. "I was wrong," said April.`,`A **magnet** pulls on only some metals, like iron and steel. The pull works across a gap.`,`Kennedy turned one magnet around. They pushed apart! Magnets can **attract** and **repel**.`,`Jaylen rubbed a balloon on his hair. It picked up paper bits. **Static electricity** pulls without touching too.`,`Magnets and static can push or pull without touching.`],
`*Tell it again:* First, ______. Then, ______. This shows that magnets ______.

*Words to know:* **magnet** · **attract** · **repel** · **pole** · **static electricity**

*Try it at home:* Test a magnet on a paper clip, foil, a coin, and a nail. Which ones stick?`,
[`Christian held a magnet an inch above a paper clip, and the clip suddenly leaped up to meet it. It had never been touched! "How does that work?" he asked. Pepper tilted her head, trying to figure it out too.`,`"I know the answer," said April. "Magnets stick to all metals." Kennedy flipped open her notebook. "That's a claim. Let's collect evidence before we decide."`,`Mrs. Swinea laid out four items on a tray: a steel paper clip, a steel nail, a piece of aluminum foil, and a penny. April predicted, "Everything on the tray will stick, because they're all metal." The crew would record what happened with each one.`,`The magnet picked up the paper clip and the nail. The foil did not move, and neither did the penny. April stared at the tray. "I was wrong," she said. "Some metals don't stick at all." Kennedy wrote it down.`,`Mrs. Swinea explained that a **magnet** pulls on iron, steel, and a few other metals, but not on aluminum or copper. The magnet's force works across a small gap, so objects don't have to touch. "That's what you saw with the paper clip jumping," she said.`,`Kennedy held two magnets and slowly brought them together. Sometimes they snapped together, and sometimes they pushed apart. "The ends are called **poles**," said Mrs. Swinea. "Opposite poles **attract**, and matching poles **repel**."`,`Jaylen rubbed a balloon on his hair and held it over a pile of paper bits. They jumped up and clung to the balloon. Even Pepper's fur lifted toward it. "That's **static electricity**," said Mrs. Swinea. "It's a different force, but it also pulls without touching."`,`The crew studied the tray. Magnets and static electricity can push and pull without touching. April grinned. "My wrong guess made us test everything. Now I know which metals stick."`],
`*Tell it again:* First, ______. Then, ______. This is evidence that magnets ______ some metals but not others. Where have you seen a magnet or static electricity at home? ______

*Words to know:* **magnet** · **attract** · **repel** · **pole** · **static electricity**

*Try it at home:* Test a magnet on a paper clip, aluminum foil, a coin, and a nail. Predict first, then sort what sticks and what does not.`);

b('3-PS2-4','The Magnet Latch',
[`Pepper standing on her back legs with the treat cabinet door swinging open, Jaylen holding his head.`,`Mrs. Swinea with a challenge card, Kennedy writing a problem statement.`,`Jaylen taping a magnet to the cabinet door only, April pointing at the empty frame.`,`The door swinging open with the magnet dangling, Pepper happily inside.`,`A steel washer taped to the frame, a magnet on the door, the door shut.`,`Pepper tugging at the door while two magnets hold it, Christian giving a thumbs-up.`,`A refrigerator door and a cabinet latch with small magnet icons.`,`The crew and Pepper by the treat cabinet.`],
[`Pepper kept opening the treat cabinet! "We have to fix this," said Jaylen.`,`Mrs. Swinea said, "Name the **problem**. Then use a magnet to solve it." Kennedy wrote, "Keep the door shut. Easy for people to open."`,`Jaylen taped a magnet to the door. April asked, "What will it stick to?"`,`They tested it. The door swung open! A magnet needs something to pull on.`,`Jaylen taped a steel washer to the frame. The magnet pulled on the washer. The door stayed shut!`,`Pepper pulled hard. The door opened a little. Christian said, "Let's **improve** it." They added a second magnet. Pepper could not open it. A person could.`,`Refrigerator doors and cabinet latches use magnets like this.`,`A good design solves a problem. Test it, then make it better.`],
`*Tell it again:* First, ______. Then, ______. This shows that we can use magnets to ______.

*Words to know:* **problem** · **design** · **solution** · **test** · **improve**

*Try it at home:* Use a magnet and a steel washer or paper clip to hold a note, a lid, or a door shut. Test it. How could you make it better?`,
[`For the third time that day, Pepper had nosed open the treat cabinet and helped herself. Jaylen sighed as he gathered up the scattered biscuits. "We have to stop her," he told the crew, "but we also have to be able to open it ourselves."`,`Mrs. Swinea handed out a challenge card. "Engineers begin by naming the **problem** clearly," she said. "Then they use science ideas to design a solution." Kennedy wrote the goals: "Keep the door shut. Pepper can't open it. Easy for people to open."`,`Jaylen taped a strong magnet to the cabinet door. "That should do it," he said. April tilted her head. "What is the magnet going to stick to?" She pointed at the empty wooden frame. Jaylen paused. "Let's test it," he said.`,`Jaylen shut the door. It stayed closed for a moment, then drifted open on its own, and Pepper wiggled right in. "A magnet can't pull on wood," Kennedy said. "It needs something made of iron or steel."`,`Jaylen taped a steel washer to the frame where the magnet touched. This time the magnet pulled on the washer, and the door clicked shut. "My first design had a flaw, and now we've found it," said Jaylen.`,`Pepper pushed at the door with her nose and it popped open. "Let's **improve** it," said Christian. They added a second magnet and a second washer. Now Pepper could not open the door, but Jaylen could with a gentle tug. The design met all three goals.`,`Mrs. Swinea showed them how many products use magnets to solve problems, such as refrigerator doors, cabinet latches, and tool holders in a garage. "Engineers designed all of these by noticing a problem and testing ideas," she said.`,`The crew looked at their notes. Their first design had failed, but testing helped them find the problem and improve it. Jaylen grinned at Pepper, who sat outside the cabinet looking sad. "Sorry, girl," he said.`],
`*Tell it again:* First, ______. Then, ______. This shows that engineers ______. What problem at home could you solve with a magnet? ______

*Words to know:* **problem** · **design** · **solution** · **test** · **improve**

*Try it at home:* Pick a small problem, like keeping a lid or note in place. Design a fix with a magnet and a steel washer or paper clip. Test it and improve one thing.`);
b('3-LS1-1','The Caterpillar Cup',
[`A clear cup with a tiny caterpillar on food, the crew looking in, Pepper sniffing from a distance.`,`Kennedy with a thought bubble of a tiny butterfly, Christian with a notebook.`,`A notebook with a daily drawing chart, a ruler beside the cup.`,`Four panels of a caterpillar growing, hanging as a chrysalis, and a butterfly drying its wings.`,`A circle diagram: egg, caterpillar, chrysalis, butterfly, then back to egg.`,`A bean plant cycle (seed, sprout, plant, flower, seeds) next to a frog cycle.`,`A family photo timeline from a baby to a grown-up, Pepper as a puppy in the first photo.`,`The crew around the cup and the circle diagram.`],
[`Mrs. Swinea gave the crew a cup. A tiny caterpillar was inside. "What will happen to it?" asked Christian.`,`Kennedy said, "It is a baby butterfly. It will just get bigger." April said, "Let's watch and see."`,`They drew the caterpillar every day. Christian wrote, "It will grow and grow."`,`The caterpillar ate and got big. Then it hung up and made a chrysalis. After a week, a butterfly came out! It looked very different.`,`A **life cycle** has stages. This one: egg, caterpillar, chrysalis, butterfly. The butterfly lays eggs. The cycle starts again.`,`A bean plant has a life cycle too. Seed, sprout, plant, flower, new seeds.`,`People have life cycles. Jaylen put his photos in order, from baby to now.`,`Every living thing is born, grows, makes new life, and dies.`],
`*Tell it again:* First, ______. Then, ______. This shows that every living thing ______.

*Words to know:* **life cycle** · **organism** · **reproduce** · **metamorphosis** · **stage**

*Try it at home:* Put baby photos in order. What stayed the same? What changed?`,
[`One Monday, Mrs. Swinea handed the crew a clear plastic cup. At the bottom was a caterpillar no bigger than a grain of rice, resting on a bit of food. "What do you think will happen to this caterpillar?" Christian asked. Pepper kept a polite distance.`,`"It's just a baby butterfly," Kennedy said. "It'll get bigger and bigger until it's a full-sized butterfly." April shook her head. "Maybe, maybe not. Let's watch carefully and keep records."`,`The crew made a notebook page for daily drawings and measurements. Christian predicted, "The caterpillar will grow and grow, and then it will turn into a bigger caterpillar." Kennedy wrote the same prediction, and everyone agreed to check each morning.`,`For about a week, the caterpillar ate and grew, shedding its skin several times. Then it hung from the lid and wrapped itself in a hard shell called a chrysalis. A little over a week later, the shell cracked, and a butterfly climbed out and slowly unfolded its wings. It looked nothing like the caterpillar!`,`"That change is called **metamorphosis**," said Mrs. Swinea. "The butterfly has completed one **stage** of a **life cycle**." She drew a circle: egg, caterpillar, chrysalis, butterfly. Adult butterflies lay eggs, so the cycle begins again. "Every living thing is born, grows, reproduces, and eventually dies."`,`Jaylen brought out his bean plant and a frog diagram from a library book. A bean plant begins as a seed, sprouts, grows leaves, flowers, and makes new seeds. A frog begins as an egg, becomes a tadpole, then a froglet, and finally an adult frog. "Different cycles, same big steps," said April.`,`Christian wondered if people have a life cycle too. Jaylen lined up his family photos from newborn to now. "We're born, we grow, and someday we may have kids of our own," he said. Pepper was in the first photo as a tiny puppy.`,`Kennedy read her notes and smiled. "I thought it was just a baby butterfly," she said. "But it changes in a special way." The crew had evidence that every living thing has a life cycle, even when the stages look very different.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that all living things ______. How is a butterfly's life cycle different from yours? ______

*Words to know:* **life cycle** · **organism** · **reproduce** · **metamorphosis** · **stage**

*Try it at home:* Plant a bean in a zip bag with a wet paper towel, and tape it to a window. Draw what you see each day, then sort your drawings into stages.`);
b('3-LS2-1','The Meerkat Lookout',
[`The crew watching a video of meerkats on a classroom screen, one meerkat standing tall as a lookout.`,`April with arms behind her head, Kennedy holding up an evidence card.`,`Three video thumbnails on the screen: meerkats, wolves, and a school of fish.`,`Three panels: a lookout meerkat barking an alarm, wolves surrounding an elk, fish swirling in a tight group as a bird dives.`,`Diagram: a group of animals with arrows labeled food, safety, and babies.`,`Pepper snuggled with Jaylen's family on a couch, a wolf pack shown in a faint inset.`,`A family working together on a task and a sports team celebrating.`,`The crew and Pepper around the evidence cards.`],
[`The crew watched a video about meerkats. One meerkat stood tall and looked around. "Why is she standing there?" asked Christian.`,`April said, "Animals live in groups just to be friends." Kennedy said, "Let's find **evidence**."`,`Mrs. Swinea showed three videos: meerkats, wolves, and fish. They wrote what the group did.`,`Meerkats: the lookout warned of danger. Wolves: they hunted a big elk together. Fish: they swam in a tight group. A bird could not pick just one.`,`Groups help animals **survive**. They find food, stay safe, and take care of babies.`,`Jaylen said, "Pepper loves our family." Dogs came from wolves that lived in packs.`,`People live in groups too. Families and teams get big jobs done together.`,`Animals live in groups because groups help them survive.`],
`*Tell it again:* First, ______. Then, ______. My claim is that animals live in groups because ______.

*Words to know:* **group** · **survive** · **defend** · **claim** · **evidence**

*Try it at home:* Watch a short video of a herd, flock, or school. How does the group help each animal?`,
[`The crew was watching a nature video when Christian pointed at the screen. One meerkat stood on her back legs, scanning the sky while the rest of the group dug for food. "Why isn't she eating with the others?" he asked.`,`"I think animals just live in groups because they like each other," April said. Kennedy shook her head. "That's a claim, but we need evidence. Let's collect some." Mrs. Swinea handed out evidence cards.`,`Mrs. Swinea queued up three more videos: meerkats, wolves, and a school of fish. The crew decided to record what the group did in each one and whether it helped. April wrote her prediction: "We'll see them playing and hanging out."`,`In the first video, the meerkat lookout barked an alarm and the whole group dove into their burrow as a hawk swooped over. In the second, wolves surrounded an elk, a prey animal far too large for one wolf to catch alone. In the third, the fish swirled in a tight group, and the hungry bird could not single out one fish.`,`"A group can do things that one animal can't," said Mrs. Swinea. Groups help animals **survive** in three big ways: finding food, **defending** against predators, and caring for young. "That's your evidence," she said. Kennedy filled out the card.`,`Jaylen cuddled up to Pepper on the couch. "She's part of our family pack," he said. Mrs. Swinea told them that dogs descended from wolves, which live in packs, and that Pepper still acts like a pack member when she waits for the family to come home.`,`Christian wondered if people use groups the same way. "Families, sports teams, and classes all work together," said April. "Together we can do jobs that are too big for one person." Kennedy nodded. "Like the Lab Crew."`,`April read through the cards. "I thought they only stayed together for fun," she said. "Now I have proof that groups help them survive." The crew wrote their claim and listed three pieces of evidence beneath it.`],
`*Tell it again:* First, ______. Then, ______. My claim is that animals live in groups because ______. My evidence is ______. How does a group of people help each other? ______

*Words to know:* **group** · **survive** · **defend** · **claim** · **evidence**

*Try it at home:* Watch a short video about a herd, flock, or school. Write a claim about why the animals live in a group, and list two pieces of evidence.`);

b('3-LS3-1','The Puppy Chart',
[`The crew peeking into a box of puppies at a neighbor's house, Pepper sniffing from the doorway.`,`Jaylen pointing to the mother dog, Kennedy holding a clipboard.`,`April's chart with columns for mom, dad, and each puppy, and a few photos taped in.`,`Six puppies in a row, some brown, some black, some with floppy ears, some with pointy ears.`,`Diagram: two parent dogs with arrows to puppies and labels trait and variation.`,`A tray of bean seeds in different sizes sorted into three piles.`,`A farmer choosing seeds and a gardener holding up a large tomato.`,`The crew and Pepper around the chart.`],
[`Jaylen's neighbor had new puppies. The crew went to see them. "They are so cute!" said Christian.`,`"The puppies are copies of their mom," said Jaylen. Kennedy said, "Let's check the **data**."`,`April made a chart. Mom: brown fur, floppy ears. Dad: black fur, pointy ears. April wrote, "All the puppies will look like mom."`,`They counted six puppies. Some were brown. Some were black. Some had floppy ears. Some had pointy ears. No two were the same!`,`Puppies **inherit** **traits** from both parents. But each puppy is a little different. That is **variation**.`,`Bean seeds from one plant have variation too. Some are big. Some are small.`,`Farmers and gardeners pick plants and animals with helpful traits.`,`Offspring are like their parents, but not exactly the same.`],
`*Tell it again:* First, ______. Then, ______. This shows that offspring ______.

*Words to know:* **trait** · **inherit** · **offspring** · **variation** · **data**

*Try it at home:* Sort a bag of dried beans or seeds by size and color. Make a chart. How many are in each group?`,
[`When Jaylen's neighbor announced that her dog had given birth to six puppies, the Lab Crew hurried over. The puppies tumbled around inside a box while Pepper sniffed at them from the doorway. "They're so tiny!" said Christian.`,`"They all look like their mom," Jaylen said, pointing to the large brown dog. Kennedy raised her clipboard. "That's a claim. Let's collect **data** and see whether it's true." She asked the neighbor if they could photograph the parents too.`,`April drew a chart with a column for the mom, the dad, and each puppy, and a row for each **trait**: fur color and ear shape. The mom had brown fur and floppy ears. The dad had black fur and pointy ears. April predicted, "All the puppies will look like their mom."`,`The crew filled in the chart. Three puppies were brown and three were black. Four had floppy ears and two had pointy ears. One puppy had black fur and floppy ears, a mix of its parents. "No two puppies are exactly alike," said April.`,`Mrs. Swinea explained that offspring **inherit** traits from both parents, so they resemble their parents but are not exact copies. The differences among individuals of the same kind are called **variation**. "Your chart is your evidence," she said.`,`Back at the table, Christian sorted a bag of bean seeds from one plant into piles. Some seeds were large, some small, and some in between. "Even seeds from the same plant vary," he said. Kennedy graphed the three piles.`,`Mrs. Swinea told them that farmers and gardeners choose seeds and animals with helpful traits, like large fruit or strong roots, and that scientists track variation to protect species. "Understanding traits helps us grow food and care for living things," she said.`,`Jaylen studied the chart. "I thought they would all be copies of their mom," he said. "But they got traits from both parents, and they're all a little different." The crew had evidence of inherited traits and variation.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that offspring ______ but also ______. Why might variation be helpful? ______

*Words to know:* **trait** · **inherit** · **offspring** · **variation** · **data**

*Try it at home:* Collect ten leaves from the same tree or a bag of dried beans. Measure or sort them, make a chart, and describe what is the same and what is different.`);
b('3-LS3-2','The Two Bean Plants',
[`Christian planting two bean seeds from the same bag in two cups.`,`Kennedy with arms crossed, April holding a ruler.`,`One cup on a sunny windowsill, one in a dark closet, a label on each.`,`Two plants side by side: a short green one and a tall, thin, pale one, April measuring.`,`Diagram: a plant with arrows labeled inherited and environment.`,`Pepper lying next to an empty treat bag, looking round and happy.`,`A gardener watering tomato plants and giving them stakes.`,`The crew and Pepper around the two plants.`],
[`Christian planted two bean seeds from the same bag. "They are the same kind of plant," he said.`,`Kennedy said, "Plants only get their traits from their parents." April said, "Let's test it. We need **evidence**."`,`They put one pot in the sun. They put one in a dark closet. They gave both the same water. Kennedy wrote, "They will look the same."`,`After 10 days, the sun plant was short, green, and strong. The dark plant was tall, thin, and pale! "The **environment** changed the plant," said April.`,`Some **traits** come from parents. The environment can **influence** how traits show up.`,`Pepper ate too many treats. She got heavier. Food is part of her environment.`,`Gardeners give plants the right light and water so they grow well.`,`Traits come from parents and from the environment.`],
`*Tell it again:* First, ______. Then, ______. This shows that the environment can ______.

*Words to know:* **environment** · **trait** · **influence** · **inherited** · **evidence**

*Try it at home:* Grow two bean seeds in cups. Put one in sunlight and one in a dark closet. Give both the same water. Measure each week.`,
[`Christian opened a bag of bean seeds and planted two of them in separate cups of soil. "They came from the same bag, so they're the same kind of plant," he said. "They should grow up exactly alike, right?"`,`"Plants get all their traits from their parents," Kennedy said confidently. "So yes, they'll look the same." April picked up a ruler. "That's a claim. Let's design a test and measure." Mrs. Swinea reminded them to change only one thing.`,`The crew placed one cup on a sunny windowsill and the other in a dark closet. They gave both cups the same amount of water at the same time. Kennedy wrote her prediction: "Both plants will look the same, since they have the same parents." April labeled the cups.`,`After ten days, April measured both plants. The sun plant was short, with thick green leaves. The closet plant was tall, thin, and pale! "They look completely different," said Christian. "The environment must have changed them."`,`Mrs. Swinea explained that some **traits** are inherited, but the **environment** can change how those traits show up. Light, water, food, and temperature can all **influence** how living things grow. "Both plants had the same inherited traits," she said. "The light made the difference."`,`Jaylen glanced at Pepper, who was sprawled next to an empty treat bag, looking rounder than usual. "Pepper's weight is influenced by her environment too," he said. "Too many treats!" Pepper thumped her tail, not at all sorry.`,`Mrs. Swinea told them that gardeners and farmers adjust light, water, and soil to help plants grow well. Coaches and doctors know that food, sleep, and exercise influence how people grow and stay strong. "The environment matters for every living thing," she said.`,`Kennedy looked at the two plants. "I was wrong," she said. "Traits come from parents, but the environment matters too." The crew had evidence that the same kind of plant can grow differently depending on its surroundings.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that the environment can ______. What part of your environment helps you grow? ______

*Words to know:* **environment** · **trait** · **influence** · **inherited** · **evidence**

*Try it at home:* Grow two bean seeds, one in sunlight and one in a dark closet, with the same water. Predict what will happen, then measure and draw each week.`);
b('3-LS4-1','The Fossil Box',
[`Mrs. Swinea opening a box of fossils, Christian holding a shell in a rock, Pepper sniffing the box.`,`April with a big dinosaur sketch, Kennedy with a clipboard.`,`A tray sorted into shell, fern leaf, shark tooth, and footprint sections.`,`Close-ups of a clam shell fossil, a fern leaf fossil, and a shark tooth fossil.`,`Diagram: a fossil with arrows labeled what lived and where it lived.`,`A split picture: an ocean scene for the shell and tooth, a warm wet forest for the fern.`,`Christian pressing a shell into clay, a small map of Maryland with Calvert Cliffs pinned.`,`The crew and Pepper around the tray.`],
[`Mrs. Swinea opened a box of fossils. Christian held a rock with a shell in it. "Is this from a dinosaur?" he asked.`,`"All fossils are from dinosaurs," said April. Kennedy said, "Let's look at the **data**."`,`The crew sorted the fossils into piles: shells, a fern leaf, a shark tooth, and a footprint. April wrote, "Every fossil is a dinosaur."`,`None of them were dinosaurs! They had a clam shell, a fern leaf, and a shark tooth.`,`A **fossil** is what is left of a living thing from long ago. Fossils tell us what lived and where.`,`A clam shell and a shark tooth mean there was an ocean. A fern leaf means there was warm, wet land.`,`Christian pressed a shell into clay to make a fossil print. People find shark tooth fossils at Calvert Cliffs in Maryland.`,`Fossils are clues about life long ago.`],
`*Tell it again:* First, ______. Then, ______. This shows that fossils ______.

*Words to know:* **fossil** · **organism** · **environment** · **extinct** · **evidence**

*Try it at home:* Press a shell or a toy into clay. What does the print tell you?`,
[`Mrs. Swinea set a heavy cardboard box on the table and lifted the lid. Inside, wrapped in paper towels, were rocks of different shapes. Christian picked up a stone with a curved shell pressed into it. "Is this from a dinosaur?" he asked. Pepper sniffed the box.`,`"All fossils come from dinosaurs," April said, drawing a quick sketch of a T. rex. Kennedy shook her head. "That's a claim. Let's look closely at the **data**." Mrs. Swinea handed them each a magnifying glass.`,`The crew sorted the fossils into groups: shells, a fern leaf, a shark tooth, and a footprint. April predicted, "Most of them will be dinosaur bones or teeth." Kennedy made a chart to record what they saw in each one.`,`When they finished, they were surprised. There were no dinosaur bones at all. They had a clam shell, a fern leaf, and a triangular shark tooth. "I was wrong," said April. "Fossils can be plants, shells, and small animals too."`,`Mrs. Swinea explained that a **fossil** is the remains or the mark of a living thing from long ago, preserved in rock. Scientists study fossils to learn which **organisms** lived long ago and what their **environment** was like. "Every fossil is a clue," she said.`,`Jaylen reasoned from the data. "The clam shell and the shark tooth mean there was an ocean here," he said. "And the fern leaf means there was warm, wet land nearby." Mrs. Swinea nodded. Some of these living things are now **extinct**, but their fossils remain.`,`Christian pressed a shell into soft clay to make his own fossil print and then removed it. The shape stayed behind. Mrs. Swinea told them that fossil shark teeth wash out of the cliffs at Calvert Cliffs in Maryland, a sign that an ocean once covered the area.`,`April looked at her sketch of the T. rex and laughed. "I thought every fossil was a dinosaur," she said. "But they're clues to all kinds of life." The crew had evidence of what lived long ago and the places where they lived.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that fossils tell us ______. What could a fossil tell us about our own area? ______

*Words to know:* **fossil** · **organism** · **environment** · **extinct** · **evidence**

*Try it at home:* Press a shell, a leaf, or a toy into clay or salt dough, then remove it. Look at the print. What does it tell you about the thing that made it?`);

b('3-LS4-2','The Bean Hunt',
[`Christian crouching in the yard looking at two beetles, one green and one brown, Pepper sniffing nearby.`,`Jaylen with a thought bubble of a beetle changing color, April with a notebook.`,`A green cloth and a brown cloth with colored beans scattered on them, Kennedy holding a timer.`,`Two pictures of the cloths after the hunt, the matching beans still left.`,`Diagram: a green beetle on a green leaf and a brown beetle on a green leaf with a bird looking at them.`,`April's drawings of bugs for sand, snow, and leaves.`,`A fast rabbit running from a fox and a dark moth on dark bark.`,`The crew and Pepper around the bean charts.`],
[`Christian found two beetles in the yard. One was green. One was brown. "Why are they different?" he asked.`,`"Beetles change color on purpose to stay safe," said Jaylen. April said, "Let's test it."`,`Mrs. Swinea gave them 20 colored beans. They spread them on a green cloth and a brown cloth. Kennedy said, "Be the bird. You have 10 seconds."`,`Beans that matched the cloth were found last. They were hard to see!`,`**Variation** means some beetles are green and some are brown. A beetle that blends in is harder for a bird to see. It lives longer and has babies. Beetles cannot choose their color.`,`April drew bugs for a sandy place, a snowy place, and a leafy place.`,`Other differences help too. Some animals are faster. Some are stronger.`,`A helpful difference can help an animal survive.`],
`*Tell it again:* First, ______. Then, ______. This shows that a helpful difference can ______.

*Words to know:* **variation** · **characteristic** · **advantage** · **camouflage** · **species**

*Try it at home:* Spread colored beans on a patterned cloth. Give friends 10 seconds to grab them. Which beans were hardest to find?`,
[`While weeding the garden, Christian spotted two beetles on the same leaf. One was bright green, and the other was dull brown. "They're the same kind of beetle," he said. "Why do they look so different?" Pepper sniffed at the leaf, then sneezed.`,`"I think beetles change their color on purpose when they need to hide," said Jaylen. April opened her notebook. "That's an idea, but we need evidence. Let's make a model of a bird hunting for beetles."`,`Mrs. Swinea gave the crew twenty beans in different colors to stand for beetles. They spread ten beans on a green cloth and ten on a brown cloth. Kennedy held a timer. "You're the bird," she told Jaylen. "You have ten seconds to grab as many beans as you can."`,`Jaylen grabbed handfuls, but the last beans left were the ones that matched the cloth. The brown beans on brown cloth and the green beans on green cloth were hard to see. April recorded the data. "Beans that blend in are found last," she said.`,`Mrs. Swinea explained that **variation** among individuals of the same **species** can give some of them an **advantage**. A beetle whose color blends in, called **camouflage**, is harder for a bird to spot, so it is more likely to survive and have young. "But a beetle can't choose its color," she said. "The differences are already there."`,`April drew three different bugs in her notebook: a pale one for a sandy place, a white one for a snowy place, and a green one for a leafy place. "The best color depends on the environment," she wrote.`,`Mrs. Swinea told them that camouflage is only one advantage. A rabbit that runs faster can escape a fox, and a plant with thorns is harder to eat. Scientists study variation to understand how living things adapt as their surroundings change.`,`Jaylen looked at the bean data. "I thought they could change color on purpose," he said. "But the ones that match just get found less." The crew had evidence that differences in characteristics can help individuals survive.`],
`*Tell it again:* First, ______. Then, ______. This is evidence that a helpful characteristic can ______. What advantage would help an animal where you live? ______

*Words to know:* **variation** · **characteristic** · **advantage** · **camouflage** · **species**

*Try it at home:* Scatter beans of different colors on a patterned cloth or a lawn. Give each person 10 seconds to collect beans. Which colors were hardest to find, and why?`);
b('3-LS4-3','The Habitat Match',
[`Mrs. Swinea laying out animal cards (penguin, camel, frog) and place cards (desert, ocean, pond), the crew leaning in.`,`April with her hands in the air, Kennedy with a notebook.`,`A chart with each animal's needs in columns, Christian writing.`,`Three panels: a penguin sweating in a desert, a camel standing in a pond, a frog on dry sand.`,`Diagram: a living thing with arrows labeled food, water, shelter, and a matching habitat box.`,`The yard with sunny dandelions and ferns in the shade, Pepper in the middle.`,`A zoo habitat built to match an animal's needs.`,`The crew and Pepper around the cards.`],
[`Mrs. Swinea laid out animal cards and place cards. "Could each animal live in each place?"`,`"Any animal can live anywhere if it tries hard," said April. Kennedy said, "We need **evidence**."`,`They wrote what each animal needs. A penguin needs cold and water. A camel needs hot and dry. A frog needs water.`,`A penguin in the desert? Too hot. A camel in a pond? Not a good fit. A frog on dry sand? Not enough water.`,`Each living thing has **needs**. In the right **habitat**, it can **survive**. In the wrong one, it may not.`,`In the yard, dandelions grew well in the sun. Ferns grew better in the shade. Same yard, different spots.`,`Zookeepers build homes with the right food, water, and shelter.`,`Animals and plants do best where their needs are met.`],
`*Tell it again:* First, ______. Then, ______. My claim is that a ______ can survive in a ______ because ______.

*Words to know:* **habitat** · **survive** · **needs** · **environment** · **claim**

*Try it at home:* Pick an animal and a place. Make a claim about whether it could survive there. Give two reasons.`,
[`Mrs. Swinea spread out two sets of cards on the table. One set showed animals, such as a penguin, a camel, and a frog, and the other showed places, such as a desert, an ocean, and a pond. "Today's question," she said, "is whether each animal could live in each place."`,`"Any animal could live anywhere if it tried hard enough," April said, throwing up her hands. Kennedy opened her notebook. "I'm not sure that's true. We need evidence, so let's make a claim for each match." Pepper sat down next to the cards to watch.`,`The crew made a chart of what each animal needs: the penguin needs cold weather and water for swimming, the camel needs hot, dry land, and the frog needs fresh water. Christian wrote down each place's conditions. April predicted, "Every animal will do fine anywhere."`,`They worked through the matches. A penguin in the desert would overheat and have no ocean to hunt in. A camel in a pond would have nowhere to travel and no desert plants to eat. A frog on dry sand would lose water through its skin and dry out. "These matches don't work," said Christian.`,`Mrs. Swinea explained that each living thing has **needs**, and its body is built for a particular **habitat**. In the right habitat, an organism **survives** well. In a poor fit, it survives less well, and in a very poor fit, it cannot survive at all. "That's your evidence," she said.`,`Jaylen led the crew into the yard to test the idea. Dandelions in the sunny lawn were thriving, but a fern in the same spot looked droopy. Another fern in the shade of the fence was lush and green. "Same yard, different habitats," said Kennedy.`,`Mrs. Swinea told them that zoo designers and gardeners use this idea every day. Zoos build habitats with the right temperature, food, and shelter for each animal, and gardeners choose plants that match their yard's sun, soil, and water.`,`April looked at her prediction and laughed. "Trying hard doesn't change what a body needs," she said. The crew wrote claims backed by evidence for each animal and place.`],
`*Tell it again:* First, ______. Then, ______. My claim is that a ______ can ______ in a ______ because ______. What habitat do you live in, and what do you need there? ______

*Words to know:* **habitat** · **survive** · **needs** · **environment** · **claim**

*Try it at home:* Pick an animal and a place. Make a claim about whether it could survive there, give two reasons, and check a book or website.`);
b('3-LS4-4','The Creek Cleanup',
[`The crew standing at a muddy creek behind school with trash in the water, Pepper on a leash.`,`Kennedy holding a trash bag, April with a clipboard.`,`The crew picking up trash in gloves, three full bags beside them.`,`The creek the next day, still muddy, rain streaks and mud running in from the bank.`,`Jaylen holding grass plugs, a bank with roots holding soil in an inset.`,`Two columns comparing cleanup and planting grasses with check marks and a clock icon.`,`A shoreline of marsh grasses with a small map pin of the Chesapeake Bay.`,`The crew and Pepper at the creek, a few frogs on a log.`],
[`The crew visited the creek behind school. The water was muddy. Trash floated in it. "I used to see lots of frogs," said Christian. "Now I see only two."`,`"Let's pick up the trash and the creek will be fixed," said Kennedy. April said, "Let's test it."`,`Mrs. Swinea helped them clean up. They filled three bags. Kennedy wrote, "The water will be clear tomorrow."`,`The next day the water was still muddy. Rain washed more dirt in.`,`A **solution** has strengths and trade-offs. Jaylen said, "Let's plant grasses on the bank. The roots hold the soil." Cleanup is quick. Grasses take longer but help for years.`,`The crew made a **claim** about the **merit** of each solution. "Do both," wrote Kennedy.`,`Groups in Maryland plant grasses and trees near the Chesapeake Bay.`,`When the environment changes, people can design solutions.`],
`*Tell it again:* First, ______. Then, ______. My claim is that the best solution is ______ because ______.

*Words to know:* **environment** · **change** · **solution** · **merit** · **trade-off**

*Try it at home:* Pick a problem, like trash in a creek. List two solutions. What are the good points and drawbacks of each?`,
[`On a field trip, the crew walked to the creek behind the school. The water was cloudy brown, and bottles and wrappers floated near the bank. "There used to be frogs all along this log," said Christian. "Now I only see two." Pepper pulled at her leash, sniffing the muddy edge.`,`"This is easy to fix," said Kennedy. "If we pick up all the trash, the creek will be healthy again." April wrote it on her clipboard. "That's one solution. Let's test it and see whether it really works." Mrs. Swinea handed everyone gloves.`,`The crew spent an hour picking up bottles, cans, and plastic bags, and filled three large trash bags. Kennedy wrote her prediction: "Tomorrow the water will be clear, and the frogs will come back." April took photos so they could compare before and after.`,`The next morning, the crew returned to the creek. The trash was gone, but the water was still brown. Rain overnight had washed more soil off the bare bank and into the creek. "The cleanup helped," said April, "but it didn't fix the whole problem."`,`Jaylen knelt down. "What about planting grasses on the bank? Their roots could hold the soil in place." Mrs. Swinea showed them a chart. Cleanup works fast but must be repeated, while planting grasses takes weeks but keeps working. "Every **solution** has strengths and **trade-offs**," she said.`,`The crew compared the two solutions using criteria: does it help the animals, how long does it last, and how much work is it? They each wrote a **claim** about the **merit** of each one. Kennedy wrote, "Cleaning up helps right away. Planting grasses helps for years. We should do both."`,`Mrs. Swinea told them that groups around the Chesapeake Bay plant marsh grasses, trees, and oysters to protect the water and the animals that live in it. "People can design solutions when an environment changes," she said. "And they test them, just like you did."`,`Kennedy read her prediction and shook her head. "One solution wasn't enough," she said. "But now we know what to try next." On the log, a third frog hopped into view, and Pepper wagged her tail.`],
`*Tell it again:* First, ______. Then, ______. My claim is that the best solution is ______ because ______. What would you add to our plan? ______

*Words to know:* **environment** · **change** · **solution** · **merit** · **trade-off**

*Try it at home:* Pick a local problem, like trash or mud in a creek. List two solutions with strengths and trade-offs for each. Which would you choose, and why?`);

b('3-ESS2-1','The Weather Log',
[`Christian at a window looking at a cool, cloudy fall day, Pepper next to him with a leash in her mouth.`,`Jaylen with a thought bubble of a sun and a number 60, Kennedy with a notebook.`,`April's weather log chart pinned to the wall with columns for date, temperature, and sky, a thermometer on the windowsill.`,`A bar graph of daily high temperatures for two weeks with bars of different heights, most in the middle.`,`Diagram: a bar graph with a band highlighted in the middle labeled typical.`,`Two small graphs side by side, this October and last October, with similar shapes.`,`Four small pictures of the seasons: hot summer, golden fall, snowy winter, and rainy spring.`,`The crew and Pepper around the graph.`],
[`Christian looked out the window. It was cool and cloudy. "What is fall weather usually like?" he asked.`,`"Fall weather is the same every day," said Jaylen. Kennedy said, "Let's collect data."`,`April made a weather log. Each day they wrote the **temperature** and what the sky looked like. Jaylen wrote, "It will be 60 degrees every day."`,`After two weeks, they made a bar **graph**. Some days were 55 degrees. Some were 72. Most days were between 58 and 68. Every day was different, but there was a pattern.`,`**Typical** weather is the pattern we expect over many days in a **season**. Any one day can be different.`,`Mrs. Swinea showed last October's weather. It looked much the same.`,`Every **season** has a pattern. Summer is hot. Winter is cold. Farmers, families, and schools plan for them.`,`Graphs help us see what a season is usually like.`],
`*Tell it again:* First, ______. Then, ______. This shows that typical fall weather ______.

*Words to know:* **weather** · **season** · **temperature** · **precipitation** · **graph**

*Try it at home:* Write down the temperature and sky each day for two weeks. Make a bar graph. What is typical?`,
[`On a cool, cloudy morning, Christian stood at the window with Pepper at his side. She had her leash in her mouth. "It's pretty chilly today," he said. "Is this what fall weather is usually like?"`,`"I think fall weather is the same every day," Jaylen said. "About sixty degrees, and cloudy." Kennedy opened her notebook. "That's a claim. Let's collect data for a couple of weeks and see." Mrs. Swinea handed them a thermometer.`,`April made a weather log with columns for the date, the **temperature**, and the sky. Each morning, the crew checked the thermometer and wrote down what they saw. Jaylen wrote his prediction: "The temperature will be about sixty degrees every day."`,`After two weeks, April turned the log into a bar **graph**. Some days reached only 55 degrees, and others hit 72. Most days landed between 58 and 68. "No two days were exactly the same," said Kennedy. "But most of them were close to each other."`,`"That's what we mean by **typical** weather," said Mrs. Swinea. "It's the pattern we expect across many days in a **season**, even though any one day can be different." She drew a band across the middle of the graph to show the typical range.`,`Mrs. Swinea pulled up the records from last October and let the crew graph them next to their own. The two graphs looked similar. "We can use patterns from past years to know what to expect," she said. April noticed that there was **precipitation** on about a quarter of the days.`,`Christian drew the four seasons: hot summer, golden fall, snowy winter, and rainy spring. Mrs. Swinea told them that farmers plan planting around the typical weather, and schools plan for snow days in winter. "Typical weather helps people get ready," she said.`,`Jaylen studied the graph and nodded. "I thought it was the same every day," he said. "But the weather changes, and there's still a pattern." The crew had data to describe fall in their town.`],
`*Tell it again:* First, ______. Then, ______. This shows that typical weather is ______. What would you expect next week, and why? ______

*Words to know:* **weather** · **season** · **temperature** · **precipitation** · **graph**

*Try it at home:* Record the temperature and sky each day for two weeks, then make a bar graph. Find the range where most days fall, then compare it with a weather website's record for the same month last year.`);
b('3-ESS2-2','Postcards From Four Places',
[`Mrs. Swinea unrolling a world map, the crew around a table, Pepper under it.`,`Christian remembering a snowy day with a thought bubble, Kennedy with a notebook.`,`A chart with four places: rainforest, desert, polar region, and Maryland, with columns for temperature and rain.`,`Four postcard pictures: a steamy rainforest, a dry desert with a cactus, an icy polar scene, and four seasons in Maryland.`,`Diagram: a single sunny day box labeled weather and a calendar of many years labeled climate.`,`April packing pretend suitcases, one with a swimsuit and one with a parka.`,`A cactus, a polar bear, and a rainforest frog, each in its place.`,`The crew and Pepper around the finished postcards.`],
[`Mrs. Swinea unrolled a world map. "Let's make postcards from different places," she said.`,`Christian said, "It snowed here once. So our climate is snowy." Kennedy said, "Let's look at the data for the whole year."`,`They looked up four places: a rainforest, a desert, a polar region, and Maryland. They wrote the temperature and rain for each. April wrote, "Maryland will look snowy all year."`,`Rainforest: hot and rainy. Desert: hot days and very little rain. Polar: very cold. Maryland: hot summers, cold winters, and rain all year.`,`**Weather** is what happens on one day. **Climate** is the usual weather in a **region** over many years.`,`They drew postcards. April packed a pretend suitcase for each place.`,`Climate decides which plants grow, which animals live there, and what homes look like.`,`Different regions have different climates.`],
`*Tell it again:* First, ______. Then, ______. This shows that climate is ______.

*Words to know:* **climate** · **region** · **tropical** · **desert** · **polar**

*Try it at home:* Pick two places in the world. Find the usual temperature and rain for each. How are they alike and different?`,
[`Mrs. Swinea unrolled a large world map across the table and set a stack of books beside it. "Today we're going to learn about the climates of four places and send postcards from each one," she said. Pepper stretched out under the table.`,`"It snowed here once last winter," said Christian, remembering. "So I think our climate is snowy." Kennedy opened her notebook. "That was one day, though. Let's collect data about the whole year to find out what our usual weather is."`,`The crew picked four places: a rainforest, a desert, a polar region, and their home state of Maryland. They searched the books and a weather website for the usual temperature and rain in each place. April made a chart and predicted, "Maryland will turn out to be mostly snowy, just like Christian said."`,`The chart told the story. The rainforest is hot and rainy almost all year. The desert has hot days and very little rain. The polar region stays very cold, with ice and snow. Maryland has four seasons, with hot summers, cold winters, and rain throughout the year. "We get snow some winters," said Kennedy, "but not all year."`,`"You've found the difference between weather and climate," said Mrs. Swinea. **Weather** is what the air is like on a particular day. **Climate** is the usual weather in a **region** over many years. "One snowy day tells us about weather, but the whole pattern tells us about climate."`,`Each crew member drew a postcard to show the climate of one place, with a short note about what it's like there. Then April packed a pretend suitcase for each: a swimsuit and rain jacket for the rainforest, sunscreen and a hat for the desert, and a thick parka for the polar region.`,`Mrs. Swinea explained that climate decides which plants can grow in a region, which animals can live there, and even what kinds of homes people build. A cactus thrives in a desert, a polar bear lives where it is icy, and a rainforest frog needs steady rain.`,`Christian looked at the postcards. "I mixed up weather and climate," he said. "Now I get it." Kennedy gave him a high five. The crew had combined information from several sources to describe four climates.`],
`*Tell it again:* First, ______. Then, ______. This shows that climate is ______. How is the climate where you live different from the desert? ______

*Words to know:* **climate** · **region** · **tropical** · **desert** · **polar**

*Try it at home:* Pick two places on a map or globe. Look up the usual temperature and rainfall for each, then compare the places. Decide what you would pack for each.`);
b('3-ESS3-1','The Storm Models',
[`The crew watching dark clouds and rain from a window, Pepper hiding under a chair.`,`April with her arms in the air, Mrs. Swinea smiling.`,`Two small cardboard houses on a table, one with a flat roof and one with a slanted taped roof, Mrs. Swinea holding a fan.`,`The flat roof blown off and the slanted roof still in place.`,`Diagram: a storm cloud with an arrow labeled hazard and a house with a shield labeled solution.`,`A baking pan with a sand slope and a barrier of rocks, Christian pouring water.`,`A family around a table with a checklist, an emergency kit, and a phone showing a weather alert.`,`The crew and Pepper around the models.`],
[`A big storm was coming. Wind blew. Rain fell. "Can we stop the storm?" asked Christian.`,`"We can stop storms," said April. Mrs. Swinea said, "Let's see what we can do."`,`They built two small houses out of cardboard. One roof was flat. One roof was slanted and taped well. Mrs. Swinea held a fan. April wrote, "The wind will blow both houses down."`,`The wind blew the flat roof off. The slanted roof stayed on!`,`We cannot stop storms. But we can design things to reduce **harm**. A good design is a **solution**.`,`Christian poured water on a sand slope. A wall of rocks slowed the water. It was a **flood** barrier.`,`Families can plan too. Pick a safe place and pack a kit. Weather alerts warn us.`,`We can reduce the harm from weather **hazards**.`],
`*Tell it again:* First, ______. Then, ______. This shows that a good design can ______.

*Words to know:* **hazard** · **severe weather** · **design** · **solution** · **merit**

*Try it at home:* Make a family storm plan. Where will you go? What will you bring? Write a checklist.`,
[`Dark clouds rolled in, and the wind began to howl. Rain rattled against the windows as the crew watched from inside. Pepper crawled under a chair. "Is there any way to stop the storm?" Christian asked.`,`"Of course," said April, throwing her arms wide. "We can stop storms. We just have to be smart." Mrs. Swinea raised an eyebrow. "Let's test what we can and can't do. I'll help you design some solutions for the damage a storm can cause."`,`The crew built two small cardboard houses. One had a flat roof, and the other had a slanted roof taped securely at the edges. Mrs. Swinea set up a fan on its lowest setting and kept hold of it herself. April wrote her prediction: "The wind will blow both houses over."`,`Mrs. Swinea switched on the fan. The flat roof peeled off and tumbled away, but the slanted roof stayed in place. "A good design made a difference," said Jaylen. "But the fan was still blowing hard."`,`"We cannot stop a storm," said Mrs. Swinea, "but good design can reduce the **harm** it does." She explained that a weather **hazard** is something that can cause damage or injury, and a **solution** is a design that reduces that harm. The crew would judge each solution's **merit** by how well it protected the house.`,`Next, Christian built a flood model in a baking pan. He piled sand into a slope and made a small town at the bottom. When he poured water down the slope, the town flooded. Then he built a wall of rocks across the slope, and the water slowed down. "That's a barrier," said Kennedy. "It has merit."`,`Mrs. Swinea told them that families and communities use the same ideas for real storms. Builders use strong roofs and tie-downs, towns build walls and storm drains, and meteorologists send alerts. Families can plan a safe place and keep a kit with water, a flashlight, and snacks.`,`April looked at her prediction and smiled. "I thought we could stop storms," she said. "But we can design ways to be safer." Pepper crawled out from under the chair and wagged her tail. The crew had evidence that good design can reduce the harm from weather hazards.`],
`*Tell it again:* First, ______. Then, ______. This shows that a good design can ______. How well did each solution work, and what would you improve? ______

*Words to know:* **hazard** · **severe weather** · **design** · **solution** · **merit**

*Try it at home:* Make a family storm plan with a safe place and a kit checklist. Build a small cardboard house and test a roof design, with an adult holding any fan.`);

b('4-PS3-1','The Fast Car Test',
[`Jaylen letting a toy car go at the top of a ramp, a paper cup at the bottom, Pepper watching.`,`April with arms crossed, Kennedy holding a notebook.`,`Two ramps side by side, one with a single book and one with three, Mrs. Swinea holding a ruler.`,`Kennedy writing numbers, with a ruler beside two slid cups.`,`Simple diagram: a slow car with a short arrow and a fast car with a long arrow.`,`Jaylen rolling a ball at wooden blocks on the grass, Pepper chasing it.`,`A car with a seatbelt and a speed-limit sign.`,`The crew and Pepper around the ramp, notebook open.`],
