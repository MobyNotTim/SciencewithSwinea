/* Layout: one-screen arcade for a 16:9 smart panel (also works on Chromebooks/phones).
   Lobby = grade -> quarter -> game style -> players. Play = top bar with scores, arena, question deck.
   Single deliberate blocky-toy look that matches MESA Boss Battle. */
:root{
  color-scheme:light;
  --ink:#1b2236; --paper:#fffdf5; --paper-2:#eef3f8; --muted:#5a6580;
  --sky-1:#39b6e6; --sky-2:#bfeaf8; --grass:#5cbf4b; --grass-2:#3d8d33;
  --gold:#ffcd2e; --good:#2fae4e; --bad:#e5433a; --heal:#33d17a;
  --a:#e5433a; --b:#2c84de; --c:#f0ad12; --d:#2fae4e;
  --g3:#7cc35a; --g4:#13ada0; --g5:#0b7b8a;
  --display:"MJ Five More Minutes","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"MJ Prettily Printed","Century Gothic","Trebuchet MS",system-ui,sans-serif;
  --step-q:clamp(24px,5.2vh,72px); --step-ans:clamp(20px,4vh,56px);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-2);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,var(--sky-1),var(--sky-2) 70%)}
#app{height:100%;position:relative}
.screen{height:100%;box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400;font-family:var(--display);text-wrap:balance}

.btn{font-family:var(--display);font-size:clamp(20px,3.3vh,42px);color:#fff;background:var(--bc,var(--good));border:4px solid var(--ink);border-radius:14px;
  box-shadow:0 6px 0 var(--ink);padding:.3em 1em .4em;cursor:pointer;transition:transform .08s,box-shadow .08s,filter .15s;text-shadow:0 2px 0 rgba(0,0,0,.25);text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{background:#9aa3b5;cursor:not-allowed;filter:none}
.btn.small{font-size:clamp(16px,2.5vh,30px);padding:.2em .8em .3em;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);text-shadow:none}
.iconbtn{width:clamp(38px,5.4vh,64px);height:clamp(38px,5.4vh,64px);display:grid;place-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);cursor:pointer;padding:0;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.iconbtn svg{width:58%;height:58%}

/* ---------- lobby ---------- */
#lobby{overflow-y:auto;padding-block:2vh 3vh;display:flex;flex-direction:column;gap:1.8vh}
.logo-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-family:var(--display);font-size:clamp(38px,8vh,104px);line-height:.95;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 9px 0 rgba(27,34,54,.35)}
.logo small{display:block;font-size:.34em;-webkit-text-stroke:0;color:var(--ink);text-shadow:none;margin-top:.35em;font-family:var(--body);font-weight:700}
.toprt{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lobby-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2vh 26px;align-items:start}
.panel{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:1.8vh 20px 2.2vh;display:flex;flex-direction:column;gap:1.4vh;min-width:0}
.step{font-size:clamp(20px,3.3vh,40px);display:flex;align-items:center;gap:.4em}
.step b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;background:var(--gold);border:3px solid var(--ink);border-radius:8px;font-weight:400;font-size:.8em;flex:none}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grade{font-family:var(--display);font-size:clamp(20px,3.4vh,42px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;background:var(--gc);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 var(--ink);padding:1vh 8px 1.2vh;cursor:pointer;line-height:1}
.grade small{display:block;font-size:.5em;-webkit-text-stroke:0;margin-top:.2em;opacity:.95}
.grade:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.grade[aria-pressed="true"],.qcard[aria-pressed="true"],.mcard[aria-pressed="true"]{outline:6px solid var(--gold);outline-offset:3px}
.qcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qcard{text-align:left;background:var(--paper-2);border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:.8vh 14px 1vh;cursor:pointer;display:flex;flex-direction:column;gap:.2vh;min-width:0}
.qcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.qcard .qn{font-family:var(--display);font-size:clamp(15px,2.3vh,28px);color:var(--muted)}
.qcard .qt{font-family:var(--display);font-size:clamp(18px,3vh,36px);line-height:1.05}
.qcard .qw{font-size:clamp(15px,2.3vh,28px);font-weight:700;color:var(--muted)}
.bookpick{display:flex;gap:12px;flex-wrap:wrap}
.bk{display:flex;align-items:center;gap:14px;text-align:left;background:var(--paper-2);border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:.8vh 16px .8vh 10px;cursor:pointer;min-width:0}
.bk[aria-pressed="true"]{background:#fff4c2;outline:6px solid var(--gold);outline-offset:3px}
.bk svg{height:clamp(54px,9vh,110px);width:auto;flex:none}
.bk .bt{font-family:var(--display);font-size:clamp(20px,3.4vh,44px);line-height:1;display:block}
.bk .ba{font-size:clamp(15px,2.3vh,28px);font-weight:700;color:var(--muted)}
.chapbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,15vw,230px),1fr));gap:10px}
.chap{text-align:left;background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:.5vh 10px .7vh;cursor:pointer;min-width:0;display:flex;flex-direction:column}
.chap b{font-family:var(--display);font-weight:400;font-size:clamp(14px,2.1vh,26px);color:var(--muted)}
.chap span{font-weight:700;font-size:clamp(15px,2.3vh,28px);line-height:1.1}
.chap[aria-pressed="true"]{background:var(--gold)}
.chap[aria-pressed="true"] b{color:var(--ink)}
.chap:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.answers.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.books{display:flex;flex-wrap:wrap;gap:8px}
.books button{font-family:var(--body);font-weight:700;font-size:clamp(16px,2.5vh,30px);background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:.15em .6em .25em;cursor:pointer;text-align:left}
.books button[aria-pressed="true"]{background:var(--gold)}
.books button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.kindrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qcard.all{grid-column:1/-1;flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
.qcard[aria-pressed="true"]{background:#fff4c2}
.hint{font-size:clamp(16px,2.4vh,30px);font-weight:700;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mcard{border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:0;cursor:pointer;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;min-width:0;text-align:left}
.mcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mcard .art{height:clamp(60px,10vh,130px);background:linear-gradient(180deg,var(--m1),var(--m2));border-bottom:4px solid var(--ink);display:grid;place-items:center}
.mcard .art svg{height:86%;width:auto;max-width:92%}
.mcard .mi{padding:.6vh 10px 1vh;display:flex;flex-direction:column}
.mcard h3{font-size:clamp(18px,3vh,38px);line-height:1.05}
.mcard span{font-size:clamp(14px,2.2vh,27px);font-weight:700;color:var(--muted);line-height:1.15}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{font-family:var(--display);font-size:clamp(17px,2.7vh,34px);min-width:2.4em;background:var(--paper-2);border:3px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:.12em .55em .22em;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold)}
.seg button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt .lbl{font-size:clamp(17px,2.8vh,34px);font-weight:700}
.team-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8vh 12px}
.team-row{display:flex;align-items:center;gap:8px;min-width:0}
.team-row svg{height:clamp(36px,5.4vh,66px);flex:none}
.team-row input{flex:1;min-width:0;font-family:var(--display);font-size:clamp(18px,2.8vh,36px);padding:.15em .45em .25em;border:3px solid var(--ink);border-radius:12px;background:var(--paper-2);color:var(--ink)}
.start-row .btn{font-size:clamp(22px,3.8vh,48px);width:100%}
.ground-strip{height:5vh;min-height:30px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));flex:none;border-top:4px solid var(--ink);
  background-image:linear-gradient(90deg,rgba(0,0,0,.12) 3px,transparent 3px),linear-gradient(var(--grass),var(--grass) 55%,var(--grass-2) 55%);background-size:54px 100%,100% 100%}
.loadnote{font-size:clamp(15px,2.2vh,26px);font-weight:700;color:var(--muted)}

/* ---------- play ---------- */
#play{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:1.1vh;padding-block:1.1vh 1.5vh}
.topbar{display:flex;align-items:center;gap:10px;min-width:0}
.topbar .title{font-family:var(--display);font-size:clamp(17px,3.2vh,42px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.chip{font-family:var(--display);display:inline-flex;align-items:center;gap:.4em;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:.08em .7em .16em;box-shadow:0 3px 0 var(--ink);font-size:clamp(15px,2.7vh,34px);white-space:nowrap}
.scores{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.score{font-family:var(--display);display:flex;align-items:center;gap:.4em;background:var(--paper);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:.05em .6em .12em .3em;font-size:clamp(15px,2.7vh,34px);white-space:nowrap;transition:transform .2s}
.score i{width:1em;height:1em;border:2px solid var(--ink);border-radius:4px;background:var(--tc);display:inline-block}
.score b{font-weight:400;font-variant-numeric:tabular-nums}
.score .nm{max-width:9em;overflow:hidden;text-overflow:ellipsis;color:var(--tc);-webkit-text-stroke:.5px var(--ink)}
.score.active{outline:4px solid var(--gold);outline-offset:2px;transform:translateY(-2px)}
.score .st{font-size:.75em;background:var(--gold);border:2px solid var(--ink);border-radius:6px;padding:0 .3em}

.arena{position:relative;overflow:hidden;border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);background:linear-gradient(180deg,var(--a-sky1),var(--a-sky2));min-height:170px}
.arena[data-mode="boss"]{--a-sky1:#123049;--a-sky2:#2f7f8f;--a-g1:#9aa0b5;--a-g2:#71768a}
.arena[data-mode="obby"]{--a-sky1:#38b6ff;--a-sky2:#d4f4ff}
.arena[data-mode="tycoon"]{--a-sky1:#7fd3ff;--a-sky2:#e8fbff;--a-g1:#6cc84f;--a-g2:#45a035}
.ground{position:absolute;left:0;right:0;bottom:0;height:20%;border-top:4px solid var(--ink);
  background-image:linear-gradient(90deg,rgba(0,0,0,.12) 3px,transparent 3px),linear-gradient(var(--a-g1),var(--a-g1) 40%,var(--a-g2) 40%);background-size:64px 100%,100% 100%}
.stage{position:absolute;inset:0}
.av svg{height:100%;display:block}
.actor{position:absolute;aspect-ratio:60/118;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.actor .hopper svg{width:100%;height:100%}
.actor .hopper{height:100%}
.actor.active .hopper{animation:hop 1.1s ease-in-out infinite}
.actor .tag{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(10px,1.6vh,20px);white-space:nowrap;background:var(--paper);border:2px solid var(--ink);border-radius:8px;padding:0 .4em .1em;color:var(--tc);margin-bottom:2px}
@keyframes hop{0%,100%{translate:0 0}50%{translate:0 -8%}}

/* boss */
.teams{position:absolute;left:3%;bottom:6%;width:50%;height:30%;display:flex;align-items:flex-end;justify-content:space-around}
.teams .actor{position:relative;height:100%}
.teams .actor.active{transform:scale(1.12);transform-origin:bottom center}
.bosswrap{position:absolute;right:5%;bottom:7%;height:66%;aspect-ratio:1/1;max-width:42%}
.boss{width:100%;height:100%;animation:bob 2.4s ease-in-out infinite}
.boss .inner{width:100%;height:100%}
.boss svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.boss.rage svg{filter:drop-shadow(0 0 14px #ff2d2d) drop-shadow(0 8px 0 rgba(0,0,0,.25))}
.boss.rage{animation-duration:1.2s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.2%)}}
.hp{position:absolute;right:3%;top:4%;width:min(40%,620px);display:flex;flex-direction:column;gap:.5vh;z-index:2}
.hp .row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.hp .bname{font-family:var(--display);font-size:clamp(18px,3.4vh,46px);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink);white-space:nowrap}
.hp .num{font-family:var(--display);font-size:clamp(15px,2.6vh,34px);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;font-variant-numeric:tabular-nums;white-space:nowrap}
.hp .bar{height:clamp(16px,3vh,38px);background:#2b2f3f;border:4px solid var(--ink);border-radius:10px;overflow:hidden;position:relative;box-shadow:0 4px 0 var(--ink)}
.hp .ghost{position:absolute;inset:0 auto 0 0;background:#fff;opacity:.6;transition:width 1s .35s ease}
.hp .fill{position:absolute;inset:0 auto 0 0;background:var(--hpc,#3bd16f);transition:width .45s ease;background-image:linear-gradient(180deg,rgba(255,255,255,.35) 0 35%,transparent 35%)}
.rage-tag{align-self:flex-end;font-family:var(--display);background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:0 .5em .1em;font-size:clamp(12px,2vh,26px);animation:pulse .8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.blink{animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.flick{animation:flick .5s steps(2) infinite}
@keyframes flick{50%{transform:translateY(-4px)}}

/* obby */
.slime{position:absolute;left:0;right:0;bottom:0;height:11%;border-top:4px solid var(--ink);background:repeating-linear-gradient(90deg,#7be04a 0 38px,#62cc35 38px 76px)}
.slime::after{content:"";position:absolute;inset:-12px 0 auto;height:12px;background:radial-gradient(circle at 12px 12px,#7be04a 10px,transparent 11px) 0 0/48px 24px repeat-x}
.plat{position:absolute;height:5%;min-height:14px;border:4px solid var(--ink);border-radius:6px;box-shadow:0 5px 0 rgba(0,0,0,.25);transform:translateX(-50%);
  background-image:linear-gradient(180deg,rgba(255,255,255,.35) 0 30%,transparent 30%)}
.plat .pn{position:absolute;left:50%;top:100%;transform:translateX(-50%);font-family:var(--display);font-size:clamp(12px,2vh,26px);color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;margin-top:4px}
.flag{position:absolute;transform:translateX(-50%)}
.flag svg{height:100%;display:block;overflow:visible}
.obby-actor{transition:left .65s cubic-bezier(.3,.7,.4,1),bottom .65s cubic-bezier(.3,.7,.4,1);transform:translateX(-50%)}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.7;box-shadow:30px 10px 0 -6px #fff,-26px 8px 0 -8px #fff}

/* tycoon */
.plots{position:absolute;left:2%;right:2%;bottom:4%;top:6%;display:flex;gap:2%;align-items:flex-end;justify-content:center}
.plot{flex:1;max-width:44%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;position:relative;min-width:0}
.plot .bld{height:76%;width:100%;display:flex;align-items:flex-end;justify-content:flex-end;position:relative}
.plot .bld>svg{height:100%;max-width:76%;overflow:visible}
.plot .bld .actor{position:absolute;left:0;bottom:0;height:40%}
.plot.active .bld .actor .hopper{animation:hop 1.1s ease-in-out infinite}
.plot .sign{font-family:var(--display);background:var(--paper);border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:.1em .6em .2em;font-size:clamp(14px,2.5vh,32px);text-align:center;margin-top:.8vh;max-width:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plot.active .sign{outline:4px solid var(--gold);outline-offset:2px}
.plot .meter{width:80%;height:clamp(10px,1.6vh,20px);border:3px solid var(--ink);border-radius:8px;background:#e7ecf3;overflow:hidden;margin-top:.6vh}
.plot .meter div{height:100%;background:var(--gold);transition:width .4s}
.pc{transform-box:fill-box;transform-origin:center bottom}
.pc.off{display:none}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:3%;background:rgba(15,20,35,.35);z-index:5}
.overlay .card2{background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:0 8px 0 var(--ink);padding:2vh 26px 2.4vh;max-width:min(980px,92%);display:flex;flex-direction:column;gap:1.2vh;align-items:center;text-align:center;box-sizing:border-box}
.overlay h2{font-size:clamp(26px,5.8vh,78px);line-height:1}
.overlay p{margin:0;font-size:clamp(19px,3.6vh,48px);font-weight:700;line-height:1.25;max-width:44ch;-webkit-text-stroke:.02em currentColor}
.overlay .lab{font-family:var(--display);font-size:clamp(14px,2.4vh,30px);color:var(--muted);letter-spacing:.05em}
.overlay .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.overlay.slim{place-items:start start;background:transparent;padding:2%}
.overlay.slim .card2{padding-block:1.4vh 1.8vh;gap:.9vh;max-width:min(1150px,62%)}
.result-good{color:var(--good)} .result-bad{color:var(--bad)}

.deck{display:flex;flex-direction:column;gap:1.1vh;min-width:0}
.qrow{display:flex;align-items:stretch;gap:12px;min-width:0}
.turn{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4vh;background:var(--tc,#888);color:#fff;border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:.6vh 14px;min-width:clamp(100px,13vw,240px);max-width:26%}
.turn .who{font-family:var(--display);font-size:clamp(17px,3.2vh,42px);line-height:1;text-align:center;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;overflow-wrap:anywhere}
.turn .lbl{font-family:var(--display);font-size:clamp(13px,2.2vh,28px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:0 .5em .1em}
.qbox{flex:1;min-width:0;background:var(--paper);border:4px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink);padding:1vh 18px;display:flex;align-items:center;gap:14px}
.qkind{font-family:var(--display);font-size:clamp(13px,2.3vh,30px);color:var(--muted);letter-spacing:.04em}
.qtext{font-size:var(--step-q);line-height:1.18;font-weight:700;-webkit-text-stroke:.025em currentColor;text-wrap:balance}
.qtext .w{background:#fff1a8;border:2px solid var(--ink);border-radius:8px;padding:0 .25em;white-space:nowrap}
.qmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3vh}
.timer{flex:none;width:clamp(46px,7.6vh,96px);aspect-ratio:1;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;background:conic-gradient(var(--tcol,var(--good)) calc(var(--p,1)*360deg),#d9dee8 0);position:relative}
.timer span{position:absolute;inset:16%;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:clamp(15px,2.8vh,36px);font-variant-numeric:tabular-nums}
.timer.low{animation:pulse .5s ease-in-out infinite}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2vh 16px}
.ans{--ac:var(--a);display:flex;align-items:center;gap:12px;text-align:left;background:var(--paper);border:4px solid var(--ink);border-radius:16px;
  box-shadow:0 6px 0 var(--ink),inset 0 -6px 0 color-mix(in srgb,var(--ac) 22%,transparent);min-height:clamp(58px,11vh,150px);padding:.5vh 16px .5vh 10px;cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s,background .2s;min-width:0}
.ans:nth-child(2){--ac:var(--b)} .ans:nth-child(3){--ac:var(--c)} .ans:nth-child(4){--ac:var(--d)}
.ans .key{flex:none;width:clamp(42px,7.4vh,96px);aspect-ratio:1;display:grid;place-items:center;background:var(--ac);color:#fff;border:4px solid var(--ink);border-radius:12px;font-family:var(--display);font-size:clamp(20px,4.2vh,54px);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.ans .txt{font-size:var(--step-ans);line-height:1.15;font-weight:700;-webkit-text-stroke:.022em currentColor;min-width:0;overflow-wrap:anywhere}
.ans.long .txt{font-size:clamp(18px,3.3vh,46px)}
.ans:hover:not([disabled]){background:color-mix(in srgb,var(--ac) 12%,var(--paper))}
.ans:active:not([disabled]){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.ans[disabled]{cursor:default}
.ans.dim{opacity:.38}
.ans.right{background:#d9f7df;outline:6px solid var(--good);outline-offset:-2px} .ans.right .key{background:var(--good)}
.ans.wrong{background:#fde0de} .ans.wrong .key{background:var(--bad)} .ans.wrong .txt{text-decoration:line-through;text-decoration-thickness:3px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.bolt{position:absolute;width:40px;height:40px;border:4px solid var(--ink);border-radius:6px;box-shadow:0 0 18px 6px rgba(255,255,255,.75)}
.orb{position:absolute;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,var(--oc,#9b59ff) 45%,#2a0b4d);border:4px solid var(--ink);box-shadow:0 0 24px 8px var(--oc,#9b59ff)}
.coin{position:absolute;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6b0,#ffcd2e 55%,#d99a00);border:3px solid var(--ink)}
.pop{position:absolute;font-family:var(--display);font-size:clamp(26px,5.6vh,80px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);white-space:nowrap;transform:translate(-50%,-50%)}
.pop.heal{color:var(--heal)} .pop.crit,.pop.gold{color:var(--gold)} .pop.small{font-size:clamp(17px,3.2vh,46px)}
.shard{position:absolute;border:3px solid var(--ink);border-radius:3px}
.banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(34px,8.5vh,130px);color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:0 7px 0 var(--ink);white-space:nowrap;text-align:center}

#results{overflow-y:auto;padding-block:2vh 3vh;display:flex;flex-direction:column;gap:2vh}
.res-head{text-align:center;display:flex;flex-direction:column;align-items:center;gap:.6vh}
.res-head h1{font-size:clamp(38px,8.5vh,116px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);line-height:1}
.res-head p{margin:0;font-size:clamp(18px,3.5vh,44px);font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:.2em .8em .3em;box-shadow:0 4px 0 var(--ink);-webkit-text-stroke:.02em currentColor;max-width:90%}
.stars{display:flex;gap:12px;justify-content:center}
.stars svg{width:clamp(50px,10vh,120px);height:auto}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,2vw,32px)}

.pod .pstat{font-size:clamp(15px,2.5vh,30px);font-weight:700;background:rgba(27,34,54,.55);border-radius:8px;padding:0 .5em .1em;text-align:center}
.mvp{font-family:var(--display);background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:0 .5em .1em;font-size:clamp(16px,2.8vh,36px);box-shadow:0 3px 0 var(--ink)}

<body>
<div id="app">
  <section id="lobby" class="screen">
    <div class="logo-row">
      <div class="logo">Reading Arcade<small>Pick your book and chapters. Pick your game. Play!</small></div>
      <div class="toprt"><a class="btn small ghost" href="index.html#/arcade">Back to Science Arcade</a><button class="iconbtn" id="fsBtn1" aria-label="Full screen" title="Full screen"></button></div>
    </div>
    <div class="lobby-grid">
      <div class="panel">
        <h2 class="step"><b>1</b> Pick your book</h2>
        <div class="bookpick" id="bookPick"></div>
        <h2 class="step"><b>2</b> Pick your chapters</h2>
        <div class="chapbar"><button class="btn small ghost" id="allCh" type="button">All chapters</button><button class="btn small ghost" id="noCh" type="button">Clear</button><span class="hint" id="chCount"></span></div>
        <div class="chaps" id="chaps"></div>
        <div class="opt"><span class="lbl">Question types</span><div class="seg" id="segType"></div></div>
      </div>
      <div class="panel">
        <h2 class="step"><b>3</b> Pick a game</h2>
        <div class="modes" id="modes"></div>
        <h2 class="step"><b>4</b> Who is playing?</h2>
        <div class="seg" id="segPlayers"></div>
        <div class="team-rows" id="teamRows"></div>
        <div class="opt"><span class="lbl">Questions</span><div class="seg" id="segQ"></div></div>
        <div class="opt"><span class="lbl">Timer</span><div class="seg" id="segTimer"></div></div>
        <div class="opt"><span class="lbl">Sound</span><div class="seg" id="segSound"></div></div>
        <div class="start-row"><button class="btn" id="startBtn" disabled>Pick your chapters first</button></div>
      </div>
    </div>
    <div class="ground-strip" aria-hidden="true"></div>
  </section>

  <section id="play" class="screen" hidden>
    <div class="topbar">
      <div class="title" id="pTitle"></div>
      <div class="scores" id="scores"></div>
      <span class="chip" id="qCount"></span>
      <button class="iconbtn" id="soundBtn" aria-label="Sound on or off" title="Sound"></button>
      <button class="iconbtn" id="fsBtn2" aria-label="Full screen" title="Full screen"></button>
      <button class="iconbtn" id="quitBtn" aria-label="Quit to menu" title="Quit to menu"></button>
    </div>
    <div class="arena" id="arena"><div class="stage" id="stage"></div><div class="overlay" id="ov" hidden></div></div>
    <div class="deck">
      <div class="qrow">
        <div class="turn" id="turn"><span class="lbl" id="turnLbl">YOUR TURN</span><span class="who" id="turnWho"></span></div>
        <div class="qbox">
          <div class="qmain"><span class="qkind" id="qKind"></span><div class="qtext" id="qText"></div></div>
          <button class="iconbtn" id="sayBtn" aria-label="Read the question out loud" title="Read it to me"></button>
          <div class="timer" id="timer" hidden><span id="timerNum"></span></div>
        </div>
      </div>
      <div class="answers" id="answers"></div>
    </div>
  </section>

  <section id="results" class="screen" hidden>
    <div class="res-head"><h1 id="resTitle"></h1><p id="resSub"></p></div>
    <div class="stars" id="stars" hidden></div>
    <div class="podium" id="podium"></div>
    <div class="res-btns">
      <button class="btn" id="againBtn">Play again</button>
      <button class="btn" style="--bc:var(--b)" id="menuBtn">Change game or words</button>
      <button class="btn ghost" id="reviewBtn">Review the words</button>
    </div>
    <div class="panel review" id="review" hidden><h2 class="step">Review</h2><ol id="reviewList"></ol></div>
    <div class="ground-strip" aria-hidden="true"></div>
  </section>
</div>

<script>
/* Vocabulary snapshot taken from index.html when this page was built.

const SNAPSHOT={};

/* Novels for reading groups. Each question: [type, question, [correct, wrong, wrong, wrong], why]. Types: r = what happened, d = think deeper, v = vocabulary, l = literary elements. */
const NOVELS=[{"id": "frindle", "title": "Frindle", "author": "Andrew Clements", "color": "#2c84de", "chapters": [{"n": 1, "t": "Nick", "q": [["r", "In third grade, what did Nick turn Miss Deaver's classroom into?", ["A tropical island", "A pirate ship", "A space station", "A dinosaur museum"], "Nick got the class to make paper palm trees and wear tropical outfits."], ["r", "How did Nick make the classroom feel hot like an island?", ["He turned up the thermostat", "He opened all the windows", "He brought in heat lamps", "He plugged in space heaters"], "He turned up the heat, sprinkled sand on the floor, and the kids took off their shoes."], ["r", "What sound did Nick copy in Mrs. Avery's fourth-grade class?", ["A red-winged blackbird's high-pitched call", "A dog's bark", "A hawk's screech", "A cricket's chirp"], "Red-winged blackbirds make a sound that confuses birds of prey."], ["d", "Why did Nick pick the blackbird call for Mrs. Avery's class?", ["He thought her nose looked like a hawk's beak", "Mrs. Avery loved birds", "It was the only sound he could make", "She asked the class to make animal sounds"], "The call confuses hawks, and Nick thought Mrs. Avery looked like one."], ["r", "Who did Mrs. Avery wrongly blame for the bird noises?", ["Janet Fisk", "Nick Allen", "The whole class", "A student from another room"], "She accused Janet, then apologized. Nick told Janet the secret, and she joined in."], ["r", "Did Mrs. Avery ever find out who was making the noises?", ["No, never", "Yes, the next day", "Yes, at the end of the year", "Yes, Janet told her"], "Nick and Janet made the sound all year and were never caught."], ["l", "Where does Frindle take place?", ["Lincoln Elementary School in Westfield, New Hampshire", "A middle school in New York City", "A summer camp in Maine", "A school in California"], "The setting is Nick's school and hometown."], ["v", "Nick turned up the thermostat. What is a thermostat?", ["A device that controls the temperature", "A thermometer for checking a fever", "A light switch", "A kind of fan"], "A thermostat sets how warm or cool a room is."], ["l", "Which word best describes Nick in Chapter 1?", ["Creative", "Shy", "Lazy", "Mean"], "Nick is always full of ideas and knows how to make them happen."]]}, {"n": 2, "t": "Mrs. Granger", "q": [["r", "What subject does Mrs. Granger teach?", ["Language arts", "Math", "Science", "Music"], "She is the only language arts teacher at Lincoln Elementary."], ["r", "What happens to a student Mrs. Granger catches chewing gum?", ["The gum goes on an index card pinned to their shirt, and a parent must sign it", "They get a week of detention", "They write 100 lines", "They are sent to the principal"], "The card has to come back to school the next day signed by a parent."], ["r", "How many words are on Mrs. Granger's weekly vocabulary list?", ["35", "10", "20", "50"], "She also gives a Word for the Day every morning."], ["r", "What does Mrs. Granger give her class every morning?", ["A Word for the Day", "A spelling bee", "A riddle", "A pop quiz"], "Students who skip it get two words the next day."], ["r", "What did Mrs. Granger's letter in August ask families to do?", ["Have one of her preferred dictionaries at home", "Buy new pens", "Read 20 books over the summer", "Cover their textbooks"], "She expected every student to use a dictionary for homework."], ["d", "Why did Nick groan about the letter?", ["He would rather ask his dad or brother what a word means", "He hates reading", "He had lost his dictionary", "He never got the letter"], "Nick liked words but did not like looking them up himself."], ["r", "What is the name of Nick's older brother?", ["James", "John", "Jacob", "Peter"], "James later writes home from college."], ["l", "The kids say Mrs. Granger has X-ray vision. What do they really mean?", ["She notices everything, even hidden gum", "She wears special glasses", "She can read minds", "She can see in the dark"], "This is an exaggeration to show how sharp she is."], ["d", "Mrs. Granger is short, but she seems like a giant to students. What does this show?", ["She is powerful and strict in her classroom", "She is new to teaching", "She is shy", "She stands on a chair"], "Her strong eyes and rules make students feel small."]]}, {"n": 3, "t": "The Question", "q": [["r", "Which class period is Mrs. Granger's class?", ["Seventh period", "First period", "Third period", "Right after lunch"], "Language arts is Nick's last class of the day."], ["r", "What is a teacher-stopper?", ["A question that gets the teacher talking so there is no time for homework", "A trick to end class early", "A note sent to the principal", "A kind of hall pass"], "Nick was an expert at choosing questions teachers loved to answer."], ["r", "What question did Nick ask Mrs. Granger?", ["Where do all the words in the dictionary come from?", "Why do we need homework?", "Who wrote the first book?", "How many words are in English?"], "He hoped it would get her talking until the bell."], ["r", "How did Mrs. Granger answer Nick's question?", ["She asked him to research it and give a report", "She ignored it", "She sent him to the office", "She talked about it for the whole period"], "She asked if the class was curious, and they were."], ["d", "Why did Nick's plan backfire?", ["He still got homework, plus a report", "The class laughed at him", "He got detention", "She answered in one sentence"], "Mrs. Granger assigned the homework anyway."], ["r", "What nickname do kids use for Mrs. Granger?", ["The Lone Granger", "The Word Wizard", "Granny Grammar", "The Dictionary Queen"], "It is a play on the name of an old TV hero."], ["v", "Mrs. Granger gave a vocabulary pretest. What is a pretest?", ["A test given before learning, to see what you already know", "The final test", "A practice game", "A test only teachers take"], "The prefix pre- means before."], ["d", "What does this chapter show about Mrs. Granger?", ["She is clever and hard to trick", "She does not like questions", "She forgot about homework", "She wants Nick to fail"], "She saw through Nick's plan right away."]]}, {"n": 4, "t": "Word Detective", "q": [["r", "What is the Allen family rule about homework?", ["Do it first thing after school", "Only on weekends", "After dinner", "There is no rule"], "Nick's parents insist homework comes first."], ["r", "Who wrote home from college to thank his parents for the homework rule?", ["James", "Nick", "Janet", "Mr. Allen"], "James said the rule helped him get great grades."], ["r", "What could Nick hear outside while he did his homework?", ["A baseball game", "An ice cream truck", "A parade", "Fireworks"], "He had to finish his work first."], ["r", "What did Nick find at the front of his dictionary?", ["An article about words and their origins", "A map of the world", "A list of jokes", "A note from Mrs. Granger"], "He thought it would make his report easy."], ["r", "Why didn't that article help Nick?", ["It was too hard to understand", "Pages were missing", "It was in another language", "It was only one sentence"], "He could not understand most of it."], ["r", "Where did Nick look next?", ["The encyclopedias in his family room", "The public library", "His brother's laptop", "Janet's notes"], "He read about dictionaries in the children's and adult encyclopedias."], ["r", "How long did Nick think his report needed to be?", ["About three minutes", "About an hour", "Ten pages", "One sentence"], "He worried he would not have enough to say."], ["v", "What does origins mean?", ["Where something comes from or begins", "How something ends", "How a word is spelled", "How much something costs"], "The origins of a word are its beginnings."], ["l", "Why is this chapter called Word Detective?", ["Nick searches for clues about where words come from", "Nick solves a crime", "A detective visits the school", "Nick finds a lost dictionary"], "He hunts through books for information, like a detective."]]}, {"n": 5, "t": "The Report", "q": [["r", "According to Nick's report, who made the first modern English dictionary?", ["Samuel Johnson", "Noah Webster", "Benjamin Franklin", "William Shakespeare"], "Samuel Johnson made his dictionary in the 1700s."], ["r", "About how many words were in Samuel Johnson's dictionary?", ["More than 43,000", "About 500", "Exactly one million", "About 100"], "The class was amazed by that number."], ["r", "After talking for a long time, what did Nick do next?", ["Read aloud from the front of his dictionary", "Showed a movie", "Asked the class questions", "Sat down"], "It was phase two of his plan to use up class time."], ["d", "Why did the class act so interested in Nick's long report?", ["They knew a long report meant less time for lessons", "They loved dictionaries", "They were afraid of Nick", "Mrs. Granger promised a prize"], "They were helping Nick's plan by playing along."], ["r", "Who does Mrs. Granger say decides what words mean?", ["Everyone who speaks the language", "Dictionary companies", "Teachers", "The government"], "She said Nick and everyone else decide."], ["r", "What did Mrs. Granger say would happen if everyone started using a new word?", ["It would end up in the dictionary someday", "It would be banned", "It would be forgotten", "People would get in trouble"], "This idea gives Nick his big idea in the next chapter."], ["d", "How did Mrs. Granger still get her lesson taught?", ["She fit a whole day's work into the last eight minutes", "She gave Nick an F", "She stopped the report right away", "She kept the class after school"], "Nick did not try to stop her."], ["l", "Mrs. Granger says people decide what goes in the dictionary. What does this foreshadow?", ["Nick will make up a word that people start using", "Nick will move away", "Mrs. Granger will retire", "Janet will write a dictionary"], "Foreshadowing is a hint about what will happen later."], ["v", "Nick worried about being the teacher's pet. What does that mean?", ["A student the teacher seems to favor", "The class hamster", "A student who feeds the pets", "The class troublemaker"], "Nick did not want his friends to think he was trying to please the teacher."]]}, {"n": 6, "t": "The Big Idea", "q": [["r", "Who was Nick walking home with?", ["Janet Fisk", "His brother James", "Mrs. Granger", "His dad"], "They balanced on the curb as they walked."], ["r", "What did Janet find on the ground?", ["A fancy gold pen", "A dollar bill", "A key", "A dictionary"], "Nick later picks it up after bumping into her."], ["r", "When Nick was a toddler, what did his made-up word gwagala mean?", ["Music", "Cookie", "Dog", "Bedtime"], "His family understood it, but he learned to say music for everyone else."], ["d", "Why did remembering gwagala matter?", ["It showed that people understand a made-up word if they agree on its meaning", "Nick missed being little", "Janet asked about it", "He wanted to sing a song"], "It connected to what Mrs. Granger said about words."], ["r", "What did Nick call the pen when he handed it back to Janet?", ["A frindle", "A gwagala", "A pinna", "A scribbler"], "This is the very first time the word appears."], ["r", "How did Nick test whether frindle could become a real word?", ["He and his friends asked a store clerk for a frindle until she understood", "He put up posters", "He wrote to a dictionary company", "He called a TV station"], "By the sixth day, the clerk knew exactly what Janet meant."], ["r", "What did Nick and five friends promise?", ["To use only frindle and never say pen", "To never do homework", "To keep the word a secret", "To buy everyone pens"], "They signed it in Nick's playroom."], ["v", "Nick and his friends signed an oath. What is an oath?", ["A serious promise", "A kind of pen", "A punishment", "A type of bread"], "Taking an oath means promising something seriously."], ["l", "What is the big idea in this chapter's title?", ["Making up the new word frindle", "Running for class president", "Opening a store", "Writing a book"], "Nick wants to see if a made-up word can become real."]]}, {"n": 7, "t": "Word Wars", "q": [["r", "What did Nick tell Mrs. Granger at the start of class?", ["That he forgot his frindle", "That he forgot his homework", "That he felt sick", "That the new word was silly"], "The class laughed at the funny new word."], ["r", "How did one of Nick's friends help?", ["Dug a pen out of his backpack and tossed it to Nick", "Told the teacher it was a joke", "Hid Nick's pens", "Started a song"], "The friend made a big show of it."], ["r", "What did Mrs. Granger hold up when she talked to Nick after class?", ["Her favorite maroon pen", "Her giant dictionary", "A detention slip", "A ruler"], "She made it clear the word for it was pen."], ["d", "Why did Nick keep his eyes wide and blank?", ["To look innocent so he would not get in trouble", "He was tired", "He could not see well", "He was scared of the dark"], "He insisted he really had forgotten his frindle."], ["r", "What did Nick promise as he ran out of the room?", ["To never forget his frindle again", "To stop using the word", "To apologize to the class", "To do extra homework"], "It was another joke that kept the word going."], ["d", "Why would the word spread quickly among students?", ["It was funny and fun to say", "Teachers required it", "It was already on TV", "It was a bad word"], "A funny word is easy for kids to pick up."], ["v", "Mrs. Granger pursed her lips. What does that mean?", ["She pressed her lips together, showing she was not pleased", "She smiled widely", "She whistled", "She opened her mouth to yell"], "Pursed lips often show disapproval."], ["l", "What kind of conflict does the title Word Wars suggest?", ["A battle over words between Nick and Mrs. Granger", "A real war", "A spelling bee", "A fight between friends"], "The conflict is between student and teacher."]]}, {"n": 8, "t": "Mightier Than the Sword", "q": [["r", "What did the fifth graders do when their class picture was taken?", ["Said frindle and held up pens", "Made silly faces", "Closed their eyes", "Turned around"], "Nick's friends whispered the plan to everyone."], ["r", "Why was that the only class photo taken?", ["The photographer was out of film", "The camera broke", "Mrs. Granger left", "It started to rain"], "The fifth grade was the last class photographed."], ["r", "What was the punishment for saying frindle instead of pen?", ["Staying after school to write sentences", "Losing recess", "A call home", "An extra test"], "Mrs. Granger posted a notice about it."], ["d", "Why did detention with Mrs. Granger become a badge of honor?", ["So many kids did it together that it felt like being on a team", "There were prizes", "They played games", "Mrs. Granger gave out candy"], "Being punished together made kids proud, not sorry."], ["r", "What did Mrs. Granger ask Nick to do with her sealed envelope?", ["Sign and date the back", "Open it right away", "Mail it", "Throw it away"], "The letter inside was for Nick."], ["d", "Why did Mrs. Granger have Nick sign and date the envelope?", ["So he would know the letter was not changed later", "To practice his cursive", "To sign a contract", "To get his autograph"], "He would get the letter when the whole thing was over."], ["r", "When every fifth grader asked Mrs. Granger for a frindle, how many students stayed after school?", ["80", "8", "20", "500"], "The next day, more than 200 students stayed."], ["r", "Who is the principal of Lincoln Elementary?", ["Mrs. Chatham", "Mrs. Avery", "Miss Deaver", "Mrs. Freed"], "She stayed to help with all the students, and later visits Nick's family."], ["l", "The title comes from the saying The pen is mightier than the sword. What does it mean?", ["Words and ideas can be more powerful than fighting", "Pens are sharper than swords", "Swords are useless", "Writing can hurt you"], "Nick's word is causing a big change without any fighting."]]}, {"n": 9, "t": "Chess", "q": [["r", "Who visits Nick's home in this chapter?", ["The principal, Mrs. Ch function wordsFor(grade,set){
  if(!grade||!set)return [];

  return (DATA[set]?DATA[set].words:[]).map(w=>Object.assign({q:set},w));
}
function booksFor(grade,set){
  if(!grade||!set)return [];
  if(set==="all"){const out=[],seen=new Set();for(let q=1;q<=4;q++){(STORIES[grade+"-"+q]?STORIES[grade+"-"+q].books:[]).forEach(b=>{if(!seen.has(b.id)){seen.add(b.id);out.push(b);}});}return out;}
  return STORIES[set]?STORIES[set].books:[];
}
function chosenBooks(){const bs=booksFor(S.grade,S.set);if(S.book){const b=bs.find(x=>x.id===S.book);if(b)return [b];}return bs;}
function bookItems(b){const t=S.text==="both"?"all":S.text,out=[];

function buildStoryQuestions(books,n){

function setLabel(){
  if(S.kind==="novel"){const N=novel();return `${N.title} · ${S.chs.length===N.chapters.length?"Whole book":chapRange()}`;}
  if(S.kind==="stories"){const bs=chosenBooks();if(S.book&&bs.length===1)return `${GRADE_INFO[S.grade].name} · ${bs[0].t}`;
    if(S.set==="all")return `${GRADE_INFO[S.grade].name} · Stories from the whole year`;
    const q=S.set.split("-")[1];return `${GRADE_INFO[S.grade].name} · Quarter ${QWORD[q]} stories`;}
  if(S.set==="all")return `${GRADE_INFO[S.grade].name} · Whole year`;
  const q=S.set.split("-")[1];return `${GRADE_INFO[S.grade].name} · Quarter ${QWORD[q]}: ${DATA[S.set]?DATA[S.set].name:""}`;

function blankOf(w){const re=new RegExp("(^|[^A-Za-z])("+reEsc(w.w)+")(?![A-Za-z])","i");const m=w.ex.match(re);if(!m)return null;return w.ex.replace(re,(all,pre)=>pre+"_____");}
function buildQuestions(words,n){
  const total=n===0?words.length:Math.min(n,Math.max(words.length,n));
  const order=[];while(order.length<total){order.push(...shuffle(words));}
  const kinds=["def","rev","blank"];let kc=Math.floor(Math.random()*3);
  return order.slice(0,total).map((w,i)=>{
    let kind=kinds[(kc+i)%3]; const bl=blankOf(w);
    if(kind==="blank"&&!bl) kind=Math.random()<.5?"def":"rev";
    // distractors: prefer same quarter, then the rest of the set
    const same=shuffle(words.filter(x=>x!==w&&x.q===w.q&&x.w.toLowerCase()!==w.w.toLowerCase()&&x.m!==w.m));
    const rest=shuffle(words.filter(x=>x!==w&&x.q!==w.q&&x.w.toLowerCase()!==w.w.toLowerCase()&&x.m!==w.m));
    let pool=same.concat(rest);
    if(kind==="blank") pool=pool.filter(x=>!new RegExp("(^|[^A-Za-z])"+reEsc(x.w)+"(?![A-Za-z])","i").test(bl));
    const dis=pool.slice(0,3);
    const field=kind==="def"?"m":"w";
    const opts=shuffle([w].concat(dis)).map(x=>({t:x[field],ok:x===w}));
    let q,kindLabel,speak;
    if(kind==="def"){kindLabel="WHAT DOES IT MEAN?";q=`What does <span class="w">${esc(w.w)}</span> mean?`;speak=`What does ${w.w} mean?`;}
    else if(kind==="rev"){kindLabel="WHICH WORD?";q=`Which word means: ${esc(w.m)}?`;speak=`Which word means: ${w.m}?`;}
    else {kindLabel="FILL IN THE BLANK";q=esc(bl).replace("_____",'<span class="w">_____</span>');speak=bl.replace("_____","blank");}
    return {src:"word",w,kind,kindLabel,q,speak,opts:opts.map(o=>o.t),ans:opts.findIndex(o=>o.ok)};
  });
}

function startTimer(sec){stopTimer();const el=$("timer");if(!sec){el.hidden=true;return;}el.hidden=false;const total=sec,end=Date.now()+sec*1000;let last=sec;
  const tick=()=>{const left=Math.max(0,(end-Date.now())/1000),whole=Math.ceil(left);$("timerNum").textContent=whole;el.style.setProperty("--p",left/total);el.style.setProperty("--tcol",left/total>.5?"var(--good)":left/total>.25?"var(--gold)":"var(--bad)");el.classList.toggle("low",left<=5);if(whole!==last&&whole<=5&&whole>0)SFX.tick();last=whole;if(left<=0){stopTimer();if(!G.locked)choose(-1);}};

async function choose(i){
  if(G.locked||G.over)return;
  const Q=G.qs[G.qi],steal=G.phase==="steal";
  if(i>=0&&G.wrongPicks.includes(i))return;
  stopTimer();lockAnswers();hush();
  const g=G,gone=()=>G!==g||g.quit;
  const t=G.teams[G.answerer];t.tries++;
  const btns=[...$("answers").children];
  if(i===Q.ans){
    btns[i].classList.add("right");btns.forEach((b,j)=>{if(j!==i&&!b.classList.contains("wrong"))b.classList.add("dim");});
    t.correct++;if(!steal){t.streak++;t.best=Math.max(t.best,t.streak);}
    SFX.correct();
    G.history.push({Q,result:steal?"stolen":"correct"});
    const msg=await reward(G.answerer,steal);
    if(gone())return;
    if(G.over)return;
    await botTurn(); if(gone()||G.over)return;
    reveal(true,msg);
  } else {
    if(i>=0){btns[i].classList.add("wrong");G.wrongPicks.push(i);if(!RM)btns[i].animate([{transform:"translateX(0)"},{transform:"translateX(-10px)"},{transform:"translateX(10px)"},{transform:"translateX(0)"}],{duration:280});}
    if(!steal)t.streak=0;
    updateScores();SFX.wrong();
    await penalty(G.answerer,steal,i<0);
    if(gone())return;
    if(!steal&&!G.solo){offerSteal(i<0);return;}
    G.history.push({Q,result:"missed"});
    await botTurn(); if(gone()||G.over)return;
    showCorrect();reveal(false,i<0?"Time's up!":steal?"No steal this time.":"Not quite!");
  }
}

async function reward(ti,steal){
  const t=G.teams[ti];
  if(G.mode==="boss"){
    let d=100+Math.min(Math.max(t.streak-1,0),4)*25;const crit=Math.random()<.15;if(crit)d=Math.round(d*1.5);if(steal)d=Math.round(d/2/5)*5;
    t.score+=d;updateScores();await attack(ti,d,crit);
    if(G.hp<=0){await bossDefeated();return "";}
    return `${t.name} ${steal?"stole it":"got it"}! ${d} damage${crit?" (CRITICAL!)":""}`;
  }
  if(G.mode==="obby"){
    const steps=steal?1:(t.streak>=3?2:1);
    t.pos=Math.min(G.L,t.pos+steps);t.score=t.pos;updateScores();
    await jump(ti,steps);
    if(t.pos>=G.L){await finishLine(t);return "";}
    return steps===2?`Double jump! ${t.name} is on platform ${t.pos}.`:`${t.name} jumps to platform ${t.pos}!`;
  }
  if(G.mode==="tycoon"){
    let c=100+Math.min(Math.max(t.streak-1,0),4)*20;if(steal)c=50;
    t.coins+=c;t.earned+=c;t.score=t.earned;updateScores();
    const builtNow=await earn(ti,c);
    if(G.solo&&t.built>=9){await labDone(t);return "";}
    return builtNow?`+${c} coins! ${t.name} built: ${builtNow}`:`+${c} coins for ${t.name}!`;
  }
}
async function penalty(ti,steal,timeout){
  if(G.mode==="boss"){await bossStrike(ti,steal?0:(G.rage?40:25),timeout);return;}
  const a=$(G.mode==="tycoon"?"actor"+ti:"actor"+ti);
  if(a&&!RM)a.querySelector(".hopper").animate([{transform:"rotate(0)"},{transform:"rotate(-14deg)"},{transform:"rotate(10deg)"},{transform:"rotate(0)"}],{duration:450});
  if(a){const c=center(a);popText(timeout?"Too slow!":G.mode==="obby"?"Wobble!":"No coins!",c.x,c.y-c.h*.5,"small");}
  await wait(700);
}

  if(!(G.mode==="obby"&&G.bot))return;

}

async function jump(ti,steps){
  const el=$("actor"+ti);SFX.jump();placeRunners();
  if(!RM)el.querySelector(".hopper").animate([{transform:"translateY(0)"},{transform:"translateY(-55%) rotate(-10deg)"},{transform:"translateY(0)"}],{duration:650,easing:"ease-out"});
  await wait(700);const c=center(el);burst(c.x,c.y+c.h*.45,["#fff",G.teams[ti].color],8,40);
  if(steps===2)popText("DOUBLE JUMP!",c.x,c.y-c.h*.6,"gold");
  await wait(500);
}
async function finishLine(who){
  G.over=true;stopTimer();const g=G;SFX.win();confetti();
  await bigBanner(who===G.bot?"Bolt wins!":`${who.name} wins!`,1700);if(G!==g||g.quit)return;endGame(who!==G.bot,who===G.bot,who);
}
/* tycoon fx */
async function earn(ti,c){
  const t=G.teams[ti],plot=$("plot"+ti),pc=center(plot.querySelector(".bld")),tc=center($("sc"+ti));
  SFX.coin();popText("+"+c,pc.x,pc.y-pc.h*.3,"gold");
  if(!RM){for(let k=0;k<5;k++){const co=fx(document.createElement("div"));co.className="coin";co.style.left=(pc.x-15)+"px";co.style.top=(pc.y-15)+"px";
    const a=co.animate([{transform:"translate(0,0) scale(.6)",opacity:1},{transform:`translate(${(tc.x-pc.x)*.5+(Math.random()*80-40)}px,${(tc.y-pc.y)*.5-60}px) scale(1.1)`},{transform:`translate(${tc.x-pc.x}px,${tc.y-pc.y}px) scale(.6)`,opacity:.9}],{duration:700,delay:k*70,easing:"ease-in"});a.onfinish=()=>co.remove();}}
  await wait(800);
  const names=[];
  while(t.coins>=G.cost&&t.built<9){t.coins-=G.cost;t.built++;names.push(LAB_NAMES[t.built-1]);
    updatePlot(ti);SFX.build();const piece=plot.querySelector(`.pc[data-i="${t.built-1}"]`);
    if(piece&&!RM)piece.animate([{transform:"translateY(-60px)",opacity:0},{transform:"translateY(6px)",opacity:1,offset:.7},{transform:"none",opacity:1}],{duration:500,easing:"ease-out"});
    await wait(550);}
  updatePlot(ti);updateScores();
  if(t.built>=9&&names.length){burst(pc.x,pc.y,["#ffcd2e","#fff",t.color],24,pc.w*.6);popText("LAB COMPLETE!",pc.x,pc.y-pc.h*.5,"gold");await wait(700);}
  return names.join(", ");
}
async function labDone(t){G.over=true;stopTimer();const g=G;SFX.win();confetti();await bigBanner("Lab complete!",1600);if(G!==g||g.quit)return;endGame(true);}

/* ================= RESULTS ================= */
function endGame(won,botWon,winner){
  G.over=true;stopTimer();hideOverlay();hush();
  const tot=G.history.length,right=G.history.filter(h=>h.result!=="missed").length;
  const pct=tot?right/tot:0;
  let title,sub;
  if(G.solo){const t=G.teams[0];
    if(G.mode==="boss")title=won?"Victory!":"Jumble got away!";
    if(G.mode==="obby")title=won?"You win!":botWon?"Bolt wins this time!":"Out of questions!";
    if(G.mode==="tycoon")title=t.built>=9?"Lab complete!":`You built ${t.built} of 9!`;
    sub=`You got ${right} of ${tot} right.${won||t.built>=9?"":" Play again to beat your score!"}`;
  } else {
    title=G.mode==="boss"?(won?"Victory!":"Jumble got away!"):G.mode==="obby"?(winner?`${winner.name} wins the race!`:"Race results"):"Build-off results";
    sub=`The class got ${right} of ${tot} right.`+(G.mode==="boss"&&!won?` Jumble escaped with ${G.hp} HP.`:"");
  }
  $("resTitle").textContent=title;$("resSub").textContent=sub;
  const stars=$("stars");stars.hidden=!G.solo;if(G.solo){const n=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;stars.innerHTML=[0,1,2].map(k=>starSVG(k<n)).join("");}
  const val=t=>G.mode==="boss"?t.score:G.mode==="obby"?t.pos:(t.built*1000+t.earned);
  const stat=t=>G.mode==="boss"?`${t.score} damage`:G.mode==="obby"?`Platform ${t.pos} of ${G.L}`:`${t.built}/9 built · ${t.earned} coins`;
  const ranked=G.teams.map(t=>({...t})).sort((a,b)=>val(b)-val(a)||b.correct-a.correct);
  const places=[];ranked.forEach((t,k)=>{places[k]=(k>0&&val(t)===val(ranked[k-1]))?places[k-1]:k+1;});
  const heights=["26vh","21vh","17vh","14vh"];
  const order=ranked.length>=3?[1,0,2,3].filter(k=>k<ranked.length):ranked.map((_,k)=>k);
  $("podium").innerHTML=G.solo?`<div class="pod" style="--tc:${ranked[0].color}"><div class="av">${avatarSVG(ranked[0].color,ranked[0].acc)}</div><div class="block"><span class="pname">${esc(ranked[0].name)}</span><span class="pstat">${stat(ranked[0])}</span><span class="pstat">Best streak ${ranked[0].best}</span></div></div>`
   :order.map(k=>{const t=ranked[k],pl=places[k];return `<div class="pod" style="--tc:${t.color}">${pl===1&&val(t)>0?'<span class="mvp">MVP</span>':""}<div class="av">${avatarSVG(t.color,t.acc)}</div>
    <div class="block" style="min-height:${heights[Math.min(pl-1,3)]}"><span class="place">${pl}${["st","nd","rd","th"][Math.min(pl-1,3)]}</span><span class="pname">${esc(t.name)}</span><span class="pstat">${stat(t)}</span><span class="pstat">${t.correct} right${t.best>=2?` · streak ${t.best}`:""}</span></div></div>`;}).join("");
  $("reviewList").innerHTML=G.history.map(h=>{const w=h.Q.w;
    if(h.Q.src==="story")return `<li><span class="tag ${h.result}">${h.result==="correct"?"Correct":h.result==="stolen"?"Stolen":"Missed"}</span><span class="rq">${h.Q.q}</span><span class="ra">Answer: <strong>${esc(h.Q.correctText)}</strong>. ${esc(h.Q.why)} <em>(${h.Q.cmp?`${esc(h.Q.book.t)} and ${esc(h.Q.book.nf.t)}, compare`:`${esc(h.Q.srcTitle)}${h.Q.nf?", nonfiction":""}`})</em></span></li>`;
    return `<li><span class="tag ${h.result}">${h.result==="correct"?"Correct":h.result==="stolen"?"Stolen":"Missed"}</span><span class="rq">${esc(w.w)}</span><span class="ra"><strong>${esc(w.m)}</strong>${w.ex?`. "${esc(w.ex)}"`:""}</span></li>`;}).join("")||"<li>No questions answered yet.</li>";
  $("review").hidden=true;$("reviewBtn").textContent=G.src==="story"?"Review the questions":"Review the words";
  show("results");
  if(won||(!G.solo&&G.mode!=="boss"))confetti();else SFX.lose();
}

/* ================= WIRING ================= */
$("fsBtn1").innerHTML=ICON.fs;$("fsBtn2").innerHTML=ICON.fs;$("quitBtn").innerHTML=ICON.quit;$("sayBtn").innerHTML=ICON.say;
$("fsBtn1").addEventListener("click",toggleFS);$("fsBtn2").addEventListener("click",toggleFS);
$("soundBtn").addEventListener("click",()=>{S.sound=!S.sound;save();renderSoundBtn();SFX.click();});
$("sayBtn").addEventListener("click",()=>{if(!G||G.qi>=G.qs.length)return;const Q=G.qs[G.qi];sayText(Q.speak+" "+Q.opts.map((o,i)=>"ABCD"[i]+". "+o+".").join(" "));});
$("allCh").addEventListener("click",()=>{S.chs=novel().chapters.map(c=>c.n);SFX.click();renderLobby();});
$("noCh").addEventListener("click",()=>{S.chs=[];SFX.click();renderLobby();});
$("startBtn").addEventListener("click",()=>{if($("startBtn").disabled)return;ac();startGame();});
$("quitBtn").addEventListener("click",()=>{
  if(!G||G.over){show("lobby");renderLobby();return;}
  const wasLocked=G.locked,prev=G.phase;G.locked=true;stopTimer();hush();
  const ov=overlay(`<h2>Leave the game?</h2><p>Scores for this game will be lost.</p><div class="btns"><button class="btn" style="--bc:var(--bad)" id="qYes">Quit to menu</button><button class="btn ghost" id="qNo">Keep playing</button></div>`);
  ov.querySelector("#qYes").addEventListener("click",()=>{G.over=true;G.quit=true;hideOverlay();$("fx").innerHTML="";show("lobby");renderLobby();});
  ov.querySelector("#qNo").addEventListener("click",()=>{hideOverlay();
    if(prev==="intro"){intro();return;}
    if(prev==="reveal"){const l=G.history[G.history.length-1];reveal(l&&l.result!=="missed","Ready for the next one?");return;}
    if(prev==="stealOffer"){offerSteal(false);return;}
    G.locked=wasLocked;if(!wasLocked)startTimer(S.timer?Math.max(10,Math.round(S.timer/2)):0);});
});
$("againBtn").addEventListener("click",()=>{SFX.click();startGame();});
$("menuBtn").addEventListener("click",()=>{SFX.click();show("lobby");renderLobby();});
$("reviewBtn").addEventListener("click",()=>{const r=$("review");r.hidden=!r.hidden;$("reviewBtn").textContent=r.hidden?(G&&G.src==="story"?"Review the questions":"Review the words"):"Hide the review";if(!r.hidden)r.scrollIntoView({behavior:RM?"auto":"smooth",block:"start"});});
document.addEventListener("keydown",e=>{if(!G||$("play").hidden||e.target.tagName==="INPUT")return;const k=e.key.toLowerCase(),map={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  if((G.phase==="answer"||G.phase==="steal")&&!G.locked&&k in map&&map[k]<G.qs[G.qi].opts.length){e.preventDefault();choose(map[k]);}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G&&!G.over)keepAwake();});
window.addEventListener("resize",()=>{if(G&&G.mode==="obby"&&!$("play").hidden)placeRunners();});

renderLobby();
})();
</script>
